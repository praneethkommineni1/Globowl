# Mapping config for tools/import_wikibooks.py.
# cuisines: Wikibooks category (without 'Category:') -> ISO country code
# courses: Wikibooks category -> Globowl course
# ingredients.names: Wikibooks ingredient link/name -> catalog id (checked after the catalog's own names and aliases)
# ingredients.ground_when_measured: ambiguous names resolved by context —
#   'fresh' if the line says fresh/grated/minced/chopped…, 'seeds' if it mentions seeds, 'ground' if measured in tsp/tbsp/pinch or says ground, else 'default'.
