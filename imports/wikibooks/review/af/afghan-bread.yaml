id: af-afghan-bread
title: Afghan Bread
summary: Afghan bread or Nan-i-Afghani is the national bread of Afghanistan. It is a flatbread and can be oval or rectangular. It is baked in a tandoor, the primary cooking equipment of the sub-continent region.
origin:
  country: AF
course: bread
authenticity: unassessed
