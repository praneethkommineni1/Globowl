id: al-albanian-mixed-vegetables
title: Albanian Mixed Vegetables
summary: Several different dishes are called "mixed vegetables"; they all consist primarily of different kinds of vegetables cut into pieces and mixed together, then either served as-is or else cooked, typically by sautéing.
origin:
  country: AL
course: side
authenticity: unassessed
yield:
  servings: 4
  amount: 4 servings
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: red-bell-pepper, unit: g, qty: 907}
  - {ingredient: vegetable-oil, unit: cup, qty: 0.5, prep: divided}
  - {ingredient: onion, unit: cup, qty: 1}
  - {ingredient: tomato, unit: cup, qty: 1}
  - {ingredient: parsley, unit: tbsp, qty: 1}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Cut off inedible tips of vegetables. Wash and slice them into 1-inch squares.
- Sauté vegetables in half the oil and remove them from the frying pan.
- Sauté onion and tomatoes in the remaining oil, and season with parsley, salt, and pepper.
- Put everything in a stock pot with a cup of water, cover tightly, and simmer until almost all moisture has cooked away.
- Serve hot, accompanied by steak, meatballs, or any other main dish.
