id: al-albanian-stewed-fig-pudding
title: Albanian Stewed Fig Pudding
summary: Stewed dry figs (hoshaf me fiq të thatë) is an Albanian pudding.
origin:
  country: AL
course: dessert
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 15
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: sugar, unit: cup, qty: 1}
  - {ingredient: milk, unit: cup, qty: 4}
  - {ingredient: ground-cinnamon}
steps:
- Stir sugar into milk, bring to a boil, and remove from heat. Gradually add figs, stirring continuously.
- Pour into earthenware serving bowls and bake in moderate oven (350°F or 180°C) for 10 minutes.
- Chill and sprinkle with cinnamon.
- Serve cold.
