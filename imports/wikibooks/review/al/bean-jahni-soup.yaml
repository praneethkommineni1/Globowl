- items:
  - {ingredient: onion, unit: cup, qty: 0.5}
  - {ingredient: olive-oil, unit: cup, qty: 0.5}
  - {ingredient: canned-tomatoes, unit: tbsp, qty: 2}
  - {ingredient: parsley, unit: tbsp, qty: 1}
  - {ingredient: mint, unit: tbsp, qty: 1}
  - {ingredient: salt}
  - {ingredient: red-chili}
steps:
- Boil beans in hot water in an uncovered pot for 5 minutes. Rinse and boil for another 15 minutes in a covered stock pot in 3 cups hot water.
- Sauté onion in olive oil until it turns yellow. Add 2 tablespoons bean stock from the pot along with tomato sauce, parsley, salt and chili powder for taste. Cook for 10 minutes or until a thick sauce is formed, then pour everything into the pot.
- Add chopped mint, cover tightly and cook for 2 hours over low heat, or for 30 minutes in a pressure cooker. This should produce a thick juice, covering beans by &frac12; inch (1.5 cm). Serve hot.
