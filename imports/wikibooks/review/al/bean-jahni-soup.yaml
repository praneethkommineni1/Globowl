id: al-bean-jahni-soup
title: Bean Jahni Soup
summary: Bean Jahni soup, Jani me fasule, is an Albanian dish of bean soup.
origin:
  country: AL
course: soup
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
- sauteing
