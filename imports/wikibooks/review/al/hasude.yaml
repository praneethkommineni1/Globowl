id: al-hasude
title: Hasude
alternate_names:
- Albanian Cornstarch Pudding
summary: Hasude is an Albanian dessert.
origin:
  country: AL
course: dessert
authenticity: unassessed
yield:
  servings: 4
  amount: 4–5
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: cornstarch, unit: cup, qty: 1.25}
  - {ingredient: butter, unit: tbsp, qty: [6, 7]}
  - {ingredient: sugar, unit: cup, qty: 1}
  - {ingredient: water, unit: cup, qty: 2}
steps:
- Melt butter in pot over medium-high heat. Gradually mix in the cornstarch.
- Once all the cornstarch is added, cook until the mass becomes yellow. Sweeten with some sugar.
- Separately prepare a syrup using the remaining sugar and water.
- After it is done cooking, shape the mass using a spoon or plastic shapes, and pour the syrup on top.
