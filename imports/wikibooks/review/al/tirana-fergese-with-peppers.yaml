  - {ingredient: tomato, unit: g, qty: 454}
  - {ingredient: feta, unit: g, qty: 227}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 1}
  - {ingredient: butter, unit: g, qty: 113}
  - {ingredient: olive-oil, unit: tbsp, qty: 3}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: red-chili, note: to taste}
steps:
- Peel the skin off the tomatoes and peppers. Sauté them with the olive oil in a saucepan for 5–7 minutes. Set them aside to cool for 15 minutes.
- Chop the tomatoes and peppers the way you like.
- In another saucepan, melt the butter. Add flour, cottage cheese, and black pepper, salt, and chili pepper to taste. Mix all the ingredients together well, then stir into the vegetable mixture.
- Bake vegetable mixture in a preheated 350°F (175°C) oven for 15 minutes.
- Remove from oven and serve immediately.
