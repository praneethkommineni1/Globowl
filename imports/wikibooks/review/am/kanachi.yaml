id: am-kanachi
title: Kanachi
alternate_names:
- Armenian Herb Salad
summary: Kanachi ( -- Armenian for herbs) consists of an assortment of various aromatic and tasty herbs that are served raw as an appetizer and/or side dish next to main courses of Armenian dishes. There is also a Persian cuisine equivalent called sabzi khordan.
origin:
  country: AM
course: salad
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: basil}
  - {ingredient: scallion}
  - {ingredient: mint}
steps:
- Remove extra stem endings, yellow leaves, and damaged parts from all herbs and wash them thoroughly. Drain.
- Remove roots from green onions and radishes and majority of radish leaves (leaving only the younger ones). Wash them thoroughly and drain.
- Mix them up or arrange them on a plate.
- Eat raw and enjoy!
tips:
- To store for later, put the washed herbs in a semi-humid clean cotton bag which you can close by a string and keep in a refrigerator. Will keep well for a few days to a week.
