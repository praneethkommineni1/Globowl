id: am-russian-salad
title: Russian Salad
summary: In this Armenian version of Russian salad (Սալադ Րուս), there are equal amounts of peas, diced carrots, corn, diced potato, and about half that amount of diced cucumber pickles and mayonnaise.
origin:
  country: AM
