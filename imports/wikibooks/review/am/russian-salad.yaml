  - {ingredient: carrot, unit: cup, qty: 1}
  - {ingredient: green-peas, unit: cup, qty: 1}
  - {ingredient: potato, unit: cup, qty: 1}
  - {ingredient: cucumber, unit: cup, qty: 0.5}
  - {ingredient: mayonnaise, unit: cup, qty: 2}
  - {ingredient: salt}
steps:
- Boil together the vegetables, then drain and transfer to a bowl.
- Add the diced pickles and cool to room temperature.
- Add the mayonnaise, and stir until uniformly mixed.
- Finish by seasoning with some salt to taste.
