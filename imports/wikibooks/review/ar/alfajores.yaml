id: ar-alfajores
title: Alfajores
alternate_names:
- Latin American Sandwich Cookies
summary: Alfajores are a Latin-American sandwich cookie filled with dulce de leche.
origin:
  country: AR
course: dessert
authenticity: unassessed
yield:
  servings: 40
  amount: 40 cookies
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: butter, unit: cup, qty: 0.5}
  - {ingredient: sugar, unit: cup, qty: 1}
  - {ingredient: egg, qty: 1}
  - {ingredient: egg-yolk, qty: 2}
  - {ingredient: vanilla-extract, unit: tsp, qty: 1}
  - {ingredient: lemon, unit: tsp, qty: 2, prep: grated}
  - {ingredient: cornstarch, unit: cup, qty: 1.5}
  - {ingredient: all-purpose-flour, unit: cup, qty: 0.5}
  - {ingredient: baking-powder, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 0.25}
steps:
- Cream butter; add sugar and beat until fluffy.
- Add egg and egg yolks one at a time, beating well. Beat in vanilla and lemon rind.
- Sift together cornstarch, flour, baking powder, and salt. Add to batter and mix well.
- Drop batter by small spoonfuls onto well-buttered baking sheet.
- Bake at 350°F for 15 minutes. Remove immediately and cool.
- Sandwich the cookies together with dulce de leche.
