  - {ingredient: black-pepper, unit: tsp, qty: 1}
- name: Optional ingredients
  items:
  - {ingredient: thyme, unit: tbsp, qty: 1, prep: finely chopped}
  - {ingredient: lemon, unit: tsp, qty: 1}
  - {ingredient: bay-leaf, unit: tsp, qty: 1, prep: small flakes}
  - {ingredient: cilantro, unit: tbsp, qty: 1, prep: finely chopped}
  - {ingredient: red-bell-pepper, qty: 0.5, prep: seeded and finely chopped}
steps:
- Combine all the ingredients except the oil, vinegar and water in a large bowl and mix together well, ensuring all the herbs and spices (especially the salt) are distributed evenly.
- Allow to rest for 30 minutes.
- Bring the vinegar and water to the boil, add to the other ingredients and mix well. This helps to soften the taste of the onion and garlic.
- Allow to rest for 30 minutes.
- Add the oil and mix well. If the liquid part doesn't cover the ingredients add oil water and vinegar in a 2:1:1 ratio to cover them.
- Transfer to an air-tight container and refrigerate overnight at least, or better, for a few days.
- When needed, remove from refrigerator about 30 minutes ahead of time to allow the oil to thin out again. Stir well and serve.
tips:
- For red chimichurri, use 50 ml red wine vinegar instead of white wine vinegar, and add 1 peeled, seeded, finely chopped tomato and ½ red bell pepper, seeded and finely chopped, instead of green pepper.
