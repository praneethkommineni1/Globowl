id: ar-chimichurri
title: Chimichurri
summary: Chimichurri is a South American sauce for meats, consisting primarily of oil, vinegar, parsley, red chilli, and herbs. There are many different variants of chimichurri, and every cook will have their own private recipe.
origin:
  country: AR
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 75
difficulty: 1
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: ml, qty: 100}
  - {ingredient: red-wine-vinegar, unit: ml, qty: 50}
  - {ingredient: water, unit: ml, qty: 50}
  - {ingredient: parsley, unit: bunch, qty: 1, prep: chopped}
  - {ingredient: onion, qty: 1, prep: finely chopped, note: medium}
  - {ingredient: garlic, unit: clove, qty: 4, prep: finely minced}
  - {ingredient: chili-flakes, note: to taste}
  - {ingredient: dried-oregano, unit: tbsp, qty: 1}
  - {ingredient: paprika, unit: tbsp, qty: 1}
