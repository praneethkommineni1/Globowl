steps:
- Dissolve salt in water.
- Mix eggs, flour, butter and 1 cup of water to form a dough. While kneading the dough, gradually add in more water until the dough is soft and stretchy. If the dough becomes sticky, add more flour.
- Once the dough is the desired consistency, allow to rest for a couple minutes, then roll it out to a thickness of ~2–3 mm (1/10 inch).
- Cut the dough into discs roughly 10–15 cm (4–6 inches) in diameter.
- Dice onion into small pieces and sauté in vegetable oil in a large frying pan. Add ground beef, and brown it.
- While beef is browning, mix in salt, sugar and spices.
- Once meat has finished cooking, remove from heat and add raisins.
- If desired add sliced olives, egg, or potatoes.
- Dice onion into small pieces and sauté in olive oil in a large frying pan. Mince garlic and add to the onions. Add and brown ground beef.
- While beef is browning, mix in salt, sugar, spices and bay leaf.
- Allow to simmer for about 20 minutes for flavours to blend.
- Remove bay leaf, and add olives and raisins.
- Place 1–2 tablespoons of empanada filling into the center of one of the dough discs (tapa).
- If Chilean empanadas are being made add one piece of the diced hardboiled egg next to the filling.
- Wet the outer edge of the tapa with cold water and fold the tapa in half to encase the filling, ensuring there is no air left inside (the wet portion will help the dough stick together, air will burst out when cooked).
- Holding the empanada in the palm of one hand, with the round edge pointing outwards, pinch and twist over a small (finger-sized) portion of the dough at the top. Continue pinching and twisting around the outer edge until you reach the bottom of the empanada, so that the open edge is sealed shut. You can also use a fork to smash together the lips of the outer edge, but it is not the traditional way and the filling can burst through.
- Repeat for the remaining filling and dough.
- To cook the empanadas, deep fry in vegetable oil on medium heat until golden brown. Alternatively, you can brush them with butter and bake on a cookie sheet in the oven at 400 °F for 8–10 minutes or until light brown.
- Allow empanadas to cool and then eat.
