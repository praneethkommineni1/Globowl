id: at-apple-strudel
title: Apple Strudel
summary: Apple strudel is said to be a famous Viennese dish. When the Turks occupied Hungary, they introduced strudel-like pastries to Hungarians. Thanks to the high percentage of gluten in the Hungarian wheat flour, strudel became quite popular in Hungary.
origin:
  country: AT
course: dessert
authenticity: unassessed
yield:
  servings: 8
  amount: 8–12
time:
  total_min: 80
difficulty: 4
techniques:
