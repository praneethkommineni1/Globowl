id: at-austrian-meatloaf
title: Austrian Meatloaf
alternate_names:
- Faschierter Braten
summary: Faschierter Braten is a traditional Austrian dish of ground beef and pork, often served with mashed potatoes, caramelized onion rings, and sometimes a salad. Similar versions of the dish exist almost all over Europe.
origin:
  country: AT
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 50
difficulty: 2
techniques:
- baking
- sauteing
ingredient_groups:
- items:
  - {ingredient: white-bread, qty: 1, prep: cut into croûton-sized cubes}
  - {ingredient: milk, unit: cup, qty: 0.5}
  - {ingredient: onion, qty: 0.5, prep: diced small}
  - {ingredient: pork, unit: g, qty: 500}
  - {ingredient: egg, qty: 1}
  - {ingredient: breadcrumbs, unit: cup, qty: 0.5}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: garlic}
  - {ingredient: dried-marjoram}
steps:
- Preheat the oven to 180°C.
- Soak the bread cubes in the milk.
- Sauté the onions in a pan over medium heat until golden yellow. Transfer them to a bowl with the ground meat.
- Add the soaked bread, egg, and breadcrumbs. Season with salt, pepper, marjoram, and garlic to taste, then stir the mixture thoroughly until you have a solid consistency.
- Shape the meat into a loaf form and place it in a baking dish.
- Bake for approximately 40 minutes until golden brown.
- Serve hot with potatoes, caramelized onions, and salad.
tips:
- The original recipe can be enriched by adding different spices or vegetables to the meat or by mixing the meat with rice.
- 'Depending on the kind of preparation, the Braten also has other names: Netzbraten when the ground meat mass is wrapped and roasted in a pork net; Falscher Hase when it is formed like the shape of a hare''s back or Stephaniebraten when the roast is additionally filled with a hard boiled egg, pickles, and sausages.'
