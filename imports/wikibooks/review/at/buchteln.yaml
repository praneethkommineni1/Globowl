id: at-buchteln
title: Buchteln
alternate_names:
- Austrian Sweet Buns
summary: 'Cuisine of Austria Originally, Buchteln (singular: Buchtel) were a Bohemian sweet dish. However, in the course of time they have become part of the traditional Austrian Cuisine. This dough is yeast-based.'
origin:
  country: AT
course: bread
