id: at-chanterelle-goulash
title: Chanterelle Goulash
summary: Goulash of Chanterelles is a typical Austrian main dish. It is served mainly during the summer, which is the mushroom season in Austria. Although it is possible to freeze mushrooms, the taste of frozen chanterelles cannot be compared to the taste of fresh ones.
origin:
  country: AT
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 25
difficulty: 2
techniques:
- steaming
ingredient_groups:
