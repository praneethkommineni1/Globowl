id: at-cheese-dumplings
title: Cheese Dumplings
summary: Cheese dumplings (kaspressknödel) are a typical Austrian dish, originally eaten by farmers throughout Austria. Bread, potatoes, and flour were used for the dough. In addition eggs, butter, left-over meats, bacon, or fruits from the garden were used to fill them.
origin:
  country: AT
course: main
authenticity: unassessed
yield:
  servings: 4
  amount: 4–6
