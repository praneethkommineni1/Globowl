id: at-fleischkrapfen
title: Fleischkrapfen
alternate_names:
- Austrian Meat Pasties
summary: Fleischkrapfen is a traditional dish originating in Salzburg. In this preparation, meat of all kinds is cut into small pieces and used to fill a fried hand pie. It is an ideal way to make use of leftover meat.
origin:
  country: AT
course: main
authenticity: unassessed
yield:
  servings: 4
  amount: 4–6
time:
  total_min: 45
difficulty: 3
