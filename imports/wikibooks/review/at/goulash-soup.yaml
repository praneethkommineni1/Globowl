id: at-goulash-soup
title: Goulash Soup
summary: The Austrian version of the Goulash soup is an easy to prepare, inexpensive, tasty and filling dish well suited for cold winter days. This thick, sweet-spicy soup of Hungarian origin is served in inns and restaurants across Austria.
