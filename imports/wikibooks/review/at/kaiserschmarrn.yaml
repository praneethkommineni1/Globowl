id: at-kaiserschmarrn
title: Kaiserschmarrn
alternate_names:
- Austrian Shredded Pancake
summary: Kaiserschmarrn, which can be translated as "the emperor’s mess", is a traditional Austrian dish, which is renowned far across the Austrian borders.
origin:
  country: AT
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 3}
  - {ingredient: milk, unit: cup, qty: 2}
  - {ingredient: sugar, unit: tbsp, qty: 1}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 1.5}
  - {ingredient: raisins, unit: tbsp, qty: 1}
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: powdered-sugar, prep: for dusting}
steps:
- Separate the whites from the yolks.
- Put yolks, milk, sugar and salt in a bowl and whip well.
- Fold in the flour while stirring thoroughly until the mass is pasty.
- Add the raisins to the mixture.
- Whisk the whites until they are stiff and then fold them into the mixture.
- Melt the butter in a frying pan, and add the dough.
- Cook until the pancake gets solid at the bottom.
- Divide the mass into quarters with a wooden spoon or spatula and turn them over. After a little while start scrambling the quarters.
- Keep turning the Kaiserschmarrn until it is done.
- Serve with icing sugar on top.
