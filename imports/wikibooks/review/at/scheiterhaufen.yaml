id: at-scheiterhaufen
title: Scheiterhaufen
alternate_names:
- Austrian Bread Pudding
summary: Scheiterhaufen (literally "funeral pyre" or "stake") is a type of traditional sweet dish in Austria and Southern Germany. It was mentioned for the first time in a Roman cookbook in the 1st century AD by Marcus Gravius Apicius.
origin:
  country: AT
course: dessert
authenticity: unassessed
