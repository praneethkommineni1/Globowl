id: at-strawberry-dumplings
title: Strawberry Dumplings
summary: Strawberry dumplings (erdbeerknödel) are a typically Austrian dish usually served as a main course, rather than as a dessert. This recipe is a tasteful, quick, and easy dish for, say, an evening with in-laws.
origin:
  country: AT
