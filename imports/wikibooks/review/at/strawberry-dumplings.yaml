  - {ingredient: breadcrumbs, unit: cup, qty: 0.8}
  - {ingredient: sugar, unit: cup, qty: 0.2}
  - {ingredient: egg, qty: 1}
  - {ingredient: twarog, unit: cup, qty: 2}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 0.5}
