title: Stuffed Duck Breast with Cabbage and Dumplings
summary: Almost every Austrian family has its own Christmas tradition. Christmas Eve differs from family to family; however, many cannot imagine Christmas without the delicious aroma of a succulent roast duck floating in the air.
