id: at-zwiebelrostbraten-with-red-wine-onion-gravy
title: Zwiebelrostbraten with Red Wine Onion Gravy
summary: Zwiebelrostbraten is a typical Austrian entrée and an all-time favorite dish in Austria. The meat used for Zwiebelrostbraten is traditionally a standing rib roast cut, which is called “Rostbraten” in German.
origin:
  country: AT
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 50
difficulty: 2
techniques:
- sauteing
ingredient_groups:
- name: Sauce
  items:
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: garlic, qty: 2, prep: minced}
  - {ingredient: vegetable-oil}
  - {ingredient: tomato-paste, unit: tsp, qty: 2}
  - {ingredient: brown-sugar, unit: tsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: red-wine, unit: ml, qty: 125}
  - {ingredient: chicken-stock, unit: ml, qty: 500}
- name: Meat
  items:
  - {ingredient: beef, unit: slice, qty: 2}
  - {ingredient: dijon-mustard, unit: tbsp, qty: 1}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: vegetable-oil}
steps:
- Sauté the onion and garlic in oil.
- Add tomato paste, sugar, and Hungarian paprika, and let it sauté just a little before finally deglazing the pan with red wine.
- Add broth and let it boil down until it has achieved the desired consistency. This will take about 25 minutes. Do not forget to stir the gravy every once in a while.
- While the gravy is being reduced, slightly beat the meat with a meat mallet. This helps the meat to stay tender. Then rub it in mustard and add salt and pepper.
- Sear the meat on both sides and cook it for another 4–5 minutes on medium heat.
- Add the onion rings to the juices remaining from the meat and let them soak up the delicious flavor. Depending on how much oil and juices there are still left in the frying pan, you might have to add some oil or water in order to let the onions absorb the flavor properly.
- Finally top the meat with the onion rings, add the gravy, and serve it with the desired side dish. Enjoy!
