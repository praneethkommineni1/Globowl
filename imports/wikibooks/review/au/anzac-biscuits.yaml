id: au-anzac-biscuits
title: Anzac Biscuits
summary: ANZAC biscuits have long had an association with the Australia/New Zealand Army Corps (ANZAC) troops sent to Gallipoli during WWI. The biscuit appears to be a variant of the Scottish oat cake, said to be from the Scottish-influenced city of Dunedin.
