id: au-lamington
title: Lamington
summary: Lamington is a dessert of sponge cake (or more traditionally, butter cake), cut into squares, coated in a layer of chocolate or strawberry icing, and topped with coconut.
origin:
  country: AU
  also_claimed_by:
