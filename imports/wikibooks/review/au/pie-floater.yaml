id: au-pie-floater
title: Pie Floater
summary: The pie floater is a meal consisting of a meat pie served upside down in a dish of pea soup. It is common in South Australia, and sometimes seen in other parts of Australia. The pie floater is a popular midnight snack for drinkers and revelers.
origin:
  country: AU
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: water}
steps:
- Heat the pie in an oven. A microwave will not work as well, as the pie pastry will not be crisp.
- Heat the pea soup separately.
- Place the pie upside down in the dish, and pour the pea soup around it until the dish is full.
