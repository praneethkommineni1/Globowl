id: au-pufftaloons
title: Pufftaloons
summary: In Australia these pufftaloons are usually made with a yeast-based bread dough, but this recipe uses baking powder instead.
origin:
  country: AU
course: snack
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 2}
  - {ingredient: baking-powder, unit: tsp, qty: 2}
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: butter, qty: 1}
steps:
- Combine flour and baking powder.
- Rub in the butter.
- Add enough milk to make a soft dough.
- Deep fry in hot vegetable oil.
- Serve hot with jam or golden syrup.
