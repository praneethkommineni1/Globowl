id: au-rissoles
title: Rissoles
summary: Rissoles (ris·sole) is an extremely popular traditional Australian dish, similar to the American meatloaf.
origin:
  country: AU
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
