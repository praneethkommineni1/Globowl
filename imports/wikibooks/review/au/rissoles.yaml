- grilling
ingredient_groups:
- items:
  - {ingredient: beef, unit: kg, qty: 1}
  - {ingredient: breadcrumbs, unit: cup, qty: 0.5}
  - {ingredient: egg, qty: 2}
  - {ingredient: all-purpose-flour}
steps:
- Place beef mince in mixing bowl with eggs, breadcrumbs and your favourite meat herbs and seasonings.
- Mix thoroughly. When fully mixed, remove one handful and mould into a the shape of a very thick hamburger patty.
- Roll the rissole in either flour or gravy powder (depending on your preferences).
- Cook in the oven, on a grill, or in a frying pan on a medium level of heat until cooked through and outer layer is crunchy.
- Serve with vegetables, hot chips, salad or by themselves on bread or toast to make rissole burgers.
