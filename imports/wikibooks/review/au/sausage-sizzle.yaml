ingredient_groups:
- items:
  - {ingredient: sausage}
  - {ingredient: white-bread}
  - {ingredient: ketchup}
  - {ingredient: onion, prep: with a little oil or butter, optional: true}
steps:
- Grill the sausages (eucalyptus wood fire is best) until the skins are partially black.
- Grill the sliced onions, if desired.
- Wrap each sausage in a slice of bread, running the sausage diagonally along the bread.
- Add grilled onions and tomato sauce to taste.
