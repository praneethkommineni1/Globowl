id: au-sausage-sizzle
title: Sausage Sizzle
summary: The sausage sizzle is an economical community or family event, common in Australia and New Zealand. Sometimes other food items are included, such as sliced onions cooked along with the sausages and used as a condiment, and some sort of salad might be available.
origin:
  country: AU
  also_claimed_by:
  - NZ
course: main
authenticity: unassessed
yield:
  servings: 1
time:
