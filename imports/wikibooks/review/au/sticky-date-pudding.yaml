id: au-sticky-date-pudding
title: Sticky Date Pudding
summary: A sticky date pudding is a favorite Australian pudding, especially in Southern climates in the winter months. Your family and friends will love you forever if you make them the following recipe.
origin:
  country: AU
course: dessert
authenticity: unassessed
yield:
  servings: 12
time:
  total_min: 1
difficulty: 3
equipment:
- Double boiler
- Electric mixer (a free standing one is better, as you need to beat the eggs for some time for best results)
- Sieve or flour sifter
- Large cake tin, lined with parchment paper and well-greased
techniques:
- baking
- boiling
- simmering
ingredient_groups:
- name: Sauce
  items:
  - {ingredient: brown-sugar, unit: cup, qty: 2}
  - {ingredient: water, unit: cup, qty: 1}
- name: Cake
  items:
  - {ingredient: dates, unit: cup, qty: 1}
  - {ingredient: baking-soda, unit: tsp, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 2}
  - {ingredient: baking-soda, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 2}
  - {ingredient: mixed-spice, unit: tsp, qty: 2}
  - {ingredient: egg, qty: 4, prep: at room temperature}
  - {ingredient: caster-sugar, unit: cup, qty: 1.5}
  - {ingredient: vegetable-oil, unit: cup, qty: 1}
