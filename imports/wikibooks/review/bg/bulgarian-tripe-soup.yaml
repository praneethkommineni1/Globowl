  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: beef, unit: cup, qty: 3.5}
  - {ingredient: onion, qty: 1, prep: chopped fine}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: red-bell-pepper, qty: 1, prep: cut into thin-strips}
  - {ingredient: dried-marjoram, unit: tsp, qty: 0.5}
  - {ingredient: bay-leaf, qty: 1}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 2}
  - {ingredient: parsley, unit: tbsp, qty: 2, prep: chopped fine}
  - {ingredient: tomato-paste, unit: can, qty: 1}
  - {ingredient: garlic, qty: 1, prep: crushed}
steps:
- Combine onion, red pepper, butter in large saucepan.
- Sprinkle flour over onion mixture, then stir in the tomato paste.
- Cut tripe into thin strips.
- Add tripe pieces, stock, salt, marjoram and bay leaf to onion mixture.
- Partially cover the pot and simmer 30 minutes.
- Remove and discard bay leaf.
- Pour soup into a tureen or serve in individual bowls.
- In a small bowl, combine parsley, garlic and cheese. Sprinkle over hot soup and serve immediately.
