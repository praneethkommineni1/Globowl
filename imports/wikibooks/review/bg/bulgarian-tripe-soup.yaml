id: bg-bulgarian-tripe-soup
title: Bulgarian Tripe Soup
alternate_names:
- Shkembe Chorba
summary: Shkembe chorba is a popular meat dish in Bulgarian cuisine.
origin:
  country: BG
course: soup
authenticity: unassessed
yield:
  servings: 1
