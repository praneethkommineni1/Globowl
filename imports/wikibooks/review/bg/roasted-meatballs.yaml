id: bg-roasted-meatballs
title: Roasted Meatballs
alternate_names:
- Kyufteta
summary: Kyufteta are Bulgarian roasted meatballs.
origin:
  country: BG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- dough-making
ingredient_groups:
- items:
  - {ingredient: pork, unit: g, qty: 227, prep: minced}
  - {ingredient: beef, unit: g, qty: 113}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: egg, qty: 1}
  - {ingredient: black-pepper, prep: ground}
  - {ingredient: white-pepper, prep: ground}
  - {ingredient: thyme, unit: tsp, qty: 1.5}
  - {ingredient: nutmeg, unit: tsp, qty: 1}
  - {ingredient: salt}
steps:
- Put all the ingredients in a bowl and knead well.
- Form the mixture into balls approximately 1 inch (2.5 cm) in diameter and flatten them until ½ inch (1.5 cm) thick.
- Place the balls in a baking pan spread with a bit of oil or cooking spray and roast at medium or high heat 15 minutes or until golden brown.
- Turn the meatballs over and roast another 5 minutes until golden brown on the other side too.
- When ready immediately remove from pan and place on kitchen paper to absorb excess fat.
- Serve hot with salads, or your favourite sauce. Enjoy!
