steps:
- Three days before serving, place the pork ribs in a large stock pot, and cover them thoroughly with salt. Cut off one of the salted ribs, place in a plastic bag, and set aside in the fridge. Cover the stockpot containing the remaining ribs, and store it in the fridge.
- One day before serving, remove the stockpot with the ribs from the fridge. Start the process of withdrawing the excess salt, soaking the ribs in cold water and changing the water three times in intervals of 6 hours. Each time you change the water, return the covered stockpot with water and ribs back to the fridge. After the third and last time, fill again the stockpot with the ribs and water and leave it in the fridge until the time to start the cooking process.
- On the day of cooking and serving, cut the filet mignon into 1-inch cubes. Slice the smoked sausage as thick as you wish. Cut the bacon into small cubes. Cut the ham steak into 1-inch cubes. Cut the smoked pork chops into small pieces. Do not cast away the bone yet; leave some meat on it to be cooked altogether. If you are also using jerked beef, cut the pieces proportionally to the rest of the meat. If any part of the meat has bones, leave part of the meat on the bones to be cooked altogether.
- Take the stockpot with the ribs out of the fridge and throw out the water. Divide the ribs; if you think they are too big, cut each in half.
- 'In a large pan, put ¼ cup olive oil and heat it. Then add the sliced bacon together with the ribs, including the salted rib you left aside in the fridge (note: the salt on this specific piece of rib will be the basic salt enough for the preparation).'
- Put the lid on, and cook all together for 10–15 minutes over medium heat, stirring occasionally.
- Add the sliced onion, the parsley, and the chives. Add the rest of the sliced meat and cook for 15 more minutes.
- Then, add 2–3 cans of black beans, plus one can of water, and cook for more 30 minutes. When it starts boiling, decrease the heat to medium-low temperature. Stir occasionally.
- Taste for salt. It should be enough. If you want to add more salt, be careful. Do not salt your feijoada too much.
- Watch the water. Add more (hot) water, if you want your feijoada more liquid. Your feijoada will be ready when the meat becomes soft and loosens from the bones. Now you can take out the bones, if you wish. Serve it warm.
- Wash the rice and drain.
- In a medium pan, put olive oil and chopped onion. Cook until it gets soft. Add garlic if you want.
- Add the rice previously washed and dry. Add a pinch of salt and stir.
- Add hot water (for each cup of rice, use 2 cups of water) and cook until it starts boiling.
- Reduce the heat. Put the lid on and finish cooking. The rice is be ready when the water is fully evaporated and the rice is soft.
- In a pan, fry 1 cup of sliced bacon until it becomes golden brown.
- Add black olives and cook.
- Add olive oil and onion. Cook until it becomes soft.
- When heated, pour the cassava/manioc flour and stir until you get the desired consistency. The amount of flour will determine the consistency. Be careful with the heat; your farofa should not be burnt in the bottom.
- Wash the collard greens leaf by leaf, then slice them in very thin strips and set it aside.
- In a pan or a skillet, put enough olive oil and sliced onion for the amount of collard greens you use. If using, add sliced bacon.
- Add the thinly-sliced collard greens with a pinch of salt and a pinch of sugar (this will help your collard greens remain green).
- Put the lid on and cook for 15 minutes, stirring occasionally.
- Peel the oranges you have already set aside.
- Cut them in round slices and put them in a ceramic bowl or on a plate.
- In a ceramic or metal bowl, put the cilantro, chives, salt, olive oil, a little bit of vinegar, and one finely chopped red hot finger pepper, and add a cup of warm bean broth, and stir altogether.
- Use a teaspoon to serve. This sauce can be used on top of the feijoada and is added individually.
- Serve the bean stew with accompanying sides and orange slices.
tips:
- Feijoada can be eaten the same day, but it will be much more tasty when served the next day.
