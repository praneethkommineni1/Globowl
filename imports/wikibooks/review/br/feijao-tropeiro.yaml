id: br-feijao-tropeiro
title: Feijão Tropeiro
alternate_names:
- Brazilian Beans and Sausage
summary: Feijao tropeiro is a traditional side dish in many parts of Brazil.
origin:
  country: BR
course: side
authenticity: unassessed
