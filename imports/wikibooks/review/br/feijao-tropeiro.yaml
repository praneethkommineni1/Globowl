- items:
  - {ingredient: dried-borlotti-beans, unit: g, qty: 907}
  - {ingredient: sausage, unit: g, qty: 907}
  - {ingredient: garlic, unit: clove, qty: 2}
  - {ingredient: onion, qty: 2, note: small}
  - {ingredient: bacon, unit: g, qty: 227}
  - {ingredient: egg, qty: 4}
  - {ingredient: scallion, unit: bunch, qty: 1, prep: chopped}
  - {ingredient: collard-greens, unit: bunch, qty: 1}
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
steps:
- Prepare beans according to their package. Drain and set aside to cool.
- In large pan, cook bacon and sausage. Remove sausage and bacon.
- Slice sausage into 1 inch-thick pieces.
- In the pan with bacon grease, sauté white onion and garlic.
- Slice collard green into small (⅛-inch) strips.
- Mix all ingredients except hard-boiled eggs in large bowl using a wooden spoon.
- Drizzle with olive oil and stir gently.
- Garnish with sliced boiled eggs.
- Serve hot or cold.
