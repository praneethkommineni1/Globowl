- boiling
ingredient_groups:
- items:
  - {ingredient: fish, unit: kg, qty: 1, prep: cut into two finger-wide strips/slices}
  - {ingredient: lemon, qty: 1, prep: juiced}
  - {ingredient: onion, qty: 2, prep: cut into circular slices}
  - {ingredient: red-bell-pepper, qty: 2, prep: cut into circular slices}
  - {ingredient: garlic, unit: clove, qty: 1, prep: pressed}
  - {ingredient: tomato, qty: 4, prep: optionally skinned then chopped}
  - {ingredient: cilantro, qty: 4, prep: finely chopped}
  - {ingredient: red-palm-oil, unit: tbsp, qty: 12}
  - {ingredient: coconut-milk, unit: ml, qty: 200}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Leave the fish in a marinade made out of lemon juice and fine powdered pepper for at least 1 hour.
- Put the fish, onions, bell peppers, garlic, tomatoes and the cilantro in numerous layers into a pot.
- Pour the azeite de dendê and the coconut milk over all, and boil everything for 20 minutes. From time to time, ladle/scoop the liquid from the pot's bottom to its top. Be careful, in order to not break the fish!
- Season to taste with salt.
- Serve with white rice.
tips:
- To get the best taste you have to add more salt than you might think.
- Try using coal fish.
