id: ca-butter-tart
title: Butter Tart
summary: Butter tarts (tartes au sucre) are an extremely common dessert in Canada. Many versions are made; some are gooey while some are not, and different nuts, fruits, and other fillings can be used. Similar tarts can be found in the culinary traditions of Scotland and France.
