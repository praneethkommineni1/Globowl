id: ca-french-canadian-shepherd-s-pie
title: French Canadian Shepherd's Pie
alternate_names:
- Pâté Chinois
summary: Pâté chinois (Chinese pie) is a traditional French Canadian main course, and is often served during the cold months of the year. It is typically served with pickled beets.
origin:
  country: CA
course: main
authenticity: unassessed
