  - {ingredient: potato, qty: 8, note: medium}
  - {ingredient: beef, unit: g, qty: 907}
  - {ingredient: onion, qty: 1, prep: chopped, note: small}
  - {ingredient: red-bell-pepper, qty: 1, prep: chopped, optional: true, note: small}
  - {ingredient: corn-kernels, unit: can, qty: 1, prep: 'drained, or creamed sweet corn with sauce'}
  - {ingredient: butter, unit: tbsp, qty: 2}
