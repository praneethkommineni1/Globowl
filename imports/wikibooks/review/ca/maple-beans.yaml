  - {ingredient: bacon, unit: slice, qty: 6}
steps:
- Wash beans and place in a saucepan with the water. Cover and bring to a boil, checking regularly.
- When water has reached the boiling point, time for 5 minutes and remove from heat. Let sit for 1 hour, covered.
- After the hour, return beans and water to heat and bring to a simmer, still covered. Simmer for 45 minutes.
- Strain beans and water through a colander, collecting the liquids in a bowl for later use.
- Combine the onion, salt, mustard, and maple syrup. Add 625 ml (2 ½ cups) of the aforementioned bean-water to the mix and blend well.
- Finely slice the bacon, place in roast pan/casserole dish, and cover with the beans, pouring the liquid mixture over top.
- Cover and bake for 3 hours at 165°C (325°F), adding 125 ml (½ cup) of bean-water at the 2 ½ hour mark.
- Melt butter and combine with brown sugar. Pour over the baked beans and bake, uncovered, until liquid is no longer visible.
tips:
- You can substitute honey or molasses for the maple syrup; maple is used for it's flavouring as much as its sweetness.
- Margarine or vegetable oil will do as well as butter for this; butter was used traditionally and is thus listed.
- This is often served with ham and sweet cornbread.
