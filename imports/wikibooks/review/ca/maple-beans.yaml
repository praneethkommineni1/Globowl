id: ca-maple-beans
title: Maple Beans
summary: Maple beans is a modification of the standard Baked Beans made throughout much of Europe and North America. This variant is common through south and central Quebec as well as most of Ontario and can be purchased in cans across Canada.
origin:
  country: CA
course: side
authenticity: unassessed
