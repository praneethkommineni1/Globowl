  - {ingredient: onion, qty: 1, prep: thinly sliced, note: large}
  - {ingredient: garlic, unit: clove, qty: [1, 2]}
  - {ingredient: beetroot, qty: [5, 6], prep: peeled and julienned, note: medium}
  - {ingredient: carrot, qty: 3, prep: peeled and julienned, note: medium}
  - {ingredient: potato, qty: 1, prep: julienned, optional: true}
  - {ingredient: white-cabbage, prep: shredded}
steps:
- Fill large stock pot with water. Add can stewed tomatoes, tomato paste, sugar, salt, onion, garlic, and beets, and boil for 20 minutes.
- Add carrots, cabbage, and potato.
- Return to a boil and cook for 1.5 hours
tips:
- It's very important to remember that this particular recipe is somewhat like wine. The older it gets, the better it gets. It is recommended to let sit in refrigerator for at least two days, before serving. The difference is truly remarkable.
