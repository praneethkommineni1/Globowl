id: ca-potato-salad
title: Potato Salad
summary: The origins of potato salad can be traced to Germany before the turn of the 17th century, where it first became popular to use vinegar and spices on potatoes as a side dish. The salad has a bite to it and is served warm as often as not.
origin:
  country: CA
