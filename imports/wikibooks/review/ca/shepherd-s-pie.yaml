id: ca-shepherd-s-pie
title: Shepherd's Pie
summary: Pâté Chinois (Chinese Pie), sometimes known as shepherd's pie, is a simple dish made from layered hamburger, creamed corn, and mashed potatoes.
origin:
  country: CA
course: main
authenticity: unassessed
yield:
  servings: 4
  amount: 4 persons
time:
  total_min: 90
difficulty: 2
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: beef, unit: g, qty: 454}
  - {ingredient: salt, prep: 'pepper, and butter to taste', note: to taste}
  - {ingredient: cheddar, unit: cup, qty: [1, 2]}
steps:
- Preheat the oven to 350&deg;F (175&deg;C)
- In a large skillet, brown the hamburger meat until it is no longer pink
- In a medium baking pan, evenly layer the meat on the bottom, then corn. Spread a layer of potatoes.
- If using, sprinkle cheese on top.
- Bake in the oven for about 30 minutes, or until the cheese is melted.
tips:
- Possible toppings include paprika, parsley, ketchup or green tomato chow-chow (ketchup vert).
- Other variations include frying the meat with a diced onion, as well as using an equal combination of creamed corn and regular corn.
- See also Shepherd's Pie and Pâté chinois.
