title: Swiss Pudding
summary: Swiss Pudding.
origin:
  country: CH
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: butter}
  - {ingredient: breadcrumbs}
  - {ingredient: apple, qty: [4, 5], prep: 'peeled, cored, and sliced'}
  - {ingredient: nutmeg}
  - {ingredient: sugar}
steps:
- Butter a baking dish, and sprinkle with the breadcrumbs.
- Combine the apples, a little butter, nutmeg, and sugar in a saucepan. Cook until softened.
- Transfer the apples into the prepared dish.
- Top apples with another layer of the crumbs, then add pieces of fresh butter on the top.
- Bake in a slow oven for about 15 minutes, until it becomes a delicate brown.
- Serve hot or cold.
