id: cm-ekwang
title: Ekwang
alternate_names:
- Cameroonian Taro Leaf Stew
summary: Ekwang is a traditional Cameroonian dish that combines cocoyam leaves, beef, crayfish, and aromatic spices. This flavorful and hearty dish is a staple in Cameroonian cuisine and is often enjoyed as a main course.
origin:
  country: CM
course: main
authenticity: unassessed
