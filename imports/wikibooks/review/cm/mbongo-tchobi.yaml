id: cm-mbongo-tchobi
title: Mbongo Tchobi
alternate_names:
- Cameroonian Black Stew
summary: Mbongo tchobi is type of stew popular among the Bassa people of Cameroon, though it is also eaten in other countries. It can be eaten with rice and yam.
