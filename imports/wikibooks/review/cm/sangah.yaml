id: cm-sangah
title: Sangah
alternate_names:
- Cameroonian Corn and Cassava Leaf
summary: Sangah is a Cameroonian dish made with corn, cassava leaf, and palm kernel extract.
origin:
  country: CM
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Pot with lid
- Stovetop
- Mortar and pestle
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: palm-nut-cream, unit: kg, qty: 1}
  - {ingredient: water}
  - {ingredient: cassava, unit: g, qty: 500, prep: well-pounded}
  - {ingredient: corn-kernels}
steps:
- Combine the water and palm nut cream in a pot. Boil for a few minutes.
- Stir in the pounded cassava leaves. Cover with the lid, and boil for 20 minutes.
- Stir in as much corn as desired. Season to taste with homi.
- Serve hot.
