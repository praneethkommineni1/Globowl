  - {ingredient: goat, unit: g, qty: 1361}
  - {ingredient: onion, qty: 2, prep: chopped}
  - {ingredient: plantain, unit: g, qty: 2268}
  - {ingredient: ground-crayfish, unit: cup, qty: 0.5}
  - {ingredient: red-palm-oil, unit: cup, qty: 1}
  - {ingredient: cayenne, unit: tbsp, qty: 1, optional: true}
  - {ingredient: kale, unit: bunch, qty: 1, prep: chopped}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
steps:
- Cut the ends off the plantains. Make a shallow slit through the length of the peel, and remove it.
- Slice the plantains into thick rounds.
- Boil the meat in a saucepan with salt, cayenne pepper, half the onions, and bouillon cubes until tender.
- Add the plantain, crayfish, red oil, and remaining onions. Simmer for about 15–20 minutes.
- Stir in the kale, and cook for an additional 8 minutes.
- Remove from the heat and serve warm.
tips:
- If you want to speed the cooking process, you can use a pressure cooker.
