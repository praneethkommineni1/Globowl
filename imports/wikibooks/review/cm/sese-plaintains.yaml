id: cm-sese-plaintains
title: Sese Plaintains
alternate_names:
- Cameroonian Plantain Stew
summary: Sese plantains is a delicious and popular meal eaten in Cameroon. It is very easy to prepare.
origin:
  country: CM
course: main
authenticity: unassessed
