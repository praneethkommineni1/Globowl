title: Chinese Rice Porridge
alternate_names:
- Congee
summary: Congee is a type of rice porridge eaten across Asia. It may also be called juk, zhou, ganji, or other similar variations.
origin:
  country: CN
course: breakfast
authenticity: unassessed
