title: Chow Mein
summary: Chow mein is a generic Chinese term for a dish of stir-fried noodles, of which there are many varieties. Authentic chow mein is generally made of soft noodles, whereas chow mein in Westernized Chinese Cuisine may also be made from thin crispy noodles.
