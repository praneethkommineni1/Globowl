id: cn-fried-corn
title: Fried Corn
summary: A pleasantly-surprising recipe encountered in China. Also, a good first attempt for beginning deep-fryers. Makes a good substitute to chips or fries.
origin:
  country: CN
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: corn-kernels}
  - {ingredient: all-purpose-flour}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: vegetable-oil}
steps:
- If using frozen corn, thaw. If using canned corn, microwave in a glass bowl or gently heat on the stove until warm.
- Coat corn with a light layer of egg wash.
- Mix salt, pepper, MSG, and other spices into the flour.
- Move corn from the egg wash, and toss with the flour mixture until well-coated.
- Heat enough oil for deep-frying to moderate–high heat.
- Deep-fry floured corn until golden brown on the outside (less than 2 minutes).
- Serve as a complement to another dish.
tips:
- Substitute moderately-chopped vegetables such as carrots and green beans for additional flavors.
