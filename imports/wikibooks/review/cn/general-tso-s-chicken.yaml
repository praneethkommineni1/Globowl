id: cn-general-tso-s-chicken
title: General Tso's Chicken
summary: 'General Tso''s chicken (Mandarin: Zuo Zongtang ji in) is a popular battered-chicken recipe in Chinese-American restaurants, allegedly hailing from Hunan province in China.'
origin:
  country: CN
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 30
difficulty: 2
techniques:
- deep-frying
