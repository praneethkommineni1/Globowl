id: cn-hot-and-sour-soup
title: Hot and Sour Soup
summary: Hot and sour soup is a popular soup served at Chinese restaurants in the United States. This version tastes exactly like that served at various Chinese restaurants in California.
origin:
  country: CN
course: soup
authenticity: unassessed
yield:
  servings: 4
  amount: 4 persons
time:
  total_min: 15
difficulty: 2
techniques:
- simmering
