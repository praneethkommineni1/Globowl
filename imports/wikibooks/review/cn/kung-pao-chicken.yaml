id: cn-kung-pao-chicken
title: Kung Pao Chicken
summary: Kung pao chicken (gong bao in Mandarin) is a spicy Sichuan recipe made with diced chicken, chili peppers and peanuts, named after a court official. It is a popular dish served at Chinese restaurants throughout the United States and the UK.
origin:
  country: CN
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 50
difficulty: 2
techniques:
- boiling
- marinating
- stir-frying
