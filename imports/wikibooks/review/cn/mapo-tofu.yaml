id: cn-mapo-tofu
title: Mapo Tofu
summary: Mápó dòufu (麻婆豆腐), also romanized as mapo tofu, is a classic spicy tofu and meat dish from the Szechuan province of China. It is a very flavourful, easy-to-prepare, and spicy dish.
