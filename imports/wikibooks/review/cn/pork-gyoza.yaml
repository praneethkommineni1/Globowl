id: cn-pork-gyoza
title: Pork Gyoza
summary: Gyoza are the Japanese variation of Chinese potsticker dumplings (guotie). They consist of a thin flour dumpling skin that is filled, pleated, and pan-fried.
origin:
  country: CN
  also_claimed_by:
