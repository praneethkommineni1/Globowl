id: cn-red-bean-paste
title: Red Bean Paste
summary: 'Red bean paste (in simplified Chinese: 红豆沙, in traditional Chinese: 紅豆沙, Pinyin: hóngdòushā, meaning "red bean sand", due to its texture) is a sweet paste used for many things in Chinese, Japanese and Korean cuisine.'
