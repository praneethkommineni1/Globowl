title: Salted Mustard Greens and Shredded Meat Noodle Soup
summary: Salted mustard greens and shredded meat noodle soup (&#38634;&#33756;&#32905;&#32114;&#40629;) is a Chinese dish composed of salted mustard greens (&#38634;&#35041;&#32005;), shredded pork (&#32905;&#32114;), soup stock, and noodles.
