id: cn-shark-fin-soup
title: Shark Fin Soup
summary: Shark fin soup, or shark fin stew, is a fish soup believed to have originated from China. On the Chinese seas during the 1800s, pirates under the control of Ch'ing Yih Szaou used to make shark fin soup that took at least 4 hours to prepare.
