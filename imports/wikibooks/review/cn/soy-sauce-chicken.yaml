id: cn-soy-sauce-chicken
title: Soy Sauce Chicken
summary: Soy sauce chicken (醬油雞) is a northern Chinese dish.
origin:
  country: CN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
- simmering
ingredient_groups:
- items:
  - {ingredient: chicken}
  - {ingredient: scallion}
  - {ingredient: vegetable-oil}
  - {ingredient: soy-sauce, unit: tbsp, qty: [2, 3]}
  - {ingredient: ginger}
  - {ingredient: sugar}
  - {ingredient: water}
steps:
- Fry the chicken parts in a pan with green onions and oil until the outside of the chicken parts are brown.
- Add soy sauce, cooking wine, chopped ginger, and sugar. Add enough water to cover the chicken.
- Simmer, uncovered, over low heat until most of the liquid has evaporated.
