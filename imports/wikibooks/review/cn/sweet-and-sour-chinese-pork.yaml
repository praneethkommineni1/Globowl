id: cn-sweet-and-sour-chinese-pork
title: Sweet and Sour Chinese Pork
summary: Jing du or sweet-and-sour pork is a Chinese dish of fried and glazed pork.
origin:
  country: CN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- name: Meat
  items:
  - {ingredient: pork, qty: 1, prep: cut in 1-inch squares and pounded flat}
- name: Marinade
  items:
  - {ingredient: sherry, unit: tbsp, qty: 3}
  - {ingredient: soy-sauce, unit: tbsp, qty: 2}
  - {ingredient: cornstarch, unit: tsp, qty: 2}
- name: Sauce
  items:
  - {ingredient: ketchup, unit: cup, qty: 0.25}
  - {ingredient: soy-sauce, unit: tbsp, qty: 1}
  - {ingredient: worcestershire-sauce, unit: tbsp, qty: 1}
  - {ingredient: sugar, unit: tbsp, qty: 1}
  - {ingredient: egg, qty: 1, prep: lightly beaten}
  - {ingredient: cornstarch, unit: tsp, qty: 2}
  - {ingredient: olive-oil, unit: cup, qty: 0.25}
  - {ingredient: ginger, unit: tsp, qty: 1}
  - {ingredient: garlic, unit: tsp, qty: 1}
  - {ingredient: cilantro, unit: tbsp, qty: 1, optional: true}
steps:
- Mix the marinade ingredients in a large bowl and add the meat. Mix well to cover the meat and refrigerate for 2 hours (or overnight).
- Combine sauce ingredients and set aside.
- Remove pork from refrigerator and remove excess liquid (if any).
- Beat egg and cornstarch and cover meat mixing well.
- Place 2 tbsp oil in a wok and cook half the meat until no longer pink when slashed (about 2 minutes).
- Remove meat, add remaining oil, and cook remaining meat.
- Set cooked meat aside and discard pan drippings.
- Add ginger and garlic to wok, stirring and cooking until fragrant.
- Return pork to wok quickly stirring and add the sauce (stand back when adding sauce or it will really clear your sinuses).
- Stir meat and sauce until meat is well covered, serve immediately.
tips:
- Extra light olive oil is used to avoid adding olive oil flavor to the dish.
