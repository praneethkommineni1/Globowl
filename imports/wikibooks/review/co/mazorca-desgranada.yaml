id: co-mazorca-desgranada
title: Mazorca Desgranada
alternate_names:
- Colombian Beef Salad
summary: La mazorca desgranada is typical northern Colombian coast fast food recipe. Is is made of sweet corn, beef, cheese, crushed potato chips, and tartar sauce.
origin:
  country: CO
course: main
authenticity: unassessed
yield:
  servings: 3
  amount: 3–4
time:
  total_min: 30
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: beef, unit: g, qty: 227, prep: cut into thin strips}
  - {ingredient: allspice}
  - {ingredient: black-pepper}
  - {ingredient: salt}
  - {ingredient: worcestershire-sauce}
  - {ingredient: lettuce, qty: 0.5, prep: thinly sliced, note: small}
  - {ingredient: monterey-jack, unit: g, qty: 113}
  - {ingredient: corn-kernels, unit: can, qty: 1}
steps:
- Fry beef in a medium skillet. Season with allspice, pepper, salt, and Worcestershire sauce.
- Heat corn in warm water, then drain well.
- Place lettuce into serving dish.
- Place corn over the lettuce.
- Add shredded cheese on top of the corn.
- Top with beef.
- Cover everything with crushed potato chips.
- Pour tartar sauce all over the dish, and enjoy.
tips:
- This recipe is similar to KFC bowls. You can eliminate beef, or replace it with chicken, bacon, pork, sausage, hot dog, and others. You can also mix tartar sauce with ketchup and/or mustard.
