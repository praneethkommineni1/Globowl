id: co-rice-tamale
title: Rice Tamale
alternate_names:
- Pastel de Arroz
summary: El Pastel de Arroz (rice tamale) is typical dish from Cartagena, Colombia. It is very common to find it on Sundays at the beach or as a Christmas Eve favourite.
origin:
  country: CO
course: main
authenticity: unassessed
