title: Arroz con Pollo
alternate_names:
- Rice and Chicken
summary: 'Arroz con pollo (trans: rice with chicken) is a traditional dish common throughout Spain and Latin America especially in Cuba, Panama, Peru, Puerto Rico, Costa Rica, and the Dominican Republic.'
