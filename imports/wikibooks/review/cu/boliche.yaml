id: cu-boliche
title: Boliche
alternate_names:
- Cuban Chorizo-Stuffed Roast
summary: Boliche (pronounced bow-lee-chay) is a popular Cuban dish consisting of eye round roast stuffed with chorizo sausages simmered in a tomato sauce base.
origin:
  country: CU
course: main
authenticity: unassessed
yield:
  servings: 6
  amount: 6–8
time:
  total_min: 1
