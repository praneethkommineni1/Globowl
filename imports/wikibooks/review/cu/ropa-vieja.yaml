id: cu-ropa-vieja
title: Ropa Vieja
alternate_names:
- Caribbean Shredded Beef
summary: Ropa vieja, which is Spanish for "old clothes," is a popular Caribbean dish consisting of shredded beef (often skirt or flank steak), vegetables, and a sauce.
