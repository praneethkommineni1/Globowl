id: de-black-forest-cake
title: Black Forest Cake
summary: Black Forest Cake, sometimes called by the French gateau, gateaux or gâteau (meaning "cake"), is a chocolate cake with a strong cherry element. The recipe originates from Germany, where it is called Schwarzwälder Kirschtorte.
