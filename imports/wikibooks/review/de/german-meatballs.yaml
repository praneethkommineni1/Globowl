- items:
  - {ingredient: beef, unit: g, qty: 227}
  - {ingredient: pork, unit: g, qty: 227}
  - {ingredient: onion, qty: 1, prep: peeled and chopped fine, note: large}
  - {ingredient: anchovies, qty: 5, prep: chopped finely}
  - {ingredient: capers, unit: tbsp, qty: 2}
  - {ingredient: egg, qty: 1, note: large}
  - {ingredient: white-bread, unit: slice, qty: [2, 3], prep: soaked in water}
  - {ingredient: lemon, qty: 2, prep: juiced}
