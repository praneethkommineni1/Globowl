id: de-german-meatballs
title: German Meatballs
summary: This is a German meatball recipe that is easy and utterly delicious. These are known in Germany as Konigsberge Klopse, or sometimes as Konigsberger Klopsies.
origin:
  country: DE
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
- simmering
