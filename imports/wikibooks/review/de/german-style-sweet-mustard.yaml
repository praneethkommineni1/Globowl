id: de-german-style-sweet-mustard
title: German Style Sweet Mustard
alternate_names:
- Senf
summary: Senf is German for "mustard". This particular senf, known as 'Süßer Senf', has a sweet, yet sharp taste that makes it great on sandwiches and crackers.
origin:
  country: DE
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 10
difficulty: 2
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: mustard-seeds, unit: g, qty: 48}
  - {ingredient: sugar, unit: tsp, qty: 0.5}
  - {ingredient: white-vinegar, unit: cup, qty: 0.5}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: black-pepper}
steps:
- Mix sugar, mustard, salt, and pepper together. Mix in water.
- Mix in vinegar last, as the mustard will lose some of its flavour if vinegar is introduced too early.
- Stir using a wire whisk to prevent lumps.
- Add some water if too thick.
tips:
- It gets better as it cools and ages awhile.
