id: de-grotten-hans
title: Grotten Hans
alternate_names:
- Steamed Sweet Bread
summary: Grotten hans is a recipe that has been called a big dumpling but is basically a steamed pudding. The recipe was traditional in the German areas of Russia.
origin:
  country: DE
course: dessert
authenticity: unassessed
yield:
  servings: 1
