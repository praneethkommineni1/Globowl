id: de-potatoes-with-green-sauce
title: Potatoes with Green Sauce
summary: Green sauce is a dish that originates from the Frankfurt/Main region of Germany.
origin:
  country: DE
course: condiment
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: sour-cream, unit: cup, qty: [3, 4]}
  - {ingredient: milk}
  - {ingredient: sunflower-oil, unit: tbsp, qty: 1}
  - {ingredient: lemon-juice, unit: tsp, qty: 2}
  - {ingredient: egg, qty: 4}
  - {ingredient: potato, qty: [10, 15], note: large}
  - {ingredient: dill, qty: [1, 1.5]}
  - {ingredient: chives, qty: [1, 1.5]}
steps:
- Combine sour cream, oil, and lemon juice. Add milk until the mixture takes the consistency of a thick sauce.
- Mix herbs well, and mix them into the sauce.
- Cut hard-boiled eggs to small pieces and add them to the sauce along with some salt and pepper.
- Leave the sauce in the fridge for about 1–1½.
- Boil potatoes and serve hot with the cold sauce. More hard-boiled eggs can also be served along with this.
