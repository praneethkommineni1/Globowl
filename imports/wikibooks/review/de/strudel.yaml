id: de-strudel
title: Strudel
summary: This version of strudel uses filo pastry to create the thin sheets. Serve warm with ice cream.
origin:
  country: DE
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: apple, qty: 4, prep: preferably red}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.5}
  - {ingredient: sugar, unit: tbsp, qty: 2}
  - {ingredient: butter, unit: cup, qty: 0.5}
steps:
- Preheat oven to 200°C.
- Peel, core, and cube apples.
- Combine apples, cinnamon, and sugar. Mix well.
- Generously brush filo pastry sheets with butter.
- Spread apple mixture over pastry sheet.
- Alternate with two layers of filo pastry for every layer of apple mixture.
- Brush with melted butter.
- Bake for 30 minutes or until pastry is golden brown.
tips:
- For more tartness, substitute for 3 red apples and 1 green apple.
