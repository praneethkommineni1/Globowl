id: dk-frikadeller
title: Frikadeller
alternate_names:
- Danish Meatballs
summary: Frikadeller are as Danish as the Dannebrog. This is standard Danish fare, made of ground pork and veal and traditionally served with boiled potatoes, gravy and rødkål (braised red cabbage).
origin:
  country: DK
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: veal, unit: g, qty: 250}
  - {ingredient: pork, unit: g, qty: 250}
  - {ingredient: egg, qty: 1, note: large}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: breadcrumbs, qty: 20}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: salt, note: to taste}
  - {ingredient: garlic, optional: true}
  - {ingredient: parsley, note: to taste}
  - {ingredient: butter}
steps:
- Mix all ingredients except butter together.
- Shape mixture into small patties.
- Fry in hot skillet with lots of butter.
tips:
- These can be frozen and reheated.
- You can substitute bread crumbs with wheat germ and/or oat bran.
- Any ingredient will work. Many people add a quantity of milk also, and the mixture is then thickened again with more flour, bread crumbs and/or oat bran.
