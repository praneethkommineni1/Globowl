id: do-locrio
title: Locrio
alternate_names:
- Dominican Chicken and Rice
summary: A locrio is a common Dominican dish similar to paella. Like paella, there are many variations. The main point is to have a little tomato sauce/paste for coloring, and some caramelized sugar. In that way it is similar to the Trinidadian pilau.
