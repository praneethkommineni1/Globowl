id: dz-algerian-chakhchoukha
title: Algerian Chakhchoukha
alternate_names:
- Vegetable and Flatbread Stew
summary: Chakhchoukha is an Algerian dish prepared for festive celebrations, consisting of a vegetable stew to which small pieces of flatbread or semolina dough are added. Typically the flatbread is either rougag or trid.
origin:
  country: DZ
