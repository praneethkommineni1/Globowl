id: dz-algerian-mint-tea
title: Algerian Mint Tea
summary: Algerian Mint Tea (Atay Djazairi) is an Algerian drink. Mint tea is a popular drink all over North Africa and its preparation varies from one country to another. Algerian Mint Tea is prepared by boiling dried green tea and fresh mint leaves in water and sugar.
origin:
  country: DZ
course: drink
authenticity: unassessed
yield:
  servings: 4
