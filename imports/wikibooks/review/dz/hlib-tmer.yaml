id: dz-hlib-tmer
title: Hlib Tmer
alternate_names:
- Algerian Date Milk
summary: Hlib t'mer (, Date Milk) is an Algerian drink from the Sahara.
origin:
  country: DZ
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: milk, unit: ml, qty: 250}
  - {ingredient: dates, qty: 7, prep: ripe dates}
  - {ingredient: sugar}
  - {ingredient: water}
steps:
- Remove the seeds from the dates and check if there are any worms inside them.
- Boil the dates with water and sugar for a few minutes until you feel the dates are well-cooked.
- Turn off the heat, blend the date mixture, and strain it as well as possible.
- Pour the resulting date syrup into your cup of milk.
tips:
- Any milk could be used for this drink as camel milk isn't easily available; either cow milk or soy milk could work out just fine.
- Alternatively, you can simmer the dates directly in the milk over low heat until the colour of the milk changes to a nice brown shade before straining.
