id: dz-lekhchef
title: Lekhchef
alternate_names:
- Algerian Raisin Drink
summary: Lekhchef () is a refreshing Algerian drink from Constantine.
origin:
  country: DZ
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 10
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: water, unit: l, qty: 1}
  - {ingredient: cinnamon-stick, qty: 2}
  - {ingredient: raisins, unit: g, qty: 150, prep: rinsed well}
  - {ingredient: sugar, note: to taste}
  - {ingredient: orange-flower-water}
  - {ingredient: rose-water}
steps:
- Combine the water and cinnamon sticks in a saucepan. Bring to a boil.
- Add the raisins to the boiling water, and simmer over low heat.
- Sweeten drink to taste with sugar, and stir over very low heat to dissolve sugar.
- Remove from the heat, remove the cinnamon sticks, and let the drink completely cool down.
- Flavour with orange blossom water and rose water.
- Put the beverage in the refrigerator and serve very cold with or without raisins.
tips:
- If you decide to blend the final mixture, do not add sugar, as your drink might end up too sweet.
