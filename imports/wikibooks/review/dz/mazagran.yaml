id: dz-mazagran
title: Mazagran
alternate_names:
- Algerian Iced Coffee
summary: Mazagran (), also called Café Mazagran, is an iced coffee from Algeria. Often deemed the original iced coffee, mazagran originated from a city in Algeria with the same name. It is said that the drink was created by French colonial troops while in captivity in Mazagran Fortress.
