id: dz-mhadjeb
title: Mhadjeb
alternate_names:
- Algerian Stuffed Flatbread
summary: Mhadjeb is a type of thin, flaky Algerian pancake made from semolina and traditionally filled with onion, tomatoes, and even meat with harissa. To ensure the dough turns out well, it must be kneaded for a sufficient amount of time.
origin:
  country: DZ
course: bread
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 60
difficulty: 3
techniques:
- dough-making
ingredient_groups:
- items:
  - {ingredient: semolina, unit: cup, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 0.5}
  - {ingredient: salt}
  - {ingredient: water}
  - {ingredient: tomato, qty: 2}
  - {ingredient: vegetable-oil}
  - {ingredient: onion, qty: 4, prep: sliced thin}
  - {ingredient: black-pepper}
  - {ingredient: red-chili}
steps:
- Combine the semolina, flour, and salt together in a bowl. Gradually stir in water with your hands until you get a smooth and soft dough.
- Wet a plastic bag in warm water, cover the dough while still dripping, and let it rest. Afterwards, uncover the dough and knead lightly for a few minutes.
- Coat your hands in oil, and shape the dough into balls, arranging them beside each other. Cover and allow to rest once more. These extra relaxation periods help to produce superior results.
- Peel the tomatoes, then dice them into small pieces.
- Heat some oil in a pan over medium-low heat. Add the onions, and stir regularly until they become translucent and soft.
- Add the diced tomatoes, seasonings, and salt. Cover the pan and allow the mixture to cook over low heat, stirring occasionally to prevent it from sticking.
- Let cool.
- On an oiled surface, roll out the first ball of dough and give it a light coating of oil.
- Place some filling in the center, and fold the dough over it on four sides to form a square.
- Lightly oil the top of the dough and move it to a hot pan over medium-low heat. Cook until the first side is well-browned, then flip it to the other side and brown again. Remove from the pan.
- Repeat the shaping and cooking process with the remaining dough and filling.
- Serve hot and enjoy!
