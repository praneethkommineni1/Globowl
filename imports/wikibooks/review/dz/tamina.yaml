id: dz-tamina
title: Tamina
alternate_names:
- Algerian Semolina Honey Dessert
summary: Tamina () is a simple Algerian dessert mainly made of semolina. It is usually served during celebrations such as engagement parties, weddings, baby showers, or Mawlid.
origin:
  country: DZ
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 30
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: semolina, unit: g, qty: 500}
  - {ingredient: butter, unit: g, qty: 250}
  - {ingredient: honey, unit: g, qty: 250}
  - {ingredient: orange-flower-water, unit: tbsp, qty: 1}
  - {ingredient: ground-cinnamon}
  - {ingredient: almonds}
steps:
- Toast the semolina in a frying pan or in a cast iron dish until it takes on a nice golden color. Remove from the heat, and let it completely cool down.
- Melt the butter and honey in a saucepan, and add orange blossom water.
- Gradually add the cooled semolina while mixing.
- Cook for 3–5 minutes while stirring to combine everything well.
- Pour the tamina on a plate without waiting too long, and even out the surface.
- Sprinkle with cinnamon and garnish with almonds or dragées.
- Let cool and serve.
