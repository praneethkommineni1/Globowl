id: dz-tisane-ma-louisa
title: Tisane ma Louisa
alternate_names:
- Algerian Lemon Herb Tea
summary: Tisane ma Louisa (, Louisa's Water Remedy Tea) is an Algerian herbal remedy tea.
origin:
  country: DZ
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, unit: ml, qty: 250}
  - {ingredient: lemon, qty: 0.5, prep: juiced}
  - {ingredient: sugar, optional: true, note: to taste}
steps:
- Heat the water in a saucepan and bring it to a boil.
- Add the verbena leaves to the boiling water.
- Let the verbena leaves steep in water for about 10 minutes.
- Stir the leaves in the water (attempt to crush them as small as possible), then strain out the leaves.
- Add the lemon juice and sugar.
