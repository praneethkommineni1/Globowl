  - {ingredient: black-pepper, note: to taste}
steps:
- Hard-boil the eggs (about 10 minutes).
- Chop the eggs into small pieces (larger pieces of egg white often fail to mix with butter).
- Mix chopped eggs with butter.
- Add salt and pepper.
- Use as sandwich spread.
