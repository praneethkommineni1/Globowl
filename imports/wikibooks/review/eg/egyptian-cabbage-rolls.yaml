id: eg-egyptian-cabbage-rolls
title: Egyptian Cabbage Rolls
alternate_names:
- Mahshi Malfoof
summary: Egyptian cabbage rolls, also known as mahshi malfoof, are a traditional Egyptian dish that features tender cabbage leaves stuffed with a savory filling. The rolls are then cooked in a flavorful tomato sauce, resulting in a delicious and comforting meal.
