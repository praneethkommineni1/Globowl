id: eg-egyptian-fish-tagine
title: Egyptian Fish Tagine
alternate_names:
- Samak Tajine
summary: Egyptian fish tagine, also known as samak tajine, is a popular seafood dish in Egyptian cuisine. It features tender fish fillets cooked in a rich tomato-based sauce with an array of aromatic herbs and spices.
origin:
  country: EG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Tagine or deep, wide skillet with a lid
- Cooking spoon or spatula
- Knife
- Citrus juicer (if using fresh lemon juice)
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped, note: large}
  - {ingredient: garlic, qty: 3, prep: minced}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: cayenne, unit: tsp, qty: 0.5}
  - {ingredient: ground-coriander, unit: tsp, qty: 1}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 1}
  - {ingredient: tomato, unit: can, qty: 1}
  - {ingredient: chicken-stock, unit: cup, qty: 1}
  - {ingredient: lemon}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: fish, qty: 4}
  - {ingredient: parsley, prep: chopped}
steps:
- Heat the olive oil in a tagine or deep skillet over medium heat.
- Add the finely chopped onion and minced garlic. Sauté until the onion becomes translucent and fragrant.
- Add the ground cumin, ground paprika, ground cayenne pepper, ground coriander, and ground cinnamon. Stir well to combine and let the spices toast for a minute to release their flavors.
- Add the diced tomatoes (including the juice) to the tagine or skillet. Stir to incorporate the spices with the tomatoes.
- Pour in the vegetable or fish stock and lemon juice. Season with salt and pepper to taste. Stir the sauce gently to combine all the ingredients.
- Reduce the heat to low and let the sauce simmer for about 10 minutes to allow the flavors to meld together.
- Carefully place the fish fillets into the simmering sauce, ensuring they are submerged. Spoon some of the sauce over the fish to coat them evenly.
- Cover the tagine or skillet with a lid and let the fish cook in the sauce for about 15–20 minutes, or until the fish is cooked through and flakes easily with a fork.
- Once the fish is cooked, remove the tagine or skillet from the heat.
- Serve hot, garnished with fresh parsley or cilantro. It pairs well with Egyptian bread or rice.
tips:
- Egyptian fish tagine is a versatile dish, and you can customize the spices and herbs according to your preference.
