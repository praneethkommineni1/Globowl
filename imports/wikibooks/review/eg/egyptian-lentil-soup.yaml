id: eg-egyptian-lentil-soup
title: Egyptian Lentil Soup
summary: Egyptian lentil soup is a hearty and nutritious soup loved for its simplicity and delicious flavors. Made with red lentils, aromatic spices, and a touch of tanginess from lemon juice, this soup is a popular choice for a comforting meal.
