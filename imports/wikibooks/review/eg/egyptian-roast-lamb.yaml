id: eg-egyptian-roast-lamb
title: Egyptian Roast Lamb
alternate_names:
- Kharouf Mahshi
summary: Egyptian roast lamb, also known as kharouf mahshi, is a traditional Egyptian dish that showcases the rich flavors of tender roasted lamb. The lamb is marinated in a fragrant blend of herbs and spices, then slow-roasted to perfection.
origin:
  country: EG
course: main
authenticity: unassessed
yield:
  servings: 1
