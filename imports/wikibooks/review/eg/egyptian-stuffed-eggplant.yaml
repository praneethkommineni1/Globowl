id: eg-egyptian-stuffed-eggplant
title: Egyptian Stuffed Eggplant
alternate_names:
- Mahshi Betinjan
summary: Egyptian stuffed eggplant, also known as mahshi betinjan, is a flavorful and satisfying dish in Egyptian cuisine. It features eggplants that are hollowed out and stuffed with a savory filling made of rice, ground meat, herbs, and spices.
