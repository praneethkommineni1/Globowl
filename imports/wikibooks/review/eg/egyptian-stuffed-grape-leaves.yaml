id: eg-egyptian-stuffed-grape-leaves
title: Egyptian Stuffed Grape Leaves
alternate_names:
- Warak Enab Mahshi
summary: Egyptian stuffed grape leaves, also known as warak enab mahshi, is a traditional dish in Egyptian cuisine that showcases delicate vine leaves stuffed with a flavorful rice and herb filling. These stuffed grape leaves are often enjoyed as appetizers or as part of a larger meal.
