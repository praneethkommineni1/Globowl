id: eg-egyptian-tomato-salad
title: Egyptian Tomato Salad
summary: Egyptian tomato salad is a simple and refreshing salad that celebrates the vibrant flavours of ripe tomatoes. This salad showcases the natural sweetness and juiciness of tomatoes, combined with a tangy dressing and aromatic herbs.
origin:
  country: EG
course: salad
authenticity: unassessed
