id: eg-fattah
title: Fattah
alternate_names:
- Egyptian Layered Bread Dish
summary: Fattah is a popular Egyptian dish that features layers of bread, rice, and meat, topped with a flavorful tomato sauce and garnished with aromatic herbs. It is a hearty and comforting dish that is often enjoyed during festive occasions and celebrations.
origin:
  country: EG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Oven
- Baking dish
- Mixing bowl
- Spoon or spatula for spreading
- Knife for chopping and mincing
- Cutting board
techniques:
- baking
