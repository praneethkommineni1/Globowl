id: eg-ful-medames
title: Ful Medames
alternate_names:
- Egyptian Fava Beans
summary: Ful medames is a classic Egyptian dish made from cooked fava beans, typically enjoyed for breakfast or as a hearty street food snack. It is a nutritious and flavorful dish that is rich in protein and fiber.
origin:
  country: EG
course: main
