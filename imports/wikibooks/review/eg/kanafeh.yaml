id: eg-kanafeh
title: Kanafeh
alternate_names:
- Egyptian Sweet Cheese Pastry
summary: Kanafeh, a delectable Middle Eastern pastry, is a must-try dessert. It consists of delicate angel hair-like strands of kadaif, paired with akawi cheese and samneh or clarified butter.
origin:
  country: EG
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 60
difficulty: 2
techniques:
- simmering
