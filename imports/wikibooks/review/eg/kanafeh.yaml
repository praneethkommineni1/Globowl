  - {ingredient: sugar, unit: g, qty: 325}
  - {ingredient: mozzarella, unit: g, qty: 225}
  - {ingredient: cream-cheese, unit: g, qty: 140}
  - {ingredient: lemon-juice, unit: tbsp, qty: 2}
