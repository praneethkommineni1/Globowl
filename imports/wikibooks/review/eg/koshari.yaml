steps:
- In a saucepan, cook the rice according to the package instructions until it is tender and fluffy. Once cooked, set the rice aside.
- In a separate pot, cook the lentils in boiling water until they are tender but not mushy. Drain the lentils in a colander and set them aside.
- Cook the small macaroni or short pasta in a pot of salted boiling water until it is al dente. Drain the pasta in a colander and set it aside.
- In a skillet, heat the vegetable oil over medium heat. Add the thinly sliced onion and sauté until it turns golden brown and crispy. Remove the fried onions from the skillet and set them aside on a paper towel to drain excess oil.
- In the same skillet, add the minced garlic and sauté for a minute until fragrant.
- Add the chopped tomatoes, tomato paste, ground cumin, ground cinnamon, salt, black pepper, and chili powder (if using) to the skillet. Stir well to combine the ingredients.
- Simmer the tomato sauce over low heat for about 10–15 minutes, allowing the flavors to meld together and the sauce to thicken slightly.
- To serve, layer the cooked rice, lentils, and pasta in a serving dish. Drizzle the tomato sauce generously over the top.
- Garnish with the crispy fried onions and freshly chopped parsley or cilantro.
- Serve the koshari hot and enjoy the harmonious blend of flavors and textures.
