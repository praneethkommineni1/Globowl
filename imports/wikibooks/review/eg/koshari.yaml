id: eg-koshari
title: Koshari
alternate_names:
- Egyptian Rice with Pasta and Lentils
summary: Koshari is a beloved Egyptian street food that brings together a delightful combination of flavors and textures. It is a hearty and satisfying vegetarian dish made with a mixture of rice, lentils, pasta, and a flavorful tomato sauce, topped with crispy fried onions.
