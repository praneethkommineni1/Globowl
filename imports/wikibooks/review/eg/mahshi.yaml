id: eg-mahshi
title: Mahshi
alternate_names:
- Egyptian Stuffed Vegetables
summary: Mahshi is a delicious Egyptian dish that involves stuffing various vegetables with a flavorful mixture of rice, herbs, and spices. It is a versatile and satisfying dish that can be customized to individual tastes.
