id: eg-molokhia
title: Molokhia
alternate_names:
- Egyptian Jute Mallow Soup
summary: Molokhia is a popular Egyptian soup made from the leaves of the jute mallow plant. It is a comforting and flavorful dish that is often enjoyed with rice or bread. Molokhia has a unique texture and a distinct earthy taste, making it a beloved staple in Egyptian cuisine.
