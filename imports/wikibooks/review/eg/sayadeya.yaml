id: eg-sayadeya
title: Sayadeya
alternate_names:
- Egyptian Fish with Rice
summary: Sayadeya is a delicious and aromatic Egyptian dish that features fish cooked with rice in a flavorful tomato-based sauce. It is a popular dish along the coastal regions of Egypt, where fresh fish is readily available.
origin:
  country: EG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Large skillet or frying pan with a lid
- Mixing bowl
- Knife for chopping and mincing
- Cutting board
- Spoon or spatula for stirring
- Paper towels
techniques:
- sauteing
- simmering
