id: es-gazpacho
title: Gazpacho
summary: Gazpacho is a hearty soup that is served cold, making it a perfect way to cool down and replenish the body on a hot, summer day. This is the classic gazpacho recipe, but there are many other variations. Gazpacho is typically served along with the main course, or afterward.
