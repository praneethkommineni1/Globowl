  - {ingredient: onion, qty: 0.5, prep: chopped}
  - {ingredient: red-wine-vinegar, unit: tbsp, qty: 1}
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: red-chili, qty: 0.25, prep: seeds removed, optional: true}
  - {ingredient: cilantro, optional: true}
  - {ingredient: salt}
  - {ingredient: black-pepper}
- name: Garnish
  items:
