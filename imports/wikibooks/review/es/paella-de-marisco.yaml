id: es-paella-de-marisco
title: Paella de Marisco
summary: Paella de marisco (seafood paella) is the world's most popular paella recipe. It emerged in its modern version in Spain's Valencian coastal region in the early 1800s. Prior to the 19th century, the ingredients for seafood paella varied greatly with the most unusual being eel.
