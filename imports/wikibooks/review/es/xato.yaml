id: es-xato
title: Xató
alternate_names:
- Catalan Endives and Fish
summary: Xató is a typical Catalan dish.
origin:
  country: ES
course: salad
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- name: Sauce
  items:
  - {ingredient: almonds, unit: g, qty: 100}
  - {ingredient: garlic, unit: clove, qty: 2}
  - {ingredient: red-chili, qty: 0.5, optional: true}
  - {ingredient: white-bread, unit: slice, qty: [2, 3]}
  - {ingredient: white-vinegar}
  - {ingredient: olive-oil}
  - {ingredient: salt}
- name: Dish
  items:
  - {ingredient: anchovies, qty: 12, prep: salt removed}
  - {ingredient: olives, unit: g, qty: 100}
steps:
- In a mortar, crush the almonds, hazelnuts, anchovies, garlic cloves, nyores pulp, chili, salt, bread (you can soak them in vinegar or add the vinegar separately), vinegar, and salt.
- Mix in the olive oil.
- Wash and soak the curly endives in water.
- Take the salt off the anchovies, the salty tuna, and the cod—rip the last two out—and mix them with the curly endive in a bowl.
- Add the olives.
- Add the sauce.
- Mix it up well, so all the ingredients are coated with sauce. Serve, trying to build up some sort of curly endive castle shape.
