id: et-berbere
title: Berbere
summary: Berbere is a mix of spices used in Ethiopian and Eritrean cuisine. It consists of a fiery mix of chili and several aromatic spices.
origin:
  country: ET
course: condiment
authenticity: unassessed
yield:
  servings: 1
