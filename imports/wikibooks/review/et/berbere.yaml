  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.25}
  - {ingredient: ground-cloves, unit: tsp, qty: 0.25}
  - {ingredient: ground-cardamom, unit: tsp, qty: 0.5}
  - {ingredient: ground-coriander, unit: tsp, qty: 0.5}
  - {ingredient: ground-fenugreek, unit: tsp, qty: 0.5}
  - {ingredient: nutmeg, unit: tsp, qty: 0.5}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tbsp, qty: 2}
steps:
- Roast everything except the pepper, chili and salt, in a heavy saucepan or cast-iron frying pan for about 5 minutes on a low heat.
- Stir in the pepper, chili and salt, and keep stirring for another 10 minutes.
- Store in a glass jar, away from sunlight.
