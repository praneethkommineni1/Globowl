id: et-doro-dabo
title: Doro Dabo
alternate_names:
- Ethiopian Chicken with Spiced Bread
summary: Doro dabo is a savory and aromatic dish that combines tender chicken pieces with a flavorful bread. This traditional Ethiopian recipe is a delightful centerpiece for special occasions and gatherings.
