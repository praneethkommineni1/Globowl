id: et-doro-fitfit
title: Doro Fitfit
alternate_names:
- Ethiopian Chicken Salad
summary: Doro fitfit is a delicious and vibrant dish made with shredded injera, spiced chicken, and a flavorful dressing. This salad is a popular part of Ethiopian cuisine and is enjoyed as a refreshing appetizer or light meal.
origin:
  country: ET
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
