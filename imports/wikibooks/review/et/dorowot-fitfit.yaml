id: et-dorowot-fitfit
title: Dorowot Fitfit
alternate_names:
- Ethiopian Chicken Stew Salad
summary: Dorowot fitfit is a unique and flavorful dish that combines the rich flavors of dorowot (Ethiopian chicken stew) with the textures of torn injera (Ethiopian flatbread). This dish is a popular part of Ethiopian cuisine and is enjoyed as a main course or a side dish.
