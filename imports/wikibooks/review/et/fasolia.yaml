id: et-fasolia
title: Fasolia
alternate_names:
- Ethiopian Green Bean Stew
summary: Fasolia is an Ethiopian stew, is a delicious and flavorful dish made with tender green beans cooked in a rich and aromatic sauce. This vegetarian stew is a popular choice in Ethiopian cuisine and pairs well with injera (Ethiopian flatbread) or rice.
origin:
  country: ET
course: main
authenticity: unassessed
