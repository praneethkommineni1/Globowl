id: et-hamli
title: Hamli
alternate_names:
- Ethiopian Spinach Stew
summary: Hamli is a vibrant and flavorful dish made with fresh spinach and a blend of aromatic spices. This vegetarian stew is a popular side dish in Ethiopian cuisine and pairs well with injera (Ethiopian flatbread) or rice.
