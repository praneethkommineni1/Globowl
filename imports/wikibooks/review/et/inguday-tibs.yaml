id: et-inguday-tibs
title: Inguday Tibs
alternate_names:
- Ethiopian Mushroom Stir-Fry
summary: Inguday tibs is a flavorful and aromatic dish made with sautéed mushrooms, onions, and a blend of spices. This vegetarian stir-fry is a popular dish in Ethiopian cuisine and is enjoyed as a main course or a side dish.
