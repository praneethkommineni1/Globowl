id: et-key-wat
title: Key Wat
alternate_names:
- Ethiopian Red Stew
summary: Key wat is a flavorful and aromatic Ethiopian stew made with tender beef simmered in a rich and spicy red sauce. This traditional dish is known for its complex flavors and is often enjoyed with injera, the Ethiopian flatbread.
origin:
  country: ET
course: main
authenticity: unassessed
