id: et-kik-alicha
title: Kik Alicha
alternate_names:
- Yellow Split Pea Stew
summary: Kik alicha is a comforting and flavorful Ethiopian split pea stew, made with yellow split peas simmered in a mild and aromatic sauce. This vegetarian stew is a staple in Ethiopian cuisine and is often served as part of a traditional Ethiopian meal.
origin:
  country: ET
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Medium-sized pot
- Wooden spoon or spatula
- Cutting board
- Chef's knife
- Strainer
techniques:
- boiling
- simmering
