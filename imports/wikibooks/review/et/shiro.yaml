- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped, note: large}
  - {ingredient: garlic, unit: clove, qty: 3, prep: minced}
  - {ingredient: chicken-stock, unit: cup, qty: 4}
