id: et-shiro
title: Shiro
alternate_names:
- Ethiopian Spiced Chickpea or Lentil Stew
summary: Shiro is a flavorful Ethiopian stew made with spiced chickpea or lentil flour. It is a popular vegetarian dish that is rich in protein and aromatic spices.
origin:
  country: ET
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Large pot
- Wooden spoon or spatula
- Cutting board
- Knife
techniques:
- boiling
- sauteing
- simmering
