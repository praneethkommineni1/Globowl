title: Timatim Fitfit
alternate_names:
- Ethiopian Tomato Salad
summary: Timatim fitfit, also known as Ethiopian tomato salad, is a refreshing and vibrant dish made with ripe tomatoes, onions, and a tangy dressing. This salad is bursting with flavors and is a popular side dish in Ethiopian cuisine.
