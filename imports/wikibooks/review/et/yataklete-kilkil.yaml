id: et-yataklete-kilkil
title: Yataklete Kilkil
alternate_names:
- Ethiopian Vegetable Stew
summary: Yataklete kilkil is an Ethiopian vegetable stew made with a variety of mixed vegetables cooked in a flavorful sauce. This vegetarian stew showcases the diverse flavors and textures of Ethiopian cuisine.
