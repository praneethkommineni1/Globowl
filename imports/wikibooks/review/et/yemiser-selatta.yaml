title: Yemiser Selatta
alternate_names:
- Ethiopian Lentil Salad
summary: Yemiser selatta is a vibrant and refreshing Ethiopian salad made with cooked lentils, fresh vegetables, and a zesty dressing. This salad is a popular dish in Ethiopian cuisine and is enjoyed as a side dish or a light meal.
