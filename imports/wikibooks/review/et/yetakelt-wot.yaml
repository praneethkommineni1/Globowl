id: et-yetakelt-wot
title: Yetakelt Wot
alternate_names:
- Ethiopian Spiced Vegetable Stew
summary: Yetakelt wot is a flavorful and aromatic dish made with a variety of vegetables cooked in a rich and spicy sauce. This vegetarian stew is a popular dish in Ethiopian cuisine and is often served as a main course with injera (Ethiopian flatbread) or rice.
