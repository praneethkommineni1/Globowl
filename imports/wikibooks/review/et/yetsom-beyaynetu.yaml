id: et-yetsom-beyaynetu
title: Yetsom Beyaynetu
alternate_names:
- Ethiopian Vegan Platter
summary: Yetsom beyaynetu is a traditional Ethiopian vegan platter that consists of a variety of flavorful vegetable and lentil dishes served with injera, the traditional Ethiopian flatbread.
