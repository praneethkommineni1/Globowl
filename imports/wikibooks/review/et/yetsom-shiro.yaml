id: et-yetsom-shiro
title: Yetsom Shiro
alternate_names:
- Ethiopian Vegan Chickpea Stew
summary: Yetsom shiro is a flavorful and hearty dish made with ground chickpeas and a blend of aromatic spices. This vegan stew is a staple in Ethiopian cuisine and is enjoyed as a main course with injera (Ethiopian flatbread) or rice.
origin:
  country: ET
course: main
