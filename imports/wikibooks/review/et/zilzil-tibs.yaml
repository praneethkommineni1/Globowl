id: et-zilzil-tibs
title: Zilzil Tibs
alternate_names:
- Spicy Ethiopian Beef Strips
summary: Zilzil tibs is a flavorful and tender Ethiopian dish made with marinated beef strips sautéed with aromatic spices and vegetables. It is known for its rich and spicy flavors.
origin:
  country: ET
course: main
authenticity: unassessed
