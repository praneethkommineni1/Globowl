steps:
- In a mixing bowl, combine the beef strips, sliced onions, minced garlic, grated ginger, niter kibbeh, berbere spice blend, paprika, cayenne pepper, cumin, coriander, cardamom, and salt. Mix well to ensure the beef is coated with the marinade. Cover the bowl and let it marinate in the refrigerator for at least 1 hour, or overnight for more intense flavors.
- Heat the olive oil in a large skillet or frying pan over medium-high heat.
- Add the marinated beef strips to the skillet, spreading them out in a single layer to ensure even cooking. Sauté for about 5–7 minutes, stirring occasionally, until the beef is browned and cooked to your desired level of doneness.
- Add the sliced onions from the marinade to the skillet and cook for an additional 2–3 minutes until the onions become soft and slightly caramelized.
- Squeeze the lemon juice over the beef and onions, and give it a final toss to incorporate the flavors.
- Remove from heat and transfer to a serving dish.
- Garnish with freshly chopped cilantro or parsley.
- Serve hot as a main course, accompanied by injera (Ethiopian flatbread) or rice.
tips:
- Adjust the level of spiciness by increasing or decreasing the amount of berbere spice blend and cayenne pepper according to your taste preferences.
- For a more tender beef, you can marinate it overnight or use a tenderizing marinade.
- Use a tender cut of beef, such as sirloin or tenderloin, for the best results.
- For a vegetarian version, you can substitute the beef with mushrooms or tofu, adjusting the cooking time accordingly.
- You can customize the dish by adding bell peppers, tomatoes, or other vegetables of your choice to the sautéed beef.
- Some recipes include a splash of soy sauce or Worcestershire sauce for added umami flavor.
