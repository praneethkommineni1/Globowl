id: fi-karelian-pasties
title: Karelian Pasties
alternate_names:
- Karjalanpiirakat
summary: Karelian pasties (Karjalanpiirakat in Finnish) are traditional pasties from North Karelia, Finland. Today they are eaten throughout Finland. According to the traditional recipe, the pasties are made from a thin rye crust with a filling of rice.
