id: fi-vorschmack
title: Vorschmack
alternate_names:
- Finnish Ground Meat
summary: Vorschmack has long traditions in Finnish cuisine. It can be served as an everyday meal, as well as a festive speciality. To be served heated, with pickled beetroot in vinegar, pickled cucumber and sour cream.
origin:
  country: FI
course: main
