id: fr-beurre-a-la-bourguignonne
title: Beurre à la Bourguignonne
alternate_names:
- Garlic Scallion Butter
summary: Beurre à la Bourguignonne, or garlic butter, is a compound butter flavored primarily with garlic. In this case, it also includes shallots and parsley.
origin:
  country: FR
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: butter, unit: cup, qty: 0.5}
  - {ingredient: shallot, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: clove, qty: [1, 3], prep: mashed or grated with a microplane}
  - {ingredient: parsley, unit: tbsp, qty: 2, prep: chopped}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Cream the butter until it is very soft.
- Beat the shallots, garlic and parsley into the butter.
- Season to taste with salt and pepper.
