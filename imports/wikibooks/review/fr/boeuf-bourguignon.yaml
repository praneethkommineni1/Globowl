id: fr-boeuf-bourguignon
title: Boeuf Bourguignon
summary: Boeuf bourguignon (French for Burgundy beef) is a well known, traditional French stew prepared with beef braised in red wine (originally Burgundy wine) and beef broth, flavored with garlic, onions, carrots, a bouquet garni and garnished with mushrooms.
origin:
  country: FR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 180
difficulty: 3
techniques:
- boiling
- simmering
