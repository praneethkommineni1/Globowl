id: fr-bouchee-a-la-reine
title: Bouchée à la Reine
summary: Bouchée à la reine is named for Marguerite de Valois, wife of Henri IV. This entrée has been somewhat neglected but is one of the great classics of French gastronomy.
origin:
  country: FR
course: main
authenticity: unassessed
yield:
  servings: 2
  amount: 2–4
time:
  total_min: 1
