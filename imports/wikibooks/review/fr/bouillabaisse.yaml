id: fr-bouillabaisse
title: Bouillabaisse
summary: Bouillabaisse is a traditional fish stew originating from the port city of Marseille. It is made by boiling several species of fish with herbs and vegetables.
origin:
  country: FR
course: main
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 60
difficulty: 2
techniques:
- boiling
- simmering
