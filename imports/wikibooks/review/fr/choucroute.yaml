title: Choucroute
alternate_names:
- Sauerkraut with Meat and Potatoes
summary: Choucroute garnie is a dish of Sauerkraut with sausages, salt pork, and potatoes. Being a little picky about your ingredients (especially the sauerkraut) with this recipe makes all the difference.
