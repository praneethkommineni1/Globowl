steps:
- Sprinkle both sides of chicken pieces very liberally with kosher salt and freshly ground black pepper. Dip into eggs. Set aside.
- Place some flour into a gallon size zip-top bag. Add chicken pieces and toss to coat. It's fun for the whole family!
- Place water in the bottom of a cast-iron skillet along with the salt pork, and heat over medium heat. Cook 8–10 minutes. Remove salt pork but leave fat in.
- Add pearl onions to same pan and cook until deeply browned. Remove and add chicken pieces, working in batches if needed, into same pan and brown on both sides. Transfer to a 7–8 quart enameled Dutch oven. Keep onions in an airtight container with salt pork in the refrigerator.
- Pour off remaining fat. Deglaze with 1 cup of wine. Pour this along with remaining ingredients into Dutch oven and refrigerate overnight.
- The next day, preheat the oven to 325 °F.
- Place the chicken in the oven and cook for 2–2½ hours, or until the chicken is tender. Maintain a very gentle simmer and stir occasionally.
- Once the chicken is done, remove it to a heatproof container, cover, and place it in the oven to keep warm. Strain the sauce in a colander and remove the carrots, onion, celery, thyme, rosemary, garlic, and bay leaf. Discard. Return the sauce to the pot, place over medium heat, and reduce by half.
- Once sauce has reduced, add salt pork and onion. Cook until heated through. Remove from heat, add chicken, and serve warm over hot cooked egg noodles, if desired.
