id: fr-croque-monsieur
title: Croque Monsieur
summary: A croque-monsieur is a French sandwich made of ham, Gruyère cheese, French bread, and Dijon mustard. Croquer means "to crunch" in French, so the name literally translates to "crunch-mister."
origin:
  country: FR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- simmering
ingredient_groups:
- name: Béchamel sauce
  items:
  - {ingredient: butter, unit: g, qty: 12}
  - {ingredient: all-purpose-flour, unit: g, qty: 12}
  - {ingredient: milk, unit: ml, qty: 125}
  - {ingredient: dijon-mustard, unit: tsp, qty: 1}
  - {ingredient: nutmeg, unit: pinch, qty: 1, optional: true}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
- name: Sandwich
  items:
  - {ingredient: white-bread, unit: slice, qty: 2}
  - {ingredient: ham, unit: slice, qty: 2}
  - {ingredient: cheese, unit: slice, qty: 2, prep: such as gruyère}
  - {ingredient: egg, qty: 1}
steps:
- Melt the butter in a small saucepan.
- Add the flour and stir over a medium heat until blended.
- Gradually add the milk, whisking continuously into a smooth sauce.
- Simmer gently for 2–3 minutes until the sauce has thickened.
- Mix in the mustard, nutmeg, salt, and pepper. Set aside.
- Preheat a grill to high. Lightly toast the bread on both sides under the grill.
- Arrange slices of ham and cheese on each slice of bread, then top with béchamel sauce.
- Place back under the grill to brown the béchamel and melt the cheese until golden brown and delicious.
- Serve hot.
