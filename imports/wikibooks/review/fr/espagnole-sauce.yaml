- items:
  - {ingredient: butter, unit: g, qty: 57}
  - {ingredient: veal, prep: 'ham, bacon, beef, or poultry'}
  - {ingredient: black-peppercorns, qty: 3}
  - {ingredient: mushroom}
  - {ingredient: tomato, qty: 1}
  - {ingredient: carrot, qty: 1}
  - {ingredient: onion, qty: 1, prep: studded with 2 cloves}
  - {ingredient: turnip, qty: 1}
  - {ingredient: thyme, unit: sprig, qty: 1, prep: 'parsley, and marjoram'}
  - {ingredient: all-purpose-flour, unit: tsp, qty: 1}
  - {ingredient: chicken-stock, qty: 0.25}
steps:
- Grease the bottom of a stew pan with butter.
- Add the meat, peppercorns, mushroom trimmings, tomato, carrot, turnip cut up, onion, bay leaf, thyme, parsley, and marjoram. Braise well for 15 minutes with the lid on.
- Add the stock and boil gently for 15 minutes.
- Strain through a tamis, then remove excess grease.
- Cool in an earthenware vessel, and add glaze if desired.
- Pass through a sieve before serving.
