id: fr-espagnole-sauce
title: Espagnole Sauce
alternate_names:
- Mrs. W.G. Waters
summary: 'The following recipe, taken from The Cook''s Decameron: A Study In Taste, apparently dates from the late 19th century. It bears no relation whatsoever to the classic espagnole, as it is not thickened except for a tiny amount of flour and should only be regarded as a curiosity.'
