- name: Onion cream sauce
  items:
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 2}
  - {ingredient: heavy-cream, unit: cup, qty: 1.5}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: onion, unit: tbsp, qty: 2}
  - {ingredient: parsley, unit: tbsp, qty: 1}
