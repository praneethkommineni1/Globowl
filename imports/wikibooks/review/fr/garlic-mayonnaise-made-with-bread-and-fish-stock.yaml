id: fr-garlic-mayonnaise-made-with-bread-and-fish-stock
title: Garlic Mayonnaise made with Bread and Fish Stock
alternate_names:
- Rouille
summary: Rouille is a traditional Provençal spicy garlic mayonnaise. It is usually served with bouillabaisse fish stew.
origin:
  country: FR
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: white-bread}
  - {ingredient: egg-yolk, qty: 1}
  - {ingredient: olive-oil, unit: ml, qty: 100}
  - {ingredient: garlic, qty: 4}
  - {ingredient: saffron}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Blend the bread, fish stock, and egg yolk together into a paste.
- Crush the garlic and saffron or annatto, and add to the paste.
- Gradually add the oil with one hand while vigorously whisking with the other, as when preparing any other mayonnaise.
- Add salt and pepper to taste.
