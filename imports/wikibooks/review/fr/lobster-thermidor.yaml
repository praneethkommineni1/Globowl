id: fr-lobster-thermidor
title: Lobster Thermidor
summary: Lobster thermidor is a dish created by stuffing an empty lobster tail with sautéed lobster meat that is cooked with butter, a light wine (often sherry), and cream.
origin:
  country: FR
course: main
authenticity: unassessed
