  - {ingredient: fava-beans-canned, unit: g, qty: 200, note: small}
  - {ingredient: red-bell-pepper, qty: 2}
  - {ingredient: onion, qty: 6, note: small}
  - {ingredient: basil, qty: 6, prep: finely chopped}
  - {ingredient: garlic, qty: 1}
  - {ingredient: egg, qty: 3}
  - {ingredient: anchovies, qty: 12, prep: or 300 g tuna steak}
  - {ingredient: olives, unit: g, qty: 100}
  - {ingredient: capers, unit: handful, qty: 1}
  - {ingredient: olive-oil}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
steps:
- Cut the tomatoes in quarters and salt them lightly once. Cut the eggs into quarters or slices. Cut the anchovies into 3–4 chunks (if using tuna, cut into similarly sized pieces). Peel the cucumber and finely slice it. Cut the green peppers into thin rings, and do the same with the onions.
- Cut the garlic in two and rub the sides and bottom of a large salad bowl with it. Toss all the ingredients except the tomatoes into the bowl.
- Drain the tomatoes, re-salt lightly and add to salad. In a separate bowl, mix 6 spoonfuls of olive oil with the basil, pepper, and salt and pour over salad. Refrigerate before serving.
