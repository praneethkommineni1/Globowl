id: fr-nicoise-salad
title: Niçoise Salad
summary: Niçoise salad (pronounced ni-swaz) sometimes referred to as salade niçoise, is a type of French salad. As suggested by the name, it is a specialty of the region of Nice in France and is composed of raw vegetables, hard boiled eggs, anchovies and tuna, and olive oil.
