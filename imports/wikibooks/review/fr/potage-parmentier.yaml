id: fr-potage-parmentier
title: Potage Parmentier
summary: There are few things more versatile or more satisfying than potage parmentier (leek and potato soup) or one of its myriad variations. It’s good freshly-made and better the next day. Hot or cold, it makes a lovely start to dinner; served with some left-over meat, a great lunch.
