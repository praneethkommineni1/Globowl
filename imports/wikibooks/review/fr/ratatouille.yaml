id: fr-ratatouille
title: Ratatouille
summary: Ratatouille is a traditional Provençal stewed vegetable dish that can be served as a meal on its own, accompanied by rice, potatoes or French bread, or as a side dish. This version of the recipe is ideal for kids, simple to make, and very healthy.
origin:
  country: FR
course: side
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: onion, qty: 1, prep: finely diced/chopped}
  - {ingredient: zucchini, qty: 1, prep: finely chopped}
  - {ingredient: red-bell-pepper, qty: 1, prep: finely chopped}
  - {ingredient: green-pepper, qty: 1, prep: finely chopped}
  - {ingredient: garlic, unit: clove, qty: 1, prep: chopped/crushed, optional: true}
steps:
- Put a pan on the stove on medium heat.
- Gently fry the onion and garlic in a little oil—5 minutes should be enough to start to make them soft.
- Add the peppers and courgette and continue to fry gently for a further 4–5 minutes until the ingredients soften.
- Add the beans and warm through.
- Serve in a bowl on its own or with toast.
tips:
- Increase quantities to serve more, and add different vegetables as desired for variation.
