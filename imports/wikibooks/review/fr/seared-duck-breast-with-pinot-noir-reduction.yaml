id: fr-seared-duck-breast-with-pinot-noir-reduction
title: Seared Duck Breast with Pinot Noir Reduction
summary: The acidic, fruity flavor of Pinot Noir perfectly matches the fatty, slightly gamey taste of the duck.
origin:
  country: FR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
