id: fr-teurgoule
title: Teurgoule
alternate_names:
- Norman Cinnamon Rice Pudding
summary: Teurgoule is a cinnamon-flavoured rice pudding that is a speciality of Normandy. The name comes from the Norman language and means twist mouth, a reference to the faces supposedly pulled by someone tasting it due to the spiciness of the dish.
origin:
  country: FR
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: sugar, unit: g, qty: 200}
  - {ingredient: long-grain-rice, unit: g, qty: 175}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.25}
  - {ingredient: milk, unit: l, qty: 2}
steps:
- Preheat your oven to 150°C (thermostat 2).
- Mix the sugar, milk, rice, salt, and cinnamon in a terrine bowl.
- Put the mix in the oven for 5 hours while making sure no one opens the oven door.
- The rice must absorb approximately three-quarters of the milk and must be covered by a brown skin.
- Let the pudding cool down and serve at room temperature.
