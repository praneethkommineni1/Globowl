id: fr-tourte-a-la-lorraine
title: Tourte à la Lorraine
summary: Tourte à la Lorraine is an elaborate meat pie with a pâte brisée (pie dough) base and a puff pastry top which is baked. Ten minutes before the end of the baking period, a savoury egg-and-cream custard is poured through a hole in the pie crust and returned to the oven to set.
