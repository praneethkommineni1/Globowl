id: gb-banana-caramel-dessert
title: Banana Caramel Dessert
summary: This dessert appears to be loosely based on or derived from banoffee pie. It combines bananas and caramel sauce with pre-made dough for convenience. The ingredients are simple, the time it takes to prepare is short, and the dessert is simply delicious!
origin:
  country: GB
course: dessert
authenticity: unassessed
yield:
  servings: 1
