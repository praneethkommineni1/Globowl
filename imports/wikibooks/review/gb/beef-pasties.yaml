  - {ingredient: potato, unit: cup, qty: 1.5}
  - {ingredient: chicken-stock, unit: cup, qty: 1}
  - {ingredient: onion, unit: cup, qty: 0.5}
  - {ingredient: parsley, unit: tbsp, qty: 1}
