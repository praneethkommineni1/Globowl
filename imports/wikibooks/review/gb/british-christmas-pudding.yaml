  - {ingredient: lemon, qty: 0.5}
  - {ingredient: orange, qty: 0.5}
  - {ingredient: breadcrumbs, unit: g, qty: 40}
  - {ingredient: almonds, unit: g, qty: 40}
  - {ingredient: egg, qty: 2}
  - {ingredient: butter, unit: g, qty: 75}
  - {ingredient: apple, qty: 1, note: small}
steps:
- Combine all dried mixed fruit in a large bowl. Stir well.
- Mix in the flour, then the sugar, lemon, orange, breadcrumbs, and nuts.
- Whisk eggs in a separate bowl. Mix eggs into the dry ingredients.
- Steam the pudding for several hours, remove it, and put it in a cool place.
- Serve with butter, cream, custard, or brandy.
