id: gb-bubble-and-squeak
title: Bubble and Squeak
summary: Bubble and squeak is a traditional English vegetable dish made from the leftover vegetables from a Sunday roast. The name is derived from the sound the dish makes while cooking.
origin:
  country: GB
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: onion, qty: 1, prep: chopped, optional: true, note: medium}
  - {ingredient: potato}
steps:
- Fry the chopped onion in fat or oil.
- Chop the vegetables, and add to the pan.
- Cook over a medium heat till the underside is golden brown and crispy, then turn it, scraping the crispy bits into the mix. Repeat the turning and scraping a few times until browned and cooked through.
