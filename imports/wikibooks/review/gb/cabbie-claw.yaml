id: gb-cabbie-claw
title: Cabbie Claw
alternate_names:
- Scottish Whitefish with Egg and Potato
summary: Cabbie claw or cabelew is a traditional dish from the North-East of Scotland and Orkney. It is traditionally made using speldings, which are young fish of the Gadidae family, such as cod, haddock, or whiting. The obscure name is a derivative of the French name for cod, cabillaud.
