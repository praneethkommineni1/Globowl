id: gb-caramel-squares
title: Caramel Squares
summary: 'Caramel squares (alternatively: caramel slices, caramel shortbread, or millionaire''s shortbread) are a wonderfully rich and classic treat, very popular all over Britain and Ireland. They can often be found in cafes, served with morning coffee or afternoon tea.'
origin:
