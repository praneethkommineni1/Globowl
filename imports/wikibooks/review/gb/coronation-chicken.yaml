id: gb-coronation-chicken
title: Coronation Chicken
summary: Coronation chicken was apparently created by Florist Constance Spry and Rosemary Hume for the banquet of the coronation of Queen Elizabeth II in 1953—see Wikipedia's article on Coronation Chicken for more information.
origin:
  country: GB
course: main
authenticity: unassessed
