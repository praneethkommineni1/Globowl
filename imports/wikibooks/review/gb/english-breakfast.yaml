id: gb-english-breakfast
title: English Breakfast
summary: The traditional English breakfast is ubiquitous the world over. Cafés and hotels all around the world offer a version, often far removed from what might be considered conventional.
origin:
  country: GB
course: breakfast
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 35
difficulty: 1
techniques:
- boiling
- simmering
