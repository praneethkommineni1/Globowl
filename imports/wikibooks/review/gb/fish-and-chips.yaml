id: gb-fish-and-chips
title: Fish and Chips
summary: Fish and chips is a popular dish in England, New Zealand and Australia. The traditional fish in England is cod, though this is likely to fall apart or fail to cook in the middle.
origin:
  country: GB
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 30
difficulty: 2
