title: Flapjacks
alternate_names:
- Traditional Scottish Recipe
summary: Scottish flapjacks are a type of baked bar dessert made with oats.
origin:
  country: GB
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: butter, unit: g, qty: 75}
  - {ingredient: brown-sugar, unit: g, qty: [50, 75]}
  - {ingredient: golden-syrup, unit: tbsp, qty: 1}
  - {ingredient: rolled-oats, unit: g, qty: 175}
steps:
- Put the butter or margarine, sugar, and golden syrup into a saucepan, and stir over a low heat until the fat and sugar have melted.
- Add the porridge oats and blend thoroughly.
- Press into a well-greased 18 cm square sandwich tin.
- Bake in the centre of a moderate oven at 180°C (350°F / gas mark 4) for 25 minutes or until evenly golden brown.
- Cut into rectangles in the tin whilst warm.
- Allow to become almost cold in the tin before removing.
- Enjoy!
tips:
- Replace the sugar and golden syrup with 75 g of honey.
- Add 50 g of raisins.
