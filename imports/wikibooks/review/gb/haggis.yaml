id: gb-haggis
title: Haggis
summary: Haggis is the national dish of Scotland, composed of a forcemeat of the heart, liver and lungs of a sheep mixed with oatmeal, well seasoned and put into bags made from the paunch of the sheep. The haggis is then boiled for 2–3 hours and left to get cold.
