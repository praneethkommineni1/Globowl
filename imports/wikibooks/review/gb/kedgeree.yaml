id: gb-kedgeree
title: Kedgeree
alternate_names:
- Rice and Smoked Fish
summary: Kedgeree (or occasionally kitcherie, kitchari or kitchiri) is a dish consisting of flaked fish (usually smoked haddock), boiled rice, eggs and butter.
origin:
  country: GB
  also_claimed_by:
