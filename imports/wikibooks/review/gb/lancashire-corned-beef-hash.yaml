id: gb-lancashire-corned-beef-hash
title: Lancashire Corned Beef Hash
summary: Serve it with buttered bread and HP sauce.
origin:
  country: GB
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 70
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: potato, qty: [4, 5], prep: chunked}
  - {ingredient: onion, qty: 1, prep: chopped, note: large}
  - {ingredient: carrot, qty: 1, prep: chopped, optional: true}
  - {ingredient: water}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: dried-oregano, unit: pinch, qty: 1, optional: true}
  - {ingredient: worcestershire-sauce, optional: true}
  - {ingredient: bay-leaf, qty: 1, optional: true, note: small}
steps:
- Put all the ingredients in a wok (a wok is perfect though not traditional) or another large pan.
- Add water until almost covering the ingredients.
- Cover and bring to boil.
- Lower heat, and simmer for 30 minutes or until the potatoes soften.
- If too wet, strain off some water.
- Add the broken-up corned beef and stir in gently.
- Bring almost to the boil.
- Switch off the heat and let it sit for 15 minutes.
- Heat again or serve as it is.
- Put all the ingredients except the corned beef into the pressure cooker. You do not need much water—perhaps 1–2 cm.
- Bring the pressure cooker up to pressure and cook for about 4 minutes.
- Meanwhile, chop up the corned beef. When the other ingredients are cooked, open the pressure cooker and mix in the corned beef.
- Serve.
