id: gb-lancashire-hotpot
title: Lancashire Hotpot
summary: Lancashire hotpot, originating from England, is a very easy but delicious baked dish consisting of lamb, onions, potatoes, and herbs.
origin:
  country: GB
course: main
authenticity: unassessed
yield:
  servings: 4
  amount: 4–6
