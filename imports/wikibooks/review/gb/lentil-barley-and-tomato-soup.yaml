id: gb-lentil-barley-and-tomato-soup
title: Lentil, Barley, and Tomato Soup
summary: Alexandra soup is a puréed vegetable soup, containing lentils, barley, and tomato. It makes for a warming meal.
origin:
  country: GB
course: soup
authenticity: unassessed
yield:
  servings: 1
