  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: brown-lentils, unit: cup, qty: 1}
  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: onion, qty: 1, prep: diced}
  - {ingredient: water, unit: cup, qty: 3}
  - {ingredient: tomato, qty: 2, prep: 'peeled, seeded, and diced'}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
steps:
- Soak the lentils and barley together overnight, then drain. This step is optional.
- Fry the onion in the butter until soft.
- Add the lentils, barley, and water.
- Cook until the lentils are tender—this will take longer if grains are not soaked.
- Add the tomatoes when the soup is almost ready.
- Purée with a food mill, blender, or food processor.
- Reheat and adjust the seasoning.
