id: gb-liverpool-lamb-and-vegetable-soup
title: Liverpool Lamb and Vegetable Soup
alternate_names:
- Scouse
summary: This is a traditional recipe for Liverpool scouse, also known as "lobscouse". The sauce is not thickened, and it is usual to serve with preserved beetroot or red cabbage and white bread with butter.
origin:
  country: GB
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: lamb}
  - {ingredient: vegetable-oil}
  - {ingredient: onion, prep: chopped}
  - {ingredient: carrot, prep: chopped}
  - {ingredient: chicken-stock}
  - {ingredient: potato, prep: diced}
steps:
- Remove the meat from the bone (if needed), and dice it.
- Heat a little oil in a large saucepan. Add the meat, and brown it.
- Add the chopped onions, carrots, and water or meat stock, and as many potatoes as possible.
- Simmer until everything is cooked.
