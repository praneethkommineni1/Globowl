id: gb-mincemeat-tart
title: Mincemeat Tart
summary: Mincemeat is a spiced fruit preserve that does not in fact contain meat, although it may contain animal suet.
origin:
  country: GB
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- name: Mincemeat
  items:
  - {ingredient: raisins, unit: g, qty: 454}
  - {ingredient: lemon}
  - {ingredient: orange, unit: g, qty: 227}
  - {ingredient: sugar, unit: g, qty: 340}
  - {ingredient: apple, unit: g, qty: 907, prep: peeled}
  - {ingredient: nutmeg, unit: tsp, qty: 0.5}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.5}
