id: gb-mushy-peas
title: Mushy Peas
summary: Mushy peas is a popular and characteristic British dish that has helped to give British cooking its well-deserved reputation. Mushy peas are often served with fish and chips.
origin:
  country: GB
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 30
difficulty: 1
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: water}
  - {ingredient: baking-soda, unit: tsp, qty: 2}
  - {ingredient: sugar, unit: tsp, qty: 1}
steps:
- Place the peas in 2–3 times their volume of water, along with the baking soda, which speeds the soaking process.
- Leave to soak overnight.
- The next day, drain the peas, and place in a saucepan with enough water to just cover them.
- Add the sugar.
- Bring to the boil and simmer for about 20 minutes, stirring occasionally to help break up the peas.
- Add water or reduce to the desired consistency.
- Season to taste with salt and pepper.
