id: gb-north-staffordshire-oatcakes
title: North Staffordshire Oatcakes
summary: An oatcake is a type of pancake made from oatmeal, cooked on a griddle. North Staffordshire oatcakes are a local delicacy in the North Staffordshire (Stoke-on-Trent) area of England, and so may be known to non-locals as a North Staffordshire oatcake or Potteries oatcake.
origin:
  country: GB
course: breakfast
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: g, qty: 220}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: yeast, unit: g, qty: 14}
  - {ingredient: milk, unit: ml, qty: 850, prep: mixed half and half}
  - {ingredient: sugar, unit: tsp, qty: 1}
steps:
- Add the salt to the flour and oatmeal.
- Dissolve the yeast with a little warm liquid and add the sugar. Allow the mixture to become frothy.
- Mix the dry ingredients with the yeast liquid to make a batter.
- Cover the batter with a clean cloth and leave it in a warm place for an hour.
- Cook the oatcakes on a well-greased griddle. Put enough batter onto the griddle to produce an oatcake about 8–9 inches in diameter. The surface will be covered in holes as it cooks.
- Flip the oatcake after 2–3 minutes when the upper side appears dry and the underneath is golden brown, and cook for another 2–3 minutes.
