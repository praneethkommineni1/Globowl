id: gb-pasties
title: Pasties
summary: 'A pasty (Cornish: pasti, hoggan, incorrectly written as pastie) is a type of pie, originally from Cornwall, in the United Kingdom. It is a baked savory pastry case traditionally filled with sliced meat and vegetables.'
