id: gb-pastry-for-cornish-pasties
title: Pastry for Cornish Pasties
summary: Any good pastry dough can be used for Cornish pasties, but it should be neither too rich nor too flaky. This works very well. Adjust amounts as required. See also Pasties.
origin:
  country: GB
course: main
authenticity: unassessed
yield:
  servings: 1
  amount: 1–2
time:
  total_min: 25
difficulty: 1
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: g, qty: 454}
  - {ingredient: lard, unit: g, qty: 227, prep: 'butter, and/or suet'}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: water}
steps:
- Combine the dry ingredients, then gradually mix in enough water to make a stiff dough.
- Roll dough to about a ¼ inch thick.
- Cut out rounds with a tea plate—or other round object about 6in across.
- Lay rounds on a pastry-board with half the round propped on a rolling-pin. Add the filling, and fold dough over filling.
- Dampen the edges with water, and press to seal. Crimp the edges, then make slit in middle of each pasty.
- Place on baking sheet, bake in hot oven (450 °F) until golden-brown.
tips:
- Try using vegetarian equivalents for the fats.
- Omit salt for low-sodium diet, or use low-sodium salt.
