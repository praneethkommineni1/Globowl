id: gb-pease-pudding
title: Pease Pudding
summary: Pease pudding, sometimes known as pease pottage or pease porridge, is a simmered pea preparation, which mainly consists of split yellow or carlin peas, water, salt and spices, often cooked with a bacon or ham joint.
origin:
  country: GB
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
- pressure-cooking
- simmering
- whisking
ingredient_groups:
- items:
  - {ingredient: butter, qty: 1}
steps:
- Put the ham hock in a pressure cooker and cover with water.
- With the lid on bring to the boil (full pressure).
- Lower the heat and simmer for 30–40 minutes.
- Remove from the heat and release the pressure. Take out the hock and put to one side.
- Add the split peas.
- With the lid on, bring back to the boil.
- Again lower the heat to a simmer (as low as possible).
- Simmer for 25–30 minutes.
- Remove from the heat and release the pressure.
- Put the contents into a bowl with the butter, and mix with a balloon type whisk.
- Leave to cool.
- Serve on white bread or stottie cake, alone or with ham from the hock. Refrigerate when cool.
tips:
- The amount of split peas added changes the consistency and the setting time.
