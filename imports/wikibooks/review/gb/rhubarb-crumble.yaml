id: gb-rhubarb-crumble
title: Rhubarb Crumble
summary: Rhubarb crumble is a traditional British dessert. Served traditionally with custard (though you can of course serve with cream or ice cream) it is a hearty, filling, and warm feast, best served after a light meal.
origin:
  country: GB
course: dessert
authenticity: unassessed
