id: gb-stovies
title: Stovies
summary: Stovies is a traditional Scottish dish originating mainly from the North Eastern counties of Angus and Aberdeenshire where even today the dish is still most commonly found and served.
origin:
  country: GB
course: main
authenticity: unassessed
yield:
  servings: 1
