id: gb-strawberry-and-yogurt-eton-mess
title: Strawberry and Yogurt Eton Mess
summary: Eton mess is a dessert of English origin consisting of a mixture of strawberries, pieces of meringue and cream, which is traditionally served at Eton College's annual prize-giving celebration picnic on the "Fourth of June" (actually celebrated on the last Wednesday in May).
origin:
  country: GB
course: dessert
authenticity: unassessed
