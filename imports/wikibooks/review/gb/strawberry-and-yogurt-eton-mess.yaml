  servings: 4
time:
  total_min: 10
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: heavy-cream, unit: ml, qty: 280}
  - {ingredient: powdered-sugar, unit: g, qty: 50}
  - {ingredient: vanilla-extract, unit: ml, qty: 10}
  - {ingredient: yogurt, unit: ml, qty: 150}
  - {ingredient: strawberries, unit: g, qty: 500}
steps:
- Rinse the strawberries, remove the tops, and cut into halves.
- Break the meringues into pieces (not too small) and place into a bowl.
- Put the double cream, vanilla essence, and icing sugar into a bowl. Whip until reasonably stiff.
- Combine the whipped cream, yoghurt, strawberries, and meringue, being careful not to mash the meringue into pieces that are too small.
- Serve in bowls.
