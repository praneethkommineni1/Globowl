id: gb-tattie-scones
title: Tattie Scones
summary: Tattie scones, also called potato scones or potato bread, are a regional variant of the savoury "griddle scone" which is especially popular in Scotland. Many variations of recipe exist, however they generally include liberal quantities of boiled Tatties (potatoes) and salt.
