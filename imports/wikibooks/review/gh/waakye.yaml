id: gh-waakye
title: Waakye
alternate_names:
- Ghanian Rice and Beans
summary: Waakye is a Ghanaian dish of rice and beans. It is a common staple food, often accompanied with garri foto, salad, and tilapia.
origin:
  country: GH
course: main
authenticity: unassessed
yield:
  servings: 3
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: water}
  - {ingredient: long-grain-rice, qty: 2, prep: washed}
  - {ingredient: salt, note: to taste}
steps:
- Half-fill a saucepan with water, and place over the fire. Add the Guinea corn leaves.
- Bring to a boil, and add the beans.
- Simmer for 40-45 minutes until the beans split in two when touched.
- Add the rice and salt, and simmer until the beans and rice are very soft. Add additional water as necessary during the cooking.
- Remove from the heat. Serve with shito and fried tomato stew, accompanied by wele, tilapia, boiled eggs, and salad.
