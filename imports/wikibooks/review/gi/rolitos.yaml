id: gi-rolitos
title: Rolitos
alternate_names:
- Gibraltarian Beef Rolls
summary: This meal is traditionally served with mashed potatoes. There is an alternative method made with a tomato sauce instead of brown gravy.
origin:
  country: GI
course: main
authenticity: unassessed
