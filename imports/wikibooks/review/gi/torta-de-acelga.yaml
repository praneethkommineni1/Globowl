id: gi-torta-de-acelga
title: Torta de Acelga
alternate_names:
- Chard Pie
summary: Torta de acelga (chard pie) is believed to be based on a spinach pie eaten in parts of Italy and is also very similar to the Greek 'spanakopita'. A very similar pie is eaten in the Ligurian Region during Easter, called Torta Pascualina.
