id: gm-benachin
title: Benachin
alternate_names:
- Gambian Rice with Meat and Vegetables
summary: Benachin, also known as "one-pot" or "jollof rice," is a flavorful and vibrant Gambian rice dish. It is a staple in Gambian cuisine and is enjoyed by people of all ages.
