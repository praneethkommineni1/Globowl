id: gm-benechin-kunkujang
title: Benechin Kunkujang
alternate_names:
- Gambian Seasoned Rice and Lamb
summary: Benechin Kunkujang or thiebou yap is a Senegalese dish popular in Gambia, known for its special blend of spices from Kunkujang. It is a variation of benachin, a one-pot rice dish commonly found in Gambia and other West African countries.
