id: gm-domoda
title: Domoda
alternate_names:
- Gambian Peanut Stew
summary: Domoda is a popular Gambian and Senegalese dish known for its rich and creamy peanut stew. It is often prepared with meat such as beef, lamb, or chicken, combined with an assortment of vegetables.
origin:
  country: GM
course: main
authenticity: unassessed
