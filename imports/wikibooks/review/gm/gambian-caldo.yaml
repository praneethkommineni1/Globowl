id: gm-gambian-caldo
title: Gambian Caldo
alternate_names:
- Seafood soup
summary: Caldo is a traditional Gambian soup known for its rich and comforting flavors. It is typically made with a variety of ingredients such as meat, vegetables, and spices, resulting in a hearty and nourishing dish.
origin:
  country: GM
course: soup
authenticity: unassessed
