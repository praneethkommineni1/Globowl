id: gm-gambian-chicken-with-lemon-and-mustard
title: Gambian Chicken with Lemon and Mustard
alternate_names:
- Yassa
summary: Yassa is a popular Gambian dish known for its tangy and flavorful marinade made with onions, lemons, and mustard. It is commonly prepared with chicken or fish and is loved for its zesty and aromatic taste.
origin:
  country: GM
course: main
authenticity: unassessed
