id: gm-gambian-mbamba-soup
title: Gambian Mbamba Soup
summary: Mbamba soup is a flavorful and aromatic Gambian dish made with dried fish and a variety of vegetables. It is a nutritious soup that is known for its rich taste and comforting qualities. Mbamba Soup is often enjoyed with rice or served as a side dish.
