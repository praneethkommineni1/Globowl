id: gm-gambian-superkanja-soup
title: Gambian Superkanja Soup
summary: Superkanja soup is a traditional Gambian dish that is known for its rich and flavorful taste. It is a hearty and nutritious soup made with a combination of different leafy greens and protein sources.
