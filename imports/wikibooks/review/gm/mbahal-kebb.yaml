id: gm-mbahal-kebb
title: Mbahal Kebb
alternate_names:
- Gambian Chicken Skewers
summary: Mbahal kebb is a traditional Gambian dish known for its unique combination of flavors and aromatic spices. It is a popular grilled chicken dish that is marinated in a tangy and spicy sauce, giving it a delicious and smoky taste.
