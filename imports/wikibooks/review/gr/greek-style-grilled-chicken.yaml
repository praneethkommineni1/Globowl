id: gr-greek-style-grilled-chicken
title: Greek-Style Grilled Chicken
summary: Greek-Style Grilled Chicken.
origin:
  country: GR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: chicken, qty: 1, prep: cut into serving pieces}
  - {ingredient: dried-oregano, unit: tbsp, qty: 1}
  - {ingredient: thyme, unit: tbsp, qty: 1}
  - {ingredient: mint, unit: tbsp, qty: 1}
  - {ingredient: rosemary, unit: tsp, qty: 2}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: garlic-powder, unit: tbsp, qty: 1}
  - {ingredient: olive-oil}
steps:
- Brush chicken pieces with olive oil. Set aside.
- Combine all remaining ingredients and rub into chicken. Refrigerate for at least 1 hour.
- Heat about 28 charcoal briquets in a large chimney starter. Disperse evenly around bottom of grill and reapply the grate.
- Add chicken and cook, turning often, until internal temperature of the breast is 165°F and the thigh is 170°F.
- Remove to a plate and cover with foil. Let rest 10 minutes before serving warm.
