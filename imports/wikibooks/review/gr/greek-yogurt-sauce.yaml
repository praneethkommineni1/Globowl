- items:
  - {ingredient: yogurt, unit: cup, qty: 1.5}
  - {ingredient: lemon, unit: cup, qty: 0.25}
  - {ingredient: olive-oil, unit: cup, qty: 0.25}
  - {ingredient: dried-oregano, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: tbsp, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: onion, qty: 0.25, prep: finely diced}
  - {ingredient: rosemary, unit: tsp, qty: 1.5, prep: finely chopped}
  - {ingredient: parsley, unit: tbsp, qty: 2, prep: finely chopped}
steps:
- Pulse all ingredients in a food processor until relatively smooth.
- Pour into your dipping bowl, and serve with a Greek-style dish.
