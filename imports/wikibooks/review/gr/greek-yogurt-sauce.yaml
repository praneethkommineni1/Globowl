id: gr-greek-yogurt-sauce
title: Greek Yogurt Sauce
summary: This yogurt sauce is good for gyros, as a grilling baste for lamb and pork, and a dipping sauce for chips.
origin:
  country: GR
course: condiment
authenticity: unassessed
yield:
  servings: 1
