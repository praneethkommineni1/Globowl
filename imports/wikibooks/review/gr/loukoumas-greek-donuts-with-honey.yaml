id: gr-loukoumas-greek-donuts-with-honey
title: Loukoumas (Greek Donuts with Honey)
summary: Callimachus called these "honey tokens" some time during the 3rd century B.C. Loukoumades were the 1st prizes awarded to winners of the ancient Olympics. Now they are the perfect Greek cafe dessert celebratory piece of decadent, or mid-morning snack.
origin:
  country: GR
course: dessert
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
ingredient_groups:
- name: Fritters
  items:
  - {ingredient: yeast, unit: tsp, qty: 4}
  - {ingredient: water, unit: cup, qty: 1.5}
  - {ingredient: all-purpose-flour, unit: cup, qty: 2}
  - {ingredient: salt, qty: 1}
  - {ingredient: vegetable-oil}
- name: Topping
  items:
  - {ingredient: honey}
  - {ingredient: ground-cinnamon}
  - {ingredient: walnuts, prep: crushed}
  - {ingredient: sesame-seeds}
steps:
- Combine the yeast and ½ cup warm water.
- Mix the flour with the salt and put it in a deep bowl.
- Add the yeast and and 1 cup warm water, and mix well until you make a uniform thin paste.
- Cover and leave in the shade for 1½–2 hours until it rises and forms bubbles under the surface.
- Heat several inches of oil in a deep frying pan. Add the batter by large spoonfuls to make fritters. Turn the balls as they puff-up, frying 3–5 minutes until golden brown all over. Do not crowd the pan.
- Remove with a strainer or ladle, and place on paper towels; keep warm.
- Drizzle loukoumas with honey.
- Sprinkle with cinnamon, walnuts, and/or sesame seeds to taste.
