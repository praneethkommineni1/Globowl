id: gr-pasta-casserole
title: Pasta Casserole
alternate_names:
- Pastitsio
summary: This recipe for pastitsio has been improved on over the generations. The reason why this is cooked on the stove top & only browned in the oven is that in Greek villages there was a shared village oven.
origin:
  country: GR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- 2.5-litre (10-cup) baking dish (metal, glass or ceramic are fine)
- 2 large saucepans for meat sauce and pasta
- 1 medium-to-large saucepan for Bechamel sauce
techniques:
- baking
- boiling
- sauteing
- simmering
ingredient_groups:
- name: Meat sauce
  items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 2, prep: chopped, note: medium}
