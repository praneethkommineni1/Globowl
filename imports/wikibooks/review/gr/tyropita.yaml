id: gr-tyropita
title: Tyropita
alternate_names:
- Greek Cheese Pie
summary: 'Tyropita (Pronounced: tee-ro-pee-ta) is a Greek layered pastry appetizer, made with layers of buttered filo dough, stuffed with cheese and usually shaped like a triangle. It is sold in bakeries throughout Greece, where it is a very popular breakfast and snack.'
origin:
  country: GR
course: starter
authenticity: unassessed
