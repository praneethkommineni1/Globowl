id: gr-tzatziki
title: Tzatziki
summary: Tzatziki is a yogurt sauce that's great over gyros, pitas, salads, lamb, as a dip, or for anything you'd like a cool tasty sauce on.
origin:
  country: GR
course: starter
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: yogurt, unit: cup, qty: 1.5}
  - {ingredient: garlic, unit: clove, qty: 4, prep: minced}
  - {ingredient: dill, unit: tbsp, qty: 1}
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: lemon-juice, unit: tbsp, qty: 4, optional: true}
  - {ingredient: cucumber, qty: 2, prep: diced, note: small}
  - {ingredient: salt}
  - {ingredient: black-pepper, optional: true, note: to taste}
steps:
- Drain yogurt in a sieve or a cheesecloth for about 3 hours prior to using it.
- Drain the cucumber and salt it to further remove moisture.
- Combine yogurt, garlic, olive oil, and lemon juice in a bowl and cover and refrigerate for 1 hour or more.
- After refrigerating, add dill and cucumber into bowl and mix with a whisk until smooth.
- Add pepper and salt to taste.
