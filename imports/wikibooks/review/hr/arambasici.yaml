id: hr-arambasici
title: Arambasici
alternate_names:
- Croatian Sour Cabbage Rolls
summary: Aramba&#353;i&#263;i are a speciality from Sinj, Croatia. Unlike some other cabbage rolls, which use fresh leaves, these are rolled up in whole pickled cabbage leaves.
origin:
  country: HR
course: starter
authenticity: unassessed
