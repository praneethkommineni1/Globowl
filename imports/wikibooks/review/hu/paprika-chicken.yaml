id: hu-paprika-chicken
title: Paprika Chicken
summary: Paprika chicken is a dish of Hungarian origin traditionally made with chicken, paprika, and lard, served over pasta. There is no official recipe. Preparations of this dish often vary between families. In this Americanized version, sour cream is used in place of lard.
origin:
  country: HU
course: main
authenticity: unassessed
yield:
  servings: 6
  amount: 6–8 as main course
time:
  total_min: 80
difficulty: 3
