id: hu-potato-casserole
title: Potato Casserole
alternate_names:
- Rakott Krumpli
summary: Rakott krumpli is a popular Hungarian potato casserole.
origin:
  country: HU
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: potato, qty: 6, note: medium}
  - {ingredient: egg, qty: 4}
  - {ingredient: salt}
  - {ingredient: sausage, qty: 1, optional: true}
  - {ingredient: olive-oil, unit: tbsp, qty: 4}
steps:
- Cook the potatoes for about 15–20 minutes.
- Peel the potatoes and the eggs.
- Slice the potatoes, eggs, and sausage.
- Put a little olive oil in a baking dish. Arrange alternating layers of potatoes, eggs, and salt or sausage in the dish.
- Drizzle olive oil over the filling, and top with sour cream.
- Bake in a preheated oven at 200°C for about 35 minutes.
tips:
- Traditionally most Hungarian cooking used lard (preferably home-made) but olive oil works just as well as a substitution.
