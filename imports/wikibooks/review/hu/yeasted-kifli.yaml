id: hu-yeasted-kifli
title: Yeasted Kifli
summary: Kifli crescents are Hungarian pastries. Unlike the vanilla kifli, these kifli are yeasted.
origin:
  country: HU
course: dessert
authenticity: unassessed
yield:
  servings: 60
  amount: 60–80 cookies
time:
  total_min: 1
difficulty: 3
