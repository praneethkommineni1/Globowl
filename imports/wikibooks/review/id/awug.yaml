id: id-awug
title: Awug
summary: Awug is a traditional Sundanese cake. This cake is made primarily from rice flour, topped with grated coconut and a palm sugar syrup. Awug has a sweet taste and it is best enjoyed while warm. It is usually sold in the morning at markets or in the afternoon by street vendors.
origin:
  country: ID
course: main
authenticity: unassessed
