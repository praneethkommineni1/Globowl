steps:
- Season the chicken pieces with salt. Coat with lemon juice, and let marinate for 15–20 minutes.
- Heat the oil to about 350°F (180°C), and fry chicken until it is golden. Remove chicken from oil, and set aside to drain.
- Sauté the garlic and onion for a minute or two. Add the remaining sauce ingredients.
- Stir fry for a minute and then add chicken pieces. Toss to coat.
- Serve hot with lime wedges.
