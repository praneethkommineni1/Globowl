id: id-babi-panggang-sauce
title: Babi Panggang Sauce
summary: Babi panggang is an Indonesian term applied to a variety of grilled pork dishes. In the Netherlands, babi panggang has become a fusion dish, typically prepared and served with a tomato-based sauce.
