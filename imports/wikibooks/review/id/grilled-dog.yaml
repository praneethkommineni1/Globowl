id: id-grilled-dog
title: Grilled Dog
summary: Anjing panggang is a specialty dish of grilled dog from Eastern Indonesia, the Southern Philippines, and other countries.
origin:
  country: ID
course: main
authenticity: unassessed
yield:
  servings: 12
time:
  total_min: 1
difficulty: 2
techniques:
- marinating
ingredient_groups:
- name: Marinade
  items:
  - {ingredient: white-vinegar, unit: cup, qty: 1}
  - {ingredient: salt, unit: tbsp, qty: 3}
  - {ingredient: garlic, unit: clove, qty: 6, prep: crushed}
  - {ingredient: red-chili, qty: 20}
  - {ingredient: tomato, qty: 3, prep: puréed}
  - {ingredient: lemon, unit: cup, qty: 3}
steps:
- Cut dog up into about 12–16 large pieces.
- In a food processor, blend together all the marinade ingredients.
- Combine the dog pieces and marinade in a large container. Let marinate for at least 2 hours in the fridge.
- Put dog pieces on a charcoal grill, cover, and let it cook over warm coals. Flip and baste occasionally for about 1 hour or until meat is tender.
