title: Kari Ayam
alternate_names:
- Indonesian Chicken Curry
summary: Kari ayam (chicken curry) is one of the signature dishes of Indonesian cuisine. In spite of the name "curry," this dish does not use Indian curry spice, and is actually a spicy but sweet dish.
