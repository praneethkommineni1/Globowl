id: id-klepon
title: Klepon
alternate_names:
- Indonesian Sweet Boiled Rice Cake
summary: Klepon (pronounced Klê-pon) is a traditional Indonesian rice cake, from Javanese cuisine. It is a boiled rice cake, stuffed with liquid gula jawa (palm sugar), and rolled in grated coconut. Klepon is green due to its pandan content.
