  - {ingredient: ground-cardamom, qty: 10, prep: ground}
  - {ingredient: nutmeg, unit: tsp, qty: 2}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 1}
  - {ingredient: vanilla-extract, unit: tsp, qty: 1}
  - {ingredient: egg-yolk, qty: 10}
  - {ingredient: egg-white, qty: 4}
  - {ingredient: condensed-milk, unit: g, qty: 195}
  - {ingredient: butter, unit: g, qty: 500}
  - {ingredient: all-purpose-flour, unit: g, qty: 125}
steps:
- Mix and sift cloves, cardamom, nutmeg, and cinnamon.
- Beat butter until smooth and creamy.
- Whip egg yolks with sugar until fluffy.
- Whip egg whites in separate mixing bowl until fluffy, then mix with egg yolks.
- Combine the spices, condensed milk, flour, and butter.
- Grease a cake pan.
- Using a small cup, spread 30–35 ml batter into the pan to make a layer.
- Bake in preheated 350°F oven, heated from the top, until golden (4–5 minutes).
- Remove from oven, brush with butter for flavoring, and top with another 30–35 ml batter to make another layer.
- Repeat the baking and layering to make around 30–40 layers.
tips:
- Adding to the complexity of the baking process, some cake shops add dried plums (prunes) inside and on top of the cake.
