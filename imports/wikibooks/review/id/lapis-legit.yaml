id: id-lapis-legit
title: Lapis Legit
alternate_names:
- Many-Layered Spiced Cake
summary: 'Lapis legit (Dutch: spekkoek) is a spice-flavored multilayered cake. A legacy of Dutch occupation in Indonesia, the cake is enjoyed during Eid ul-Fitr and Christmas celebrations. In the Netherlands, the sliced cake is served as dessert in Rijsttafel (Indonesian rice table).'
