id: id-mixed-pickled-vegetables
title: Mixed Pickled Vegetables
alternate_names:
- Acar Campur
summary: Acar campur is a very simple Indonesian pickle salad. Here is one example, of which there are many variations, some of which depend on what items are in season.
origin:
  country: ID
course: salad
authenticity: unassessed
