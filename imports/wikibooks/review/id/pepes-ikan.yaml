id: id-pepes-ikan
title: Pepes Ikan
alternate_names:
- Indonesian Steamed Fish
summary: Pepes is cooking method of steaming the ingredients (fish, chicken, tofu, or mushroom) wrapped in banana leaves until it becomes tender, then grilling the packets. In this recipe any fresh water fish or salt water fish can be used as substitute.
