id: id-pork-braised-with-garlic-and-onions-of-indonesia
title: Pork Braised with Garlic and Onions of Indonesia
alternate_names:
- Babi Kecap
summary: This is a traditional Indonesian dish.
origin:
  country: ID
course: main
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: pork, unit: kg, qty: 1}
  - {ingredient: onion, qty: 5, prep: chopped, note: large}
  - {ingredient: garlic, unit: clove, qty: 5, prep: minced}
  - {ingredient: soy-sauce, unit: tsp, qty: 4}
  - {ingredient: ginger}
  - {ingredient: black-pepper}
  - {ingredient: red-chili, optional: true}
steps:
- Cut the meat into 1-inch (2.5 cm) cubes.
- Add the onions, garlic and ginger to a pan and cook at around 200°C.
- Add the pork and mix with the soy sauce and black pepper (and chili pepper if desired).
- After about 3–4 minutes, reduce the heat to around 120°C and cook, covered, for one hour.
- Serve with nice-tasting rice.
