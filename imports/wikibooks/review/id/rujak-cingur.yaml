title: Rujak Cingur
alternate_names:
- Indonesian Cow Snout Salad
summary: Rujak cingur is a traditional food from Surabaya, Indonesia. This dish is made from cingur (cow's snout) and vegetables, which are drizzled with peanut sauce or petis sauce.
