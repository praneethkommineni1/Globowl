id: id-seblak
title: Seblak
summary: Seblak is a traditional snack from Sunda. This food is commonly found in West Java Province, especially in Bandung, Garut, and Tasikmalaya. It is made mainly from crackers with kencur (aromatic ginger) and chili as the main spices.
