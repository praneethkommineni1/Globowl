id: id-tahu-gejrot
title: Tahu Gejrot
summary: Tahu gejrot is a traditional dish from Cirebon, West Java, Indonesia. The dish is made from the main ingredient of fried Sumedang tofu or tofu pong, drizzled with a sweet and sour sauce and crushed chili peppers.
origin:
  country: ID
