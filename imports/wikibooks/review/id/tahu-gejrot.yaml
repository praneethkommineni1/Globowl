ingredient_groups:
- items:
  - {ingredient: red-chili, qty: 12}
  - {ingredient: garlic, unit: clove, qty: 3}
  - {ingredient: shallot, qty: 4}
  - {ingredient: palm-sugar, unit: g, qty: 100, prep: thinly sliced}
  - {ingredient: tamarind-paste, qty: 3}
  - {ingredient: water, unit: ml, qty: 300}
  - {ingredient: firm-tofu, qty: 15}
  - {ingredient: kecap-manis, unit: tbsp, qty: 4}
  - {ingredient: salt, note: to taste}
steps:
- Grind the chiles, garlic, and shallots together, then set aside.
- Combine the palm sugar, tamarind, and water in a saucepan. Boil the mixture until all the ingredients dissolve and form a syrup.
- Pour the syrup over the ground chile mixture. Mix well until evenly combined.
- Cut the tofu diagonally, then press lightly until the center of the tofu is slightly crushed.
- Arrange the tofu on a plate, then drizzle with the spicy and sweet sauce.
