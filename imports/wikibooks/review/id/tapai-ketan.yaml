title: Tapai Ketan
alternate_names:
- Indonesian Fermented Sticky Rice
summary: Tapai, also tape (pronounced "tah-pay"), is a traditional fermented food of Indonesia, although present in some form throughout South-East Asia.
origin:
  country: ID
course: main
