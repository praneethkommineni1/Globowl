steps:
- Beat the eggs, salt, pepper, and stock powder together in a bowl until well-combined.
- Mix in the garlic, spring onion, celery, and chile.
- Scoop the corned beef into the mixture, then use a spoon to break it into smaller pieces before mixing well again.
- Add the tofu, but do not mix, as this would crush the soft tofu.
- Heat a skillet over medium heat. Add a thin coat of oil, then spread the egg mixture evenly in the pan.
- Let the egg cook until fully cooked on the bottom, then flip the egg and cook the other side until done.
- Serve on a plate with soy sauce and fried shallots as desired.
