id: id-tempe-mendoan
title: Tempe Mendoan
summary: Tempe mendoan is a dish made from thin tempeh, fried with flour so as to taste deliciously piquant. Traditionally in the Banyumas territory, tempe mendoan was made from thin, wide tempeh, one or two sheets cooked at a time.
