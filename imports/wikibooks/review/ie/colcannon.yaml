id: ie-colcannon
title: Colcannon
summary: Colcannon is a rich mashed potato dish with cabbage, butter, and other ingredients. It's very easy to make and is a nice change from ordinary mashed potatoes. Its sloppiness is balanced by the crunch of the cabbage, and it should taste a little peppery.
