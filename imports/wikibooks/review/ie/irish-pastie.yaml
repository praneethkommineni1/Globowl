id: ie-irish-pastie
title: Irish Pastie
summary: Not to be confused with its Cornish counterpart, the pastie could be considered one of Northern Ireland's national dishes at it is regularly bought from chip shops across the province and generally can't be found anywhere else. Here is a recipe to try your own version.
