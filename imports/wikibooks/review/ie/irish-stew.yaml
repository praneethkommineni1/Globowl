  - {ingredient: potato, qty: 4, prep: peeled and thickly sliced, note: large}
  - {ingredient: onion, qty: 2, prep: thickly sliced, note: large}
  - {ingredient: carrot, qty: [3, 4], prep: peeled and thickly sliced, note: medium}
  - {ingredient: parsley, unit: sprig, qty: 1, prep: chopped}
  - {ingredient: water, unit: cup, qty: 2}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Choose a pot with a well-fitting lid and put in the ingredients in layers, starting and finishing with potatoes. Pour in the water and season to taste.
- Cover and put on a very low heat for about 2½ hours until the meat is tender and the potatoes have thickened the liquid.
tips:
- The dish may also be made with lamb, in which case it requires only 1½ hours cooking time.
