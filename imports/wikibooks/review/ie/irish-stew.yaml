id: ie-irish-stew
title: Irish Stew
summary: 'Irish stew (Irish: stobhach gaelach) is a traditional Irish dish made from lamb or mutton as well as potatoes, onions and parsley. It originated in Ireland but appears in cookbooks all over Europe, including in Escoffier''s Guide Culinaire.'
origin:
  country: IE
