title: Seafood Kebabs with Zhoug Sauce
summary: This recipe is for charcoal-grilled squid, prawn, and fish kebabs in zhoug (a spicy dipping sauce that can be used in a variety of different ways). The original recipe called for octopus, but it's been expanded with good results.
