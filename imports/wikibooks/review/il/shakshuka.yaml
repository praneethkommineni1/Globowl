id: il-shakshuka
title: Shakshuka
summary: Shakshuka is a popular Middle Eastern dish with many variations. It is vegetarian-friendly.
origin:
  country: IL
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 1
difficulty: 2
equipment:
- 1 frying pan
- 1 cutting board
- 1 kitchen knife
ingredient_groups:
- items:
  - {ingredient: onion, qty: 1}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: tomato, qty: [4, 5]}
  - {ingredient: egg, qty: 2}
  - {ingredient: red-bell-pepper}
  - {ingredient: basil, unit: tsp, qty: 1}
  - {ingredient: cayenne, prep: 'paprika, and turmeric to taste', note: to taste}
steps:
- Peel and chop the onion. Fry it in the oil until it turns translucent.
- Chop the tomatoes and pepper, and add to the onion in the pan.
- Add herbs and spices. Cover and let cook until the tomatoes are evenly cooked through (around 25 minutes on low heat).
- With a wooden spoon, make two holes in the onion-tomato mix.
- Break and pour each egg into its own hole. Cover and let cook until the eggs are firm (around 5 more minutes).
- Serve with bread.
tips:
- Tuna and garlic
- Cheese on top
- Bread inside
