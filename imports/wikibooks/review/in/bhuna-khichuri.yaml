id: in-bhuna-khichuri
title: Bhuna Khichuri
alternate_names:
- Bengali Rice and Lentils
summary: Khichuri is a Bengali dish once considered comfort food for the poor but now a delicacy served warm in the monsoon rain.
origin:
  country: IN
