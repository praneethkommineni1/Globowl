id: in-bonda
title: Bonda
alternate_names:
- South Indian Vegetable Fritter
summary: Bonda is a typical South Indian snack. The process of making Bonda involves deep frying a filling of potato (or other vegetables) dipped in gram flour batter.
origin:
  country: IN
course: starter
authenticity: unassessed
yield:
  servings: 1
