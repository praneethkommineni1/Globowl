id: in-chakarai-pongal
title: Chakarai Pongal
alternate_names:
- Sweet Rice and Black Gram Pudding
summary: Chakarai pongal is a sweet and buttery porridge-like dish that is traditionally prepared in South India for the Makar Sankranti festival that heralds the arrival of summer.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: cup, qty: 0.5}
  - {ingredient: mung-beans, unit: cup, qty: 0.5}
  - {ingredient: water, unit: cup, qty: 4}
  - {ingredient: cashews, unit: cup, qty: 0.25}
  - {ingredient: raisins, unit: cup, qty: 0.25}
  - {ingredient: ground-cardamom, unit: tbsp, qty: 1}
  - {ingredient: ghee, unit: cup, qty: 1}
  - {ingredient: milk, unit: cup, qty: 0.25}
steps:
- Cook the rice and dhal together with cups of water in a pot or pressure cooker until mushy.
- Meanwhile, melt the jaggery with 1 cup of water in a pan.
- Add the cardamom to the jaggery as it melts.
- Mush the rice and paruppu (dal) mixture well and add to the pan of jaggery.
- Stir well and cook on low heat till the mixture comes together well.
- Heat 4 tablespoons of the ghee in a separate pan and fry cashews to golden brown.
- Add raisins and fry for a few more seconds or until they swell up.
- Add the nuts and raisins to into the pongal.
- Serve hot with an additional dollop of neyyi or ghee.
