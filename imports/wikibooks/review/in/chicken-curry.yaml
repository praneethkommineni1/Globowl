- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: clove, qty: 6, prep: smashed}
  - {ingredient: lemon, qty: 0.5, prep: juiced}
  - {ingredient: red-chili, qty: 5, prep: slit in half length-wise, note: medium}
