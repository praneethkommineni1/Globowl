- items:
  - {ingredient: chickpeas-canned, unit: cup, qty: 1}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: tomato, qty: 1, prep: medium chopped}
  - {ingredient: chili-powder, unit: tsp, qty: 1}
  - {ingredient: curry-powder, unit: tsp, qty: 1.5}
  - {ingredient: garam-masala, unit: tsp, qty: 0.25}
  - {ingredient: ground-turmeric, unit: tsp, qty: 0.25}
  - {ingredient: garlic, unit: tsp, qty: 1}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: cilantro, prep: for garnishing}
steps:
- Soak the chickpeas overnight in water.
- Pressure cook the chickpeas until done (3 whistles).
- Heat the cooking oil in a pot. Add the onions and sauté until golden brown.
- Add the turmeric powder, chilli powder, garam masala, and Madras curry powder.
- Add the tomatoes, ginger, and garlic paste and stir for about 1 minute.
- Add the boiled chickpeas and some water.
- Add salt to taste. Cook for about 10 minutes on medium heat.
- Garnish with cilantro and serve with chapattis or paratha.
