title: Coconut Chutney
alternate_names:
- South Indian
summary: Coconut Chutney is served as a side dish for a lot of Indian snacks and breakfast items. It can be mild to extra hot depending on the individual preference. This recipe is from South India.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- roasting
ingredient_groups:
- name: Base
  items:
