id: in-coriander-chutney
title: Coriander Chutney
summary: Coriander chutney goes well with a papadum or chapati. It is suitable for refrigeration and freezes fairly well. It pairs extremely well with meat and many vegetarian preparations and is commonly served as a condiment with a wide variety of dishes in North Indian cuisine.
origin:
  country: IN
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: cilantro, unit: bunch, qty: 1}
  - {ingredient: red-chili, qty: 2}
  - {ingredient: ground-cumin, unit: tsp, qty: 1, optional: true}
  - {ingredient: onion, qty: 1, note: small}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: lemon}
steps:
- Wash the coriander.
- Finely chop the onion, chillies, and coriander.
- Add the salt, juice, and cumin.
- Blend to a fine paste.
tips:
- This can also be made with mint leaves and is called mint chutney. Both varieties are called green chutney.
- Grated coconut, garlic, and ginger can also be added.
