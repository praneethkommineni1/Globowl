id: in-dabeli
title: Dabeli
alternate_names:
- Potato-stuffed Buns with Chutney
summary: Dabeli is an Indian dish, originally from the region Kutch in Gujarat. Dabeli is now a common street food in Mumbai. It is also called double roti or kutchi dabeli.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 2
  amount: 2–3
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- name: Filling
  items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: asafoetida, unit: pinch, qty: 1}
  - {ingredient: potato, qty: 2, prep: boiled and mashed}
  - {ingredient: salt}
  - {ingredient: water}
  - {ingredient: red-chili, prep: finely chopped, optional: true}
