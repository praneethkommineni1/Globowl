title: Dal Makhani
alternate_names:
- Black Gram with Cream
summary: Dal makhani is a delicacy from Punjab, India. Traditionally this dal was cooked slowly, for hours, on charcoal. This gave it a creamy texture. It had ‘malai’ (cream) or fresh butter added to it. When cooked at home these days, more moderate amounts of cream or butter are used.
