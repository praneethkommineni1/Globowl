id: in-deep-fried-chiles-filled-with-chickpea-flour
title: Deep Fried Chiles Filled with Chickpea Flour
alternate_names:
- Mirchi Bhajji
summary: Mirchi bhajji are fried stuffed peppers.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 5
  amount: 5–10 bhajjies
time:
  total_min: 30
difficulty: 1
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: red-bell-pepper, qty: [11, 17]}
  - {ingredient: chickpea-flour, unit: cup, qty: 1.5}
  - {ingredient: rice-flour, unit: tbsp, qty: 1}
  - {ingredient: red-chili, qty: [6, 7], prep: finely chopped}
  - {ingredient: cilantro, unit: tbsp, qty: 1}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: salt, note: to taste}
  - {ingredient: vegetable-oil}
steps:
- Slit 5–10 of the peppers, preferably the longest and fattest.
- Mix salt and gram flour. Stuff the slit peppers with this mixture, and keep aside for 15–20 minutes.
- Heat oil in a pan over medium heat.
- Mix all other dry ingredients. Dip each green pepper into this mixture gently to coat it.
- Deep fry in heated oil until golden brown.
- Drain on kitchen paper to remove excess oil.
- Serve hot with chutney or ketchup.
