steps:
- Soak the urad dal in water for several hours.
- Soak the rava in water.
- Grind the soaked urad dal to make a somewhat loose batter. Mix in the soaked rava.
- Mix in the flour, then add enough water to thin it if necessary.
- Mix in onions, chillies, and salt to the batter. Allow to ferment and rise.
- Make small balls and deep fry them in hot oil.
