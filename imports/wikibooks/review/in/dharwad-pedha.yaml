id: in-dharwad-pedha
title: Dharwad Pedha
alternate_names:
- Sweetened Paneer Cheese
summary: Dharwad pedha is a unique variety of peda (milk sweet) famous all over India. There are majorly 30 different ways to make pedha/khova sweets from milk, and Dharwad peda is one of its kind. It has received Government accreditation as Geographical indication of India.
origin:
  country: IN
course: dessert
authenticity: unassessed
yield:
  servings: 1
