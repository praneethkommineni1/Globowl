id: in-dhokla
title: Dhokla
alternate_names:
- Steamed Black Gram Bread
summary: Dhokla is a Gujarati snack that is made with black gram. It is not to be confused with khaman, a variant made from besan (chickpea flour). It is eaten as a side dish with the main meal and is usually tangy and slightly sweet in taste.
