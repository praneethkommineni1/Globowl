title: Egg Rice
summary: Egg Rice.
origin:
  country: IN
course: side
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 30
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: cup, qty: 2}
  - {ingredient: onion, qty: 1, prep: chopped, note: small}
  - {ingredient: red-chili, qty: 2, prep: chopped}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: garlic, unit: tsp, qty: 1}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.25}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: egg, qty: 2, prep: beaten}
steps:
- Cook rice and keep it aside.
- Sweat onions and green chilies in a pan together over medium heat.
- Add ginger and garlic pastes.
- Add rice, and mix everything well.
- Add salt and spice powder.
- Stir in the beaten eggs.
- Cook until everything is mixed well.
