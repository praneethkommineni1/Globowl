ingredient_groups:
- items:
  - {ingredient: carrot, qty: [2, 3], note: large}
  - {ingredient: cashews, unit: cup, qty: 0.5, prep: broken}
  - {ingredient: raisins, unit: cup, qty: 0.5, prep: washed}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: sugar, unit: tsp, qty: [2, 3]}
  - {ingredient: green-cardamom-pods, qty: 4}
