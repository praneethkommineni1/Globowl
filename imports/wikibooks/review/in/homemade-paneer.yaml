id: in-homemade-paneer
title: Homemade Paneer
summary: Paneer is a fresh curd cheese of Indian origin made by curdling milk with an acid and pressing out the water and whey.
origin:
  country: IN
course: side
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: milk, unit: l, qty: 3}
  - {ingredient: lemon-juice, unit: tbsp, qty: 6}
steps:
- Bring milk to a boil in a large pan.
- Just before the milk starts to boil, add the lemon juice or vinegar to coagulate the milk.
- Pour the coagulated milk through a cheese cloth to discard most of the water within.
- Press the water out firmly and place a weight on top of the paneer.
- Allow to rest and harden for 2–3 hours in the refrigerator.
tips:
- Sometimes the hardening in the refrigerator may not work. You may find that the paneer may breakdown into small granules while cooking. The alternate way to make it firm is by steaming it for about 15 minutes.
