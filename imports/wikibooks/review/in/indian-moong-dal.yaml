  - {ingredient: red-chili, qty: 3}
  - {ingredient: ground-turmeric, unit: tsp, qty: 0.5}
  - {ingredient: water, unit: cup, qty: 1.5}
  - {ingredient: salt, note: to taste}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
