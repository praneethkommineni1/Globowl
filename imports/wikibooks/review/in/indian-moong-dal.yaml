id: in-indian-moong-dal
title: Indian Moong Dal
summary: This recipe is for cooking moong dal in the typical Indian way.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 2
