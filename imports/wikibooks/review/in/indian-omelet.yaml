id: in-indian-omelet
title: Indian Omelet
summary: The Indian omelet is called so since it has various Indian spices and vegetables added to it.
origin:
  country: IN
course: breakfast
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 4, note: large}
  - {ingredient: onion, unit: cup, qty: 1}
  - {ingredient: tomato, unit: cup, qty: 0.5}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: black-pepper, unit: tsp, qty: 0.25}
  - {ingredient: cumin-seeds, unit: tsp, qty: 0.5}
  - {ingredient: cilantro, note: to taste}
  - {ingredient: red-chili, note: to taste}
  - {ingredient: vegetable-oil}
steps:
- In a small bowl, whisk the eggs lightly. Add in all the other ingredients and mix properly.
- Set a skillet on stove, and smear its surface with a thin coat of oil.
- Pour the contents of the bowl into the skillet.
- Lightly brown on one side.
- Turn over and lightly brown other side.
