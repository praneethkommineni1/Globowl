id: in-indian-rice
title: Indian Rice
summary: This makes an excellent side dish, and goes well with a large variety of things, from spicy eggplant to tofu to potatoes in coconut sauce.
origin:
  country: IN
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tsp, qty: 2}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: raisins, unit: cup, qty: 0.5}
  - {ingredient: cashews, unit: cup, qty: 0.25}
  - {ingredient: long-grain-rice, unit: cup, qty: 2}
  - {ingredient: water, unit: cup, qty: 4}
steps:
- Heat the olive oil in a pot.
- Add the cumin, then the raisins and cashews. Sauté for two minutes.
- Add the rice, and sauté for another minute.
- Add water, and bring everything to a boil.
- Lower the heat, cover, and cook for 12 minutes.
tips:
- Basmati rice is recommended, as other types may turn out poorly. Do not use Italian risotto rice, or any sticky rice.
