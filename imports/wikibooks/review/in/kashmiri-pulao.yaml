id: in-kashmiri-pulao
title: Kashmiri Pulao
summary: This very fancy Kashmiri pulao, or Kashmiri Pallao, is from the Northern Indian state of Kashmir.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 40
difficulty: 3
techniques:
- pan-frying
