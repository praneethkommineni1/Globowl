  - {ingredient: whole-cloves, qty: 5}
  - {ingredient: green-cardamom-pods, qty: 4}
  - {ingredient: bay-leaf, qty: 1}
  - {ingredient: onion, qty: 1, prep: sliced thin, note: small}
  - {ingredient: ginger-garlic-paste, unit: tsp, qty: 1.5}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: saffron, qty: [3, 4]}
  - {ingredient: milk, unit: tbsp, qty: 1}
  - {ingredient: long-grain-rice, unit: kg, qty: 0.5, prep: cooked and drained}
  - {ingredient: dates, unit: g, qty: 100, prep: pitted and sliced thin}
