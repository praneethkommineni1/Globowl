id: in-kuddi
title: Kuddi
alternate_names:
- Spiced Yogurt Sauce
summary: Kuddi, also called kadhi, is a sort of gravy based on yogurt and chickpea flour. It can be served with pakora, rice, or roti.
origin:
  country: IN
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
techniques:
- boiling
- pan-frying
ingredient_groups:
- items:
  - {ingredient: yogurt, unit: l, qty: 0.5}
  - {ingredient: chickpea-flour, unit: tsp, qty: 1}
  - {ingredient: sugar, unit: tsp, qty: [2, 3]}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: ginger, qty: 1, prep: grated}
  - {ingredient: red-chili, qty: 1, prep: chopped}
  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: cumin-seeds, unit: tsp, qty: 0.5}
steps:
- Combine the yogurt, chickpea flour, sugar, salt, grated ginger, and chopped green chilli.
- Heat and bring to a boil with continuous stirring.
- Taste and add more sugar or salt as needed. It should be sour, salty, and sweet.
- Fry the jeera seeds in butter, and mix them into the kuddi.
- Serve.
