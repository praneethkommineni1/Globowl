id: in-lemon-rice
title: Lemon Rice
summary: Lemon rice is a specialty of the South Indian coastal state of Tamil Nadu.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
