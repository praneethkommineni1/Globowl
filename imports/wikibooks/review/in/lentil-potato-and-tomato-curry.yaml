  - {ingredient: water, unit: cup, qty: 4}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: bay-leaf, qty: 1}
  - {ingredient: margarine, unit: tbsp, qty: 1}
  - {ingredient: olive-oil, unit: tbsp, qty: 1}
  - {ingredient: potato, qty: 2, prep: cut into 1/2 inch cubes, note: large}
  - {ingredient: ground-turmeric, unit: tsp, qty: 1}
  - {ingredient: cayenne, unit: tsp, qty: 0.5}
  - {ingredient: tomato, unit: g, qty: 794}
  - {ingredient: garam-masala, unit: tsp, qty: 2}
  - {ingredient: honey, unit: tsp, qty: 1}
steps:
- In a large pot, combine and cook water, lentils, salt and bay leaf.
- In a large frying pan, combine potatoes, turmeric, cayenne pepper, olive oil and margarine. Fry for 5–10 minutes.
- Add potato mixture to the pot with the lentils along with all remaining ingredients. Cook until the potatoes are soft and tender.
- Remove bay leaf before serving.
