id: in-lentil-potato-and-tomato-curry
title: Lentil, Potato, and Tomato Curry
summary: This creates a healthy, inexpensive and easy stew with depths of flavor. This recipe is fairly low on the heat scale, but feel free to add more cayenne pepper to up its spiciness. It is excellent served with chapatis or rice.
origin:
  country: IN
course: main
