- items:
  - {ingredient: red-bell-pepper, qty: 3}
  - {ingredient: orange, qty: 1, prep: 'yellow, and red capsicum'}
  - {ingredient: cashews}
  - {ingredient: tomato, qty: 4, note: large}
  - {ingredient: carrot, unit: cup, qty: 1}
  - {ingredient: green-peas, unit: cup, qty: 1}
