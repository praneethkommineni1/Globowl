id: in-malai-mixed-vegetable-curry
title: Malai Mixed Vegetable Curry
summary: Malai mixed vegetable, is a creamy side dish for Indian bread.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 10
time:
  total_min: 30
difficulty: 3
