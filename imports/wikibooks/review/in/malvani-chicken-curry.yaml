title: Malvani Chicken Curry
summary: Kombdi vade is a Malvani dish, which is quite popular in Maharashtra.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 30
difficulty: 2
techniques:
- marinating
- pan-frying
- sauteing
ingredient_groups:
- items:
  - {ingredient: ground-ginger, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: tbsp, qty: 2}
  - {ingredient: chicken, unit: g, qty: 800}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: coconut, qty: 1, prep: flesh grated}
  - {ingredient: onion, qty: 4, prep: chopped}
  - {ingredient: red-chili, unit: tsp, qty: 1}
