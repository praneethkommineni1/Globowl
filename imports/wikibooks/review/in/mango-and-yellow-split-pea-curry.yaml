id: in-mango-and-yellow-split-pea-curry
title: Mango and Yellow Split Pea Curry
summary: Mango Dal also known as Amchur Dal is a vegetarian dish from Southern India which is also popular in the West. The dish is popular amongst vegetarians and persons who wish to limit the amount of meat in their diet.
origin:
  country: IN
course: main
