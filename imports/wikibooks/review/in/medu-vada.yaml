id: in-medu-vada
title: Medu Vada
alternate_names:
- South Indian Savory Lentil Donut
summary: A vada is a savoury South Indian doughnut made from lentils (or sometimes potatoes). This is a recipe for medu vada. It is commonly accompanied by idli.
origin:
  country: IN
