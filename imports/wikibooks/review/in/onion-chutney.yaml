id: in-onion-chutney
title: Onion Chutney
summary: Onion chutney is a delicious sweet-and-sour chutney used as a side dish for many South Indian snacks and breakfast items. It is one of the components used in masala dosa assembly.
origin:
  country: IN
course: main
authenticity: unassessed
