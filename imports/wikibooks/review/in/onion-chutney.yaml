  total_min: 1
difficulty: 1
techniques:
- stir-frying
ingredient_groups:
- items:
  - {ingredient: vegetable-oil, unit: tsp, qty: 2}
  - {ingredient: chickpeas-canned, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 2, prep: coarsely chopped}
  - {ingredient: coconut, qty: 3, prep: each 1x1 inch}
  - {ingredient: tamarind-paste, unit: tsp, qty: 1}
  - {ingredient: red-chili, qty: [4, 6]}
  - {ingredient: salt, note: to taste}
steps:
- In a shallow pan, heat the oil. Add the chana dal, and stir until the dal is roasted.
- Add the onions, and stir fry them till they become transparent and the edges turn golden brown. Turn off the heat and let them cool for a few minutes.
- When cooled, blend together the onion mixture, coconut, chillies, tamarind, and salt until it makes a smooth paste. Add a few teaspoons of water if necessary.
