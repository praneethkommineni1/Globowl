- items:
  - {ingredient: red-chili, qty: 1, note: large}
  - {ingredient: raisins, unit: cup, qty: 1.5}
  - {ingredient: sugar, unit: cup, qty: 4}
  - {ingredient: white-vinegar, unit: cup, qty: 3}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: water, unit: cup, qty: 1}
  - {ingredient: ground-cloves, unit: tsp, qty: 0.25}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.5}
  - {ingredient: nutmeg, unit: tsp, qty: 0.25}
  - {ingredient: allspice, unit: tsp, qty: 0.25}
  - {ingredient: bay-leaf, qty: 6}
steps:
- Pare, core, and slice pears.
- Chop pepper finely.
- Mix pears, pepper, raisins, sugar, crystallised ginger, white vinegar, salt, and water in a pot.
- Use string to tie spices in a cheesecloth bag and add to pears
- Simmer mixture until thick, about 2 hours.
- Remove spice bag.
- Add liquid pectin and boil for 1 minute.
- Pour immediately into hot, sterilised jars, and seal straight away.
