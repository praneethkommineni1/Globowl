id: in-pear-chutney
title: Pear Chutney
summary: Pear chutney is served as a side dish for many Indian foods. It can be mild to extra hot depending on the individual preference.
origin:
  country: IN
course: condiment
authenticity: unassessed
yield:
  servings: 3
  amount: 3 pints (approximately seven 5-inch jars)
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
- simmering
