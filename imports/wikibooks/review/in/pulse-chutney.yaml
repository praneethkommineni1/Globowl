id: in-pulse-chutney
title: Pulse Chutney
summary: Pulse chutney is an vegan Indian recipe. Use fewer chili peppers if you do not want it so hot.
origin:
  country: IN
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: mung-beans, unit: g, qty: 57}
  - {ingredient: ginger, qty: 1.5}
  - {ingredient: red-chili, qty: 4}
  - {ingredient: salt}
  - {ingredient: lemon-juice}
steps:
- Soak the green mung beans for 3–4 hours. Allow to sprout.
- Mince the green chilies, fresh ginger, and salt.
- Grind to a paste in a mortar and pestle or food processor.
- Season with lemon juice to taste.
