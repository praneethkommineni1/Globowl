id: in-rasam
title: Rasam
alternate_names:
- Tamarind and Tomato Soup
summary: Rasam, also called saru, is a popular dish in South India. It can be described as a thin soup, served on top of rice.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
- pan-frying
ingredient_groups:
- name: Rasam powder
  items:
  - {ingredient: vegetable-oil, unit: tsp, qty: 2}
  - {ingredient: coriander-seeds, unit: tbsp, qty: 1}
  - {ingredient: red-chili, qty: [3, 4]}
  - {ingredient: cumin-seeds, unit: tsp, qty: 1}
