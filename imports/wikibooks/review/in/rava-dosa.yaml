ingredient_groups:
- items:
  - {ingredient: rice-flour, unit: cup, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 1}
  - {ingredient: semolina, unit: cup, qty: 0.5}
  - {ingredient: salt, note: to taste}
