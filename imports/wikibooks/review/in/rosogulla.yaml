id: in-rosogulla
title: Rosogulla
alternate_names:
- Bengali Milk Balls in Syrup
summary: Rasgulla is a milk-based Bengali sweet, popular in West Bengal, India.
origin:
  country: IN
course: dessert
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 45
difficulty: 4
techniques:
- boiling
- dough-making
ingredient_groups:
- name: Chenna
  items:
  - {ingredient: water, unit: cup, qty: 0.5}
  - {ingredient: milk, unit: l, qty: 1}
- name: Sugar Syrup
  items:
  - {ingredient: sugar, unit: cup, qty: 5}
  - {ingredient: milk, unit: cup, qty: 0.5}
  - {ingredient: water, unit: cup, qty: 3}
- name: Assembly
  items:
