id: in-saffron-rice
title: Saffron Rice
summary: Saffron rice is yellow or tan, with a taste reminiscent of spice breads and spice cakes. It goes well with chicken.
origin:
  country: IN
course: side
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: cup, qty: 1}
  - {ingredient: saffron, unit: tsp, qty: 0.5}
  - {ingredient: chicken, unit: cup, qty: 2}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 6}
  - {ingredient: celery, unit: cup, qty: 0.5}
  - {ingredient: ground-cinnamon, qty: 1}
  - {ingredient: whole-cloves, qty: 2}
  - {ingredient: brown-sugar, unit: tbsp, qty: 1.5}
  - {ingredient: molasses, unit: tbsp, qty: 1.5}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: ground-coriander, unit: pinch, qty: 1}
  - {ingredient: ground-cardamom, unit: pinch, qty: 1}
steps:
- Wash the rice in cool water until the water runs absolutely clear.
- Place the saffron threads in a teaspoon or tablespoon of boiling water to soak.
- Heat the oil, cinnamon, and cloves in a heavy saucepan.
- Add the celery to the saucepan.
- Add the rice to the saucepan; stir for 5 minutes and/or until the grains are golden.
- Add the stock, sugar, molasses, salt, coriander, and cardamom.
- Stir to dissolve the sugar.
- Bring to a boil, then reduce to a low simmer.
- Add the saffron mix, both water and threads, stirring gently.
- Cover and cook 25 minutes, or until rice is tender and the liquid absorbed.
- Fluff with a fork.
