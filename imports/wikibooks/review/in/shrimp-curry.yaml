id: in-shrimp-curry
title: Shrimp Curry
summary: Shrimp Curry.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: shrimp, unit: g, qty: 454, prep: 'deveined jumbo shrimp, heads removed'}
  - {ingredient: onion, qty: 0.5, prep: finely diced}
  - {ingredient: garlic, unit: tbsp, qty: 1}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: curry-powder, unit: tbsp, qty: 1}
  - {ingredient: chicken-stock, unit: cup, qty: 0.5}
  - {ingredient: ghee, unit: tbsp, qty: 1}
steps:
- Heat oil in a large stainless steel sauté pan over medium high heat. Add shrimp and sauté just until bright pink. Remove and keep warm.
- Melt ghee in same pan. Add vegetables and sauté until browned around edges.
- Add remaining ingredients and shrimp and toss to coat. Reduce heat to medium low and cook until shrimp are heated through.
- Remove and serve.
