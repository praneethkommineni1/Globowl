id: in-south-indian-millet-swallow
title: South Indian Millet Swallow
alternate_names:
- Mudde
summary: Mudde is a compact ball swallow made from finger millet. It is a lunchtime staple of rural communities in Karnataka, Tamil Nadu and Andhra Pradesh in South India, and an important source of long-lasting energy among the rural poor.
origin:
  country: IN
course: side
authenticity: unassessed
yield:
  servings: 6
  amount: 6 balls
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, unit: cup, qty: 5}
  - {ingredient: ghee}
steps:
- Boil the water in a pot, add a little of the flour to make a paste, then add the rest of the flour.
- Stir once with the handle of a wooden spoon and leave it in the pot.
- Keep on low heat for about 10 minutes until it smells cooked.
- Stir until the mixture turns dark reddish-brown. Once it begins to leave the sides of the pot, remove the pot from the fire and stir vigorously for 5–10 minutes—it's hard work, but the longer you keep at it, the lighter it will be.
- Pull the mixture out and form into balls of about fist size.
