steps:
- Cut tofu into 2.5 cm (1-inch) cubes.
- Spread out the tofu on a cookie sheet and bake for 20–25 minutes at . This releases the extra water from the tofu and dries it out to be able to absorb the marinade.
- Mix the spices, tomato sauce, yogurt, and oil in a bowl.
- Let the tofu marinate well (about 8 hours) in this mixture, preferably in the refrigerator.
- After marinating, thread the tofu onto skewers and grill it.
tips:
- If a grill is not available, arrange the tofu pieces on a cookie sheet and bake for 20 minutes at , then broil for another 20 mins at on the middle shelf.
- If dry tofu is not preferred, then bake the tofu with the marinade in a baking dish for 30–40 minutes at and then broil for 20–25 mins at .
- To make this vegan, substitute the yogurt with soymilk
- Try serving with rice or naan, and garnish with fresh-chopped cilantro or with fresh onions and cucumbers.
