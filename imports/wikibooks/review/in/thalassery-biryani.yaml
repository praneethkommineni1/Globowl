id: in-thalassery-biryani
title: Thalassery Biryani
summary: Thalassery biriyani is a rice dish blended with Chicken and Spices. The recipe has a strong legacy of the Mughlai cuisine. This variant of biryani is an Indian cuisine and has originated from the Malabar region of South India.
origin:
  country: IN
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 60
difficulty: 3
