id: in-traditional-pilau-rice
title: Traditional Pilau Rice
summary: Known as pilau, pullao, pulao and pilaf, this rice dish will take between up to an hour to prepare if made the traditional way.
origin:
  country: IN
  also_claimed_by:
  - PK
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 60
difficulty: 3
techniques:
- boiling
- pan-frying
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: ml, qty: 425}
  - {ingredient: onion, qty: 1, prep: peeled and finely chopped, note: medium}
  - {ingredient: garlic, unit: clove, qty: [1, 2]}
  - {ingredient: garam-masala}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: ground-coriander, unit: tsp, qty: 1.5}
  - {ingredient: beef, unit: g, qty: 250}
  - {ingredient: chickpeas-canned, unit: g, qty: 400}
  - {ingredient: tomato, qty: 1, prep: 'diced, or 1 dozen cherry tomatoes, cut into eighths', note: large}
  - {ingredient: green-peas, optional: true}
  - {ingredient: salt}
  - {ingredient: vegetable-oil}
