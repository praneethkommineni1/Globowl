id: in-upma
title: Upma
alternate_names:
- Indian Semolina Porridge
summary: Upma is a popular South Indian dish made from semolina. Several variations of the dish exist including the use of different varieties of ground wheat, rice and even bread. A simple upma or uppittu takes just about 10 minutes to prepare.
