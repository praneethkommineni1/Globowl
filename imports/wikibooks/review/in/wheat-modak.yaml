id: in-wheat-modak
title: Wheat Modak
alternate_names:
- Coconut Pastries
summary: Modak is a deep fried Indian sweet that is almost exclusively prepared during the Ganesha Festival around August, when it is often given as an offering to Lord Ganesha, the elephant-headed Remover of Obstacles. Modak is reportedly his favorite sweet.
origin:
  country: IN
course: dessert
authenticity: unassessed
yield:
  servings: 20
  amount: 20–25 servings
time:
  total_min: 1
difficulty: 3
techniques:
- sauteing
ingredient_groups:
- name: Dough
  items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 1}
  - {ingredient: semolina, unit: cup, qty: 1}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: ground-turmeric, unit: pinch, qty: 1}
  - {ingredient: water, unit: cup, qty: 1}
- name: Filling
  items:
  - {ingredient: coconut, qty: 1, prep: grated finely}
  - {ingredient: sugar, unit: cup, qty: 1.5}
  - {ingredient: ground-cardamom, unit: tbsp, qty: 0.75}
steps:
- Combine all the dough ingredients; it should be dry but should a little sticky.
- Grease the dough with oil and leave covered for 1 hour.
- Melt the jaggery with 4 tablespoons of water in a non-stick skillet until it is liquid.
- Add coconut. Sauté for 15–20 minutes, until the mixture becomes very thick and almost dry.
- Mix in the cardamom powder and remove from the fire.
- Spread the mixture out on a metal tray to cool.
- Take a tablespoon-sized ball of dough and roll it out—using flour if it is sticky—into a disc 4 inches across.
- Put a tablespoon-sized lump of filling in the middle (it should be hardening well by now), wet the edges with a finger, and fold up the sides, crimping the dough into a peak at the top to completely seal in the filling.
- Deep fry the modak in oil until golden brown.
