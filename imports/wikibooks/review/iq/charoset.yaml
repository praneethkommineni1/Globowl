id: iq-charoset
title: Charoset
alternate_names:
- Iraqi
summary: Iraqi charoset is a dried fruit and nut-based paste served during the Jewish celebration of Passover by Jews from Iraq.
origin:
  country: IQ
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: dates, unit: ml, qty: 500, prep: chopped and seeded}
  - {ingredient: water}
  - {ingredient: salt}
  - {ingredient: walnuts, unit: ml, qty: 125}
steps:
- Boil dates in lightly salted water stirring frequently until it is a thick paste.
- Mix in finely chopped nuts.
tips:
- A traditional variant is made by straining the pulp out of the paste producing a honey-like date syrup. This procedure uses considerably more dates and can take several days to produce sufficient syrup.
