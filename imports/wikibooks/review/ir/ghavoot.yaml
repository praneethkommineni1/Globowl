id: ir-ghavoot
title: Ghavoot
alternate_names:
- Iranian Nut and Seed Powder
summary: Ghavoot (قاووت) or ghovvatoo (قووتو) is a nutritionally-dense recipe made of powdered seeds, nuts, and sugar. There are several versions, depending on the components chosen, and their ratios. It is a traditional souvenir of Kerman, Iran.
origin:
  country: IR
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: ground-cinnamon}
  - {ingredient: sesame-seeds}
  - {ingredient: poppy-seeds}
  - {ingredient: chickpeas-canned}
  - {ingredient: walnuts}
  - {ingredient: almonds}
  - {ingredient: pistachios}
steps:
- Grind and roast each component.
- Add an equal weight of sugar; grind everything together.
- Serve as powder, or blend it with milk or hot water.
tips:
- Ghavoot is a traditional energizer. You can consume it as a pre-workout snack.
