id: ir-ghormeh-sabzi
title: Ghormeh Sabzi
alternate_names:
- Iranian Herb Stew
summary: Ghormeh sabzi is one of the most popular dishes in the Persian part of Iran. It is relatively easy to prepare and yields food for multiple days. That is why typically a large amount of stew is prepared. The herbs and the dried limes create a unique flavour.
origin:
  country: IR
course: main
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 300
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: onion, qty: 2, prep: finely chopped}
  - {ingredient: beef, unit: g, qty: 800}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: parsley, unit: bunch, qty: 1, prep: finely chopped}
  - {ingredient: spinach, unit: bunch, qty: 1, prep: finely chopped}
  - {ingredient: cilantro, unit: bunch, qty: 1, prep: finely chopped}
  - {ingredient: lime, qty: 8}
