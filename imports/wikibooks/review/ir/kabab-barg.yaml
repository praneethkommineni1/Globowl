id: ir-kabab-barg
title: Kabab Barg
alternate_names:
- Persian Grilled Meat
summary: This kebab is prepared by marinating meat overnight and grilling it over an open fire. It is usually served with polo (white rice) or naan.
origin:
  country: IR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- grilling
- marinating
ingredient_groups:
- items:
  - {ingredient: olive-oil}
  - {ingredient: onion, qty: 3}
  - {ingredient: garlic}
  - {ingredient: saffron, unit: tsp, qty: 0.5}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: lamb, unit: kg, qty: 1, prep: cut into 1 x 5 cm pieces}
steps:
- Combine the olive oil, onions, garlic, saffron, salt, and pepper to make the marinade.
- Toss the lamb pieces with the marinade. Cover, and marinate overnight in the refrigerator.
- Thread the lamb onto metal skewers.
- Brush the lamb with the marinade. Grill for 5–10 minutes on each side over an open fire.
