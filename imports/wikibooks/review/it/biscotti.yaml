steps:
- In a mixing bowl, cream butter and 1 cup sugar.
- Add eggs, one at a time, beating well after each addition.
- Stir in vanilla.
- Combine dry ingredients; add to creamed mixture.
- Stir in almonds.
- Line a baking sheet with foil, and grease the foil.
- Divide dough in half; shape into two 12 x 3-inch rectangles on the foil.
- Brush with milk and sprinkle with remaining sugar.
- Bake at 375°F for 15–20 minutes or until golden brown and firm to the touch.
- Remove from oven and reduce heat to 300°F.
- Lift rectangles with foil onto wire rack; cool for 15 minutes.
- Place on a cutting board; slice diagonally ½ inch thick. Place slices with cut side down on an ungreased baking sheet.
- Bake for 10 minutes. Turn cookies over; bake 10 minutes more. Turn oven off, leaving cookies in oven with door ajar to cool.
- Store in airtight container.
