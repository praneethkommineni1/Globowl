id: it-bruschetta
title: Bruschetta
summary: This article describes general preparation procedures for the popular Italian appetizer (or antipasto) Bruschetta (plural bruschette), slices of toasted or grilled bread rubbed with garlic, drizzled with olive oil, and seasoned with salt and pepper.
origin:
  country: IT
course: starter
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 10
difficulty: 1
ingredient_groups:
- name: Base
  items:
  - {ingredient: white-bread, qty: 1, prep: sliced 1/2 inch thick on the bias}
  - {ingredient: garlic, qty: 0.5}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: olive-oil}
- name: Toppings
  items:
  - {ingredient: tomato}
  - {ingredient: mushroom}
  - {ingredient: anchovies}
  - {ingredient: onion}
steps:
- Toast the bread slices in a toaster oven, under a broiler, or on a grill, until they turn golden.
- Immediately rub the bread with the cut side of the garlic. Sprinkle with salt and black pepper, and drizzle generously with extra-virgin olive oil.
- Serve warm topped with whatever combinations of seasonal ingredients you choose.
