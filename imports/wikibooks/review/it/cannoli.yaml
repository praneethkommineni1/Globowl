id: it-cannoli
title: Cannoli
summary: Cannoli are sweet Italian pastries. They consist of a fried pastry shell in the shape of a tube, filled with a sweet cream and cheese mixture.
origin:
  country: IT
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: ricotta, unit: tbsp, qty: 2}
  - {ingredient: sugar, unit: tbsp, qty: 1}
steps:
- Prepare the cannoli shells if you are making them yourself.
- Combine the ricotta and sugar. Fold in the whipped cream and chocolate chips.
- Fill shells with the ricotta mixture. A piping bag works well here.
- Cool cannoli in the fridge before serving.
tips:
- Replace the chocolate chips with dried fruit.
