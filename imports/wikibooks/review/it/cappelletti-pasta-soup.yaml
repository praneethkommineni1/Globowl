id: it-cappelletti-pasta-soup
title: Cappelletti Pasta Soup
alternate_names:
- Cappelletti in Brodo
summary: Cappeletti in Brodo is a very simple and very delicious Italian pasta soup, made with Cappeletti (small meat or vegetable filled) ravioli. It's delicious on a cold day, getting in from a long day at work, and without much time to devote to preparing a tasty meal.
origin:
  country: IT
course: soup
authenticity: unassessed
