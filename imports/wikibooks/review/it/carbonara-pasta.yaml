id: it-carbonara-pasta
title: Carbonara Pasta
summary: This is a wonderful dish that is very easy to do. It uses raw eggs, which are not to everyone's taste and should be avoided by pregnant women.
origin:
  country: IT
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
