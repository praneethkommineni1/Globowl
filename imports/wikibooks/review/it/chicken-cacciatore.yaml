id: it-chicken-cacciatore
title: Chicken Cacciatore
summary: Chicken cacciatore is a classic Italian chicken dish. It is reddish, and the tomato adds a distinct flavor.
origin:
  country: IT
course: main
authenticity: unassessed
yield:
  servings: 4
time:
