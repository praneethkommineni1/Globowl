  - {ingredient: black-pepper, unit: tsp, qty: 0.25}
  - {ingredient: garlic-powder, unit: tsp, qty: 0.25}
  - {ingredient: dried-oregano, unit: tsp, qty: 1}
  - {ingredient: basil, unit: tsp, qty: 0.5}
  - {ingredient: dry-white-wine, unit: cup, qty: 0.25, prep: 'chicken broth, or alcohol-free white wine'}
  - {ingredient: sugar, unit: tsp, qty: 1}
steps:
- Place onion and chicken in 3 ½ quart (3.5 L) slow cooker.
- Combine remaining ingredients in a bowl. Stir.
- Pour over chicken and cover the chicken.
- Cook on low for 6–8 hours or on high for 3–4 hours.
- Discard bay leaf and serve.
