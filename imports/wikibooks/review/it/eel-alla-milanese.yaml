id: it-eel-alla-milanese
title: Eel alla Milanese
summary: 'This recipe is from The Cook''s Decameron: A Study In Taste, Containing Over Two Hundred Recipes For Italian Dishes, from a project that puts out-of-copyright texts into the public domain. This is from a very old source, and it reflects the cooking at the turn of the last century.'
