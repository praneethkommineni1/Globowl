id: it-eggplant-parmesan-melanzane-alla-parmigiana
title: Eggplant Parmesan (Melanzane alla Parmigiana)
summary: Melanzane alla parmigiana is a typical Italian dish, existing in different forms in most parts of Italy. Northerners claim it as their own because of the name.
origin:
  country: IT
course: main
authenticity: unassessed
yield:
  servings: 1
