id: it-focaccia
title: Focaccia
summary: 'Focaccia is a type of a somewhat flat yeast bread from Italy. The basic bread is often topped with any of the following: herbs, olive oil, cheese, meats, and vegetables, and can be seen as a precursor to pizza. Focaccia is commonly used for sandwiches.'
