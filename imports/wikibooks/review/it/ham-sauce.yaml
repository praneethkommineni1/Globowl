id: it-ham-sauce
title: Ham Sauce
alternate_names:
- Modern
summary: Ham sauce (in Italian, Salsa di Prosciutto) is a relatively quick and simple sauce used to coat pasta or served over rice. It should not be confused for a glaze for baked ham—rather, it is a sauce on its own that incorporates ham.
origin:
  country: IT
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: ham, unit: g, qty: [85, 113], prep: cut into strips}
  - {ingredient: tomato, unit: tsp, qty: 1}
  - {ingredient: butter, unit: g, qty: 28}
  - {ingredient: chicken-stock, unit: cup, qty: 2}
steps:
- Melt butter in small saucepan, and gently sauté the strips of meat.
- Stir in tomato purée.
- Add stock and simmer for about 5 minutes.
- Serve over rice or toss with pasta.
