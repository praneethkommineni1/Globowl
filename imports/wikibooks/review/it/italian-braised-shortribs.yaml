id: it-italian-braised-shortribs
title: Italian Braised Shortribs
summary: 'Short-ribs cooked in red wine with classic Italian herbs makes them flavorful, moist, and fork tender. Also see: Braised Shortribs.'
origin:
  country: IT
course: main
authenticity: unassessed
