id: it-latte-di-suocera
title: Latte di Suocera
alternate_names:
- Lemon Cream Liqueur
summary: Latte di suocera, translated as mother-in-law's milk, is an Italian alcoholic beverage.
origin:
  country: IT
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: sugar, unit: g, qty: 510}
  - {ingredient: milk, qty: 1}
  - {ingredient: lemon}
  - {ingredient: vanilla-extract, qty: 0.5, prep: split lengthwise}
steps:
- Combine all the ingredients in a wide-mouthed jar, and screw the lid on tightly.
- Shake well, and place the jar in a cool, dark place.
- Shake once a day for 8 days.
- Filter the liquid and bottle it.
- Stopper the bottle, put it in a cool dark place, and let it rest for a month before serving.
