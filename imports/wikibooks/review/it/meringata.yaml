id: it-meringata
title: Meringata
alternate_names:
- Cream-filled Meringue Gateaux
summary: Meringata (literally "meringued") refers to any type of cake or dessert with a meringue topping or meringue mixed into it such as meringata di limone (lemon meringue pie) or meringata di panna (meringue cream gateaux, pie, or other dessert).
