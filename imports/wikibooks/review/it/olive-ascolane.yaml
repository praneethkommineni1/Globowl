id: it-olive-ascolane
title: Olive Ascolane
alternate_names:
- Stuffed Fried Olives
summary: Olive ascolane is an Italian starter from Ascoli Piceno made of fried green olives, stuffed with minced meat (beef, pork and chicken liver) and spices. This recipe was contributed to ItaliansRUs.com by Phil and Jackie Cicconi.
origin:
  country: IT
course: starter
authenticity: unassessed
