id: it-ossobuco-alla-milanese
title: Ossobuco Alla Milanese
summary: Ossobuco, when loosely translated from Italian, means hollowed bone; a reference to the large piece of marrow in the center of the veal shank bone. It's a Milanese speciality of veal shanks cooked in meat broth and flavored with white wine.
