id: it-pasta-marinata
title: Pasta Marinata
summary: Pasta marinata (Italian for "marinaded dough") is a batter used when frying food. It is good for battering meat, fish, vegetables, or sweets which are to be fried in the Italian manner.
origin:
  country: IT
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: semolina, unit: g, qty: 57}
  - {ingredient: egg, qty: 2, prep: separated}
  - {ingredient: salt, note: to taste}
  - {ingredient: butter, unit: g, qty: 57}
  - {ingredient: water}
steps:
- Mix the semolina flour, egg yolks, a little salt, and melted butter.
- Add the water so as to form a liquid substance.
- Whip the egg whites to soft peaks, and fold into the batter.
tips:
- If for meat or vegetables add a few drops of vinegar or a little lemon juice.
