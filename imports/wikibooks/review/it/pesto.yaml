id: it-pesto
title: Pesto
summary: Pesto is a sauce which is added mainly, but by no means exclusively to pasta. Pesto is purely the Italian version of this delicious sauce, with other names for the same (or similar) sauce from other countries.
origin:
  country: IT
course: condiment
authenticity: unassessed
