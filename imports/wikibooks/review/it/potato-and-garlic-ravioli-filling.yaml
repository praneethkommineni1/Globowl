ingredient_groups:
- items:
  - {ingredient: potato, qty: 3, note: large}
  - {ingredient: olive-oil, unit: tbsp, qty: 4}
  - {ingredient: garlic, unit: clove, qty: 6, prep: grated with a micro plane or finely chopped}
  - {ingredient: chives, unit: tbsp, qty: 1, prep: finely sliced}
  - {ingredient: lemon-juice, unit: tbsp, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: black-pepper, unit: tsp, qty: 0.5}
steps:
- Boil the potatoes in their skins until tender when pierced with a fork.
- Peel them as soon as they are cool enough to handle and mash in a bowl.
- Sauté the garlic in the oil for 1 minute.
- Add the potatoes and mix well.
- Add the chives, lemon juice and seasoning and mix well.
- Cover and allow to cool while you prepare the pasta dough.
