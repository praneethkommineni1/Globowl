techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: cup, qty: [0.25, 0.5]}
  - {ingredient: garlic, qty: 6, prep: minced}
  - {ingredient: tomato, unit: can, qty: 1}
  - {ingredient: olives, unit: cup, qty: 0.5}
  - {ingredient: capers, unit: tbsp, qty: 2, prep: rinsed}
  - {ingredient: chili-flakes, unit: tsp, qty: 1}
  - {ingredient: dried-oregano, unit: tsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 0.125}
  - {ingredient: parsley, unit: tbsp, qty: 2}
steps:
- Heat oil in a large skillet.
- Add garlic and sauté over medium heat until garlic starts to brown lightly.
- Add oregano, pepper, olives, capers, and tomatoes. Simmer for about 15 minutes.
- Add parsley and cook for another 2 minutes.
- Add salt to taste.
- Pour over 1 pound (450 g) of cooked pasta, and serve.
