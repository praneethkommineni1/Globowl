id: it-rice-and-peas
title: Rice and Peas
alternate_names:
- Risi e Bisi
summary: Risi e bisi (or rixi e bixi) is a Northern Italian dish, a signature meal of the city of Venezia (Venice) in particular, in the Veneto region. Its name literally translates to "rice and peas".
origin:
  country: IT
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
