ingredient_groups:
- items:
  - {ingredient: long-grain-rice}
  - {ingredient: green-peas}
steps:
- Cook the rice per the cooking instructions on the packet.
- Boil the peas with their pods. Mash them.
- Add the mashed peas to the rice.
tips:
- Bacon can be added to make it even more delicious.
