id: it-seafood-risotto
title: Seafood Risotto
summary: Risotto is an Italian rice dish, most popular in the north of Italy. Historically, risotto is the name given to all recipes that use rice as the main component and are served as first dish in a traditional Italian lunch or dinner as usually pasta also is.
