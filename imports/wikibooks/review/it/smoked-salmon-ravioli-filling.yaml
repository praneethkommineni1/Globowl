  - {ingredient: parmesan, unit: cup, qty: 0.5}
steps:
- Mix the salmon, chives, lemon zest and seasonings in a bowl until salmon is well coated.
- Mix the ricotta or cottage cheese, egg, and Parmesan cheese.
- Add to the salmon and mix until well blended but not homogeneous.
- Cover and refrigerate until the dough is ready.
tips:
- Ravioli with this filling are excellent served with a lemon cream sauce.
