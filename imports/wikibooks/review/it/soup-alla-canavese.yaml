  - {ingredient: onion, qty: 0.5, prep: chopped}
  - {ingredient: carrot, qty: 0.5, prep: chopped}
  - {ingredient: celery, unit: stalk, qty: 0.5, prep: chopped}
  - {ingredient: bacon, prep: chopped}
