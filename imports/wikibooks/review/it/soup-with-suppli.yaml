id: it-soup-with-suppli
title: Soup with Supplì
summary: Soup with supplì is not traditional in Italy, where the preparation stops at the cooking of the supplì (risotto balls), which are a little bigger than eggs.
origin:
  country: IT
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: egg, prep: beaten}
  - {ingredient: breadcrumbs}
  - {ingredient: chicken-stock}
steps:
- Shape the leftover risotto into little balls the size of nuts.
- Dip the balls into beaten egg, then roll them in bread crumbs.
- Fry the breaded risotto balls in butter, then drain them from the grease.
- Serve the risotto balls in hot broth.
