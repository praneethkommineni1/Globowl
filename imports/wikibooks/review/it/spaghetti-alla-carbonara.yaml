id: it-spaghetti-alla-carbonara
title: Spaghetti alla Carbonara
summary: Spaghetti alla carbonara (literally "charcoal burners' spaghetti" in Italian) is an Italian pasta dish made with eggs, pecorino romano, guanciale and black pepper. It was created in the middle of the 20th century.
