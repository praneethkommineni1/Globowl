id: it-spaghetti-sauce
title: Spaghetti Sauce
summary: This is a simple spaghetti sauce that works well for everyday meals, even with picky eaters. It is best served hot at the table, to be poured over lightly-cooked pasta. Shredded mozzarella cheese may be added on top.
origin:
  country: IT
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: tomato-paste, unit: g, qty: 822}
  - {ingredient: dried-oregano, unit: tsp, qty: 1}
  - {ingredient: basil, unit: tsp, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: mushroom, optional: true}
  - {ingredient: beef}
steps:
- For more efficient use of the herbs, you should grind them well with the salt. The salt helps to grind the herbs. If you skip this step, increase the amount of herbs. Also double the herbs if you prefer.
- Mix everything in a pot.
- Bring to a boil while stirring to prevent the sauce from burning to the bottom of the pan.
- Immediately remove from the heat and serve. Hot tomato products lose tomato flavor, so don't delay.
