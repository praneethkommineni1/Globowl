id: it-spaghetti-with-bolognese-meat-sauce
title: Spaghetti with Bolognese Meat Sauce
summary: This northern Italian meat sauce, or Ragu Bolognese, is wonderful on pasta with freshly grated Parmesan cheese, or as filling for lasagne.
