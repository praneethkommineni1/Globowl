  total_min: 1
difficulty: 3
ingredient_groups:
- name: Dough
  items:
  - {ingredient: egg, qty: 6}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 6}
  - {ingredient: baking-powder, unit: tsp, qty: 3}
  - {ingredient: cream-of-tartar, unit: tsp, qty: 0.5}
  - {ingredient: sugar, unit: cup, qty: 1.5}
  - {ingredient: sherry, unit: cup, qty: 0.5}
  - {ingredient: all-purpose-flour}
  - {ingredient: shortening}
- name: Glaze
  items:
  - {ingredient: sugar, unit: cup, qty: 1.5}
  - {ingredient: honey, unit: cup, qty: 2}
  - {ingredient: orange, unit: tbsp, qty: 1}
steps:
- Combine eggs, oil, baking powder, cream of tartar, sugar, and sherry. Mix in enough flour to make a dough. The dough should be somewhat sticky but still workable.
- Shape dough into small balls, about ½ inch in diameter.
- Heat the shortening or oil to 350–375°F. Deep fry the dough balls until golden brown and cooked through.
- Mix all the glaze ingredients over low heat until sugar is dissolved. Dip each fritter into the glaze, and remove.
