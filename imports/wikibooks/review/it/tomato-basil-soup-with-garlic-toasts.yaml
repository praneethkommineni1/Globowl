id: it-tomato-basil-soup-with-garlic-toasts
title: Tomato Basil Soup with Garlic Toasts
summary: This soup is comfort food at its best. You know, get all cozy in the sofa, turn on your favorite flick, that kind of thing.
origin:
  country: IT
course: soup
authenticity: unassessed
