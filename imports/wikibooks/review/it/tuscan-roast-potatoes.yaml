id: it-tuscan-roast-potatoes
title: Tuscan Roast Potatoes
summary: This is great served with grilled steak, roast chicken, or vegetable sauté.
origin:
  country: IT
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: potato, unit: g, qty: 454, prep: cut into 2-inch cubes}
  - {ingredient: salt, unit: tbsp, qty: 1}
  - {ingredient: black-pepper, unit: tbsp, qty: 1}
  - {ingredient: olive-oil, unit: cup, qty: 0.5}
  - {ingredient: parsley, unit: tsp, qty: 1.5, prep: 'rosemary, thyme, basil and oregano'}
steps:
- Heat a large pot of water to a boil. Add potatoes and cook for 10 minutes. Shock in a bowl of ice water.
- Drain and refrigerate for 1 hour.
- Combine remaining ingredients. Add potatoes and toss to coat.
- Spread out in one even layer on your largest baking pan. Roast at 450°F (230°C) for 20 minutes, stirring halfway.
- Serve warm.
