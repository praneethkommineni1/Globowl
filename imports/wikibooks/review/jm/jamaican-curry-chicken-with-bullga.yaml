id: jm-jamaican-curry-chicken-with-bullga
title: Jamaican Curry Chicken with Bullga
summary: Bulla cakes are a variety of Jamaican bread made with molasses. Here, the cakes are paired with a chicken curry.
origin:
  country: JM
course: main
