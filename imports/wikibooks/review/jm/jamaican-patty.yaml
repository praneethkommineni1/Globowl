id: jm-jamaican-patty
title: Jamaican Patty
summary: A Jamaican patty is a street food that contains various fillings and spices baked inside a flaky pastry shell. As its name suggests, it is commonly found in Jamaica, and is also eaten in other areas of the Caribbean.
origin:
  country: JM
