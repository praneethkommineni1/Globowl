steps:
- Grind together scallion and Island Spice Scotch Bonnet Pepper Soya sauce. Add to ground beef along with salt and thyme.
- Cook beef.
- While beef is cooking, pour cold water over bread in a saucepan to cover. Soak for a few minutes, then squeeze dry, saving the water.
- Pass bread through a mincing mill, and return the ground bread to the water with thyme and cook until bread is dry. Combine meat and cooked bread.
- Add paprika and cook for 20 minutes.
- Remove from heat.
- Allow to cool.
- Sift flour, turmeric, curry powder, salt and knead in lard.
- Bind with water to form a firm dough and knead for 2 minutes.
- Roll pastry ⅛ inch thick.
- Cut out pastry rounds 6 inches in diameter.
- Divide beef filling between patties, and brush edges with water.
- Fold dough over filling, and seal. Brush with milk.
- Bake on top shelf of oven for about 25 minutes at 450°F until golden brown
tips:
- For extra crust flakiness, roll out dough, brush with lard, fold over and roll again. Do this about 3 times.
