id: jp-agedashi-tofu
title: Agedashi Tofu
summary: Agedashi tofu (or agedashi dofu) &#25562;&#12370;&#20986;&#12375;&#35910;&#33104; is a simple Japanese way to serve hot tofu. Silken (kinugoshi) firm tofu, cut into cubes, is lightly dusted with potato starch or cornstarch and then deep fried until golden brown.
