id: jp-carrots-cooked-kinpira-style
title: Carrots Cooked Kinpira Style
summary: Kinpira is a Japanese cooking term that roughly translates to sauté and simmer.
origin:
  country: JP
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: carrot, unit: g, qty: 250, prep: julienned}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1, prep: preferably sesame oil}
  - {ingredient: water}
  - {ingredient: soy-sauce, note: to taste}
steps:
- Cut the carrots into thin matchstick pieces (sen-giri, or julienned)
- Pour a small amount of oil into a saucepan and sauté the carrot pieces briefly
- Add just enough water to half-cover the carrot pieces
- Place the lid on the pot and let the carrots simmer briefly on medium-low heat
- Add a little tamari or shoyu to enhance flavour. Serve.
