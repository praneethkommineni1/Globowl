id: jp-daigakuimo
title: Daigakuimo
alternate_names:
- Japanese Candied Sweet Potato
summary: 'Daigakuimo (Japanese: 大学芋) is a dish of Japanese candied sweet potato.'
origin:
  country: JP
course: side
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: sweet-potato, unit: g, qty: 454}
  - {ingredient: sugar, unit: cup, qty: 0.333}
  - {ingredient: soy-sauce, unit: tsp, qty: 1}
  - {ingredient: water, unit: tbsp, qty: 2}
  - {ingredient: sesame-seeds, unit: tsp, qty: 1}
  - {ingredient: vegetable-oil}
steps:
- Cut sweet potatoes into bite-sized pieces.
- Heat the oil and fry the sweet potatoes at 350°F (175°C) until brown.
- Mix water, sugar, and soy sauce in a saucepan. Put the pan on low heat.
- When the liquid turns sticky, remove from the heat and add fried sweet potatoes. Quickly mix the potatoes with the sticky sugar.
- Sprinkle sesame seeds over the coated sweet potatoes.
