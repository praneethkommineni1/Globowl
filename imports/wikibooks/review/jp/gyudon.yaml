id: jp-gyudon
title: Gyudon
alternate_names:
- Japanese Beef and Rice Bowl
summary: Gyudon, often literally translated as 'beef bowl', is a Japanese dish consisting of rice topped with beef and onion simmered in a mildly sweet sauce flavored with dashi, soy sauce, and mirin. It also often includes shirataki noodles.
