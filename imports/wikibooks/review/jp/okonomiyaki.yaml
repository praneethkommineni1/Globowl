title: Okonomiyaki
alternate_names:
- Japanese Savory Pancake
summary: Okonomiyaki is a popular savory pancake dish in Japan. It consists of a batter made of flour, eggs, cabbage and green onions and other ingredients of your choice. The name means "as you like it" or "what you want" in Japanese.
