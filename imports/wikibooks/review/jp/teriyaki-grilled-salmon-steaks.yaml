ingredient_groups:
- items:
  - {ingredient: salmon, qty: 5}
  - {ingredient: black-pepper, unit: tbsp, qty: 2}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: soy-sauce, unit: tbsp, qty: 2}
  - {ingredient: water, unit: cup, qty: 0.25}
  - {ingredient: honey, unit: tbsp, qty: 1}
  - {ingredient: ginger, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: tbsp, qty: 2}
steps:
- Season salmon with pepper.
- Combine remaining ingredients to make teriyaki marinade.
- Place on hot grill, and cook for 3–4 minutes on each side until flaky. Glaze with teriyaki marinade for the last 2 minutes.
- Serve and enjoy.
tips:
- Garnish with fresh chopped cilantro, black/white sesame seeds, and/or chopped green onions.
- For added heat, add paprika, cayenne, or red pepper flakes to marinade.
- You can substitute olive oil for the canola oil based on preference.
