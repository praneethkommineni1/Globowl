id: jp-tonkotsu-ramen
title: Tonkotsu Ramen
summary: Tonkotsu ramen is a dish of ramen noodles served in rich and fatty pork broth usually garnished with a variation of toppings (most of the time pork cutlets, green onions, and hard-boiled eggs split in two). There are many variations to this recipe.
