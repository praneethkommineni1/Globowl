id: jp-ume-shu
title: Ume-shu
alternate_names:
- Japanese Plum Juice
summary: Ume juice is extracted by preserving the fruits in sugar. It tastes sweet, smooth, and acidic, and is a refreshing drink, often enjoyed in the summer. The taste and aroma of ume-shu can appeal to even those people who normally dislike the taste of alcohol.
origin:
  country: JP
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- A container (preferably a sealable glassware)
ingredient_groups:
- items:
  - {ingredient: honey, note: to taste}
steps:
- Wash plums and wipe dry.
- Cram plums tightly into container with rock sugar. Add liquor if using.
- Pour honey into container on top of ume.
- Seal container, and leave in a cool, dark place until the plums are shriveled and leathery.
- Remove fruit from container.
- To drink, dilute the plum liquid with two times as much water.
tips:
- Keep in a cool place during summer.
