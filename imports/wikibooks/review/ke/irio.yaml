id: ke-irio
title: Irio
alternate_names:
- Kenyan Mashed Potatoes with Veggies
summary: Irio is a Kenyan staple food of peas, corn, and potatoes. It’s mostly found among East African nations.
origin:
  country: KE
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
equipment:
- Stovetop
- Pot
- Knife
- Masher and/or wooden paddle
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: potato, prep: quartered}
  - {ingredient: green-peas}
  - {ingredient: corn-kernels}
  - {ingredient: water}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Combine the potatoes, peas, and corn in a pot. Add enough water to cover the potatoes but not completely drown them.
- Simmer, covered, for about 15–20 minutes until fork-tender but not mushy. The water should be nearly empty by the time the potatoes are fork-tender, but if there is still a significant amount, it is advisable to drain it and leave only a small amount left so that the potatoes will be simple to mash.
- Mash everything together, and season with salt and black pepper to taste.
- Serve.
