id: ke-scribbled-eggs
title: Scribbled Eggs
summary: This recipe was found in Githima, a small town outside the city of Nakuru in Kenya. If you ask for fried eggs in the West of Kenya, you'll probably have the eggs scribbled.
origin:
  country: KE
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: vegetable-oil}
  - {ingredient: tomato, prep: chopped, optional: true}
  - {ingredient: scallion, prep: sliced, optional: true}
  - {ingredient: egg, qty: 2}
steps:
- Heat a small amount of oil in a skillet over medium heat.
- If using tomatoes, add them to the pan. Fry for a minute.
- If using scallion, add to tomatoes. Cook for another minute.
- Beat the eggs well, and pour into the pan.
- Start stirring the eggs—Kenyans call this scribbling. Cook like this until the egg is done.
