id: kh-egg-soda
title: Egg Soda
summary: 'Egg soda (Vietnamese: soda sữa hột gà, Khmer: សូដាក្រឡុកពងមាន់, lsau da kralok pongmean) is a sweet drink made from egg yolk and carbonated water, popular in Vietnam and Cambodia.'
origin:
  country: KH
  also_claimed_by:
  - VN
course: drink
authenticity: unassessed
yield:
  servings: 1
  amount: 1–2 servings
time:
  total_min: 2
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: condensed-milk, unit: tsp, qty: 2}
  - {ingredient: egg-yolk, qty: 1}
steps:
- Fill a glass with ice.
- In another glass, combine the condensed milk and egg yolk.
- Add carbonated water to the desired level, and mix until well-blended.
- Pour liquid over ice.
- Enjoy.
