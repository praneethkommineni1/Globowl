id: kr-bibimbap
title: Bibimbap
summary: Bibimbap (also called Bibimba or Bibimbop) is a typical Korean meal that literally means "mixed rice".
origin:
  country: KR
course: main
authenticity: unassessed
yield:
  servings: 3
