ingredient_groups:
- items:
  - {ingredient: beef, unit: g, qty: 454, prep: sliced as thin as possible}
  - {ingredient: scallion, qty: 3, prep: sliced on the bias}
  - {ingredient: mushroom, qty: 4, prep: sliced, optional: true}
