id: kr-cabbage-kimchi
title: Cabbage Kimchi
summary: Kimchi (김치), also spelled kimchee or gimchi, is a Korean dish of pickled vegetables, usually napa cabbage or Korean radish and is commonly served as a side dish. It is usually fermented in a brine of anchovy sauce, ginger, garlic, green onion, and chilli pepper.
