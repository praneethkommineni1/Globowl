id: kr-quail-egg-and-chili-jangjorim
title: Quail Egg and Chili Jangjorim
summary: Jangjorim is Korean dish consisting mainly of boiled or braised beef and soy sauce. This version uses quail eggs.
origin:
  country: KR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: egg}
  - {ingredient: water, unit: cup, qty: 3}
  - {ingredient: soy-sauce, unit: cup, qty: 1}
  - {ingredient: sugar, unit: cup, qty: 0.5}
  - {ingredient: garlic, unit: clove, qty: 6}
  - {ingredient: ginger, unit: slice, qty: 3}
  - {ingredient: red-chili, qty: 3}
steps:
- Bring a pot of water to a boil. Add the quail eggs, and boil for about 10 minutes.
- Carefully drain the eggs, and cool in cold water.
- Peel the cooled eggs.
- Combine the water, soy sauce, sugar, wine, garlic, and ginger in a saucepan. Bring to a boil.
- Add the eggs to the pot, and simmer until the liquid is reduced by half.
- Add the peppers, and cook just for 1–2 minutes.
tips:
- Adding 1 tablespoon each of salt and vinegar to the boiling water makes the eggs easier to peel.
- Don't overcook after adding the chili pepper—it will get too soft.
