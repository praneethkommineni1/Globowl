id: lb-garlic-lemon-chicken
title: Garlic Lemon Chicken
summary: This is a recipe for chicken flavored with garlic and lemon, served with a garlic sauce called toom.
origin:
  country: LB
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
