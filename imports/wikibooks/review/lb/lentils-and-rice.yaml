id: lb-lentils-and-rice
title: Lentils and Rice
alternate_names:
- Mjeddrah
summary: Mjeddrah is a stout lentil and rice stew, a Lebanese staple.
origin:
  country: LB
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
