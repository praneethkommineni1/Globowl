id: lr-dumboy-and-pepper-soup
title: Dumboy and Pepper Soup
summary: Dumboy is the national dish of Liberia. It is similar in appearance to pounded yam and fufu. It requires a lot of time and patience to prepare. It is usually enjoyed with pepper soup but can also be combined with any complimentary soup of your choice or even broth like soup.
