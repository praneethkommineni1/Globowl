  - {ingredient: onion, qty: 1, prep: neatly chopped, note: large}
  - {ingredient: bay-leaf, qty: 3}
  - {ingredient: scotch-bonnet, qty: 2, prep: neatly chopped}
  - {ingredient: salt, unit: tbsp, qty: 3, note: to taste}
  - {ingredient: bouillon-cube, qty: 3, prep: crushed}
  - {ingredient: shrimp, unit: g, qty: 1361}
