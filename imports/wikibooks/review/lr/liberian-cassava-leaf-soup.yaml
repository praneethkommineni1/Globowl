title: Liberian Cassava Leaf Soup
summary: Liberian cassava leaf soup is a delicious and hearty dish that is widely enjoyed in Liberia. Made with cassava leaves, meat, and an assortment of vegetables, this soup is a flavorful and nutritious meal that is perfect for gatherings and special occasions.
