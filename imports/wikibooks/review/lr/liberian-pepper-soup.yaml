id: lr-liberian-pepper-soup
title: Liberian Pepper Soup
summary: Liberian pepper soup is a flavorful and spicy soup from Liberia. It is a popular dish that is often enjoyed as a warming and comforting meal, especially during cold weather or when feeling under the weather.
