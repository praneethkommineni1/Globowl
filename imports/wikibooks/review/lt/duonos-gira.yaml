id: lt-duonos-gira
title: Duonos Gira
alternate_names:
- Lithuanian Rye Drink
summary: Duonos gira (Lithuanain kvass) is a low- to no-alcohol drink made from fermented dark rye bread. It is often served in Lithuania as a summertime drink but is also good served hot in winter.
origin:
  country: LT
course: drink
authenticity: unassessed
yield:
  servings: 1
