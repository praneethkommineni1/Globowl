  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, qty: 5}
  - {ingredient: white-bread, unit: g, qty: 454}
  - {ingredient: sugar, unit: g, qty: 454, optional: true}
  - {ingredient: yeast, unit: tsp, qty: 4}
  - {ingredient: raisins, unit: cup, qty: 1}
steps:
- Boil water and pour over the cubed bread. Let soak for 24 hours.
- Strain the liquid off, and reserve it. Mix yeast and sugar into this liquid. Keep in a warm place for 48 hours.
- Transfer liquid to bottles. Add raisins or other dried fruit and close off bottles.
- The duonos gira is now ready to drink. Store bottles in cool place for up to 2 months.
