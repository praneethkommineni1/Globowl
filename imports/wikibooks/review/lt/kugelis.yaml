ingredient_groups:
- items:
  - {ingredient: potato, unit: g, qty: 2268, prep: peeled and grated}
  - {ingredient: onion, qty: 2, prep: grated, note: medium}
  - {ingredient: bacon, unit: g, qty: 454, prep: fried and crumbled}
  - {ingredient: butter, qty: 1, prep: melted}
  - {ingredient: egg, qty: 6}
  - {ingredient: evaporated-milk, qty: 1, note: large}
  - {ingredient: salt, unit: tsp, qty: 4}
  - {ingredient: black-pepper, note: to taste}
steps:
- Combine the grated potatoes and onions.
- Fry and crumble bacon. Add to the potato mixture along with ¼ cup bacon fat. Mix well.
- Beat the eggs, and stir in the evaporated milk, melted butter, salt, and pepper.
- Mix the egg mixture into the potato mixture.
- Pour into a well-greased 9x13-inch cake pan—it should just barely fit.
- Bake at 350°F (175°C) for 90 minutes.
- Slice into squares, and top with sour cream or applesauce.
tips:
- Leftovers are best reheated sliced thin and sautéed in melted butter. Kugelis also reheats well in the microwave and freezes well.
- Do not drain the liquid from the potatoes and onions.
