id: lt-kugelis
title: Kugelis
alternate_names:
- Lithuanian Baked Potato Pudding
summary: Kugelis, also called bulvių plokštainis (literally "flat potato dish") or banda, is a Lithuanian baked potato pudding. Its main ingredients are potatoes, bacon, milk, onions, and eggs. It may be spiced with salt, black pepper, bay leaves, and/or marjoram.
origin:
  country: LT
