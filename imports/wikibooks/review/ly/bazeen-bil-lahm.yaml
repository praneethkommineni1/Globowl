id: ly-bazeen-bil-lahm
title: Bazeen bil Lahm
alternate_names:
- Libyan Meat Bazeen
summary: Bazeen bil Lahm is a traditional Libyan dish that is hearty, flavorful, and satisfying. It is a combination of tender chunks of meat, typically beef or lamb, cooked in a rich and aromatic sauce, and served with a special dough-like bread called bazeen.
