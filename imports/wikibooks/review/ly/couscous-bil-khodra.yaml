title: Couscous bil Khodra
alternate_names:
- Libyan Vegetable Couscous
summary: Couscous bil khodra, also known as Libyan vegetable couscous, is a nutritious and flavorful dish that is popular in Libyan cuisine. This dish features fluffy couscous cooked with a medley of vegetables and aromatic spices.
