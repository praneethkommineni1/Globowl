id: ly-dajaj-mashwi
title: Dajaj Mashwi
alternate_names:
- Libyan Grilled Chicken
summary: Dajaj mashwi is a mouthwatering Libyan dish featuring grilled chicken that is marinated in a flavorful blend of herbs and spices. This dish is popular in Libyan cuisine and is often enjoyed during festive occasions and gatherings.
origin:
  country: LY
course: main
