- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: clove, qty: [4, 5], prep: minced}
  - {ingredient: red-chili, qty: [2, 3], prep: finely chopped}
  - {ingredient: tomato, qty: [4, 5], prep: finely chopped}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: cayenne, unit: tsp, qty: 0.5}
  - {ingredient: ground-coriander, unit: tsp, qty: 0.5}
  - {ingredient: salt, note: to taste}
  - {ingredient: tomato, unit: tbsp, qty: 1}
  - {ingredient: lemon-juice, unit: tbsp, qty: 1}
