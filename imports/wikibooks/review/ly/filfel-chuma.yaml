id: ly-filfel-chuma
title: Filfel Chuma
alternate_names:
- Libyan Spicy Tomato Sauce
summary: Filfel chuma is a popular spicy tomato sauce in Libyan cuisine. It is known for its vibrant red color, bold flavors, and fiery kick. This versatile sauce is made with a combination of tomatoes, garlic, chili peppers, and various spices.
origin:
  country: LY
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Saucepan
- Wooden spoon or spatula
techniques:
- sauteing
- simmering
