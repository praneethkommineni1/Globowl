title: Harissa bil Djaj
alternate_names:
- Libyan Chicken Harissa
summary: Harissa bil djaj is a flavorful and aromatic Libyan chicken dish. It features tender chicken pieces simmered in a rich and spicy tomato sauce, infused with a blend of aromatic spices.
