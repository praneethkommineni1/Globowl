id: ly-mafrum-bil-lahm
title: Mafrum bil Lahm
alternate_names:
- Libyan Baked Meat and Potatoes
summary: Mafrum bil Lahm is a traditional Libyan dish that features layers of seasoned meat and potatoes, topped with a flavorful tomato sauce. It is a delicious and satisfying meal that is often enjoyed during festive occasions and gatherings.
