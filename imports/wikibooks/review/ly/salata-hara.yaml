id: ly-salata-hara
title: Salata Hara
alternate_names:
- Libyan Spicy Salad
summary: Salata hara is a vibrant and spicy salad commonly enjoyed in Libyan cuisine. It is known for its bold flavors and fiery kick, making it a perfect accompaniment to grilled meats or as a refreshing side dish.
origin:
  country: LY
course: salad
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Mixing bowl
- Spoon or spatula
- Whisk
- Plastic wrap
