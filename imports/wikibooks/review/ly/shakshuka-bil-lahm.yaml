id: ly-shakshuka-bil-lahm
title: Shakshuka bil Lahm
alternate_names:
- Libyan Meat Shakshuka
summary: Shakshuka bil Lahm, also known as Libyan Meat Shakshuka, is a delicious and hearty dish that is popular in Libyan cuisine. This dish features a flavorful tomato-based sauce with tender chunks of meat, traditionally beef or lamb, and poached eggs.
origin:
  country: LY
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Large skillet with a lid
- Wooden spoon or spatula
- Knife
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: garlic, unit: clove, qty: 2, prep: minced}
  - {ingredient: beef, unit: g, qty: 500, prep: cut into small cubes}
  - {ingredient: red-bell-pepper, qty: 2, prep: diced}
  - {ingredient: tomato, qty: 4, prep: diced}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: cayenne, unit: tsp, qty: 0.5}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
