id: ly-sharmoula-bil-lahm
title: Sharmoula bil Lahm
alternate_names:
- Libyan Marinated Meat Sharmoula
summary: Sharmoula bil lahm is a flavorful Libyan dish featuring marinated meat cooked to perfection. The marinade, known as sharmoula, is made with a combination of aromatic herbs and spices that infuse the meat with a delicious and fragrant taste.
origin:
  country: LY
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Mixing bowl
- Chef's knife
- Cutting board
- Skewers
- Grill or grill pan
- Basting brush
- Plastic wrap
techniques:
- marinating
