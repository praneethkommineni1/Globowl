  - {ingredient: ground-cumin, unit: tsp, qty: 2}
  - {ingredient: paprika, unit: tsp, qty: 2}
  - {ingredient: ground-coriander, unit: tsp, qty: 1}
  - {ingredient: cayenne, unit: tsp, qty: 0.5}
  - {ingredient: salt, unit: tsp, qty: 0.5}
