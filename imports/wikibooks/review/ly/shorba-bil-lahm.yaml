id: ly-shorba-bil-lahm
title: Shorba bil Lahm
alternate_names:
- Libyan Meat Soup
summary: Shorba bil lahm is a comforting and hearty meat soup popular in Libyan cuisine. It is flavorful and broth-based, packed with tender pieces of meat, vegetables, and aromatic spices. It is often enjoyed as a satisfying meal on its own or as a starter to a larger feast.
