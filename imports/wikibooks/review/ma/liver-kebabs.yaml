id: ma-liver-kebabs
title: Liver Kebabs
summary: Liver kebabs taste very good and are ideal for feeding young children liver as long as you don't tell them beforehand what it is. Served with fresh bread and Moroccan Salad, the kebabs make a nice meal.
origin:
  country: MA
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- grilling
ingredient_groups:
- items:
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: cilantro, unit: handful, qty: 1, prep: finely chopped}
  - {ingredient: garlic, unit: clove, qty: [2, 3], prep: minced, optional: true}
  - {ingredient: sunflower-oil, unit: tbsp, qty: 1}
steps:
- Cut the liver into small cubes about 1 cm square, and put them in a container.
- Add paprika, some salt and pepper, chopped coriander, minced garlic, and oil to the liver.
- Mix this all together and leave to marinate for 30 minutes or more.
- Slide the meat onto skewers, and grill to preferred level of char.
