id: ma-moroccan-salad
title: Moroccan Salad
summary: This Moroccan salad is something that is easy to throw together, refreshing to eat, and good-looking.
origin:
  country: MA
course: salad
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: tomato, qty: 3, prep: ripe tomatoes}
  - {ingredient: red-bell-pepper, qty: 1}
  - {ingredient: onion, qty: 1}
  - {ingredient: cilantro, unit: handful, qty: 1, prep: finely chopped}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: white-vinegar, unit: tbsp, qty: 2}
steps:
- Cut the tomatoes, pepper and onion into small dice.
- Add the fresh coriander, cumin, salt, pepper, and vinegar.
- Put it all into a container, put the lid on tightly, and give it a good shake to combine everything.
- Let rest for 30 minutes to allow the flavours to mingle before serving.
tips:
- You can peel the tomatoes if you wish.
