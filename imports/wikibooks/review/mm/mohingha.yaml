id: mm-mohingha
title: Mohingha
alternate_names:
- Burmese Fish Noodle Soup
summary: Mohingha is a traditional Burmese dish made of colored soup with rice vermicelli. Here is a modern-day recipe.
origin:
  country: MM
course: soup
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 20
difficulty: 1
