id: mx-adobo-sauce
title: Adobo Sauce
summary: Adobo sauce is a sauce or marinade used in Latin American and Southwestern U.S.-style cooking, made of finely chopped or pureed chiles, garlic, vinegar, and often onions and tomatoes. Food that has been prepared with adobo is sometimes called adobado .
origin:
  country: MX
  also_claimed_by:
  - US
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: chipotle-in-adobo, qty: 12, prep: dried jalapeño peppers}
  - {ingredient: water, unit: cup, qty: 4}
  - {ingredient: onion, unit: cup, qty: 0.5, prep: diced}
  - {ingredient: white-vinegar, unit: cup, qty: 0.333}
  - {ingredient: ketchup, unit: cup, qty: 0.25}
  - {ingredient: garlic, unit: clove, qty: 3, prep: crushed or sliced}
  - {ingredient: ground-cumin, unit: pinch, qty: 1, prep: oregano}
  - {ingredient: salt, note: to taste}
steps:
- Combine all ingredients in a heavy saucepan. Cook over a very low heat for 1–2 hours until the chiles are very soft and the liquid has been reduced to about 1 cup. Alternatively, cook in a slow cooker overnight.
- Beat with a mortar and pestle, or put in blender to puree for a thick sauce.
tips:
- Sauce will keep for several weeks in the fridge in an airtight container. You can also can it in mason jars for longer storage, following proper procedures for sterilizing jars and canning.
