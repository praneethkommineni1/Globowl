id: mx-atropellado-de-coco
title: Atropellado de Coco
alternate_names:
- Coconut and Sweet Potato Dessert
summary: Atropellado de coco is a traditional Yucatecan dessert, containing coconut and sweet potato.
origin:
  country: MX
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: sweet-potato}
  - {ingredient: sugar}
  - {ingredient: ground-cinnamon}
  - {ingredient: water}
  - {ingredient: coconut}
steps:
- Bake or steam sweet potato until soft, then mash it.
- Combine sugar, cinnamon, and water over medium-low heat to make a syrup.
- Combine the sweet potato mash and sugar syrup.
- Mix in ground coconut until it forms a workable dough.
- Form dough into balls or other shapes and serve.
