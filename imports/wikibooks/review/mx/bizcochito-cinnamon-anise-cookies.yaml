id: mx-bizcochito-cinnamon-anise-cookies
title: Bizcochito (Cinnamon Anise Cookies)
summary: A bizcochito or biscochito is a crispy cookie flavored with anise and cinnamon. It was developed by Hispanic residents of New Mexico and southern Colorado who trace their ancestry back to the first Spanish colonists.
origin:
  country: MX
  also_claimed_by:
