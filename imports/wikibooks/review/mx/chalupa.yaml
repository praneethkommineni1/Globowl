id: mx-chalupa
title: Chalupa
summary: A chalupa is a kind of tostada platter in Mexican cuisine. It is a specialty of South-central regions of Mexico, such as the states of Guerrero and Oaxaca.
origin:
  country: MX
  also_claimed_by:
