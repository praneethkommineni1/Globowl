- roasting
ingredient_groups:
- name: Salsa de chile de árbol
  items:
  - {ingredient: tomatillo, unit: cup, qty: 1, prep: dehusked}
  - {ingredient: red-chili, qty: [4, 6], prep: roasted}
  - {ingredient: garlic, unit: clove, qty: 1}
  - {ingredient: water, unit: cup, qty: 0.5}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
- name: Chilaquiles
  items:
