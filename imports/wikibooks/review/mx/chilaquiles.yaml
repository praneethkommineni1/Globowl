id: mx-chilaquiles
title: Chilaquiles
summary: The following recipe is quite common in most of Mexico as a breakfast item, due to the addition of eggs, but is also eaten throughout the day including during dinner time. The additional recipe for a salsa de chile de árbol will be used as the primary sauce.
origin:
  country: MX
course: breakfast
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
