id: mx-guacamole
title: Guacamole
summary: Guacamole is a Mexican paste made from crushed avocado and various seasonings, usually including onions, peppers, garlic and tomatoes. Guacamole is used as a condiment, an ingredient, and as an appetizer when served with tortilla chips.
origin:
  country: MX
