id: mx-homemade-corn-tortillas
title: Homemade Corn Tortillas
summary: Tortillas are a type of flatbread popular in Mexico and Central America, commonly made from wheat flour or masa. This recipe is for the masa (corn) variety; see Flour Tortilla for the wheat flour version.
origin:
  country: MX
  also_claimed_by:
