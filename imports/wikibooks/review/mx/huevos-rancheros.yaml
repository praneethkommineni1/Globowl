id: mx-huevos-rancheros
title: Huevos Rancheros
summary: Huevos Rancheros (Spanish for "eggs ranch-style") is a traditional Mexican country breakfast. From its home in Mexico, the dish has spread throughout the Americas.
origin:
  country: MX
  also_claimed_by:
  - US
