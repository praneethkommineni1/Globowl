id: mx-machacado-con-huevo
title: Machacado con Huevo
alternate_names:
- Eggs with Shredded Beef
summary: Machacado con huevo is a dish which consists of shredded dry beef that is scrambled with eggs. Its name means "shredded with eggs" in Spanish. The shredded dry beef, carne seca, is said to have originated in the town of Ciénega de Flores, about an hour north of Monterrey, Mexico.
origin:
  country: MX
course: breakfast
authenticity: unassessed
yield:
  servings: 10
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: egg, qty: 6, prep: lightly beaten, note: large}
  - {ingredient: beef, unit: cup, qty: 2}
  - {ingredient: refried-beans, unit: can, qty: 1, prep: warmed}
  - {ingredient: cheddar, unit: cup, qty: 2}
steps:
- Heat butter in large skillet over medium-high heat.
- Add eggs; cook, stirring frequently, for 2–3 minutes or until eggs just begin to set.
- Stir in shredded beef filling. Cook, stirring occasionally, for 2 to 3 minutes or until eggs are cooked and beef is heated through.
- Serve eggs with tortillas, beans, cheese, and salsa.
tips:
- Machacado con huevo can be served in a big bowl, and with some soft tortillas at hand can be prepared in your plate, can be served in the table as tacos, or can be eaten without using tortillas at all.
- Queso fundido con chorizo (melted cheese with chorizo) is also something that can be found at the table when eating machacado con huevo. It is usually served at the table in a pan, and added to the taco.
