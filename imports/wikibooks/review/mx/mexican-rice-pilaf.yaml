id: mx-mexican-rice-pilaf
title: Mexican Rice Pilaf
summary: There's a lot of Mexican flavors in this dish, like tequila, Mexican oregano, chile powder, habanero chiles, tomato paste, and rice.
origin:
  country: MX
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
