ingredient_groups:
- items:
  - {ingredient: butter, unit: cup, qty: 1, prep: softened}
  - {ingredient: sugar, unit: cup, qty: 3.5}
  - {ingredient: cocoa-powder, unit: cup, qty: 0.5}
  - {ingredient: vanilla-extract, unit: tsp, qty: 1}
  - {ingredient: coffee, unit: cup, qty: 0.5}
steps:
- Combine butter, confectioner's sugar, cocoa, vanilla, and coffee in a medium-large bowl, mixing slowly until everything is moistened.
- Beat at high speed with an electric mixer until uniform and fluffy.
- If it seems a little too wet to spread, you can beat in up to ½ cup additional confectioner's sugar.
