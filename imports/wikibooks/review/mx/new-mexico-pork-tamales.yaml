id: mx-new-mexico-pork-tamales
title: New Mexico Pork Tamales
summary: New Mexico Pork Tamales are a classic Southwestern United States meal, made from pork and chicken. This version adds cumin, chili powder and garlic powder to outer masa flour of the tamale.
