id: mx-refried-beans
title: Refried Beans
summary: Oddly enough, refried beans (frijoles refritos) are only fried once. The prefix "re" is a Spanish prefix meaning "very" or "well", inappropriately tacked onto a non-Spanish word.
origin:
  country: MX
  also_claimed_by:
