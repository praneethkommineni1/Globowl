id: mx-spicy-mexican-omelet
title: Spicy Mexican Omelet
summary: 'Here''s a tip for making good omelets: Cook the things that you want cooked before you add it into the eggs, and have everything at room temperature.'
origin:
  country: MX
course: breakfast
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 3, prep: uncracked}
  - {ingredient: salt, unit: pinch, qty: [2, 3]}
  - {ingredient: scotch-bonnet, qty: 1, prep: finely minced and seeded if you like}
  - {ingredient: monterey-jack, unit: cup, qty: 1, prep: at room temperature}
  - {ingredient: cilantro, unit: tbsp, qty: 2, prep: finely chopped}
  - {ingredient: butter}
steps:
- Cover whole eggs with warm but not scalding water. Let sit 5 minutes or until room temperature.
- Beat eggs with salt. Set aside.
- Combine chiles, salsa, cilantro, and cheese. Set aside.
- Heat a large nonstick skillet over medium high heat. Quickly swirl with butter and crack in the eggs. Cook until egg is set and well browned on side facing pan.
- Sprinkle salsa mixture evenly on uncooked side of egg. Fold in half and cook raw side until set and well browned.
- Sprinkle with chopped cilantro and serve warm.
