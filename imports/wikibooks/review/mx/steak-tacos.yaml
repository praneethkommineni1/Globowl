id: mx-steak-tacos
title: Steak Tacos
summary: Tacos de bistec is a popular dish in Mexico. This form of the taco can be found in all areas.
origin:
  country: MX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: lard, optional: true}
  - {ingredient: beef}
  - {ingredient: cilantro, prep: finely-chopped}
  - {ingredient: onion, prep: finely-chopped}
  - {ingredient: lime, prep: quartered}
  - {ingredient: tortilla}
steps:
- Put the corn oil in a pan or griddle, and warm it up. Cook the steak in the pan if needed. When the steak is ready, keep it warm.
- Warm or make the tortillas in a pan. You can use the same pan used for the meat.
- Once everything is ready, put the meat down the middle in the tortillas, which typically are used in layers of two to help the taco hold together without breaking (flour tortillas only need one layer).
- Squeeze as much lime juice as desired over the meat. Add cilantro, onions, and salsa verde to taste.
