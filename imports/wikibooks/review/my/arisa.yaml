id: my-arisa
title: Arisa
alternate_names:
- Malaysian Blended Chicken
summary: Arisa is a unique dish only found in state of Johor, Malaysia. It is very rare nowadays, normally only served to royalty and social elites of Johor at formal functions and celebrations. This rarity reflects its passing as an oral tradition between mother to daughter.
origin:
  country: MY
