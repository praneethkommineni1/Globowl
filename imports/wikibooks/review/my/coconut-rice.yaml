id: my-coconut-rice
title: Coconut Rice
alternate_names:
- Nasi Lemak
summary: Coconut Rice.
origin:
  country: MY
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: cup, qty: 6}
  - {ingredient: coconut-milk, unit: cup, qty: 7}
  - {ingredient: salt}
  - {ingredient: pandan-leaf, qty: [1, 2], optional: true}
  - {ingredient: ginger, optional: true}
steps:
- Rinse the rice and set it aside.
- Meanwhile put the coconut milk on the stove, and add the salt.
- Add the rice, pandan leaves, and ginger. Let it simmer until the coconut milk evaporates.
- Cover it with lid and let it sit for about 15 minutes until it is well cooked.
