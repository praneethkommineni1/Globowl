id: my-pork-spare-rib-soup
title: Pork Spare Rib Soup
alternate_names:
- Bah Kut Teh
summary: Bah kut teh (literally, "spare rib tea") is a Hokkien specialty. It is an exotic herbal soup spiced with plenty of aromatic spices including star anise, cinnamon, cloves and lots of garlic. It is often served with Chinese doughnuts and goes well with white rice.
