id: my-smore
title: Smore
alternate_names:
- Eurasian Beef Stew
summary: This is an Eurasian dish, not to be confused with the American dessert made with toasted marshmallows (s'mores).
origin:
  country: MY
course: main
authenticity: unassessed
yield:
  servings: 1
