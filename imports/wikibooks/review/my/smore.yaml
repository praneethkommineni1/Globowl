  - {ingredient: ginger, qty: 1, prep: julienned}
  - {ingredient: cinnamon-stick, qty: 10, prep: rinsed}
  - {ingredient: carrot, unit: g, qty: 100, prep: peeled and sliced diagonally, note: small}
  - {ingredient: potato, qty: 3, prep: peeled and quartered}
