id: ng-aadun
title: Aadun
alternate_names:
- Nigerian Corn Flour with Palm Oil
summary: 'Aadun is a snack common amongst Yoruba-speaking people of Nigeria. There are two types of aadun: one made from pure corn flour and one made from corn flour mixed with palm oil and salt. This recipe is for the latter. The Kogi people add ground beans to modify the taste.'
