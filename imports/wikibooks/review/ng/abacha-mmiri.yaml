id: ng-abacha-mmiri
title: Abacha Mmiri
alternate_names:
- Soaked Cassava Flakes
summary: Abacha mmiri (literally "water cassava flakes"), also known as bobozee, is a Nigerian snack prepared from cassava.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: cassava, qty: 1}
  - {ingredient: salt, unit: tsp, qty: [1, 2], note: to taste}
  - {ingredient: coconut, unit: cup, qty: 0.5}
  - {ingredient: roasted-peanuts, unit: cup, qty: 0.25}
steps:
- Peel the cassava, then cut into slices 1 cm thick. Rinse well.
- Boil the cassava in a large pot of water until cooked through.
- Soak the cooked cassava in fresh water overnight. The next day, drain away any remaining water and rinse the cassava well.
- Season the cassava to taste with the salt.
- Serve the cassava with the coconut, palm kernel, and roasted groundnut.
tips:
- The cassava is rinsed after soaking to remove the sour taste that develops.
