id: ng-abak-atama-soup
title: Abak Atama Soup
summary: Abak Atama Soup is a traditional dish of the Efik people and Ibibio people of Southern Nigeria, especially in Akwa Ibom and Cross River States. It is a rich palm fruit soup made with Atama leaves, which give it a distinct aroma and flavour.
