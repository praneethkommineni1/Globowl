id: ng-abula
title: Abula
alternate_names:
- Nigerian Three Stews
summary: 'Abula (literally "mixture") is a dish common amongst Yoruba people of Nigeria. It is a combination of three different soups/stews: gbegiri, ewedu, and pepper sauce.'
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 2
  amount: 2–3
time:
  total_min: 20
difficulty: 4
