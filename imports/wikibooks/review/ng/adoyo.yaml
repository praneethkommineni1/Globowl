id: ng-adoyo
title: Adoyo
alternate_names:
- Nigerian Ogi Beverage
summary: Adoyo is a popular Nigerian drink that can be found on almost every street just like zobo, kunu, and fura da nono. It is made with boiling water decanted from ogi (pap) and pineapple, lemongrass, Lemon and/or orange. It is a natural drink that does not require any coloring.
origin:
  country: NG
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: pineapple, prep: sliced}
  - {ingredient: lemongrass, prep: rinsed}
  - {ingredient: sugar}
steps:
- Combine ogi water, pineapple, and lemongrass leaves in a pot. Simmer for at least 45 minutes.
- Remove from the heat, and cool completely. Once cool, strain out the solids.
- Place the sugar in a pot. Slowly melt it over medium heat, stirring, and cook until it reaches a light brown caramel.
- Stir some hot water into the caramel to make a sauce—if you use cold water, it will crystallize. Set aside.
- Sweeten the strained liquid with the caramel sauce, and serve.
tips:
- You can substitute honey for the finished caramel syrup.
- If desired, you can omit the sugar and skip the caramelization step.
