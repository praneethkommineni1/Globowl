id: ng-ager-soup
title: Ager Soup
summary: Ager soup is a typical Nigerian draw soup prepared from the pulp obtained from ager tree. It is commonly consumed by the Tiv people.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 2
  amount: 2–3
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: red-palm-oil, unit: tbsp, qty: 2}
  - {ingredient: beef, unit: kg, qty: 0.4, prep: rinsed}
  - {ingredient: stockfish, qty: 1, prep: rinsed}
  - {ingredient: iru, unit: tsp, qty: 2}
  - {ingredient: bouillon-cube, qty: 1}
  - {ingredient: red-bell-pepper, qty: 3, prep: blended}
  - {ingredient: tomato, qty: 5, prep: blended, note: medium}
  - {ingredient: salt, unit: tsp, qty: 1}
steps:
- Scrape off the white flaky skin of the ager stalk. Pound gently for a few minutes to remove the ager pulp.
- Squeeze the pulp in a small amount of water to extract the slippery juice. Sieve this product to separate the juice from the fibres.
- Heat a little water in a pot, and add the ager juice.
- Add the palm oil, blended pepper, blended tomato, beef, and fish. Cook for few minutes, stirring continuously until an elastic consistency is achieved.
- Add nune, maggi cubes, and salt to taste.
- Serve with swallows as desired.
