id: ng-alkubus
title: Alkubus
alternate_names:
- Nigerian Steamed Bread
summary: Alkubus is a steamed wheat bread from northern Nigeria. It originated from Arabs.
origin:
  country: NG
course: bread
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 3
techniques:
- steaming
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 2}
  - {ingredient: yeast, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: baking-powder, unit: tsp, qty: 1}
  - {ingredient: water, unit: cup, qty: 0.5}
  - {ingredient: vegetable-oil, unit: tsp, qty: 2}
steps:
- Sift the flour into a mixing bowl. Mix in the yeast, salt, and baking powder.
- Mix in the water to make a dough, and knead it until cohesive and fully combined.
- Cover the dough and let rise for 1 hour.
- Gently deflate the dough.
- Grease a cooking mold, and transfer the dough to the mold.
- Cover the mold and place it in a steamer setup. Steam until cooked through and a skewer inserted into the center comes out clean.
- Remove from the heat and let cool.
- Unmold the steamed bread and serve.
