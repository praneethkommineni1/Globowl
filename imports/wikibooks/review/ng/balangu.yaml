id: ng-balangu
title: Balangu
alternate_names:
- Nigerian Spiced Ram Meat
summary: Balangu is a meat delicacy commonly consumed in the northern part of Nigeria. It is similar to suya, but balangu is made from ram meat. It is also known as suya plus.
origin:
  country: NG
course: main
