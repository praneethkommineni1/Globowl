id: ng-banga-rice
title: Banga Rice
summary: Banga rice is a rice dish popular in the Delta State of Nigeria. It features oil palm fruit concentrate, and it is both easy and delicious to make.
origin:
  country: NG
course: main
authenticity: unassessed
