id: ng-bean-balls
title: Bean Balls
summary: Akara are a Nigerian snack of fried beans. In Ghana, it is also known as koose or black-eyed pea fritters. Akara can be considered one of the simplest vegetarian or vegan-friendly Nigerian dishes.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 24
  amount: 24 balls
time:
  total_min: 90
difficulty: 2
equipment:
- Mixing bowl
- Sieve
- Blender or food processor
- Knife
- Chopping board
- Whisk
