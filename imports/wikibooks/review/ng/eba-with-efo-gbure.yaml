id: ng-eba-with-efo-gbure
title: Eba with Efo Gbure
alternate_names:
- Cassava Flake Swallow with Waterleaf Soup
summary: Eba with efo gbure is a Nigerian dish that pairs a starchy swallow with a vegetable soup. It is a native meal of the Yoruba people of southwestern Nigeria and other parts of Yorubaland, and it can be served along with a meat or seafood of choice.
