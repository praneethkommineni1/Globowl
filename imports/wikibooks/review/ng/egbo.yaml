id: ng-egbo
title: Egbo
alternate_names:
- Nigerian Cornmeal Porridge
summary: Egbo, also known as corn porridge, is a dish common among the people from Ibadan, Nigeria. It is made from cooked dry corn. Egbo is referred to ororo robo when eaten with sauce, beans, and vegetables.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Mill
- Pressure cooker
ingredient_groups:
- items:
  - {ingredient: salt}
steps:
- Crack the corn using the mill, and blow to get rid of the husks.
- Cook the corn with a pinch of salt using a pressure cooker.
- Add more water, and cook until soft and pulpy.
