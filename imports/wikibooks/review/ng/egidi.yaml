id: ng-egidi
title: Egidi
alternate_names:
- Pounded Corn
summary: Egidi, also known as pounded corn, is a typical Yoruba dish common among the people of Ondo state. It is served with various soups, such as as okro, ogbono, and ẹgusi soups.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 20
difficulty: 2
equipment:
- Mortar and pestle
- Stove
- Pot
- Bowl/plate
ingredient_groups:
- items:
  - {ingredient: corn-kernels}
  - {ingredient: water}
steps:
- Grind the corn kernels to make a paste.
- Wrap the paste using wrapping leaves.
- Cook for few minutes.
- Pound using mortar and pestle until the mixture is lump-free.
- Serve with soup.
