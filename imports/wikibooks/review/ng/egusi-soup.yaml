id: ng-egusi-soup
title: Egusi soup
summary: Egusi Soup is a Nigerian soup made from ground melon seeds (egusi), vegetables, meat, and fish. Some versions include tomatoes, which add a richer flavour and deeper colour to the soup. It is commonly served with pounded yam, eba, fufu, or semolina.
