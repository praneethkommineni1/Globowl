id: ng-ekpang-nkukwo
title: Ekpang Nkukwo
summary: Ekpang Nkukwo is a traditional dish of the Efik and Ibibio people of southern Nigeria. It is made from grated cocoyam wrapped in cocoyam leaves and cooked with palm oil, fish, meat, periwinkle, and seasonings. It is commonly served during special occasions and family gatherings.
