id: ng-faten-wake
title: Faten Wake
alternate_names:
- Hausa Bean Porridge
summary: Faten wake is a traditional Hausa bean porridge from Northern Nigeria. This hearty and nutritious dish is made with soft-cooked beans, vegetables, and spices, and it is typically served as a main meal for lunch or dinner.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 3
  amount: 3–4
time:
  total_min: 75
difficulty: 3
techniques:
- simmering
