id: ng-fried-unripe-plantain
title: Fried Unripe Plantain
alternate_names:
- Nigerian Green Plantain
summary: Fried unripe plantain is prepared from unripe plantain, hence the name green plantain. It is served with fried yam, egg sauce or fried potatoes.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: plantain, prep: peeled}
  - {ingredient: black-pepper}
  - {ingredient: salt, note: to taste}
  - {ingredient: vegetable-oil}
steps:
- Slice unripe plantain into small rounds, then season with ground pepper and salt to taste.
- Heat enough vegetable oil in a pan for deep-frying.
- Deep-fry plantain, ensuring all sides are golden and cooked.
- Remove from oil, and serve hot with fried yam and egg sauce.
