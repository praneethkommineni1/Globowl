id: ng-gurasa
title: Gurasa
alternate_names:
- Hausa Flatbread with Vegetables
summary: Gurasa or "light bread" is a traditional Hausa/Fulani Food in northern Nigeria and other parts of West Africa. It is eaten as a light dish for lunch or breakfast.
