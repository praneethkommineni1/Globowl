id: ng-gurudi
title: Gurudi
alternate_names:
- Nigerian Coconut Biscuit
summary: Gurudi, also called gurundi, is a Nigerian coconut biscuit made from finely-grated coconut, cassava starch, and sugar.
origin:
  country: NG
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- baking
ingredient_groups:
- items:
