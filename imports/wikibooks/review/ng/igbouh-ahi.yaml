id: ng-igbouh-ahi
title: Igbouh Ahi
alternate_names:
- Nigerian Roasted Bambara Nuts
summary: Roasted bambara nuts, also known as igbouh ahi, is a crunchy snack commonly consumed by the Tiv people of Nigeria.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
