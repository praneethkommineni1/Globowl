id: ng-iresi-eyin
title: Iresi Eyin
alternate_names:
- Yoruba Palm Oil Native Rice
summary: Iresi eyin is one of the Yoruba versions of a palm oil rice dish also called palm oil rice/native Jollof rice. It is more accurately described as a palm oil rice. It is different from Yoruba jollof/Yoruba Party Jollof/ Nigerian jollof, which is more popular.
