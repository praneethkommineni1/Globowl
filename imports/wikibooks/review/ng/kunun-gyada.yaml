id: ng-kunun-gyada
title: Kunun Gyada
alternate_names:
- Groundnut and Rice Gruel
summary: Kunun gyada is a light porridge made from blended raw groundnut and rice, usually eaten in the northern part of Nigeria. It is similar to akamu, except that blended rice is poured into a boiled groundnut milk when the later is made by pouring pap into boiled water.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 3
  amount: 3 servings
time:
  total_min: 1
difficulty: 3
equipment:
