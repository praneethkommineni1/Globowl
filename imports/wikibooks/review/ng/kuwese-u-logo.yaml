id: ng-kuwese-u-logo
title: Kuwese U Logo
alternate_names:
- Nigerian Fried Cassava
summary: Fried Cassava, also known as Kuwese U Logo in Tiv. It is prepared from cassava.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: cassava}
  - {ingredient: black-pepper}
  - {ingredient: vegetable-oil}
  - {ingredient: salt, note: to taste}
steps:
- Cut cassava into your desired size and shape, then rinse with water. Dry well.
- Blend pepper and pour on sliced cassava. Toss to coat.
- Heat the oil in a deep frying pan.
- Deep-fry the cassava in the hot oil until tender.
- Remove from the oil and serve hot, sprinkled with salt.
