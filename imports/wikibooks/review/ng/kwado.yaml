id: ng-kwado
title: Kwado
alternate_names:
- Nigerian Cassava Flour Salad
summary: Kwado, also called coldmeal, is a Nigerian meal consumed primarily by students in boarding houses. It is prepared without cooking, hence the name 'coldmeal'.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: stockfish}
  - {ingredient: onion, prep: sliced and rinsed}
  - {ingredient: salt, note: to taste}
steps:
- Mash the smoked fish in a bowl.
- Add the garri, ground kuli kuli, sliced onions, salt, and dry pepper.
- Stir the ingredients together and serve.
tips:
- You can add some water to moisten the garri if desired.
