id: ng-lafun
title: Lafun
alternate_names:
- Nigerian Cassava Swallow
summary: Lafun, also known as white amala, is a typical Nigerian swallow made from cassava flour. It is commonly consumed by the Yoruba tribe, and it is served with various soups, such as ewedu soup, okro soup, ẹfọ riro and ẹgusi soup.
origin:
  country: NG
course: side
authenticity: unassessed
