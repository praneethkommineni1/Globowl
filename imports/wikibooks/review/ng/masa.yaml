id: ng-masa
title: Masa
alternate_names:
- Hausa Rice Pancake
summary: Rice masa, or rice waina, is a type of Nigerian masa from the Hausa people of Nigeria, especially in Northern Nigeria. The recipe varies across households, but it is traditionally made in an oval shape. You can add ginger or onions if desired.
origin:
  country: NG
course: breakfast
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Blender
- Mixing bowl
- Spoon or ladle
- Non-stick frying pan or masa pan
- Stove
- Sieve (optional)
- Onion
- Ginger
- Cooked rice
- Milk
techniques:
- boiling
- pan-frying
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: cup, qty: 2}
  - {ingredient: yeast, unit: tsp, qty: 1}
  - {ingredient: sugar, unit: cup, qty: 0.5}
  - {ingredient: salt}
  - {ingredient: baking-powder, unit: tsp, qty: 1, optional: true}
  - {ingredient: vegetable-oil, prep: for cooking}
steps:
- Soak the rice in water for at least 8 hours, and up to overnight. Drain the rice.
- Take a few tablespoons of the soaked rice, and boil it until tender.
- Combine the cooked rice and uncooked rice. Blend until smooth, adding only as much water as you need to get a paste—don’t let it become watery.
- Mix yeast and sugar with a small amount of warm water in a small bowl. Leave for a few minutes to foam.
- In a large bowl, mix the blended rice with the yeast mixture and baking powder. Cover, and let rest for 6–8 hours.
- Season the batter with salt and sugar to taste.
- Heat a small amount of oil in a non-stick pan. Pour small dollops of batter into the pan, and fry like pancakes. They should come out fluffy and light.
- Serve with hot sauce, and enjoy.
