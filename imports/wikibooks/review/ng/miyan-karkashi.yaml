id: ng-miyan-karkashi
title: Miyan Karkashi
alternate_names:
- Nigerian Sesame Leaf Soup
summary: Miyan karkashi is a Nigerian draw soup made from karkashi (sesame leaf). It is often consumed in northern Nigeria, where it is typically served with varieties of tuwo such as tuwo shinkafa and tuwo masara.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 2
  amount: 2-3
time:
  total_min: 10
difficulty: 2
equipment:
