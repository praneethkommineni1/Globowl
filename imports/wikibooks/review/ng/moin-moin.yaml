id: ng-moin-moin
title: Moin Moin
alternate_names:
- Nigerian Bean Pudding
summary: Moin moin, also called moimoi or moyin moyin, is a traditional West African (particularly Nigerian) dish based on black-eyed peas or other beans. It is usually conical or cylindrical in shape, depending on the type of mould used.
origin:
  country: NG
course: main
authenticity: unassessed
