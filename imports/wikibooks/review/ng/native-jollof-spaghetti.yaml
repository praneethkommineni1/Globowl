id: ng-native-jollof-spaghetti
title: Native Jollof Spaghetti
summary: Native jollof spaghetti is a Nigerian dish of pasta made with palm oil, meat, spicy peppers, and native Nigerian seasonings. It is similar to native jollof rice, with spaghetti substituted for the rice. It can be eaten at all times of the day.
