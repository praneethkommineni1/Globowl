id: ng-nigerian-barbecued-chicken-wings
title: Nigerian Barbecued Chicken Wings
summary: Nigerian barbecued chicken wings are usually eaten as a side dish or served alongside grains like jollof rice and fried rice. They are especially common at parties, gatherings and festivals.
origin:
  country: NG
course: main
authenticity: unassessed
