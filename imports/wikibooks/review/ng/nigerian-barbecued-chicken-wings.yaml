techniques:
- baking
- grilling
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 1}
  - {ingredient: cornmeal, unit: tbsp, qty: 2}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: chicken, qty: 10}
steps:
- Combine the flour, cornmeal, pepper, salt, sugar, ginger, and paprika in a bowl.
- Add the chicken pieces, and rub the mixture into them well so they are completely coated.
- Set in the fridge, and allow the chicken to rest for 1 hour.
- Arrange the chicken pieces on a baking tray or on a grill. Grill or bake until cooked through (about 45 minutes baking at 375°F).
