id: ng-nigerian-bean-porridge
title: Nigerian Bean Porridge
summary: Bean porridge is a traditional Nigerian dish enjoyed across different regions of the country, regardless of tribe or language. It is one of the most popular, easy-to-cook, and nutritious meals.
