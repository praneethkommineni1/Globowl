id: ng-nigerian-cocoyam-chips
title: Nigerian Cocoyam Chips
summary: Nigerian cocoyam chips, popularly called kokoro in Yoruba, are a type of chips made with cocoyam (taro root).
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Frying pan
- Knife
- Stove
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: taro}
  - {ingredient: salt}
  - {ingredient: vegetable-oil}
steps:
- Wash cocoyam with water, and peel the tuber. Rinse twice to remove dirt, then thinly slice it to your desired shape.
- Put the sliced cocoyam in a pot, then season with salt. Toss well to season all of the cocoyam.
- Preheat the frying pan enough vegetable oil for deep frying. Add the cocoyam slices, working in batches if needed, and fry until crisp.
- Drain the cocoyam chips of excess oil, and serve.
