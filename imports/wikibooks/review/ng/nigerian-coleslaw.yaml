id: ng-nigerian-coleslaw
title: Nigerian Coleslaw
summary: Coleslaw is a salad dish that mainly consists of raw, finely shredded cabbage mixed with dressing. In Nigeria, coleslaw is usually simple and straightforward—typically made with cabbage, carrots, and mayonnaise.
origin:
  country: NG
course: salad
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: white-cabbage}
  - {ingredient: carrot, prep: peeled}
  - {ingredient: mayonnaise}
steps:
- Slice cabbage thinly.
- Use a grater to shred the carrot into a bowl. If possible, use a grater or mandoline that will make long, thin pieces.
- Combine the cabbage and carrots. Add mayonnaise, and toss to combine.
- Refrigerate until cold before serving.
