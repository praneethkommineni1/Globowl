id: ng-nigerian-corned-beef-sauce
title: Nigerian Corned Beef Sauce
summary: This corned beef sauce is also known as spaghetti sauce in Nigeria, but you can also use it for boiled rice, boiled yam, and boiled potatoes.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- pan-frying
ingredient_groups:
- items:
  - {ingredient: vegetable-oil}
  - {ingredient: onion, qty: 2, prep: diced, note: medium}
  - {ingredient: tomato, qty: [6, 10], prep: diced}
  - {ingredient: scotch-bonnet, qty: [8, 10], prep: diced}
  - {ingredient: red-bell-pepper, qty: 3, prep: diced, optional: true}
  - {ingredient: garlic, unit: tbsp, qty: 1}
  - {ingredient: ginger, unit: tbsp, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: chicken-bouillon-cube}
steps:
- Heat the vegetable oil in a saucepan. Add the onions, tomatoes, peppers, garlic, and ginger. Stir, and fry for about 10 minutes.
- Mix in the corned beef, and fry for about 10 minutes.
- Add salt and seasoning cube to taste. Stir, then cover and cook for a few minutes.
- Adjust seasoning as needed, and serve.
