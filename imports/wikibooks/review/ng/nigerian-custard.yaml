id: ng-nigerian-custard
title: Nigerian Custard
summary: Nigerian custard is a breakfast dish widely consumed in Nigeria. It is often eaten instead of akamu (pap) or ogi. It can be served with bread and akara. Custard is made from corn flour. People mix it with hot water until it becomes thick.
origin:
  country: NG
course: dessert
authenticity: unassessed
