id: ng-nigerian-dodo
title: Nigerian Dodo
alternate_names:
- Fried Ripe Plantain
summary: Dodo is a Nigerian dish of fried ripe plantain. It is often served with jollof rice, rice and beans, and beans porridge.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: plantain, qty: 4}
  - {ingredient: salt, unit: tsp, qty: 0.25}
  - {ingredient: vegetable-oil, unit: cup, qty: 0.5}
steps:
- Cut each ripe plantain into 6 small pieces. Toss with salt and chile-tomato purée to taste.
- Heat ½ cup of oil in a frying pan. Add the 6 plantain pieces, and deep fry until all sides are golden brown.
- Serve with jollof rice or bean porridge.
