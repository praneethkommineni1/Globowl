id: ng-nigerian-eggplant-fufu
title: Nigerian Eggplant Fufu
summary: Nigerian eggplant fufu is a swallow made from eggplants Despite the dark purple colour of eggplant, it turns a dark greyish colour as in amala when cooked.
origin:
  country: NG
course: side
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Pot
- Food processor
- Paper towels
ingredient_groups:
- items:
  - {ingredient: eggplant, qty: 2}
steps:
- Cut the eggplant into small pieces and soften in a pot of boiling water. Drain well.
- Absorb excess water from the eggplant with paper towels, then blend with the food processor.
- Transfer the eggplant purée to a pot, and stir over medium heat for 2 minutes.
- Add the psyllium husk, and stir for additional 3 minutes.
- Shape into desired portions.
tips:
- Choose small or medium-sized eggplant for your fufu, as they contain fewer seeds and are sweeter. It is also best to use eggplant with indentations since they are sweeter and have fewer seeds.
