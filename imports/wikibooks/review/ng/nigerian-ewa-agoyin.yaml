id: ng-nigerian-ewa-agoyin
title: Nigerian Ewa Agoyin
summary: Ewa agoyin is a popular Nigerian street food made from very soft and mashed beans with a rich, spicy, and deeply caramelized pepper sauce.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: salt, note: to taste}
  - {ingredient: water, unit: cup, qty: 2}
  - {ingredient: red-chili, qty: [8, 10]}
  - {ingredient: onion, qty: 1}
  - {ingredient: red-palm-oil, unit: cup, qty: 1}
  - {ingredient: bouillon-cube, qty: 1}
  - {ingredient: ground-crayfish, qty: 1}
  - {ingredient: garlic}
  - {ingredient: iru, unit: tsp, qty: [2, 3]}
steps:
- Cook the beans in plenty of water until they become extremely soft and mushy.
- Stir or lightly mash the cooked beans until you get a smooth, thick, porridge-like texture. Season with salt to taste, and set aside.
- Blend or grind dried pepper and fry it with chopped onions in a pot or pan.{{Recipe summary
- Add salt and seasoning cubes if desired, and continue frying until the oil rises and the sauce is well cooked.
- Spoon the hot pepper sauce over the mashed beans and serve.
