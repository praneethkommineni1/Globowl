id: ng-nigerian-fried-yam
title: Nigerian Fried Yam
summary: Nigerian fried yam is usually eaten with a pepper sauce.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Stovetop
- Frying pan
- Sieve
- Bowl
ingredient_groups:
- items:
  - {ingredient: yam, prep: peeled and sliced into sticks}
  - {ingredient: salt}
  - {ingredient: vegetable-oil}
steps:
- Rinse the cut yam and place in a bowl. Season with salt.
- Heat oil in a pan or pot. Add the cut yam little by little to avoid overcrowding.
- Stir, and cook until the yam is golden. Flip and cook until golden on all sides.
- Remove fried yam from pan, and drain away any excess oil.
