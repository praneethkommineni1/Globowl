id: ng-nigerian-jollof-rice
title: Nigerian Jollof Rice
summary: Nigerian jollof rice is a dish of rice cooked with peppers, onions, and tomatoes, which gives the rice a red-orange color.
origin:
  country: NG
course: main
authenticity: unassessed
