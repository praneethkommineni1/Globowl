id: ng-nigerian-miyan-giyada
title: Nigerian Miyan Giyada
summary: Miyan gyada is a traditional Nigerian soup popular in northern Nigeria, especially among the Hausa people. It is made from groundnuts (peanuts), which are blended into a paste and cooked to form a rich, creamy soup.
origin:
  country: NG
course: soup
authenticity: unassessed
