id: ng-nigerian-ofe-akwu
title: Nigerian Ofe Akwu
alternate_names:
- Palm Fruit Soup
summary: __notoc__ Ofe Akwu is the Igbo name for palm fruit soup, a deeply flavourful soup made from fresh palm fruit extract. While closely related to Banga soup, the Igbo version has a distinct spice profile, lighter seasoning, and is traditionally served with pounded yam.
