steps:
- 'Cook the meats: Season 700 grams assorted meat (beef, shaki, oxtail, goat meat) with diced 1 onion, 1 of 2 seasoning cubes, and a pinch of 1 teaspoons salt. Add 200 grams stockfish (panla), soaked and cleaned midway through cooking. Cook on medium heat until tender. Reserve the meat stock.'
- 'Prepare the cocoyam thickener: Boil peeled 500 grams cocoyam (ede), peeled and boiled until very soft. Pound in a mortar until smooth and lump-free, or blend with a little water. Set the cocoyam paste aside this is the soup thickener.'
- 'Build the soup base: Pour reserved meat stock into a pot. Add 0.3 cups palm oil and bring to a boil. Add 1 tablespoons ogiri okpei (fermented locust bean paste) and blended 3 scotch bonnet pepper (rodo). Stir well.'
- 'Add cocoyam thickener: Drop spoonfuls of the cocoyam paste into the boiling soup. Do not stir immediately allow it to dissolve slowly into the stock, thickening the soup naturally. Stir gently after 10 minutes'
- 'Add proteins and season: Add cooked 700 grams assorted meat (beef, shaki, oxtail, goat meat), 200 grams stockfish (panla), soaked and cleaned, and 150 grams smoked fish, deboned into the pot. Add 3 tablespoons ground crayfish and remaining 2 seasoning cubes. Taste and adjust 1 teaspoons salt. Simmer on medium-low heat for 10 minutes.'
- 'Add oha leaves and finish: Hand-shred 200 grams fresh oha (ora) leaves, hand-shredded and stir gently into the soup. Cook for 3–5 minutes only. The soup should be thick, richly coloured, and aromatic.'
- 'Serve: Serve hot with pounded yam (iyán), eba, fufu, or semovita.'
