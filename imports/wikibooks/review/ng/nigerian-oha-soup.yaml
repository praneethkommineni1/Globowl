id: ng-nigerian-oha-soup
title: Nigerian Oha Soup
alternate_names:
- Ora Soup
summary: Oha soup, also called Ora soup, is a delicacy of the Igbo people of southeastern Nigeria. It is prepared with the tender leaves of the Oha tree (Pterocarpus mildbraedii), cocoyam as a thickener, and palm oil.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
