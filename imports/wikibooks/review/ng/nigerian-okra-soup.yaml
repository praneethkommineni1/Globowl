steps:
- 'Cook the meats: Season 700 grams assorted meat (beef, shaki, ponmo, cow leg) with diced 1 onion, 1 of 2 seasoning cubes, and a pinch of 1 teaspoons salt. Add 200 grams stockfish (panla), soaked and cleaned midway through cooking. Cook on medium heat until tender. Reserve the meat stock.'
- 'Fry the palm oil base: Heat 0.3 cups palm oil in a pot on medium heat. Add 1 tablespoons iru (locust bean) and stir well. Add blended or crushed 3 scotch bonnet pepper (rodo). Fry the pepper in the palm oil for 5–7 minutes until the rawness is gone.'
- 'Add stock and proteins: Pour reserved meat stock into the pot. Add cooked 700 grams assorted meat (beef, shaki, ponmo, cow leg), 200 grams stockfish (panla), soaked and cleaned, and 150 grams smoked fish, deboned. Add 3 tablespoons ground crayfish and remaining 2 seasoning cubes. Stir well and simmer on medium heat for 10 minutes'
- 'Add okra and finish: Add the finely sliced or blended 500 grams fresh okra pods, finely sliced or blended into the pot. Stir gently to combine. Cook on medium heat for 5–7 minutes only do not overcook. Taste and adjust 1 teaspoons salt. The soup should be thick, green-tinged, and draw when lifted.'
- 'Serve: Serve hot with pounded yam (iyán), eba, amala, fufu, or starch.'
