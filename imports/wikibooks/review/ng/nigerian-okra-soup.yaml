id: ng-nigerian-okra-soup
title: Nigerian Okra Soup
alternate_names:
- Ila Asepo
summary: Okra soup, known as Ila Asepo in Yoruba, is one of the oldest and most widely eaten soups in Nigeria. Made from finely cut or blended okra pods, it is a draw soup prized for its thick, viscous texture and deep savoury flavour.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
