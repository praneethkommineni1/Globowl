steps:
- Grind your pepper(2 scoops) and 500g crayfish
- Prepare your onion and 1 full stick of fried fish
- wash a bowl of Periwinkle thoroughly with salt
- keep them aside. Then peel your banana
- Grind the banana(20 pieces)with a grater
- Put it in a bowl
- Add 3 cubes of Maggi and a teaspoon of salt
- Wash your hand thoroughly and mix them and keep aside
- Prepare your meat and kpomo
- Put it in a bowl,add onions, two spoon of the grinded pepper , 3 cubes of Maggi and steam for 15 mins
- Turn your steamed meat into a clean bowl
- with the same pot,add a very little quantity of water into the pot
- Add your 2 cubes Maggi, half spoon of grinded pepper and 3 spoons of crayfish and onion. Cover for 5 mins
- When there is a steam in the pot, use a spoon to scoop the grinded banana to shape the spoon into the water gently,carefully avoiding overlapping in the pot.
- Add Periwinkle and meat at the first 20 scoops in the pot,continue that way till you are done with taking the banana from the bowl.
- After which, cover the pot and leave to boil till the banana turns nude color
- Add your 3 litres of oil and stir thoroughly
- Add your leaf and bring it down.
