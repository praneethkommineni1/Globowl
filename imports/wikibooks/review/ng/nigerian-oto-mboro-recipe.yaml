id: ng-nigerian-oto-mboro-recipe
title: Nigerian Oto mboro recipe
summary: Nigerian oto mboro recipe is a type of Nigerian African recipe made with green grinded banana. It is majorly eaten by people in the south-south geopolitical zone.
origin:
  country: NG
course: main
authenticity: unassessed
