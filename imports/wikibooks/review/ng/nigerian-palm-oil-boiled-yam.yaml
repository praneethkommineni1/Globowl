ingredient_groups:
- items:
  - {ingredient: yam, prep: peeled and diced}
  - {ingredient: red-palm-oil}
  - {ingredient: salt, note: to taste}
  - {ingredient: red-chili, prep: blended to paste}
  - {ingredient: onion, optional: true}
steps:
- Cook the yam pieces in salted boiling water for a few minutes.
- Drain the yam pieces. Toss the yam with palm oil, salt, fresh pepper, and utazi leaves.
- Serve.
