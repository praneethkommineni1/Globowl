id: ng-nigerian-palm-oil-boiled-yam
title: Nigerian Palm Oil Boiled Yam
alternate_names:
- Ji Mmanu
summary: Palm oil boiled yam, also known as ji mmanu, is a typical Igbo food.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
