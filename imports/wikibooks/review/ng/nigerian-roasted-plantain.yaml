id: ng-nigerian-roasted-plantain
title: Nigerian Roasted Plantain
summary: Nigerian roasted plantain, also called boli, is a street food popular in Nigeria. It can be eaten with groundnut or pepper stew, and it is best eaten hot.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Rack
- Baking sheet
- Large saucepan
- Oven
ingredient_groups:
- items:
  - {ingredient: plantain, prep: peeled}
  - {ingredient: fish}
steps:
- Heat the oven to 400°F. Place a rack on a baking sheet.
- Place the plantains and fish on the rack.
- Roast the plantains and fish in the preheated oven until they are cooked through. For an even roast, turn the plantains from time to time.
- Heat the pepper stew, and serve it with the plantains and fish.
