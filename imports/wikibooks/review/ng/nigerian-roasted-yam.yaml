id: ng-nigerian-roasted-yam
title: Nigerian Roasted Yam
summary: Roasted yam, also known as Ìṣu sisun in the Yoruba language, is a typical Nigerian street food mostly eaten as a snack. It is prepared just like roasted corn and eaten with groundnuts or boli (roasted plantain).
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
- roasting
ingredient_groups:
- items:
  - {ingredient: yam}
  - {ingredient: water}
steps:
- Cut yam into suitably-sized pieces, then peel them.
- Soak the yam in water overnight.
- Rinse the yam and roast it, making sure all sides are deeply roasted.
- Serve the roasted yam with groundnuts or roasted plantain.
