id: ng-nigerian-suya
title: Nigerian suya
summary: Nigerian suya is one of the country’s most iconic street foods—smoky, spicy, and deeply flavorful. It’s essentially skewered meat (usually beef, sometimes chicken or goat) that’s thinly sliced, coated in a bold spice mix, and grilled over open flames.
origin:
  country: NG
course: main
authenticity: unassessed
