difficulty: 2
ingredient_groups:
- items:
  - {ingredient: beef, unit: kg, qty: 1}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: garlic-powder, unit: tsp, qty: 1}
  - {ingredient: bouillon-cube, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, note: medium}
  - {ingredient: tomato, qty: 2}
steps:
- Slice meat thinly (usually beef).
- Mix yaji (ground peanuts, chili, ginger, garlic, onion, salt, seasoning).
- Coat the meat with oil and the spice mix; let it rest briefly.
- Skewer the meat and add more spice.
- Grill over charcoal, turning often, until cooked and slightly charred.
- Serve hot with onions, tomatoes, and extra spice.
