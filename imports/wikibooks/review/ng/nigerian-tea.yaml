id: ng-nigerian-tea
title: Nigerian Tea
alternate_names:
- Hot Chocolate
summary: Nigerian tea refers to a hot chocolate beverage usually served at breakfast and with bread, meat pie, and many other snacks. Despite the name, there is no actual tea in the beverage.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
