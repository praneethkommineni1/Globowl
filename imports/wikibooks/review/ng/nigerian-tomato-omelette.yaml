id: ng-nigerian-tomato-omelette
title: Nigerian Tomato Omelette
summary: Nigerian tomato omelette is a simple dish of egg and tomato.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Stove
- Whisk
- Frying pan
- Bowls
- Spatula
ingredient_groups:
- items:
  - {ingredient: egg}
  - {ingredient: tomato, prep: diced}
  - {ingredient: vegetable-oil}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Heat some oil in a pan over high heat. Add the tomatoes, and fry until well-heated.
- Beat the eggs, and stir in the cooked tomato. Return the mixture to the pan over medium-low heat, making sure it is evenly spread across the pan. Cook until the egg is sturdy enough to flip.
- Flip the omelette to the other side, and cook until the bottom is golden.
- Serve hot with bread or jollof rice.
