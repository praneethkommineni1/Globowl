id: ng-nigerian-turmeric-rice
title: Nigerian Turmeric Rice
summary: Nigerian Turmeric Rice is a vibrant and aromatic rice dish from Nigeria, colored yellow with turmeric and flavored with a blend of local spices. It is enjoyed across different regions and often served during festive occasions.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: chicken, optional: true}
  - {ingredient: long-grain-rice, qty: 1.5}
  - {ingredient: ground-turmeric, unit: tsp, qty: 2}
  - {ingredient: curry-powder, unit: tsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: red-onion, qty: 1, prep: diced}
  - {ingredient: bouillon-cube, qty: 2, note: small}
  - {ingredient: chicken-stock}
  - {ingredient: tomato, qty: 3, prep: diced}
steps:
- In a clean pot, combine chicken, stock cubes, half the onion, curry powder, and thyme. Cover with water, and cook until the chicken is tender.
- Parboil the rice for about 10 minutes. Drain the rice in a sieve, and immediately rinse with cold water.
- Transfer the chicken stock into a clean pot. Stir in the turmeric powder, black pepper, and curry powder. Cover, and bring to a boil.
- Add the parboiled rice, making sure that the liquid is on the same level with the rice. Taste and add salt if necessary. Stir with a wooden spoon, and allow to cook on medium heat until the water is almost entirely dried up.
- Add the chopped onions and tomatoes. Cover and continue to cook until the water dries up.
- Stir to combine well, and serve.
