id: ng-nigerian-wheat-swallow
title: Nigerian Wheat Swallow
summary: One variety of swallow in Nigeria is that made of wheat flour. It is served with various soups and stews, such as ẹgusi, okro, or ogbono soups.
origin:
  country: NG
course: side
authenticity: unassessed
yield:
