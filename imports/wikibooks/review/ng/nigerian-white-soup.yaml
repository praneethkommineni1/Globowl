id: ng-nigerian-white-soup
title: Nigerian White Soup
alternate_names:
- Ofe Nsala
summary: Ofe Nsala, commonly called White Soup, is a light, delicately spiced soup from the Igbo people of southeastern Nigeria, particularly from the Anambra and Imo axis. Unlike most Nigerian soups, it contains no palm oil, giving it a pale, clear appearance.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
