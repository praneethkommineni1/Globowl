id: ng-nigerian-yam-and-potato-porridge
title: Nigerian Yam and Potato Porridge
summary: Yam and potato porridge with peppered ponmo is an upgraded version of yam porridge, a popular dish in southern Nigeria, particularly among the Yoruba people. The porridge is served with peppered ponmo due to the fact that people like to chew something while eating the porridge.
