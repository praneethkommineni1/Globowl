id: ng-nune-soup
title: Nune Soup
summary: Nune soup, also known as locust bean soup, is a typical Nigerian soup that is quick and easy to prepare. It is commonly consumed with ruam kanem (pounded yam) in the Tiv tribe.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 2
  amount: 2-3
time:
  total_min: 30
difficulty: 1
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: fish}
  - {ingredient: iru, prep: rinsed}
  - {ingredient: salt}
steps:
- Blend pepper the pepper to a paste. Boil it for few minutes.
- Add the fish, locust beans, and salt to taste.
- Stir and cook for few minutes.
- Serve with pounded yam or akpu.
