id: ng-ofada-rice
title: Ofada rice
summary: Ofada Rice is a traditional Nigerian rice variety commonly grown and eaten in southwestern Nigeria, especially among the Yoruba people. It is known for its natural aroma, slightly brown colour, and unique taste. It is often served with spicy stew called Ofada stew.
