id: ng-okpa
title: Okpa
alternate_names:
- Boiled Bambara Bean Pudding
summary: Okpa is a Nigerian dish made with ground bambara beans.
origin:
  country: NG
course: dessert
authenticity: unassessed
yield:
  servings: 12
time:
  total_min: 1
difficulty: 1
equipment:
- Mixing bowl
