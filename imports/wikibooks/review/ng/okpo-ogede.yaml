id: ng-okpo-ogede
title: Okpo Ogede
alternate_names:
- Plantain Moi-Moi
summary: Okpo ogede is a Nigerian dish of overripe plantains. It is also known as plantain moi-moi.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: plantain, qty: 4}
  - {ingredient: onion, qty: 1, note: medium}
  - {ingredient: ground-crayfish, unit: tbsp, qty: 2}
  - {ingredient: water, unit: cup, qty: 0.333}
  - {ingredient: salt, note: to taste}
  - {ingredient: red-palm-oil, unit: tsp, qty: 1}
steps:
- Blend the plantains, plantain flour, onion, and crayfish together with a little water.
- Transfer the mixture to a bowl, then mix in salt and palm oil.
- Divide the mixture between molds, such as ramekins or aluminum pouches.
- Place the filled molds in a steamer basket over boiling water. Cook until set.
- Serve with custard, oatmeal, and/or cooked ground corn (akamu).
