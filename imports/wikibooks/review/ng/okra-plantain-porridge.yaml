id: ng-okra-plantain-porridge
title: Okra Plantain Porridge
summary: Okra plantain porridge is a typical Nigerian food prepared from unripe plantain and okra. It is easy to prepare.
origin:
  country: NG
course: breakfast
authenticity: unassessed
yield:
  servings: 2
  amount: 2-3
time:
  total_min: 10
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: plantain, qty: 1, prep: peeled and diced}
  - {ingredient: water, unit: cup, qty: 1}
  - {ingredient: stockfish, qty: 1, prep: cleaned}
  - {ingredient: chicken-bouillon-cube, qty: 1}
  - {ingredient: onion, qty: 2, prep: sliced}
  - {ingredient: red-palm-oil, unit: g, qty: 200}
  - {ingredient: okra, unit: g, qty: 100, prep: grated}
  - {ingredient: salt, unit: tsp, qty: 0.25}
steps:
- Combine the plantain and water in a saucepan. Bring to a boil, then simmer for 3–5 minutes.
- Add the catfish, stock cube, onions, palm oil, okra, and ugu leaves. Stir until a porridge is formed, then cook for an additional 5 minutes.
- Season with the salt and chile-tomato. Serve hot.
tips:
- The chile-tomato purée is a product commonly available in Nigerian supermarkets. It consists of puréed tomato and chile pepper, sometimes with onion and/or red bell pepper added. It may also be called something like "tomato stew mix", "tomato mix", "tomato and pepper mix", or ata lilo. You can make it yourself at home by puréeing the ingredients together and simmering to reduce it slightly, though you will have to determine the ratios yourself. One place to start is 40% tomato + 30% bell pepper + 20% onion + 10% scotch bonnet chile, but other recipes do exist.
