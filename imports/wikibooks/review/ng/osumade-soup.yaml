id: ng-osumade-soup
title: Osumade Soup
summary: Osumade soup is a dish native to the Agbor people of Nigeria. It features palm nut extract and osumade (licorice) stick, and it is very aromatic with a sweet flavor. This soup is very light and similar to nsala soup.
origin:
  country: NG
course: soup
authenticity: unassessed
