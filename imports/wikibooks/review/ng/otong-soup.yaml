id: ng-otong-soup
title: Otong Soup
summary: Otong soup is a popular soup amongst the Efik tribe of the Southern part of Nigeria. It is made from ugu leaves, uziza leaves, and okra. It is similar to the Yoruba ila alasepo and the Igbo okwuru.
