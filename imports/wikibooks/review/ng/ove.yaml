  - {ingredient: red-chili, unit: tsp, qty: 2}
  - {ingredient: yam, qty: 1, prep: peeled and grated}
  - {ingredient: fish, unit: cup, qty: 0.25}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 0.25, prep: chopped}
  - {ingredient: salt, unit: pinch, qty: 1}
steps:
- Remove unwanted substances from the fish. Then, rinse and cook for few minutes.
- Combine the groundnut oil, onion, pepper paste, and fish to make a sauce.
- Stir the sauce into the grated yam along with the salt.
- Wrap this mixture up in the leaf, then boil for a few minutes to cook it.
