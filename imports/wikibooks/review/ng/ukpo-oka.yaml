id: ng-ukpo-oka
title: Ukpo Oka
alternate_names:
- Nigerian Corn Pudding
summary: Ukpo oka is a delicacy made from corn, popular among the Ika-Ibo people of Delta State, Nigeria. It is also known as nni oka, ekoki, sapala and igbankwu oka.
origin:
  country: NG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
- steaming
ingredient_groups:
- items:
  - {ingredient: corn-kernels, qty: 4}
  - {ingredient: onion, qty: 1}
  - {ingredient: ground-crayfish, unit: tsp, qty: 0.333}
  - {ingredient: water, unit: cup, qty: 0.333}
  - {ingredient: red-palm-oil, unit: cup, qty: 0.25}
  - {ingredient: salt, unit: tsp, qty: 0.333}
steps:
- Blend together the corn, pepper, onion, and crayfish with a small amount of water.
- Transfer the mixture to a bowl, and stir in salt and palm oil to taste.
- Pour the mixture into a mold. Place in boiling water, and steam for 45 minutes.
