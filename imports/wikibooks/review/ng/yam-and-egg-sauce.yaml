ingredient_groups:
- items:
  - {ingredient: yam}
  - {ingredient: tomato}
  - {ingredient: black-pepper}
  - {ingredient: egg}
  - {ingredient: salt}
  - {ingredient: vegetable-oil}
steps:
- Peel and slice the yam. Boil yam in water until soft, then drain.
- Blend the tomatoes and peppers together. Whisk together with the egg and a pinch of salt.
- Cook the egg mixture in a hot pan with a little oil.
- Serve the eggs with the yam.
