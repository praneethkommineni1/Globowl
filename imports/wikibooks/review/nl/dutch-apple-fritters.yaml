id: nl-dutch-apple-fritters
title: Dutch Apple Fritters
alternate_names:
- Oliebollen
summary: 'Oliebollen (literally: oil dumplings) are a type of Dutch apple fritter. They are served at Dutch festivals in the United States, such as the Holland Happening Festival in Oak Harbor, Washington.'
origin:
  country: NL
course: main
authenticity: unassessed
yield:
  servings: 50
  amount: 50 donuts
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
