id: nl-no-bake-chocolate-pie
title: No-Bake Chocolate Pie
summary: This is an old Dutch recipe for a very 'powerful' chocolate pie.
origin:
  country: NL
course: dessert
authenticity: unassessed
yield:
  servings: 10
  amount: 10–12
time:
  total_min: 40
difficulty: 3
ingredient_groups:
- name: Filling
  items:
  - {ingredient: cocoa-powder, unit: g, qty: [150, 200]}
  - {ingredient: sugar, unit: g, qty: [150, 200]}
  - {ingredient: butter, unit: g, qty: [250, 500]}
  - {ingredient: milk, optional: true}
- name: Crust
  items:
  - {ingredient: coffee, optional: true}
steps:
- Melt the butter in a saucepan, then mix in the sugar.
- Stir in the cocoa and milk.
- Dip biscuits in the coffee, and arrange them in the bottom of the dish to make a single layer. Spread the chocolate mixture on top of the biscuits. Repeat this step until you run out of biscuits and chocolate.
- Scatter the sprinkles on top, then chill in the fridge until set.
- Slice and serve.
tips:
- The above measurements aren't precise; play with the amounts to your liking.
- Adding the milk will make the cake less solid.
- Coffee is optional; addition is to taste.
- Use about 750 g butter for more than 2 layers of biscuits, and adjust the cocoa/sugar to match.
- 'Vegan variation: Remove the milk and chocolate sprinkles, and replace the butter by ⅔ soy butter and ⅓ margarine (or all margarine).'
