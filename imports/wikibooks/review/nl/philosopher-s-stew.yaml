id: nl-philosopher-s-stew
title: Philosopher's Stew
summary: 'Philosopher''s stew (Dutch: filosoof) is a dish from the Netherlands. It is an oven-baked dish made of beef, potatoes, onions and apples.'
origin:
  country: NL
course: main
