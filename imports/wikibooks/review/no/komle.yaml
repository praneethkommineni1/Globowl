id: no-komle
title: Komle
alternate_names:
- Norwegian Potato Dumplings
summary: Komle, also called raspeball, is a Norwegian dish of potato dumplings, often eaten along with sausages, boiled carrots and bacon.
origin:
  country: 'NO'
course: main
authenticity: unassessed
yield:
  servings: 1
