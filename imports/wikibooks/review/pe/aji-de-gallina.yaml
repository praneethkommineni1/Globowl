id: pe-aji-de-gallina
title: Ají de Gallina
alternate_names:
- Peruvian Chili Chicken
summary: (Spanish for chili pepper chicken) is a traditional Peruvian dish which has its roots in the social upheaval of the French Revolution in 1789. Chefs working for wealthy families lost their jobs after French aristocrats were imprisoned and executed.
origin:
  country: PE
course: main
authenticity: unassessed
