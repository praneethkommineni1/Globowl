id: pe-beef-heart-kabobs
title: Beef Heart Kabobs
alternate_names:
- Anticuchos
summary: Peruvian anticuchos are a type of grilled skewered meat, often made with beef heart. The dish is one of the most popular in Peru, and it is often sold by street vendors and accompanied by corn-on-the-cob and portions of cold boiled potato with a spot of chili sauce.
origin:
  country: PE
course: main
authenticity: unassessed
yield:
  servings: 5
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: beef, qty: 1}
  - {ingredient: garlic, unit: clove, qty: 2}
  - {ingredient: red-chili, unit: cup, qty: 0.25}
  - {ingredient: white-vinegar, unit: cup, qty: 2}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: annatto, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
steps:
- Place all the above ingredients, other than the heart, in a bowl and mix thoroughly.
- Clean the heart, removing all fat. Cut into bite-sized cubes. Place the heart pieces into the marinade mixture, and leave to marinate for about 10 hours or overnight. The heart should be completely covered by the marinade.
- After marinating, thread the meat onto skewers. If desired, at this stage some additional ingredients such as bell peppers (capsicum) or corn-on-cob (cut to a similar size to the heart) may be also added to the skewers.
- Cook the skewers on a barbecue grill, turning frequently while brushing with the marinade mix. When the meat is well done, remove skewers from grill and serve immediately.
