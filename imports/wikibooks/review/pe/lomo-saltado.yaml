id: pe-lomo-saltado
title: Lomo Saltado
alternate_names:
- Peruvian Steak Stir-fry
summary: Lomo saltado is a dish of marinated steak, vegetables and fried potatoes, usually served over white rice. It is one of the most popular recipes in Peru and is often found on the menu at many smaller restaurants at a very reasonable price.
origin:
  country: PE
course: main
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 80
difficulty: 3
techniques:
- marinating
- pan-frying
