  - {ingredient: red-chili, qty: 0.25, prep: seeded and minced}
  - {ingredient: celery, qty: 1, prep: minced}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: lemon, qty: 5, prep: juiced}
  - {ingredient: lime, qty: 5, prep: juiced}
  - {ingredient: cilantro, unit: bunch, qty: 1, prep: chopped}
  - {ingredient: corn-kernels, qty: 2, prep: grilled with husk on}
steps:
- Boil salted water. Have ice water ready on the side. Poach shrimp for just 30 seconds in the hot water, then cool in ice water and drain.
- Combine shrimp with fish, then toss with onion, ginger, garlic, hot pepper, celery, salt, and black pepper. Allow to cool in the refrigerator at least 30 minutes and up to 2 hours.
- Add lemon and lime juices and refrigerate 1 additional hour. Finish with cilantro and corn.
- Check seasoning and serve.
