id: pe-shrimp-and-sea-bass-ceviche
title: Shrimp and Sea Bass Ceviche
summary: Ceviche (or cebiche) is traditional Peruvian/Ecuadorian dish in maritime areas. In its classic form, it is composed of chunks of raw fish, lime juice, chopped onion, and minced ají limo or rocoto, both types of chiles.
