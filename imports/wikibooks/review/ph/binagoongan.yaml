id: ph-binagoongan
title: Binagoongan
alternate_names:
- Sautéed Pork with Shrimp Paste
summary: Binagoongan is a Filipino cooking process consisting of vegetables (most notably water spinach) or meat (usually pork, but can also be chicken or beef) sautéed or braised in bagoong alamang (shrimp paste), garlic, black peppercorns, and bay leaves.
origin:
  country: PH
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: pork, unit: g, qty: 454, prep: cut into pieces}
  - {ingredient: shrimp, unit: g, qty: 227}
  - {ingredient: vegetable-oil, unit: cup, qty: 0.25}
  - {ingredient: garlic, qty: 0.5, prep: crushed}
  - {ingredient: onion, qty: 1, prep: sliced thinly}
  - {ingredient: tomato, qty: 1, prep: sliced, note: large}
  - {ingredient: white-vinegar, unit: cup, qty: 0.5}
  - {ingredient: water, unit: cup, qty: 2}
steps:
- Fry pork pieces in hot oil.
- Sauté garlic, onions and tomatoes after pork has browned.
- Add shrimp.
- Add the rest of the ingredients and let simmer until pork is tender. If desired, let water reduce.
- Serve with rice.
