  total_min: 1
difficulty: 3
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: kg, qty: 0.5}
  - {ingredient: water}
  - {ingredient: sugar, unit: kg, qty: 0.5}
  - {ingredient: chocolate, qty: 2}
  - {ingredient: condensed-milk, unit: can, qty: 1}
steps:
- Wash the rice twice.
- Combine the rice and water in a pot. Place the pot over medium heat, cover, and bring to a boil.
- Uncover the pot and stir in the sugar and cocoa powder until well mixed.
- Simmer over low heat, stirring regularly, until the rice is cooked and the porridge is thickened as desired.
- Stir in the evaporated milk and serve.
tips:
- Sometimes champorado tastes good when eaten with salted fish.
