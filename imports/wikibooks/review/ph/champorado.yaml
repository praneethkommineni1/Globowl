id: ph-champorado
title: Champorado
alternate_names:
- Chocolate Rice Porridge
summary: Champorado is a chocolate porridge and favorite Filipino comfort food, especially during cold weather.
origin:
  country: PH
course: main
authenticity: unassessed
yield:
  servings: 1
