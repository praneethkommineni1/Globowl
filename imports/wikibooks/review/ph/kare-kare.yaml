id: ph-kare-kare
title: Kare-Kare
alternate_names:
- Oxtail and Vegetables in Peanut Sauce
summary: Kare-kare is a Philippine stew derived from curry with a savory peanut sauce.
origin:
  country: PH
course: main
authenticity: unassessed
