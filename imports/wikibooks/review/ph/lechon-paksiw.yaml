title: Lechon Paksiw
alternate_names:
- Pork Roast Leftovers in Sweet and Sour Sauce
summary: If you have ever hosted a true Filipino party whether it be a birthday, wedding or a community fiesta (feast) then you would know that a party is never complete without Roast Pig or Roast Suckling Pig.
origin:
  country: PH
