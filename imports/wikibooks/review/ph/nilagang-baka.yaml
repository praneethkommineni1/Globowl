id: ph-nilagang-baka
title: Nilagang Baka
alternate_names:
- Boiled Beef and Vegetables in Broth
summary: Nilagang baka is a Philippine dish of boiled beef and vegetables in broth.
origin:
  country: PH
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: beef, unit: kg, qty: 2.5}
  - {ingredient: black-peppercorns, unit: tsp, qty: 0.5}
  - {ingredient: onion, qty: 1, prep: quartered}
  - {ingredient: potato, qty: 1, prep: quartered}
  - {ingredient: white-cabbage, qty: 1, prep: quartered}
  - {ingredient: white-cabbage, qty: 2}
  - {ingredient: corn-kernels, qty: 1, prep: quarter-sliced}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: chives, qty: 2}
steps:
- Boil beef, peppercorns, onion, salt, corn, and potato until tender.
- Slice onion chives into 3-inch strips. Add to the boiling beef.
- Slice saba into half. Add to the boiling beef.
- Serve in one large bowl or individual serving bowls.
- Serve with rice on the side.
