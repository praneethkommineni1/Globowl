id: ph-sinigang
title: Sinigang
alternate_names:
- Philippine Sour Soup
summary: Sinigang, the famous sour soup of the Philippines, is a fruity sour-based soup boiled with either pork, beef, chicken, fish or seafood. A variety of vegetables can be included, but onions and tomatoes are required.
origin:
  country: PH
course: soup
authenticity: unassessed
