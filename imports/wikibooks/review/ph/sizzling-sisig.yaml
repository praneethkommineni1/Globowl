id: ph-sizzling-sisig
title: Sizzling Sisig
alternate_names:
- Filipino Pork Sauté
summary: Sisig, famous for being a food eaten while drinking alcoholic beverages, is a Filipino dish made from pork jowl and ears (maskara), pork belly, and chicken liver, which is usually seasoned with calamansi, onions, and chili peppers.
origin:
  country: PH
course: main
