- items:
  - {ingredient: pork, qty: 1.5}
  - {ingredient: onion, qty: 2, prep: minced, note: small}
  - {ingredient: red-bell-pepper, qty: 2, prep: minced}
  - {ingredient: garlic, qty: 1, prep: minced}
  - {ingredient: red-chili, qty: 6, prep: minced}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: white-vinegar, unit: cup, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: brown-sugar, unit: tsp, qty: 1}
  - {ingredient: beef, unit: cup, qty: 1}
steps:
- Grill pork head to remove hair.
- Boil pork head until tender.
- Take out all the meat and dice.
- In a sauté pan, heat oil and sauté garlic, onion, red pepper, pork meat and liver.
- Season with liquid seasoning, black pepper, and brown sugar.
- Pour in beef stock and cook until meat is tender and starts to oil again.
- Add minced chili pepper last.
- Serve on a sizzling plate.
