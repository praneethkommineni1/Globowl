id: pl-dereniowka
title: Dereniówka
alternate_names:
- Polish Dogwood Liqueur
summary: Dereniówka, is a type of Polish nalewka made from cornus mas (dogwood). It, among other nalewkas, were popular in noble manors of 17th CE Poland. Dereniówka belongs to the family of fruit nalewkas, such as orzechówka, wiśniówka, and porzeczkówka.
origin:
  country: PL
course: drink
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: sugar, unit: g, qty: 40}
steps:
- Macerate the cornus alba fruits in vodka for 14 days. Shake the concoction daily.
- When the alcoholate is ready, remove the sediments and add the sugar.
- Let it clarify and rest for a while (several days only), and then it is ready for consumption.
- Serve at room temperature in 30 ml glasses.
