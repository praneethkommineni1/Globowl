id: pl-roso
title: Rosół
alternate_names:
- Polish Meat Soup
summary: Rosó&#322; is a traditional Polish meat broth. The most popular variety is Rosó&#322; z kury, or clear chicken (hen) soup. It is commonly served with fine noodles, often home made, like Jewish lokshen.
origin:
  country: PL
course: condiment
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 60
difficulty: 3
techniques:
- boiling
- sauteing
- simmering
