steps:
- Put the chicken wings, salt, pepper, bay leaves and pimentos into a saucepan or stock pot with 1.5 L (1½ quarts) cold water. After bringing it to a boil, let it simmer for 25 minutes on low heat.
- Add the peeled carrots, celery root, parsnip root, and leek, and boil it for 10 more minutes. During that time peel the potatoes and dice them into 6 mm x 6 mm/quarter inch cubes (0.25 x 0.25 inches).
- Take out the leek, and add the potatoes to the pot. Boil them for 10–12 minutes and make sure the potatoes are cooked through.
- Grate the sour-salted (pickled) cucumbers and put them into a sauté pan with the melted butter. Sauté for 2 minutes, and add the flour and constantly stir it over low heat.
- Add ½–⅓ cups (120-80 ml) of water to the sauté pan and continue stirring.
- When the potatoes are cooked, add the prepared sour cucumber preparation to the stock pot and mix them well. Boil for 3–5 minutes and season the soup to taste. If you like, mix some soup with cream or sour cream in a small cup and add it to the pan, or a smaller amount to each individual serving.
- Bon appétit! Smacznego!
tips:
- It is very important to add the potatoes first, and then the sour cucumbers. If you add them in reverse order, the potatoes will not be cooked through.
