id: pr-arroz-con-gandules
title: Arroz con Gandules
alternate_names:
- Puerto Rican Rice and Pigeon Peas
summary: Arroz con gandules is a Puerto Rican dish of rice, pigeon peas, smoked meat, and sofrito.
origin:
  country: PR
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
