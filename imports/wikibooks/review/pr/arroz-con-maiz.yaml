steps:
- Chop the onion and add to blender. Blend until liquefied.
- With the motor running, add the remaining ingredients one at a time and process until smooth.
- Remove 1½ cup of sofrito for the rice. The sofrito will keep in the refrigerator for up to 3 days. Alternatively, freeze in ice trays and it will last a month.
- Heat the oil and annatto seeds in a small skillet over medium heat just until the seeds give off a lively, steady sizzle. Don't overheat the mixture or the seeds will turn black and the oil green. Once they're sizzling away, pull the pan from the heat and let stand until the sizzling stops.
- Strain as much of the oil as you can into a heavy pot or Dutch and let it stand for at least 5 minutes.
- Lightly toast the cumin and coriander seeds in a small skillet over low heat for a few minutes. Keep an eye on them, they turn dark fast.
- Remove seeds from the heat and grind in a little spice grinder or coffee mill.
- Re-heat the annatto oil over high heat until rippling. Stir in vienna sausage and brown. Add sofrito, alcaparrado, squash, salt, bay leaves, coriander, cumin, and pepper. Cook until sofrito stops boiling and sizzles, about 5 minutes.
- Stir in the rice until everything is mixed together and rice is coated with oil all over.
- Stir in wine, liquid from vienna sausage and enough broth or water to cover the rice by the width of two fingers. Top with banana leaf (or pan lid), folding it up or cutting it as necessary to fit over rice.
- Bring to a boil, then boil without stirring until the level of liquid meets the rice.
- Remove the banana leaf, give the rice a big stir, and put leaf back on top. Reduce the heat to low, cover the pot with lid, and cook until the water has been absorbed and the rice is tender (about 20 minutes).
- Once rice is fully cooked mix in corn and cook with lid for an additional minute.
tips:
- You can add 5–6 leaves of orégano brujo when making the sofrito.
- Try adding 1 cup mashed cooked squash (e.g. butternut, acorn, delicata, kabocha, or honeynut) with the alcaparrado mixture.
- Try mixing 1 teaspoon ground turmeric or smoked paprika in with the rice.
