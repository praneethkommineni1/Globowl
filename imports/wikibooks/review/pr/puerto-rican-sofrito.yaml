id: pr-puerto-rican-sofrito
title: Puerto Rican Sofrito
summary: Sofrito is a combination of ingredients used to give a distinctive flavor to many Puerto Rican dishes. It is mostly used when cooking legumes, rice dishes, soups and stews.
