id: ps-musakhan
title: Musakhan
alternate_names:
- Palestinian Spiced Chicken
summary: Musakhan is a Palestinian dish of spiced chicken flavored with sumac and served with bread.
origin:
  country: PS
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- deep-frying
- pan-frying
ingredient_groups:
- items:
  - {ingredient: chicken, unit: g, qty: 200}
  - {ingredient: onion, unit: g, qty: 300}
  - {ingredient: sumac, unit: g, qty: 100}
  - {ingredient: black-pepper}
  - {ingredient: white-pepper}
  - {ingredient: salt}
steps:
- Fry the chicken with the onion.
- Add the salt and the peppers before the chicken is done, and add the sumac 5 minutes from the end of cooking.
- Fry the raw nuts until they are golden. Add them to the chicken and onions
- Roll the mixture in the spring roll pastry, and deep fry them.
- Take the spring rolls out of the oil and let them dry on cooking paper.
- Serve them hot or cold.
