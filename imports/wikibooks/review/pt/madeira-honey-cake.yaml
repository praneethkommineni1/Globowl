id: pt-madeira-honey-cake
title: Madeira Honey Cake
summary: This is the recipe for the traditional Madeira Honey Cake, usually made on Christmas but also all year round on the island of Madeira and originally named in Portuguese bolo de mel. It is made with "mel de cana" which literally means "cane honey," otherwise known as molasses.
