id: pt-salt-cod-and-potato-casserole
title: Salt Cod and Potato Casserole
alternate_names:
- Bacalhau à Zé do Pipo
summary: Bacalhau à zé do pipo is a traditional Portuguese cod dish. It can be confused with various other Portuguese dried/salted codfish recipes.
origin:
  country: PT
