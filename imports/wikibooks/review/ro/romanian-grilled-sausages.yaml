id: ro-romanian-grilled-sausages
title: Romanian Grilled Sausages
alternate_names:
- Mititei
summary: Mititei or mici (grilled skinless sausages) is a typical Romanian dish. Usually in Romania you can find the prepared meat mixture in most food shops, and you only have to cook them.
origin:
  country: RO
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- grilling
ingredient_groups:
- items:
  - {ingredient: pork}
  - {ingredient: garlic}
  - {ingredient: black-pepper}
  - {ingredient: paprika}
steps:
- Combine all ingredients to form a paste.
- Shape meat mixture by hand into 7–8 x 2–2.5 cm (3 x 1 inch) sausage shapes. Each should be about 50 grams.
- Grill the sausages until cooked through. Do not let them dry out.
- Serve with salt, mustard, and bread.
tips:
- If grilling is not possible, you can fry the sausages in a skillet with some lard. Do not use oil.
