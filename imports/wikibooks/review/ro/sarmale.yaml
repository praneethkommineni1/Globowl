id: ro-sarmale
title: Sarmale
alternate_names:
- Romanian Cabbage Rolls
summary: Sarmale is a small handful of ground up meat (usually pork) mixed with rice and rolled up in pickled cabbage leaves or grape leaves and then boiled. The meat is seasoned to taste of course, including garlic, salt, pepper, etc.
origin:
  country: RO
course: main
authenticity: unassessed
yield:
  servings: 1
