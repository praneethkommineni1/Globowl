id: ru-sirniki
title: Sirniki
alternate_names:
- Russian Cheese Fritters
summary: Sirniki are Russian sweet curd fritters, generally eaten after the main course at dinner, but sometimes also at breakfast.
origin:
  country: RU
course: snack
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 2}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 6}
  - {ingredient: sugar, unit: tbsp, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 1}
- name: Garnish
  items:
  - {ingredient: sour-cream, prep: confiture.}
steps:
- Mix cottage cheese, eggs, flour, sugar and salt.
- Take piece of paste, make round, flat shape and put on warm frying pan with oil or melted butter.
- Wait until it becomes gold colour and flip.
- When it is brown on both sides you can eat it.
