  - {ingredient: red-bell-pepper, qty: [1, 2], prep: finely cut}
  - {ingredient: white-cabbage, qty: 0.25, prep: finely cut}
  - {ingredient: potato, qty: [2, 3], prep: diced}
  - {ingredient: sunflower-oil}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: tomato, qty: [2, 3], prep: grated}
  - {ingredient: all-purpose-flour, qty: 1}
