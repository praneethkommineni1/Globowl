id: rw-akabenz
title: Akabenz
alternate_names:
- Rwandan Fried Chicken
summary: Akabenz is a popular Rwandan dish consisting of crispy and flavorful fried chicken. This dish is loved for its juicy and tender meat, paired with a crispy outer coating. It is often served as a main course with various side dishes or enjoyed on its own as a snack.
origin:
  country: RW
course: main
authenticity: unassessed
