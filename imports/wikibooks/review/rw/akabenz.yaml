  - {ingredient: all-purpose-flour, unit: cup, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: garlic-powder, unit: tsp, qty: 1}
  - {ingredient: onion-powder, unit: tsp, qty: 1}
  - {ingredient: thyme, unit: tsp, qty: 1}
  - {ingredient: dried-oregano, unit: tsp, qty: 1}
  - {ingredient: chicken, unit: g, qty: 907}
  - {ingredient: vegetable-oil, prep: for frying}
steps:
- In a large bowl, combine the flour, salt, black pepper, paprika, garlic powder, onion powder, dried thyme, and dried oregano. Mix well to ensure the spices are evenly distributed.
- Coat each piece of chicken with the seasoned flour mixture, making sure to shake off any excess.
- Heat vegetable oil in a large frying pan over medium-high heat. The oil should be hot but not smoking.
- Carefully place the coated chicken pieces into the hot oil, ensuring they are not overcrowded in the pan. Fry in batches if necessary.
- Fry the chicken for about 6–8 minutes per side or until golden brown and cooked through. The internal temperature should reach 165°F (74°C) for the chicken to be fully cooked.
- Once cooked, transfer the fried chicken to a plate lined with paper towels to absorb any excess oil.
- Serve immediately while still hot and crispy.
tips:
- For extra flavor, marinate the chicken pieces in a mixture of buttermilk, garlic, and spices for a few hours before coating them in the seasoned flour.
- Feel free to adjust the seasoning according to your taste preferences. You can add more or less of each spice to suit your preference for spiciness and flavor.
- Serve with traditional Rwandan side dishes like isombe (cassava leaves with eggplant) or mizuzu (fried plantains) for a complete meal.
- Chicken is a good source of protein.
