id: rw-akarange
title: Akarange
alternate_names:
- Rwandan Tomato Sauce
summary: Akarange is a flavorful and versatile Rwandan tomato sauce that can be used as a base for many dishes. Made with ripe tomatoes and aromatic spices, this sauce adds a burst of flavor to various meals.
origin:
  country: RW
course: condiment
authenticity: unassessed
