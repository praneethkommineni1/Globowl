id: rw-ibihaza
title: Ibihaza
alternate_names:
- Rwandan Beans
summary: Ibihaza is a traditional dish from Rwanda that features flavorful and hearty beans cooked to perfection. This simple yet delicious recipe is a staple in Rwandan cuisine and can be enjoyed as a main course or as a side dish.
