title: Ibirayi n'Ibishyimbo
alternate_names:
- Rwandan Bean Soup with Fish
summary: Ibirayi n'ibishyimbo is a delicious and hearty Rwandan bean soup that features a combination of tender beans and fish. It is a popular dish in Rwanda, often enjoyed as a nutritious and comforting meal.
