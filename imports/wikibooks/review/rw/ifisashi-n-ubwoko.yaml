id: rw-ifisashi-n-ubwoko
title: Ifisashi n'Ubwoko
alternate_names:
- Rwandan Peanut Spinach Stew with Mushroom
summary: Ifisashi n'ubwoko is a delicious and nutritious Rwandan dish that combines the earthy flavors of spinach and mushrooms with the rich creaminess of peanut sauce. This hearty stew is a popular choice in Rwandan cuisine and is often served with steamed rice or ugali.
