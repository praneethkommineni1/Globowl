id: rw-ikijumba
title: Ikijumba
alternate_names:
- Rwandan Sweet Potato Stew
summary: Ikijumba is a comforting and flavorful sweet potato stew from Rwanda. Made with tender sweet potatoes, vegetables, and aromatic spices, this stew is a hearty and nutritious dish that is perfect for colder days.
