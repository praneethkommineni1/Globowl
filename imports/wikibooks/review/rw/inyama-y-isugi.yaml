id: rw-inyama-y-isugi
title: Inyama y'Isugi
alternate_names:
- Rwandan Grilled Pork
summary: Inyama y'isugi is a traditional Rwandan dish of succulent grilled pork. The pork is marinated in a flavorful blend of spices and grilled to perfection, resulting in tender and juicy meat with a smoky flavor.
origin:
  country: RW
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Grill
- Tongs
- Basting brush
