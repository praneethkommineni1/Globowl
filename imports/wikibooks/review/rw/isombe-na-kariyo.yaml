id: rw-isombe-na-kariyo
title: Isombe na Kariyo
alternate_names:
- Cassava Leaves with Pumpkin
summary: Isombe na kariyo is a delightful Rwandan dish that combines tender cassava leaves with pumpkin. This flavorful and nutritious dish is a popular choice in Rwandan cuisine.
origin:
  country: RW
course: main
authenticity: unassessed
yield:
  servings: 1
