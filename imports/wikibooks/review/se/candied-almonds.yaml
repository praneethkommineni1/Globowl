id: se-candied-almonds
title: Candied Almonds
alternate_names:
- Brända mandlar
summary: Brända mandlar (literally "burnt almonds") is a recipe for Swedish candied almonds.
origin:
  country: SE
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: almonds, unit: g, qty: 100}
  - {ingredient: powdered-sugar, unit: g, qty: 100}
  - {ingredient: water, unit: ml, qty: 125}
  - {ingredient: food-coloring, qty: 1, optional: true}
steps:
- Put the almonds in the oven at 180 °C for a few minutes to toast them.
- Pour the water into a heavy-bottomed saucepan, then sprinkle in the sugar. Place over a low heat, and stir until the mixture thickens.
- Add the colouring. Stir in the almonds so that they get a nice coating.
- Spread out the almonds on some baking paper, separate the almonds using a fork, and let them cool a bit.
