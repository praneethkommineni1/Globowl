id: se-chokladboll
title: Chokladboll
alternate_names:
- Swedish Chocolate Balls
summary: A chokladboll (literally meaning chocolate ball) is a traditional Swedish pastry often eaten with coffee during fika. They are quick and easy to prepare, since they require no baking and only a few, common ingredients.
origin:
  country: SE
course: dessert
authenticity: unassessed
yield:
  servings: 24
  amount: 24 balls
time:
  total_min: 20
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: rolled-oats, unit: cup, qty: 3.25}
  - {ingredient: sugar, unit: cup, qty: 1.25}
  - {ingredient: vanilla-extract, unit: tbsp, qty: 1, prep: added with the coffee}
  - {ingredient: butter, unit: cup, qty: 0.667, prep: softened}
  - {ingredient: coffee, unit: tbsp, qty: 6}
  - {ingredient: coconut}
steps:
- Mix oats, sugar, vanilla sugar, and cocoa in a large bowl.
- Using your hands or a potato masher, incorporate the butter into the dry ingredients until the dough has an even consistency.
- Add the coffee and mix until incorporated.
- Fill a small bowl with flaked coconut or pearl sugar.
- With your hands, roll the dough into 1-inch (3 cm) diameter balls.
- Roll each ball in the coconut or pearl sugar and place on a tray.
- Chill chocolate balls for at least one hour before serving.
