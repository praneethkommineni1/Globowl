id: se-rhubarb-fool
title: Rhubarb Fool
summary: Rhubarb fool is a traditional dessert in Swedish cuisine. Its sweet and sour taste makes it a perfect summer dessert, to be served after a heavy meal.
origin:
  country: SE
course: dessert
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 10
difficulty: 2
techniques:
- boiling
- whisking
ingredient_groups:
- items:
  - {ingredient: water, qty: 4}
  - {ingredient: sugar, qty: 1}
  - {ingredient: milk, prep: 'or a mixture of milk and cream, for serving'}
steps:
- Rinse the rhubarb and cut it into smaller pieces, about 1–3 cm in length. If the rhubarb is coarse or of low quality, it may be necessary to peel it first.
- Bring the water and sugar to a boil. Add the rhubarb and boil until soft, about 3–5 minutes. Meanwhile, mix the starch with a bit of water until it dissolves.
- When the rhubarb is soft, whisk or stir vigorously to make sure all the rhubarb pieces break up into strings. There should be no whole pieces left—if necessary boil some more.
- Remove the rhubarb from the heat. Add the dissolved starch to the rhubarb while stirring. Keep stirring and bring the rhubarb to a boil once again.
- Pour the rhubarb fool into serving bowls and sprinkle some sugar on top to prevent a skin from forming. Leave to cool off and then refrigerate.
- Serve at room temperature or chilled, with milk.
tips:
- Depending on the type of rhubarb and whether it is peeled or not, the color of the rhubarb fool can vary from pale yellow to clear red.
- Cornstarch can substitute for the potato starch.
- To reduce the amount of carbohydrates in the recipe, consider use an artificial sweetener instead of the sugar. If using artificial sweetener then add that ingredient late. Unlike sugar it does not need to be dissolved in hot water.
