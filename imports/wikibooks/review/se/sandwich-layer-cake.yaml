id: se-sandwich-layer-cake
title: Sandwich Layer-Cake
summary: Smörgåstårta or sandwich cake is a typical Swedish party dish, not to be confused with Smörgåsbord. The sandwich cake is a very rich sandwich with so much filling it resembles a cake.
