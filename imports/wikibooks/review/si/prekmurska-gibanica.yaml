id: si-prekmurska-gibanica
title: Prekmurska Gibanica
alternate_names:
- Slovenian Layered Strudel Cake
summary: Prekmurska gibanica is a pastry similar to Strudel, with poppy seeds, curd cheese, walnuts, and apples. It is a national specialty of Slovenia.
origin:
  country: SI
course: breakfast
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 4
equipment:
- A fireproof earthenware baking mould (preferably round, diameter 32–35 cm, height 7–9 cm)
techniques:
- baking
- dough-making
