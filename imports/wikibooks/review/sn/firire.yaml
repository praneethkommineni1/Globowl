id: sn-firire
title: Firire
alternate_names:
- Senegalese Fried Fish with Sauce
summary: Firire is a dish loved by most Senegalese people. It is usually eaten as dinner and can be served with bread or fresh green salad.
origin:
  country: SN
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- marinating
- pan-frying
