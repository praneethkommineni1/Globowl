- items:
  - {ingredient: fish, prep: cleaned}
  - {ingredient: garlic, unit: clove, qty: 2, prep: minced}
  - {ingredient: mustard-seeds, unit: tbsp, qty: 1}
  - {ingredient: white-vinegar, unit: tbsp, qty: 1}
  - {ingredient: chili-powder}
  - {ingredient: onion, qty: 1, prep: chopped}
