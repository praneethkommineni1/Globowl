id: sn-yassa-poulet
title: Yassa Poulet
alternate_names:
- Senegalese Chicken
summary: Yassa poulet is a popular dish that can be found throughout West Africa, though it specifically originated from Senegal. It has a unique, sweet taste.
origin:
  country: SN
course: main
authenticity: unassessed
