id: sr-surinamese-chicken-pot-pie
title: Surinamese Chicken Pot Pie
alternate_names:
- Pastei
summary: Pastei is a very old dish and was brought to Suriname by the Jewish settlers. It is a simple dish made from chicken, carrots and peas, and closely resembles chicken pot pie. It is served best with plain white rice.
origin:
  country: SR
course: main
authenticity: unassessed
yield:
  servings: 1
