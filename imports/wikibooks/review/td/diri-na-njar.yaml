id: td-diri-na-njar
title: Diri Na Njar
alternate_names:
- Chadian Spiced Rice with Vegetables
summary: Diri na njar is a flavorful Chadian rice dish cooked with tomatoes, onions, and various seasonings. It is a popular and comforting meal in Chad, enjoyed by many.
origin:
  country: TD
course: main
authenticity: unassessed
