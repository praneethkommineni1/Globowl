id: th-fuk-thong-pad-khai
title: Fuk-Thong Pad Khai
alternate_names:
- Thai Stir-Fried Pumpkin
summary: Fuk-thong pad khai or Thai stir-fried Pumpkin with egg is a delicious and simple Thai dish. It usually served with warm rice. Pumpkin is the main ingredient, and the pumpkin must be firm and heavy for its size.
