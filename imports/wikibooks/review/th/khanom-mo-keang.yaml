id: th-khanom-mo-keang
title: Khanom Mo Keang
alternate_names:
- Thai Custard
summary: 'Khanom mo keang (Thai: ขนมหม้อแกง), or khanom khumpamas (Thai: ขนมกุมภมาศ) is a Thai custard dessert. In present-day Thailand, the dessert is prepared in a square aluminum pan.'
origin:
  country: TH
course: dessert
authenticity: unassessed
yield:
  servings: 1
