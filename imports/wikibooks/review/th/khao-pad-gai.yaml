title: Khao Pad Gai
alternate_names:
- Thai Chicken Fried Rice
summary: Khao pad gai is Thai-style fried rice with chicken, as street vendors in the central region of Thailand make it. Note that this is a very imprecise recipe, and so "cups" means "handfuls". Any measuring tool that holds about the capacity of a large handful will do.
