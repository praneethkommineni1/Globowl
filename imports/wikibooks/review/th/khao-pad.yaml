- items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: garlic, unit: tbsp, qty: 1}
  - {ingredient: egg, qty: 2}
  - {ingredient: long-grain-rice, unit: cup, qty: 2, prep: cooled}
  - {ingredient: fish-sauce, unit: tbsp, qty: 1}
  - {ingredient: soy-sauce, unit: tbsp, qty: 1}
  - {ingredient: shrimp, unit: cup, qty: 1}
  - {ingredient: sugar, unit: tsp, qty: 2}
  - {ingredient: black-pepper, unit: tsp, qty: 0.5}
  - {ingredient: scallion, prep: sliced}
steps:
- Heat up a frying pan or wok and add the oil, then the minced garlic. Stir fry until fragrant.
- Add the eggs, and stir fry the eggs until cooked.
- Add the rice and stir fry.
- Season with fish sauce, soy sauce, and sugar, then continue frying until the rice is crumbly.
- Add meat, pepper, and spring onions. Stir again until heated through, then transfer to a serving dish.
