id: th-nam-phrik-ong
title: Nam Phrik Ong
alternate_names:
- Thai Pork and Tomato Dip
summary: 'Nam phrik ong, or Thai pork and tomato dip (Thai: น้ำพริกอ่อง), is a traditional Northern Thai food of pork, tomatoes, and chilli. It is much like a Thai version of a bolognese sauce, and the name comes from combining nam phrik (hot sauce; literally "liquid chili") and ong.'
