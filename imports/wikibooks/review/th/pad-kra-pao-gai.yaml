id: th-pad-kra-pao-gai
title: Pad Kra Pao Gai
alternate_names:
- Thai Basil Chicken Stir Fry
summary: One of the most well known dishes in Thailand is pad kra pao gai (ผัดกะเพราไก่), a spicy stir fry containing basil and chicken. Most places, from small street food stalls to big restaurants, serve Pad Kra Pao Gai.
origin:
  country: TH
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- stir-frying
ingredient_groups:
- items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1.5}
  - {ingredient: red-chili, qty: [5, 10]}
  - {ingredient: garlic, unit: clove, qty: 5, prep: finely chopped}
  - {ingredient: chicken, unit: g, qty: 500}
  - {ingredient: green-beans, unit: g, qty: 125, prep: finely chopped}
  - {ingredient: fish-sauce, unit: tbsp, qty: 2}
  - {ingredient: oyster-sauce, unit: tbsp, qty: 3}
  - {ingredient: sugar, unit: pinch, qty: 1}
  - {ingredient: basil, qty: [15, 20]}
steps:
- Add the oil to a pan over high heat. Wait until the oil has heated up.
- One the oil is hot, add the chillis and garlic to the pan and stir fry for roughly 10 seconds.
- Add the minced chicken, and stir fry with a spatula.
- When the chicken is nearly done add the green beans.
- Add the fish sauce, oyster sauce, and sugar. Stir fry for 2 minutes.
- Turn the heat off, add basil, and stir for 5 seconds.
- Serve with rice and a fried egg on top.
