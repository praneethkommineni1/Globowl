id: th-pad-thai-sauce
title: Pad Thai Sauce
summary: Pad thai sauce is commonly used in a Thai dish that shares the same name. This is a simplified version that is versatile enough to use in many other dishes. This recipe works best with rice noodles and is a great addition to any cook's stir-fry repertoire.
origin:
  country: TH
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: garlic, qty: 1}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 3}
  - {ingredient: tamarind-paste, unit: tbsp, qty: 3}
  - {ingredient: soy-sauce, unit: tbsp, qty: 2}
  - {ingredient: fish-sauce, unit: cup, qty: 0.25}
  - {ingredient: sugar, unit: cup, qty: 0.25}
  - {ingredient: cornstarch, unit: tbsp, qty: 0.5}
steps:
- Mince the garlic. Lightly brown it in a frying pan over high heat with the oil.
- Combine the juice, soy sauce, fish sauce, and sugar and mix thoroughly
- After mixture starts bubbling, add the chili paste and cornstarch. Mix well and cook for another minute or two.
