id: th-pineapple-curry
title: Pineapple Curry
summary: Thai pineapple curry (แกงสับปะรด / kaeng sap pa rod) is a traditional curry of Southern Thailand. The recipe has crushed pineapple with juice, so it tastes both sweet and sour. It is often served over rice and garnished with peeled orange slices, diced green onion, or celery.
