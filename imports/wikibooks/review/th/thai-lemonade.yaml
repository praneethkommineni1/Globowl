id: th-thai-lemonade
title: Thai Lemonade
summary: This is the Thai version of lemonade.
origin:
  country: TH
course: drink
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 1
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, unit: ml, qty: 125}
  - {ingredient: sugar, unit: g, qty: 100}
  - {ingredient: lemongrass, unit: stalk, qty: 2}
  - {ingredient: ginger, qty: 2, prep: peeled and cut into pieces}
  - {ingredient: lime, prep: 'sliced, for garnish'}
steps:
- Bring the water to a boil with the sugar, lemon grass, and ginger. Boil for 20 minutes.
- Allow the syrup to cool, then remove lemongrass and ginger.
- Pour the syrup in 4 large glasses, and add the carbonated water.
- Garnish glasses with lime discs.
