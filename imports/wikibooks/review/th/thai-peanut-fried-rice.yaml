id: th-thai-peanut-fried-rice
title: Thai Peanut Fried Rice
summary: Thai Peanut Fried Rice.
origin:
  country: TH
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
- whisking
ingredient_groups:
- name: Sauce
  items:
  - {ingredient: soy-sauce, unit: tbsp, qty: 1}
  - {ingredient: water, unit: tbsp, qty: 1}
  - {ingredient: golden-syrup, unit: tsp, qty: 2}
  - {ingredient: peanut-butter, unit: tsp, qty: 2}
- name: Fried rice
  items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 3}
  - {ingredient: egg, qty: 2}
  - {ingredient: long-grain-rice, unit: cup, qty: 2}
  - {ingredient: carrot, qty: 1, prep: shredded, note: large}
  - {ingredient: roasted-peanuts, unit: cup, qty: 0.5}
steps:
- Whisk sauce ingredients together in small bowl.
- In a pan, heat 1 tbsp oil. Fry eggs, then chop them up and remove from the pan.
- In the same pan, heat 2 tbsp oil. Fry the frozen edamame beans for 2–3 minutes until cooked.
- Add the rice and sauce and toss. Then, add in the shredded carrot, peanuts, and the eggs and fry for 2–3 more minutes.
