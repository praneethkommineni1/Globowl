id: th-thai-red-curry-paste
title: Thai Red Curry Paste
summary: 'Thai red curry paste (Thai: phrik kaeng phet) is a spicy paste commonly used to make curry dishes.'
origin:
  country: TH
course: main
authenticity: unassessed
yield:
  servings: 3
  amount: 3–4 tablespoons
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: red-chili, qty: 12, prep: chopped, note: small}
  - {ingredient: lemongrass, qty: 1}
  - {ingredient: garlic, unit: clove, qty: 3, prep: pressed}
  - {ingredient: onion, qty: 1, note: small}
  - {ingredient: ginger, unit: tbsp, qty: 1}
  - {ingredient: cilantro, unit: tbsp, qty: 2, prep: leaves and stems}
  - {ingredient: ground-cumin, unit: pinch, qty: 1}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
steps:
- Grind the red chiles, garlic, lemongrass, and onion in a mortar.
- Add the remaining ingredients except for the oil, and keep grinding to make a fluid paste.
- Mix in the oil. Store in an airtight container in the refrigerator for up to 1 month.
