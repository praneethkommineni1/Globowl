id: th-thong-yib
title: Thong Yib
alternate_names:
- Thai Candied Egg Yolks
summary: This sweet and juicy Thai dessert is served in auspicious ceremonies for blessings.
origin:
  country: TH
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 4
techniques:
- simmering
