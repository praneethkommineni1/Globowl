ingredient_groups:
- items:
  - {ingredient: chicken, unit: g, qty: 400, prep: diced}
  - {ingredient: chicken-stock, unit: cup, qty: 3}
  - {ingredient: mushroom, unit: g, qty: 100, prep: halved}
  - {ingredient: tomato, qty: 6}
  - {ingredient: lemongrass, qty: 1, prep: cut into short lengths}
  - {ingredient: kaffir-lime-leaf, qty: [2, 3], prep: torn}
  - {ingredient: fish-sauce, unit: tbsp, qty: 3}
  - {ingredient: lime, unit: tbsp, qty: 4}
  - {ingredient: sugar, unit: tsp, qty: 0.5}
  - {ingredient: red-chili, qty: [5, 6], prep: just broken with pestle}
steps:
- Place the stock in a pot, add the lemongrass and kaffir lime leaves, and bring to boil over medium heat.
- Add the chicken meat, mushroom, fish sauce, lime juice, and sugar; cook slowly and uncovered for 10 minutes. Do not stir.
- Add the tomatoes and chilies and cook for 5 more minutes. Remove from heat.
- Serve with steamed jasmine rice.
