id: th-yellow-curry-paste
title: Yellow Curry Paste
summary: Yellow Curry Paste.
origin:
  country: TH
course: main
authenticity: unassessed
yield:
  servings: 5
  amount: 5–6 tablespoons
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: coriander-seeds, unit: tbsp, qty: 2}
  - {ingredient: cumin-seeds, unit: tbsp, qty: 2}
  - {ingredient: lemongrass, qty: 3, prep: chopped}
  - {ingredient: ginger, unit: tbsp, qty: 1}
  - {ingredient: red-chili, qty: 6, prep: seeded and chopped}
  - {ingredient: salt, unit: tbsp, qty: 1}
  - {ingredient: garlic, unit: clove, qty: 3, prep: smashed}
  - {ingredient: shallot, qty: 1, prep: chopped}
  - {ingredient: ground-turmeric, unit: tbsp, qty: 1}
  - {ingredient: shrimp-paste, unit: tbsp, qty: 1}
steps:
- Toast the cumin and coriander seeds in a pan for 3–4 minutes. Set aside.
- Grind lemongrass and ginger in a mortar, add chilli-peppers and salt, and grind for 4 minutes.
- Add garlic and shallot and keep grinding.
- Add the roasted cumin and coriander seeds and turmeric.
- Add the trassi and grind to a fluid paste.
- Store in an airtight container in the refrigerator for storage (lasts 1 month).
