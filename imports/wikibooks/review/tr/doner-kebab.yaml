id: tr-doner-kebab
title: Döner Kebab
summary: Döner kebab (döner kebap in Turkish) literally means "rotating grilled meat" (any type of meat applies). They were first developed in Bursa. Authentic Turkish döner is made with bread, salad and meat from lamb; regardless, mostly beef or a mix of beef and lamb is used in Europe.
