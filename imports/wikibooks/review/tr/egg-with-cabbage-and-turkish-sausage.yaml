id: tr-egg-with-cabbage-and-turkish-sausage
title: Egg with Cabbage and Turkish Sausage
summary: Eggs cooked with Turkish sausage (called sucuk) and spicy cabbage, can be served on its own or with rice. If the red pepper paste is already salted, there is no need for additional salt, but this can be adjusted according to need and the ingredients used.
origin:
  country: TR
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 25
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: white-cabbage, unit: cup, qty: [1, 2]}
  - {ingredient: egg, qty: [2, 3]}
  - {ingredient: gochujang, unit: tbsp, qty: 1}
  - {ingredient: olive-oil, unit: tbsp, qty: [1, 2]}
  - {ingredient: peanut-butter, qty: 1, note: large}
  - {ingredient: hot-sauce, optional: true}
  - {ingredient: parsley, optional: true}
steps:
- Heat olive oil in a medium-sized pot with lid.
- Add sliced sucuk and quickly brown.
- Mix in chopped cabbage and red pepper paste.
- Mix in the water and peanut butter.
- Cover lid and cook for around 5–10 minutes, depending on how crispy you want the cabbage.
- Crack 2–3 eggs into the pot. Cover, and cook until the eggs are done.
- Serve with rice or meat. If desired, garnish with a little tabasco and/or finely-chopped herbs.
