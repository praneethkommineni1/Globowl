id: tr-menemen
title: Menemen
alternate_names:
- Eggs with Onion, Green Pepper, and Tomato
summary: Menemen is a Turkish dish of eggs with onion, green pepper and tomato. It can be served as a breakfast or luncheon dish.
origin:
  country: TR
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 25
difficulty: 2
techniques:
- sauteing
ingredient_groups:
- items:
  - {ingredient: egg, qty: 4}
  - {ingredient: onion, qty: 2}
  - {ingredient: red-bell-pepper, qty: 2}
  - {ingredient: tomato, qty: 4}
  - {ingredient: parsley, unit: tbsp, qty: 2}
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: dried-oregano, unit: tsp, qty: [1, 2], optional: true}
  - {ingredient: paprika, unit: tsp, qty: [1, 2], optional: true}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Prepare a concassée of tomatoes by blanching, peeling, seeding and dicing the tomatoes. Alternately, you may simply grind the tomatoes in a food processor or grate them using a box grater.
- Dice the onions and peppers in medium dice and sauté in the olive oil until tender.
- Add the oregano and paprika, if using.
- Add the tomatoes to the peppers and onion and cook for 5 minutes.
- Add the parsley and season with salt and freshly ground black pepper.
- Beat the eggs and pour over the mixture in the pan. Stir until cooked.
- Serve with Turkish bread.
