id: tr-tarhana
title: Tarhana
alternate_names:
- Turkish Yogurt Soup
summary: Tarhana Çorbası is a Turkish soup made from a fermented and dehydrated mix of flour, yogurt, onions, tomatoes and green peppers. The exact composition of tarhana differs from region to region in Turkey.
origin:
  country: TR
course: soup
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 1
difficulty: 4
