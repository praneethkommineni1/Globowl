id: tr-yuvarlak
title: Yuvarlak
alternate_names:
- Greek Meatballs
summary: Yuvarlak, yuvarlak köfte, or γιουβαρλάκια (youvarlakia), meaning round in Turkish, are a kind of large meatball in sauce. The meat mixture includes rice or bulgur. They are cooked in moist heat and the juices thickened with avgolemono. They are found in Turkish and Greek cuisine.
