ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 2}
  - {ingredient: baking-powder, unit: tsp, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: water, unit: cup, qty: 0.75}
