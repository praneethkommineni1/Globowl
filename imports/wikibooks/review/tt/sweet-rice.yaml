id: tt-sweet-rice
title: Sweet Rice
summary: Sweet rice is a rice pudding that can be served hot or cold.
origin:
  country: TT
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 60
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, unit: cup, qty: 3}
  - {ingredient: long-grain-rice, unit: cup, qty: 1.5}
  - {ingredient: evaporated-milk, unit: can, qty: 1.5}
  - {ingredient: condensed-milk, unit: can, qty: 2}
  - {ingredient: cinnamon-stick, qty: 2}
  - {ingredient: vanilla-extract, unit: tbsp, qty: 1}
  - {ingredient: raisins, unit: tbsp, qty: 4, optional: true}
steps:
- Bring water to a boil. Add rice, and boil until very soft. Most of the water should be absorbed by the rice. Add more water if necessary.
- Add evaporated milk, condensed milk, cinnamon sticks, and vanilla essence.
- Cook over medium heat, stirring once in a while to prevent sticking, until mixture has thickened and reached a pudding-like consistency.
- Remove from heat, and stir in raisins.
- Let stand.
