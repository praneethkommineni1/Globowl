id: tz-nyama-choma
title: Nyama Choma
alternate_names:
- Tanzanian Barbecue
summary: Nyama Choma is a popular grilled meat recipe in Tanzania, though it is also loved among other African countries like Kenya. It can be served with fries or ugali, some kachumbari and some hot spicy peri peri sauce. You can use any meat of your choice to prepare this recipe.
