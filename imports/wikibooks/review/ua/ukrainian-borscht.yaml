id: ua-ukrainian-borscht
title: Ukrainian Borscht
summary: Ukrainian borshch is a vegetable soup with beetroots as its characteristic ingredient. It is an everyday and ritual dish, known since at least the early Kyiv Rus times. Borshch is very nourishing, especially if you cook it with meat, so it is normally eaten for dinner.
