id: ua-ukrainian-cabbage-soup
title: Ukrainian Cabbage Soup
alternate_names:
- Kapusniak
summary: Kapustnik is a hearty Central and Eastern European raw cabbage soup. It must be not confused with Kapusniak which is made of sauerkraut.
origin:
  country: UA
course: soup
authenticity: unassessed
yield:
  servings: 5
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
- simmering
