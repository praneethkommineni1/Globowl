id: ug-beef-muchomo
title: Beef Muchomo
alternate_names:
- Ugandan Beef Skewers
summary: Beef muchomo is a Ugandan street food, but it can be made at home for any backyard get-together. The inside is very tender and it tastes delicious when eaten with skewered onions.
origin:
  country: UG
course: main
authenticity: unassessed
