id: ug-muceere
title: Muceere
alternate_names:
- Ugandan Pumpkin Stew
summary: Muceere is a hearty and flavorful dish that celebrates the natural sweetness and richness of pumpkin. This traditional stew is made with tender chunks of pumpkin cooked in a flavorful sauce, making it a comforting and nutritious meal.
origin:
  country: UG
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
