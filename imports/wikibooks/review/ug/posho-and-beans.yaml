  - {ingredient: tomato, qty: 2, prep: finely chopped}
  - {ingredient: curry-powder, unit: tsp, qty: 1}
  - {ingredient: ground-ginger, unit: tsp, qty: 0.5}
  - {ingredient: ground-cumin, unit: tsp, qty: 0.5}
- name: Posho
  items:
  - {ingredient: water, unit: l, qty: 1.5}
