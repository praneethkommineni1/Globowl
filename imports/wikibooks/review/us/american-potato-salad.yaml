id: us-american-potato-salad
title: American Potato Salad
summary: Potato salad is able to trace its origins to Germany before the turn of the 17th century, where it first became popular to use vinegar and spices on the potato as a side to a meal. The salad has a bite to it and is served warm as often as not.
