id: us-artichoke-dip-with-parmesan
title: Artichoke Dip with Parmesan
summary: Artichoke hearts are readily available in cans and jars in many countries, and are increasingly used in the making of snack dips. Many national chain restaurants in the USA have some variety of artichoke dip, which is usually mayonnaise-based.
origin:
  country: US
course: starter
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: mayonnaise}
  - {ingredient: parmesan}
steps:
- Combine all ingredients to make dip.
tips:
- There are many who increase the amount of artichokes used, for health-conscious reasons. There are also versions that replace the mayonnaise with soft tofu.
- 'Various items that are often added to the base artichoke dip, (to taste):'
- Salt and pepper.
- Chopped scallions, (green onions)
- Dill weed
- Finely-chopped olives, (often with pimento)
- Chopped tomatoes (an especially common addition)
- Any number of very finely chopped vegetables (sometimes pre-cooked but raw is fine)
- Chopped spinach, cooked
- ½ cup sour cream
- ½ cup cream cheese
- Minced garlic
- Small can chopped green chilis
- Dijon Mustard (to taste)
