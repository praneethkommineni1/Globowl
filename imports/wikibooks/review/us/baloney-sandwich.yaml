id: us-baloney-sandwich
title: Baloney Sandwich
summary: This is a very basic recipe for a bologna (baloney) sandwich. See variations for different ways to prepare it.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
