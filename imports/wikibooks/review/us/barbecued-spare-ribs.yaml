title: Barbecued Spare Ribs
summary: Barbecued Spare Ribs are a classic American barbecue meal made from pork. This version is cooked in the oven, not on a barbecue, and uses a barbecue sauce with Asian-associated flavors like soy sauce, rice vinegar, and garlic.
