steps:
- Place spare ribs in a large baking dish in one layer. In a small bowl, combine the remaining ingredients. Pour over spare ribs and coat on both sides. Marinate overnight, basting occasionally.
- Preheat the oven to . Place a large, shallow roasting pan on the oven bottom. Fill with water. Place spare ribs on a roasting rack.
- Roast ribs for 45 minutes.
- Raise oven temperature to , and roast for 15 more minutes.
- Serve hot or cold.
tips:
- Alternatively, bake at for 20 mins then lower the temp to for 1 hour; this renders most of the fat and produces very tender meat.
- To actually barbecue the ribs on a grill, get grill temperature to and cook for 5-6 hours.
