id: us-bell-pepper-chili
title: Bell Pepper Chili
summary: Chili made with bell-peppers, served over white rice.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 12
time:
  total_min: 80
difficulty: 2
techniques:
- pan-frying
- simmering
ingredient_groups:
- items:
  - {ingredient: beef-mince, unit: g, qty: [1361, 1588]}
  - {ingredient: onion, qty: [6, 8], prep: coarsely chopped}
  - {ingredient: red-bell-pepper, qty: [2, 3], prep: coarsely chopped}
  - {ingredient: chili-powder}
  - {ingredient: kidney-beans-canned, unit: can, qty: 1}
  - {ingredient: tomato, unit: can, qty: 2}
  - {ingredient: long-grain-rice}
  - {ingredient: cheddar, prep: shredded, optional: true}
steps:
- Put beef in a large pot.
- Fry on medium, breaking up the beef, until it turns brown. Drain grease.
- Add peppers and onions to the pot.
- Fry until the onions are transparent. Drain grease if necessary.
- Add crushed tomatoes. Simmer for 1 hour, stirring occasionally.
- Add kidney beans. Simmer for an additional 10 minutes.
- Add chili powder and garlic salt to taste.
- Serve over white rice. Optionally, top with shredded cheddar cheese.
