ingredient_groups:
- items:
  - {ingredient: black-beans-canned, unit: can, qty: 2, prep: drained}
  - {ingredient: chicken, unit: cup, qty: 1.5}
  - {ingredient: cilantro, unit: cup, qty: 0.25, prep: plus extra sprigs for garnish, optional: true}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
steps:
- Purée all ingredients in a blender until smooth.
- Pour into a large saucepan or Dutch oven, and bring to a simmer.
- Simmer, partially covered and stirring frequently, to blend flavors, 5 or 7 minutes.
- Serve, garnishing each portion with 1 tablespoon of tortilla chips, 1 tablespoon of sour cream and optional cilantro sprigs.
tips:
- Garnishes can include ¼ cup crumbled tortilla chips and ¼ cup sour cream.
