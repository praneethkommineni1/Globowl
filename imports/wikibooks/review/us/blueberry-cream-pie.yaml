ingredient_groups:
- name: Pie
  items:
  - {ingredient: sour-cream, qty: 1}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 2}
  - {ingredient: sugar, unit: cup, qty: 0.75}
  - {ingredient: vanilla-extract, unit: tsp, qty: 1}
  - {ingredient: egg, qty: 1, prep: beaten}
- name: Topping
  items:
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 3}
  - {ingredient: butter, unit: tbsp, qty: 3}
steps:
- Preheat oven to 400°F (200°C).
- In a mixing bowl, combine sour cream, flour, sugar, vanilla, and egg.
- Beat until very smooth.
- Fold in blueberries.
- Pour filling into pie shell.
- Bake for 25 minutes.
- In a small bowl, mix flour, butter and pecans, stirring well.
- Sprinkle over pie and bake an additional 10 minutes.
- Remove from oven.
- Cool on wire rack, then chill.
tips:
- A little whipped cream on top is a nice addition.
