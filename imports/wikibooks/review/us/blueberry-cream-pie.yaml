id: us-blueberry-cream-pie
title: Blueberry Cream Pie
summary: This recipe for blueberry cream pie is from chef Taylor Piercefield.
origin:
  country: US
course: dessert
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 60
difficulty: 2
techniques:
