ingredient_groups:
- items:
  - {ingredient: cheese, unit: g, qty: 227}
  - {ingredient: mushroom, unit: can, qty: 1}
  - {ingredient: green-peas, unit: can, qty: 1}
  - {ingredient: long-grain-rice, unit: cup, qty: 3}
  - {ingredient: cooking-spray}
  - {ingredient: almonds, unit: cup, qty: 0.5}
steps:
- Preheat oven to 350°F.
- Combine cheese, mushrooms, peas, and rice in large bowl.
- Coat 1½ quart baking pan with cooking spray.
- Move mixed ingredients to baking dish.
- Cover and bake for 20 to 25 minutes.
- Sprinkle almonds on top
- Bake 5 minutes more.
tips:
- Instant brown rice will work fine.
- Mushroom "stems and pieces" are okay.
