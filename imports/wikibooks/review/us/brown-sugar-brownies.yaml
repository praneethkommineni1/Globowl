ingredient_groups:
- items:
  - {ingredient: brown-sugar, unit: cup, qty: 1}
  - {ingredient: butter, unit: cup, qty: 0.5, prep: softened}
  - {ingredient: egg, qty: 2}
  - {ingredient: chocolate, unit: g, qty: 57, prep: melted}
  - {ingredient: all-purpose-flour, unit: cup, qty: 0.5}
  - {ingredient: walnuts, unit: cup, qty: 1}
steps:
- Preheat oven to 325°F.
- Grease an 8 x 8 x 2-inch square baking pan.
- Cream sugar and butter until fluffy.
- Beat in eggs.
- Beat in melted chocolate.
- Mix in flour, then stir in nuts.
- Pour into prepared pan.
- Bake about 25 minutes.
- Cool in pan, and cut into squares.
tips:
- The brownies can also be baked in a Dutch oven at moderately slow heat instead of in the baking pan.
