  - {ingredient: onion, qty: 1, prep: minced}
  - {ingredient: garlic, unit: clove, qty: [2, 5], prep: minced}
  - {ingredient: parmesan, unit: cup, qty: 1}
  - {ingredient: chicken, unit: g, qty: 907, prep: cubed}
  - {ingredient: chicken-stock, unit: can, qty: 1}
  - {ingredient: canned-tomatoes, unit: can, qty: 1}
  - {ingredient: heavy-cream, qty: 0.5}
  - {ingredient: olives, qty: 1, note: small}
  - {ingredient: pasta, unit: g, qty: [454, 680], prep: cooked}
steps:
- Sauté onion, peppers, and garlic in the margarine slowly over low/medium heat until the onions are clear.
- Add the Parmesan, chicken breast, chicken stock, tomato sauce, cream, and olives. Simmer for about an hour.
- Serve over the cooked pasta.
tips:
- It is important to use jarred peppers—the flavor of fresh peppers completely changes the recipe.
