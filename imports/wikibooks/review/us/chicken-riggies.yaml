id: us-chicken-riggies
title: Chicken Riggies
summary: Chicken Riggies (recipe by P.A. Johnson) is a Utica, NY classic. It is well known throughout the greater Mohawk Valley and once a year there is a festival in honor of this dish called Riggiefest, held to benefit the YWCA of the Mohawk Valley.
