id: us-chipotle-bbq-sauce
title: Chipotle BBQ Sauce
summary: This chipotle BBQ sauce is really smoky and hot, so if you can't stand the heat, adjust it to your liking.
origin:
  country: US
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: chipotle-in-adobo, unit: can, qty: 2}
  - {ingredient: ketchup, qty: 1}
  - {ingredient: molasses, unit: cup, qty: 1}
  - {ingredient: worcestershire-sauce, unit: cup, qty: 0.25}
  - {ingredient: soy-sauce, unit: cup, qty: 0.5}
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 2}
  - {ingredient: cider-vinegar, unit: cup, qty: 0.25}
steps:
- Whisk together oil and flour and cook on medium heat, stirring constantly until light blonde color is achieved.
- Add remaining ingredients and bring to a boil; reduce heat to low and cook 15 minutes.
- Cool for 15 minutes and purée in batches until smooth.
- Store in nonreactive container for up to 1 week.
