id: us-chipotle-fish-n-chips
title: Chipotle Fish n' Chips
summary: Chipotles add a Southwestern smoky heat to otherwise normal fish n' chips.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- pan-frying
- whisking
ingredient_groups:
- name: Chipotle vinegar
  items:
  - {ingredient: chipotle-in-adobo, qty: [2, 3], prep: pureed until smooth}
- name: Fish
  items:
  - {ingredient: beer, qty: 1}
  - {ingredient: cornmeal, unit: cup, qty: 2}
  - {ingredient: worcestershire-sauce, unit: tbsp, qty: 2}
  - {ingredient: salt, unit: tbsp, qty: 1}
  - {ingredient: chipotle-in-adobo, qty: [3, 4], prep: pureed until smooth}
  - {ingredient: chipotle-in-adobo, unit: tbsp, qty: [1, 2]}
  - {ingredient: cornstarch}
  - {ingredient: tilapia, qty: 4, prep: cut into 1-ounce strips}
  - {ingredient: vegetable-oil}
steps:
- Make the chipotle vinegar by whisking all ingredients in a dipping bowl. Keep at room temperature until needed.
- Combine beer, cornmeal, old bay, worcestershire sauce, salt, chipotles, and adobo to make a batter.
- Dredge fish pieces in cornstarch, and then dip in the batter.
- Fry coated fish pieces two at a time in the oil at 350°F. They should take 3 minutes to become golden and crisp on the outside.
- Drain fish pieces on a cooling rack suspended above a baking pan. If inside is undercooked, finish in a 350°F oven.
- Serve with French fries and the chipotle vinegar.
