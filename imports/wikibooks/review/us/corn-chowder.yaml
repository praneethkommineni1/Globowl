ingredient_groups:
- items:
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: onion, unit: cup, qty: 1}
  - {ingredient: celery, unit: cup, qty: 0.5}
  - {ingredient: potato, unit: cup, qty: 1.5, prep: 'pared potatoes, cut in 1/2-inch cubes'}
  - {ingredient: corn-kernels, unit: cup, qty: 2, prep: fresh or frozen}
  - {ingredient: water, unit: cup, qty: 1.5}
  - {ingredient: bouillon-cube, qty: 2}
  - {ingredient: thyme, unit: tsp, qty: 0.25}
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: heavy-cream, unit: cup, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: black-pepper, note: to taste}
steps:
- In a medium saucepan, melt butter; add onion and celery and cook until tender.
- Add potatoes, corn, salt, pepper, water, bouillon cubes, and thyme.
- Cover and simmer for 15 minutes, or until potatoes and corn are tender.
- Add milk and cream.
- Heat through.
tips:
- If cooking outdoors, you can substitute evaporated milk or powdered milk. Paprika or pepper can be added for spicier flavor.
