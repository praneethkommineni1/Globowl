ingredient_groups:
- items:
  - {ingredient: corn-kernels, qty: 1}
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: egg, qty: 3}
  - {ingredient: sugar, unit: tbsp, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 0.125}
  - {ingredient: butter, unit: tbsp, qty: 1, prep: cut into 6 pieces}
steps:
- Preheat oven to 325°F.
- Put frozen corn, milk, eggs, sugar, and salt into a blender.
- Blend on medium until ingredients are mixed thoroughly.
- Pour into a medium-sized baking dish coated with cooking spray.
- Dot the top with butter pieces.
- Bake for 70 minutes.
