id: us-deep-dish-pizza
title: Deep Dish Pizza
summary: Pizza is a traditional Italian fare that was introduced by immigrants to America in the late 19th and early 20th centuries. In America it has evolved to unique variations, including this Deep Dish Pizza variety.
