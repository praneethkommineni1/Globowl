steps:
- Stir yeast and sugar into warm water. Let stand until bubbly.
- Add the salt and about half the flour so the dough can be handled.
- Knead on lightly-floured surface until smooth and elastic, adding flour only if necessary.
- Cover the ball of dough and let sit 10–15 minutes.
- Roll into 14x16-inch rectangle.
- Spread with slivered pepperoni, cheese, and herbs of your choice.
- Sprinkle liberally with fresh grated black pepper.
- Roll as you would a jellyroll, sealing edge by pinching. Form the roll into a circle.
- Put dough in a 14-inch Dutch oven. Let rise. Start baking breads slightly before reaching the "double" stage—as the oven heats, the dough continues to rise.
- Place 11 hot charcoal briquettes on bottom and 17 on top.
- When bread is ⅔ baked, take off bottom coals.
- Brush with melted butter.
- Place dough in a well-greased round pan. A cast-iron frying pan works well.
- Let rise for 1 hour.
- Bake at 375°F for 1 hour.
- Brush with melted butter.
tips:
- Rising bread requires warmth. Cool or dry weather inhibits the process. When outside temperatures are too cool for breads to rise, place 3–4 hot coals on top of the oven with bread inside. If it's windy, provide a windbreak.
