id: us-denver-omelet
title: Denver Omelet
summary: The Denver omelet is a bit like the Spanish omelet, but with different non-egg ingredients.
origin:
  country: US
course: breakfast
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 1
difficulty: 2
techniques:
- sauteing
ingredient_groups:
- items:
  - {ingredient: egg, qty: 4, note: large}
  - {ingredient: onion, unit: cup, qty: 1}
  - {ingredient: red-bell-pepper, unit: cup, qty: 0.5}
  - {ingredient: ham, unit: cup, qty: 0.5}
  - {ingredient: bacon, unit: slice, qty: 8, prep: drained and crumbled}
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: black-pepper, unit: tsp, qty: 0.5}
  - {ingredient: hot-sauce, optional: true}
steps:
- Melt butter in a large skillet or on a griddle.
- Sauté onion, bell pepper, ham and bacon in the butter until the onion starts to become translucent.
- In a small bowl, whip the eggs lightly. Add salt, pepper, and hot sauce if desired.
- Slowly stir the eggs into the mixture in the skillet.
- Lightly brown on one side.
- Flip over and lightly brown other side.
