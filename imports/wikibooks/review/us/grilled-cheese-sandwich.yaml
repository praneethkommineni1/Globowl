id: us-grilled-cheese-sandwich
title: Grilled Cheese Sandwich
summary: ':See: Grilled Cheese Sandwich A toasted cheese sandwich works well as an everyday lunch. It goes well with soda (pop) or tomato soup. Quality greatly depends on ingredient selection and cooking temperature. A good toasted cheese sandwich has a crispy outside and is not mushy.'
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
