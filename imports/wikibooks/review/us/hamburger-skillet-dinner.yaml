title: Hamburger Skillet Dinner
summary: The original contributor of this recipe provided the following anecdote:"This was the first thing I could cook. I learned to make it staying with a friend as I was leaving the Navy. For years I have called it 'Keith's Whats-it.'"
origin:
  country: US
