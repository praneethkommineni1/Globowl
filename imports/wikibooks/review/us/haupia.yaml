id: us-haupia
title: Haupia
alternate_names:
- Hawaiian Coconut Pudding
summary: Haupia is a Hawaiian pudding made of coconut milk and cornstarch (originally Polynesian arrowroot starch).
origin:
  country: US
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: coconut-milk, unit: cup, qty: 3}
  - {ingredient: sugar, unit: cup, qty: 0.5}
  - {ingredient: salt, qty: 1}
  - {ingredient: cornstarch, unit: cup, qty: 0.5}
steps:
- Mix coconut milk with sugar and salt over a medium heat.
- Slowly add cornstarch and stir until thickened.
- Pour into a pan or square form.
- Cool for 1 hour or until fully set.
- Unmold and cut into squares.
