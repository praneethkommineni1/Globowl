difficulty: 2
techniques:
- grilling
ingredient_groups:
- items:
  - {ingredient: butter, unit: cup, qty: 0.5, prep: softened}
  - {ingredient: parsley, unit: tbsp, qty: 2}
  - {ingredient: chives, unit: tbsp, qty: 2}
  - {ingredient: thyme, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: cayenne, unit: tsp, qty: 0.25}
  - {ingredient: corn-kernels, qty: 7, prep: husks and silks carefully removed}
steps:
- Combine all ingredients except corn in small bowl. Mix well.
- Measure about 1 tablespoon of the mixture and spread over each ear of corn.
- Wrap each ear of corn in heavy foil.
- Grill over medium heat 10–15 minutes, or until tender.
