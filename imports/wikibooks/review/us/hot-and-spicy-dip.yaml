difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 2}
  - {ingredient: lemon-juice, unit: tbsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: olive-oil, unit: cup, qty: 2}
  - {ingredient: ketchup, unit: cup, qty: 0.25}
  - {ingredient: worcestershire-sauce, unit: tsp, qty: 1}
  - {ingredient: hot-sauce, unit: tsp, qty: 1}
  - {ingredient: scallion, unit: tbsp, qty: 2}
  - {ingredient: cayenne, unit: tsp, qty: 0.5}
steps:
- Combine the eggs, lemon juice and salt in a blender. Blend briefly.
- While motor is running, add oil in a slow, steady stream until the mixture has emulsified into a mayonnaise.
- Transfer to a bowl and add the remaining ingredients.
- Season with salt and pepper to taste.
