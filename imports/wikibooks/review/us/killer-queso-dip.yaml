title: Killer Queso Dip
summary: Queso (literally "cheese" in Spanish), also known as chile con queso, is a common dip found in southwestern and Tex-Mex cooking.
origin:
  country: US
course: starter
authenticity: unassessed
yield:
  servings: 3
  amount: 3 cups
time:
