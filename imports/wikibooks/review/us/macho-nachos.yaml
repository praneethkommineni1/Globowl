steps:
- Stir cayenne pepper into the bean dip to taste. Spread this mixture on chips, and transfer to a baking sheet.
- Sprinkle chips with cheese, and bake at 400°F for 2 minutes or until cheese melts.
- Top with guacamole dip and sour cream; garnish liberally with sliced jalapeño peppers.
