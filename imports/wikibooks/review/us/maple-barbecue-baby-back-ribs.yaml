id: us-maple-barbecue-baby-back-ribs
title: Maple Barbecue Baby Back Ribs
summary: These ribs have beaten some of the best BBQ joints around, including Famous Dave's and Roscoe's, in local competitions.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: pork, qty: 2}
steps:
- Remove membrane on the bottom of the ribs. Season both sides liberally with rib rub and refrigerate at least 1 hour.
- Place enough hickory and applewood chunks in the firebox of a smoker to keep the temperature around 200 °F (95 °C).
- Place ribs in smoker and cook, brushing with barbecue sauce every 1½ hours for 4 hours or until very tender, changing chunks as needed.
- Brush meat side of ribs liberally with sauce and place meat side down on a very, very hot grill until well browned and slightly charred.
- Slice into one-rib portions and serve with additional sauce.
