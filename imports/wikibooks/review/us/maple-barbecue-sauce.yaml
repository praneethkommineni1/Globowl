id: us-maple-barbecue-sauce
title: Maple Barbecue Sauce
summary: This maple barbecue sauce is great with chicken, but it contains sugar in this sauce, so put it on things 10–15 minutes before you take them off the heat.
origin:
  country: US
course: condiment
authenticity: unassessed
