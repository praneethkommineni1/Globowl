id: us-mexican-ribs
title: Mexican Ribs
summary: These ribs use a Southwestern style rub, feature a sauce with a lot of prominent Mexican flavors, and are cooked over mesquite instead of hickory, which isn't very easy to find in the South, however mesquite is.
origin:
  country: US
