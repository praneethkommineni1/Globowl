id: us-new-england-clam-chowder
title: New England Clam Chowder
summary: New England clam chowder is a dairy-based seafood chowder or thick soup originating in the northeastern United States. It is often thickened with a roux, and it usually contains minimal vegetables save for potatoes and onions.
origin:
  country: US
course: soup
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 60
difficulty: 2
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 2}
  - {ingredient: potato, qty: 1, prep: diced, note: medium}
  - {ingredient: onion, qty: 1, prep: diced, note: medium}
  - {ingredient: water, unit: cup, qty: 1}
  - {ingredient: pork, unit: g, qty: 85, prep: diced}
  - {ingredient: milk, qty: 1.5, prep: scalded}
  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: salt, note: to taste}
steps:
- If using frozen clams, drain and reserve liquid.
- Cut hard parts away and keep them separate.
- Sauté salt pork in a heavy iron pot until brown and crisp.
- Remove pork and sauté hard part of clam and onions in hot fat until onion is light brown.
- Stir in flour, then slowly add boiling water, salt, pepper, and diced potato.
- Cover and simmer gently 10 minutes or until potato is tender.
- Add soft parts of clams and liquid.
- Just before serving, stir in scalded milk and butter.
- Heat thoroughly, but not to boiling.
- Serve piping hot with oyster or soda crackers.
