id: us-original-texas-style-chili
title: Original Texas-Style Chili
summary: The original Texas-style chili version of chili con carne contains no vegetables at all, except chili peppers. If using fresh peppers, they should have been prepared by being boiled, peeled, and chopped.
origin:
  country: US
course: main
authenticity: unassessed
