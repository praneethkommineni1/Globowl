id: us-party-mix
title: Party Mix
summary: Party mix is a great recipe for when you have company over. It stores great in a sealed container, and if you're not too picky you can keep it out overnight. Adjust seasonings to your preference.
origin:
  country: US
course: snack
authenticity: unassessed
yield:
  servings: 24
  amount: 24 servings (½ cup each)
time:
  total_min: 90
difficulty: 1
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: butter, unit: tbsp, qty: 6}
  - {ingredient: worcestershire-sauce, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: tsp, qty: 0.75}
  - {ingredient: onion-powder, unit: tsp, qty: 0.5}
steps:
- Heat oven to 250°F (120°C).
- In an ungreased large roasting pan, melt butter in oven.
- Stir in seasonings.
- Gradually stir in remaining ingredients until evenly coated.
- Bake for 1 hour, stirring every 15 minutes.
- Spread on paper towels to cool, about 15 minutes.
- Store in airtight container.
- In large microwavable bowl, microwave butter uncovered on high about 40 seconds or until melted.
- Stir in seasonings.
- Gradually stir in remaining ingredients until evenly coated.
- Microwave uncovered on high 5–6 minutes, thoroughly stirring every 2 minutes.
- Spread on paper towels to cool.
- Store in airtight container.
