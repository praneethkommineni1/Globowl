  - {ingredient: green-peas, qty: 1}
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: mushroom, unit: can, qty: 1, prep: juice reserved}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 1}
