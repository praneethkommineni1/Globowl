difficulty: 2
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: beef, unit: g, qty: 1814}
  - {ingredient: onion, qty: 1, prep: chopped, note: large}
  - {ingredient: garlic, unit: clove, qty: 2, prep: finely chopped}
  - {ingredient: dried-oregano, unit: tsp, qty: 1}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: chili-powder, unit: tsp, qty: 6}
  - {ingredient: tomato, unit: can, qty: 2}
  - {ingredient: salt, note: to taste}
  - {ingredient: water, unit: cup, qty: 2}
steps:
- Brown meat, onion, and garlic in a large skillet.
- Add rest of ingredients and bring to a boil. Lower heat, cover, and simmer for about an hour.
- Skim off grease.
