id: us-pedernales-river-chili
title: Pedernales River Chili
summary: Pedernales River Chili was American President Lyndon Johnson's favorite chili con carne recipe. It was named after the location of his Texas Hill Country ranch. The recipe calls for leaving out the traditional beef suet (on doctor's orders after his heart attack while he was U.S.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 10
  amount: 10–12
time:
