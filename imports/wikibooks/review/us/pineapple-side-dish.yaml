id: us-pineapple-side-dish
title: Pineapple Side Dish
summary: Hot pineapple side dish is a casserole of pineapple with cheese.
origin:
  country: US
course: dessert
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 60
difficulty: 2
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: pineapple, unit: can, qty: 1}
  - {ingredient: sugar, unit: cup, qty: 0.5}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 3}
  - {ingredient: butter, unit: cup, qty: 0.25, prep: melted}
  - {ingredient: cheddar, unit: cup, qty: 1.5, prep: divided}
steps:
- Preheat oven to 350°F (175˚C).
- Grease a 1½ quart (1½ liter) baking dish.
- Drain the pineapple, reserving ¼ cup juice; set aside.
- In a small bowl, combine sugar and flour.
- Add the butter and 1 cup cheese; mix well.
- Gently stir in pineapple.
- Pour into the prepared baking dish.
- Sprinkle crushed crackers on top; drizzle with reserved pineapple juice.
- Bake, uncovered, for 30–35 minutes or until bubbly around the edges.
- Remove from oven and sprinkle with remaining cheese.
