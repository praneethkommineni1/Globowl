id: us-pumpkin-pie
title: Pumpkin Pie
summary: Serve your pumpkin pie warm or cold, topped with whipped cream or not!
origin:
  country: US
course: dessert
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 120
