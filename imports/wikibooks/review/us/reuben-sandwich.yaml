id: us-reuben-sandwich
title: Reuben Sandwich
summary: The Reuben or Reuben sandwich is a grilled or toasted sandwich made with corned beef, sauerkraut, Swiss cheese, and Russian dressing. It is typically made with rye bread though originally it may have been served on pumpernickel bread. The origins of the Reuben are contested.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: beef, unit: g, qty: 227}
  - {ingredient: sauerkraut, unit: cup, qty: 0.25}
  - {ingredient: onion, unit: tbsp, qty: 2}
  - {ingredient: white-bread, unit: slice, qty: 2}
  - {ingredient: parsley}
  - {ingredient: butter, unit: tbsp, qty: 1}
steps:
- Combine the sauerkraut, onion, and parsley.
- Spread the dressing on two slices bread.
- Pile layers of corned beef, cheese, and sauerkraut mixture on one slice.
- Add second slice of bread.
- Butter the outside of the bread.
- Grill until lightly browned, roughly 5–10 minutes.
tips:
- The Reuben has a "sister" sandwich, the Rachel, which is made with pastrami or turkey in place of corned beef (and sometimes coleslaw in place of sauerkraut).
- A Georgia Reuben is a Reuben made with turkey and coleslaw instead of sauerkraut.
- A Reuben served in a Jewish delicatessen would not contain cheese or butter, as dietary laws forbid meat and dairy in the same dish.
