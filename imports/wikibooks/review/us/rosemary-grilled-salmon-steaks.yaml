steps:
- Combine the oil, vinegar, rosemary, and pepper. Add salmon steaks, and marinate for 15 minutes.
- Place the steaks on a hot grill, cooking on each side for 3 minutes until flaky.
tips:
- Use cedar/alder planks or charcoal for added flavor.
