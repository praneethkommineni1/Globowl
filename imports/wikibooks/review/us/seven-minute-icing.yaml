  - {ingredient: sugar, unit: cup, qty: 1}
  - {ingredient: water, unit: tbsp, qty: 3}
  - {ingredient: baking-powder, unit: tsp, qty: 0.5}
steps:
- Put the egg white, sugar, and water in the top of a double boiler.
- Place over boiling water and beat with a rotary egg beater seven minutes.
- Then add baking powder and flavoring.
- Remove from heat and beat until thick.
- Spread in swirls over cake.
