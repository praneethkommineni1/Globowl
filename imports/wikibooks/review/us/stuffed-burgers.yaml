id: us-stuffed-burgers
title: Stuffed Burgers
summary: Stuffed burgers are gaining popularity because you don't really know what you're gonna bite down on.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
