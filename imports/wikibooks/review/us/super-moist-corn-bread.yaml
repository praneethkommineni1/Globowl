id: us-super-moist-corn-bread
title: Super Moist Corn Bread
summary: Super Moist Corn Bread.
origin:
  country: US
course: bread
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 60
difficulty: 1
equipment:
- Dutch oven (optional)
- 8-inch square baking pan, greased
- Whisk
- Toothpick
ingredient_groups:
- items:
  - {ingredient: cornmeal, unit: cup, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 1}
  - {ingredient: baking-powder, unit: tsp, qty: 2}
  - {ingredient: baking-soda, unit: tsp, qty: 0.5}
  - {ingredient: brown-sugar, unit: cup, qty: 0.25, optional: true}
  - {ingredient: milk, unit: cup, qty: 0.5}
  - {ingredient: yogurt, unit: cup, qty: 0.5}
  - {ingredient: egg, qty: 1, prep: lightly beaten}
  - {ingredient: butter, unit: cup, qty: 0.25}
steps:
- Preheat oven to 425°F (220°C). If using a Dutch oven, preheat with 16–18 glowing charcoal briquettes, with 3 times as many on the top as on the bottom.
- In a large bowl, mix cornmeal, flour, baking powder, baking soda, and brown sugar, if used.
- In another bowl, whisk together the milk, yogurt, egg, and melted butter or olive oil.
- Gradually add the dry mixture to the wet mixture and stir until just combined, no longer.
- Immediately pour into the greased pan and bake for 15–20 minutes, or until a toothpick inserted in the center comes out clean.
tips:
- Over-mixing after adding together the liquid and dry mixtures will toughen the batter!
