id: us-switchel
title: Switchel
alternate_names:
- Ginger Water
summary: Switchel, also known as ginger water or haymaker's punch, is a sweetened beverage made from ground ginger, apple cider vinegar, sugar or other sweeteners and water.
origin:
  country: US
course: drink
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 10
difficulty: 1
ingredient_groups:
- name: Variation I
  items:
  - {ingredient: sugar, unit: cup, qty: 1}
  - {ingredient: ground-ginger, unit: tbsp, qty: 1}
  - {ingredient: water, qty: 1}
  - {ingredient: cider-vinegar, unit: cup, qty: 1}
- name: Variation II
  items:
  - {ingredient: cider-vinegar, unit: cup, qty: 0.667}
steps:
- Dissolve sugar/syrup and ground ginger in the water.
- Stir in the apple cider vinegar
- Chill or serve over ice cubes. Shake well before serving.
tips:
- Some traditional recipes have used maple syrup, honey and/or molasses, separately or in combination, as sweeteners. The ratio of sweetener and vinegar to water vary widely in traditional and modern recipes.
- A small amount of oatmeal is sometimes added to give the beverage more body and to add to the flavor.
