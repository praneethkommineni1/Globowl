id: us-tortilla-soup
title: Tortilla Soup
summary: Tortilla soup is a traditional southwestern dish and an excellent way to finish tortillas that have begun to go stale. It works well as a soup before a meal or as the meal itself. Turkey or pork may be used in place of chicken.
