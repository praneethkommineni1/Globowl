id: us-traditional-tuna-casserole
title: Traditional Tuna Casserole
summary: Traditional tuna casserole is a simple, quick-to-make meal, mentioned by Garrison Keillor on A Prairie Home Companion.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 4
  amount: 4–8
