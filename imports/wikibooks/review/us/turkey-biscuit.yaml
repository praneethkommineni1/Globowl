id: us-turkey-biscuit
title: Turkey Biscuit
summary: This recipe is designed for using the leftover turkey after a holiday meal, such as Thanksgiving or Christmas dinner.
origin:
  country: US
course: main
authenticity: unassessed
yield:
  servings: 1
