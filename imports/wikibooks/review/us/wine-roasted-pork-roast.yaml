ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: pork, qty: [4, 5]}
  - {ingredient: onion, qty: 1, prep: chopped, note: large}
  - {ingredient: red-wine, unit: cup, qty: 1.5}
steps:
- Heat olive oil in 10-inch Dutch oven over campfire.
- Rub seasoning on roast.
- Add roast to Dutch oven, turning to brown on all sides.
- Add onion, sauté 5 minutes.
- Pour wine over roast.
- Cover and cook slowly for three hours over fire.
