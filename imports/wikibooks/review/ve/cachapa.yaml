id: ve-cachapa
title: Cachapa
alternate_names:
- Venezuelan Corn Pancakes
summary: Cachapas are traditionally made with fresh corn, and are a summer favorite, but this easy recipe uses canned cream corn, pancake mix, and whatever cheese you have on hand. Try this simple appetizer for a taste of Venezuela whenever you like.
origin:
  country: VE
course: starter
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 0.25}
  - {ingredient: egg, qty: 1}
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: sugar, unit: tbsp, qty: 2, note: to taste}
  - {ingredient: cheese}
steps:
- Blend all the ingredients together in a blender. The mix should become thick and heavy. If not, add more corn.
- Shape the mix into small pancakes approximately ½ inch (1.5 cm) thick and about 5 inches (13 cm) in diameter. Let them cook on medium heat for about 1 minute on each side, or until small bubbles form on the top.
- Cachapas should be served hot and may be accompanied with cheese (feta cheese is one option, Mexican white cheese "Cotija", Venezuelan or Colombian "Queso Blanco" ,"Queso de Mano" or "Queso Guayanes" where available).
