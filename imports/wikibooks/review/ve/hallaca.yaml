id: ve-hallaca
title: Hallaca
alternate_names:
- Venezuelan Stuffed Corn Dough
summary: Hallaca (pronounced ah-YA-kah) is the main Venezuelan Christmas dinner dish.
origin:
  country: VE
course: main
authenticity: unassessed
yield:
  servings: 20
  amount: 20 hallacas
time:
  total_min: 1
difficulty: 1
