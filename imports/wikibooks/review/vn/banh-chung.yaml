id: vn-banh-chung
title: Bánh Chưng
summary: Bánh chưng (literally "steamed cake") is a traditional Vietnamese dish made from glutinous rice, mung beans and pork, all wrapped in lá dong (Stachyphrynium placentarium) and tied tightly with strings. It is traditionally eaten during Lunar New Year ().
