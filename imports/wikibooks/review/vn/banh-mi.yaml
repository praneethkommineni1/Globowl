id: vn-banh-mi
title: Bánh Mì
summary: means 'bread' in Vietnamese, and it often refers to a type of Vietnamese sandwich. It may have started as a 'kitchen sink' recipe in Vietnam, where various leftovers would be tossed into a sandwich to finish them up (like a po' boy).
