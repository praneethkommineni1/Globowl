id: vn-bo-bia
title: Bò bía
summary: Bò bía is the southern Vietnamese variant of popiah, a Fujianese/Teochew-style fresh spring roll filled with an assortment of fresh, dried, and cooked ingredients, eaten during the Qingming Festival and other celebratory occasions.
