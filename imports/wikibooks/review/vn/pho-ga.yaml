id: vn-pho-ga
title: Phở Gà
alternate_names:
- Vietnamese Chicken Noodle Soup
summary: Pho ga is a Vietnamese chicken noodle soup dish. It is considered one of the culinary gems of Vietnamese cuisine, available within a mile radius of almost every person in the community of Little Saigon, a Vietnamese enclave located in Orange County, California.
origin:
  country: VN
course: soup
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
ingredient_groups:
- name: Seasoning pouch
  items:
  - {ingredient: fennel-seeds, unit: tsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: star-anise, qty: 3}
  - {ingredient: green-cardamom-pods, qty: [1, 2]}
  - {ingredient: cinnamon-stick, qty: 0.5}
  - {ingredient: whole-cloves, qty: 3}
- name: Soup
  items:
  - {ingredient: chicken, qty: 1, note: small}
  - {ingredient: chicken-stock, unit: cup, qty: 12}
  - {ingredient: ginger, unit: slice, qty: [3, 4]}
  - {ingredient: onion, qty: 1, prep: peeled, note: medium}
  - {ingredient: salt, unit: tbsp, qty: 1}
  - {ingredient: fish-sauce, note: to taste}
- name: Serving
  items:
  - {ingredient: noodles}
  - {ingredient: cilantro}
  - {ingredient: basil, prep: torn}
  - {ingredient: bean-sprouts}
  - {ingredient: hoisin-sauce}
