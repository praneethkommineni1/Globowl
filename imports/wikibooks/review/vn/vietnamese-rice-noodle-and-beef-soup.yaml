id: vn-vietnamese-rice-noodle-and-beef-soup
title: Vietnamese Rice Noodle and Beef Soup
alternate_names:
- Bún bò Huế
summary: Bún bò Huế is a popular Vietnamese noodle soup that originated in the old imperial capital of Huế.
origin:
  country: VN
course: condiment
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- A large stockpot (8–10 L)
- A large mixing bowl (2.5 L)
- A small frying pan
techniques:
- boiling
- sauteing
- simmering
