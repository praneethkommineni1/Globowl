id: xx-akpu
title: Akpu
summary: Akpu is a traditional swallow made from fermented cassava and widely consumed in southeastern Nigeria. It is a staple food among the Igbo people and is commonly served with soups such as onugbu soup, ora soup, oha soup, and egusi soup.
origin:
  country: XX
