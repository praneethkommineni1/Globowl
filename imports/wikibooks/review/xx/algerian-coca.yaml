id: xx-algerian-coca
title: Algerian Coca
summary: Algerian coca (كوكة) is a savory pastry that is popular in Algeria, particularly in the city of Oran. It is similar to a thin-crust pizza or a flatbread, often topped with a variety of ingredients such as onions, tomatoes, peppers, and sometimes meat or fish.
