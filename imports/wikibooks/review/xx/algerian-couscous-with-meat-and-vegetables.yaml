title: Algerian Couscous with Meat and Vegetables
summary: '__notoc__ Algerian couscous (Arabic: كسكس, Berber: ⵙⴽⵙⵓ) is a traditional Algerian dish that holds a central place in Algerian cuisine. It is a staple food in Algeria, often served during family gatherings, religious celebrations and special occasions.'
