id: xx-arisa-pitha
title: Arisa Pitha
alternate_names:
- Fried Indian Sweet Rice Pastry
summary: Arisa pitha is a sweet filled pancake from Odisha, India. It is made using sugar and a sweet pitha. A thick jantani (semi-solid mixture) of rice flour and sugar or jaggery is made into small semi-flat round shapes and fried in ghee or oil until golden brown.
