id: xx-arjoli
title: Arjoli
alternate_names:
- Maltese Herbed Bread Dip
summary: Arjoli (alternately spelled Ajjoli) is a Maltese dip or spread. It is typically held together with bread.
origin:
  country: XX
course: starter
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
ingredient_groups:
- items:
  - {ingredient: basil, prep: minced}
  - {ingredient: mint, prep: minced}
  - {ingredient: parsley, prep: minced}
  - {ingredient: garlic, unit: clove, qty: 4, prep: diced}
  - {ingredient: olives, prep: diced}
  - {ingredient: capers, prep: chopped}
  - {ingredient: tomato-paste, unit: tsp, qty: 1}
steps:
- Let the galletti soak in water overnight to soften.
- Combine soaked galletti and all remaining ingredients in a mortar and pestle. Crush to a paste consistency.
tips:
- Use dry Maltese bread instead of the galletti.
- Add one or two sun-dried tomatoes for a spicy taste.
- Another Maltese version of Ajjoli (alternative spelling) mixes lots of diced tomato flesh (no skin or seeds) with very finely diced garlic and plenty of olive oil which should be left for flavors to blend for at least an hour.
