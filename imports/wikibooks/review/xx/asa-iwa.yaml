id: xx-asa-iwa
title: Asa iwa
summary: Asa Iwa is a traditional Efik cassava dish made from fermented cassava paste that is wrapped in leaves and steamed until firm. It is commonly eaten as a staple food and is often served with soups such as afang soup, edikang ikong, or other vegetable soups.
