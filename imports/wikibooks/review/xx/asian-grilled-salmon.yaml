id: xx-asian-grilled-salmon
title: Asian Grilled Salmon
summary: Many fish work well with Asian-associated flavors of soy sauce, ginger, and curry. Salmon is used here.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Kettle-style charcoal grill
- Blender or food processor
- Gallon-size zip-top plastic bag
- Kitchen towel tied into a roll with kitchen twine and soaked in vegetable oil
- Aluminum foil
- Chimney starter
- Natural chunk or hardwood lump charcoal
ingredient_groups:
- items:
  - {ingredient: soy-sauce, unit: cup, qty: 0.333}
  - {ingredient: white-vinegar, unit: tbsp, qty: 3}
  - {ingredient: red-chili, unit: tbsp, qty: 1}
  - {ingredient: curry-powder, unit: tsp, qty: 2}
  - {ingredient: ginger, unit: tbsp, qty: 1}
  - {ingredient: garlic, unit: clove, qty: 5, prep: smashed and minced}
  - {ingredient: olive-oil, unit: cup, qty: 0.25}
  - {ingredient: brown-sugar, unit: tbsp, qty: 2}
  - {ingredient: black-pepper, unit: tsp, qty: 2}
  - {ingredient: salmon, qty: 4, prep: pin bones removed}
  - {ingredient: basil, unit: tbsp, qty: 2, prep: in chiffonade}
  - {ingredient: cilantro, unit: cup, qty: 0.25}
steps:
- Purée all ingredients except salmon and fresh herbs in blender until smooth. Pour into plastic bag and add salmon; toss to coat. Seal, getting as much air out as possible, and refrigerate up to 4 hours.
- After 4 hours, preheat 4.5 lbs (2 kg) charcoal in chimney. Disperse evenly around the bottom of the grill and reapply grate.
- While charcoal heats, remove salmon from marinade. Discard remaining marinade. Let sit at room temperature until coals have heated.
- Once the grate is hot, quickly swab the grate with the towel. Add salmon to the hottest part, skin side up, and cook 3–5 minutes per side for medium, rotating 90 degrees halfway to get grill marks.
- Remove to a plate and cover tightly with aluminum foil. Let rest 5 minutes.
- Move salmon to warmed individual plates, sprinkle with chopped herbs, and garnish with citrus wedges, if desired. Serve immediately.
tips:
- If you don't know how to use a chimney starter, see the notes in Barbecue Wings.
