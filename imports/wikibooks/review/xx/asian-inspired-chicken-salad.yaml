id: xx-asian-inspired-chicken-salad
title: Asian-Inspired Chicken Salad
summary: This chicken salad is inspired by east and southeast Asian-associated flavors of soy, ginger, sesame, and mango.
origin:
  country: XX
course: salad
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 15
difficulty: 3
techniques:
- blanching
ingredient_groups:
- items:
  - {ingredient: broccoli, unit: cup, qty: 1.5}
  - {ingredient: carrot, unit: cup, qty: 0.5}
  - {ingredient: chicken, qty: 1, prep: cut in strips}
  - {ingredient: ginger, unit: cup, qty: 0.75}
  - {ingredient: mango, qty: 1, prep: 'peeled, seeded, and thinly sliced', optional: true}
steps:
- In large saucepan quickly plunge broccoli and pea pods into boiling water for 30 seconds. Drain vegetables. Quickly rinse with cold water. Drain well.
- In large bowl toss together the blanched broccoli and pea pods, greens, cabbage and carrots.
- Add chicken.
- Drizzle with salad dressing. Toss to coat.
- Arrange on 4 serving plates.
- Top with mango, if desired.
- Serve with crackers.
