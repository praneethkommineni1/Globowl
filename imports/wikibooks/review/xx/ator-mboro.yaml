id: xx-ator-mboro
title: Ator mboro
summary: Ator Mboro (also known as Oto Mboro) is a traditional Efik and Ibibio dish made from unripe bananas cooked in a rich palm-oil sauce with fish, crayfish, and spices. It is valued for its nutritional benefits and is commonly eaten as a main meal.
