id: xx-baklava
title: Baklava
summary: __notoc__ Baklava is a Mediterranean dessert consisting of layers of phyllo dough interspersed with crushed nuts and soaked in sweet syrup. This recipe is modified from one at Allrecipes.
origin:
  country: XX
