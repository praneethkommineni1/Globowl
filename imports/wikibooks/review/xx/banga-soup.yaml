  - {ingredient: salt, note: to taste}
  - {ingredient: ground-crayfish, unit: tbsp, qty: 1}
  - {ingredient: onion, qty: 1, note: small}
  - {ingredient: scent-leaf}
  - {ingredient: water}
steps:
- If using raw palm nuts, boil until soft, then pound lightly and extract the juice using warm water. Strain to remove the chaff. If using canned extract, skip this step.
- Place the assorted meat and dried fish in a pot. Add chopped onions, stock cube, and salt. Add a small amount of water and boil until the meat is tender.
- Pour in the palm nut extract. Add more water if too thick. Stir well and bring to a boil.
- Add ground crayfish and Banga spice mix. Allow to cook uncovered on medium heat for 15–20 minutes, or until the oil begins to rise to the top.
- Add scent leaves (or basil) and cook for another 5 minutes.
- Remove from heat and serve hot with starch, fufu, pounded yam, or rice.
tips:
- Canned palm nut concentrate saves time and is commonly available in African stores.
- Banga spice mix can be homemade or store-bought. A typical mix includes oburunbebe stick, aidan fruit, rohoje, and beletientien.
- You can substitute scent leaves with basil or bitterleaf, depending on availability and taste preference.
- Add fresh pepper if you like it spicy.
- For a richer flavor, include smoked catfish or periwinkle.
- Banga soup is traditionally eaten with starch in Delta state, but pounded yam or eba is common in other regions.
