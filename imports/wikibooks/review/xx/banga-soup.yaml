id: xx-banga-soup
title: Banga Soup
summary: Banga soup is a traditional Nigerian soup made from palm nut extract, typically enjoyed by the Urhobo and Itsekiri people of the Niger Delta. It is rich, flavorful, and often served with starch or other swallow foods.
origin:
  country: XX
course: main
authenticity: unassessed
