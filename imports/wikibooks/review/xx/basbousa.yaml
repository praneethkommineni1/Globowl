title: Basbousa
alternate_names:
- Egyptian Semolina Cake
summary: Basbousa is a delightful Middle Eastern dessert that is known for its rich and moist texture. Made with semolina, coconut, and sweet syrup, this cake is a popular treat enjoyed across many cultures.
