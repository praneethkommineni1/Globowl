id: xx-basic-chai
title: Basic Chai
summary: Traditional chai has numerous variations, depending on which region it is brewed. This is a simple recipe with milk, sugar, and spices.
origin:
  country: XX
course: drink
authenticity: unassessed
yield:
  servings: 2
