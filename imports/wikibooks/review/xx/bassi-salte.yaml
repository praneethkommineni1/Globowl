id: xx-bassi-salte
title: Bassi-Salté
alternate_names:
- Senegalese Couscous with Meat and Vegetables
summary: Bassi salte is a treasured Senegalese delicacy known for its rich flavors. This traditional dish harmoniously combines millet couscous, tender meat, and vibrant greens. To elevate the taste, the addition of sweet ingredients like raisins adds a delightful touch.
