id: xx-bechamel-sauce
title: Béchamel Sauce
alternate_names:
- Louisiannaise
summary: Sauce béchamel is one of the basic sauces of French Cuisine. This variation is used in Louisiana for seafood dishes, especially crab meat.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: onion, qty: 0.25}
  - {ingredient: bay-leaf, qty: 1}
  - {ingredient: butter, unit: tbsp, qty: [1, 2]}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: [1, 2]}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Warm the milk, then add the onion and bay leaf. Steep for 15 minutes.
- Melt the butter in a saucepan.
- Whisk in the flour, and cook on medium to medium-high heat to make a roux.
- Gradually whisk in the milk.
- Cook, stirring constantly, until thick.
- Season with salt and pepper.
