id: xx-beurre-monte
title: Beurre Monté
summary: Beurre monté is a French sauce with many applications; it can be used plain as a dip, cooked in, or adjusted with savory or sweet ingredients. The sauce is simply an emulsion of butter into water, which gives butter a saucier consistency.
origin:
  country: XX
