id: xx-blue-cheese-dressing
title: Blue Cheese Dressing
summary: Adapted from the Buttermilk Ranch Dressing recipe.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 3
  amount: 3 cups (770 g)
time:
  total_min: 1
difficulty: 1
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: lemon-juice, unit: tbsp, qty: 2}
  - {ingredient: buttermilk, unit: cup, qty: 0.667}
  - {ingredient: mayonnaise, unit: cup, qty: 1}
  - {ingredient: sour-cream, unit: cup, qty: 0.75}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: black-pepper, unit: tsp, qty: 0.5}
  - {ingredient: garlic-powder, unit: tsp, qty: 0.5}
  - {ingredient: onion-powder, unit: tsp, qty: 0.5}
steps:
- Combine all ingredients except the blue cheese and whisk until smooth and homogeneous.
- Dice the blue cheese into approximately ½ inch (1 cm) cubes. Most blue cheese is crumbly, so you'll wind up with a lot of crumbs as well as larger chunks.
- Pour the mayonnaise mixture into a serving container and stir in the cubes and crumbs of cheese.
