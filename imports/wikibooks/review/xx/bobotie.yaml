id: xx-bobotie
title: Bobotie
summary: __NOtOC__ Bobotie is a traditional South African dish consisting of spiced minced meat baked with a savory egg-based custard topping.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 90
difficulty: 3
ingredient_groups:
- name: Meat filling
  items:
  - {ingredient: beef, unit: g, qty: 500}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: white-bread, unit: slice, qty: 2}
  - {ingredient: milk, unit: ml, qty: 125}
  - {ingredient: curry-powder, unit: tbsp, qty: 1}
  - {ingredient: ground-turmeric, unit: tsp, qty: 1}
  - {ingredient: fruit-chutney, unit: tbsp, qty: 1}
  - {ingredient: white-vinegar, unit: tbsp, qty: 1}
  - {ingredient: raisins, unit: tbsp, qty: 2}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: black-pepper, note: to taste}
- name: Custard topping
  items:
  - {ingredient: egg, qty: 2}
  - {ingredient: milk, unit: ml, qty: 250}
  - {ingredient: bay-leaf, qty: 2}
steps:
- Soak the bread in the milk and set aside.
- Heat the oil in a frying pan and sauté the onion until soft.
- Add the minced meat and cook until browned.
- Stir in the curry powder, turmeric, chutney, vinegar, raisins, salt, and pepper.
- Squeeze excess milk from the bread and mix the bread into the meat mixture.
- Transfer the mixture to a greased baking dish.
- Beat the eggs with the milk and pour over the meat.
- Place the bay leaves on top.
- Bake at 180°C (350°F) for about 35–40 minutes, or until the custard is set and lightly browned.
- Serve hot with yellow rice, vegetables, or chutney.
tips:
- Bobotie is believed to have originated from Cape Malay cuisine in South Africa.
- The combination of sweet and savory flavors is characteristic of the dish.
- Traditionally, it is served with yellow rice flavored with turmeric.
