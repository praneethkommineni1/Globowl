id: xx-boiled-cocoyam
title: Boiled Cocoyam
summary: Boiled cocoyam, also known as lambo (Yoruba), gwaza (Hausa), and akasi (Igbo) is a typical Nigerian food. It is believed to have a richer taste and higher nutritional value than yam.
origin:
  country: XX
course: main
authenticity: unassessed
