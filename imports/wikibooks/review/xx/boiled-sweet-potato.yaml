id: xx-boiled-sweet-potato
title: Boiled Sweet Potato
summary: Boiled sweet potato is a typical Nigerian food which has a delicious taste when compared to yam or cocoyam. It contains various nutrients.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
