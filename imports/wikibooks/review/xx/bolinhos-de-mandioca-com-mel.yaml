title: Bolinhos de mandioca com mel
summary: Bolinhos de Mandioca com Mel (Cassava Fritters with Honey) is a sweet snack made from grated cassava, shaped into small cakes and fried until golden. The fritters are traditionally served warm and drizzled with honey.
