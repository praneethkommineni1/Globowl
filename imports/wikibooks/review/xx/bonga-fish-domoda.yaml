id: xx-bonga-fish-domoda
title: Bonga Fish Domoda
alternate_names:
- Gambian Fish in Peanut Sauce
summary: Bonga fish domoda is a popular Gambian dish that features bonga fish cooked in a rich peanut-based sauce. It is a flavorful and hearty stew that is enjoyed across Gambia and often served with rice or couscous.
origin:
  country: XX
course: main
authenticity: unassessed
