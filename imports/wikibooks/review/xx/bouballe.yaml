id: xx-bouballe
title: Bouballe
alternate_names:
- Sweetened Matzo Meal Omelette
summary: Bouballe is a Jewish dish traditionally eaten for Passover. It is a sort of sweetened omelette bound with matzo meal and starch .
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 2}
  - {ingredient: cornstarch, unit: tbsp, qty: 1}
  - {ingredient: sugar}
steps:
- Whip the egg whites.
- Add the yolks, then the matzo meal and cornstarch. Mix everything together.
- Cook the mixture like an omelette.
- When cooked, sprinkle with sugar and serve.
tips:
- Before sprinkling the sugar, cut into small squares, so it can be eaten with your fingers.
- Goes well with maple syrup
