title: Boule-Di
alternate_names:
- Senegalese Fish and Rice
summary: Boule-di, also known as boule (pronounced "boo-lay"), is a traditional West African dish that originated in Senegal. It is a hearty and flavorful one-pot meal made with a combination of fish, vegetables, and rice.
