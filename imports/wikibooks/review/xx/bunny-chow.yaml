id: xx-bunny-chow
title: Bunny Chow
summary: __NOtOC__ Bunny chow is a South African street food consisting of a hollowed-out loaf of bread filled with curry. Originating in Durban, it is commonly prepared with mutton, chicken, beef, or bean curry.
