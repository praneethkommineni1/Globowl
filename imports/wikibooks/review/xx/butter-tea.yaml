id: xx-butter-tea
title: Butter Tea
summary: Butter tea, known as Po Cha, is a traditional drink of the Tibetans and is also consumed in Bhutan. Butter tea is an indispensable part of Tibetan life. Before work, a Tibetan will down several bowlfuls of this tangy beverage, and it is always served to guests.
origin:
  country: XX
course: drink
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 20
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: milk, unit: cup, qty: 3}
  - {ingredient: butter, unit: tbsp, qty: 2}
  - {ingredient: salt, note: to taste}
steps:
- Boil tea with milk for 2–10 minutes, depending upon the strength of tea desired
- Strain into tea cups.
- Add butter and salt. Stir thoroughly, ideally by carefully using a blender, and serve.
