id: xx-calamansi-juice-drink
title: Calamansi Juice Drink
summary: Calamansi juice drink is a Filipino version of lemonade because calamansi is readily available in the marketplace.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: sugar, unit: tbsp, qty: 0.5}
steps:
- Halve the calamansi with a sharp knife.
- Use your hands to squeeze the juice from the calamansi.
- Combine the juice with the cold water in a glass.
- Stir in sugar until dissolved.
- Add ice cubes.
tips:
- This drink can also be served hot.
- It is a good source of Vitamin C.
