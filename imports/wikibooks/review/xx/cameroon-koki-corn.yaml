  - {ingredient: red-palm-oil, unit: cup, qty: 0.333}
  - {ingredient: corn-kernels, unit: cup, qty: 4}
  - {ingredient: onion, qty: 0.5}
  - {ingredient: cornmeal, unit: cup, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: bouillon-cube, qty: 1}
