id: xx-camotes-enmielados
title: Camotes Enmielados
alternate_names:
- Mexican Sweet Yams
summary: Camotes enmielados, also known as camotes con pilocilo, or camotes enmielados al horno, camotes con piloncilo al horno, is a baked, or stovetop, dessert-style Mexican yam/sweet potato dish. It is traditionally a home-cooked food, not typical restaurant fare.
origin:
  country: XX
