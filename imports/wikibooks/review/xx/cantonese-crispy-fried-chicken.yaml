id: xx-cantonese-crispy-fried-chicken
title: Cantonese Crispy Fried Chicken
summary: Crispy fried chicken is a Hong Kong/Cantonese specialty.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 4
