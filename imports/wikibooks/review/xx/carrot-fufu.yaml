id: xx-carrot-fufu
title: Carrot Fufu
summary: Carrot fufu is a swallow made from carrot, common in Nigeria due to its low carbohydrate content. It is easy to make once the carrot is blended smoothly.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 15
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: carrot, qty: 4, prep: chopped}
  - {ingredient: water, unit: cup, qty: 0.5}
steps:
- Blend the chopped carrot until smooth.
- Transfer the carrot to the cheesecloth, and squeeze out all the water from the carrot paste.
- Cook the carrot paste in a pot over medium heat for 5 minutes.
- Stir in the psyllium husk to thicken and bind the fufu.
tips:
- The function of the psyllium husk is to make the carrot fufu moldable, and this give it the texture of eba.
- Cut or scrape off any dark marks on the carrot.
