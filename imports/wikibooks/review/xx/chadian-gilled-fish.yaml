id: xx-chadian-gilled-fish
title: Chadian Gilled Fish
summary: Chadian grilled fish is a popular dish in Chad known for its simplicity and flavorful taste. Fresh fish is marinated with local spices, then grilled to perfection, resulting in a delicious and aromatic meal.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
