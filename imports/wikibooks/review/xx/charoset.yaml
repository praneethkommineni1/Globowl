id: xx-charoset
title: Charoset
alternate_names:
- Maghrebi
summary: Maghrebi charoset is a variety of charoset served during the Jewish celebration of Passover by Jews from Northwest Africa. Serve as part of the seder. The northwest African tradition uses bitter greens such as endive rather than horseradish with the Charoseth.
