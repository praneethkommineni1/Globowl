id: xx-cherbet-meliana
title: Cherbet Meliana
alternate_names:
- Algerian Cherry Beverage
summary: Cherbet Meliana () is a refreshing Algerian drink. As the name indicates, the drink originates from Meliana, a town located in Aïn Defla Province, northwestern Algeria, where it is considered a traditional drink.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 10
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: sugar, unit: kg, qty: 1}
steps:
- Mix sugar cubes with warm water. Add cherry juice and broken pits.
- Bring to a boil over high heat while skimming until the syrup drips into a thin stream.
- Remove from heat and strain. Bottle. Serve with sparkling or still water.
tips:
- This beverage can also be prepared with lemon, grape, or pomegranate juice.
