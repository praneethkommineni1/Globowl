title: Chereh Tamba
alternate_names:
- Gambian Groundnut Stew
summary: Chereh tamba, also known as Gambian groundnut stew, is a flavorful and hearty stew that showcases the use of groundnuts (peanuts) as a key ingredient. It is a traditional Gambian recipe that highlights the rich flavors of the region.
