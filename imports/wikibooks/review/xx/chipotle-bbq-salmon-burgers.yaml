id: xx-chipotle-bbq-salmon-burgers
title: Chipotle BBQ Salmon Burgers
summary: Chipotle BBQ Salmon Burgers.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: salmon, unit: g, qty: 567, prep: cut into 2-inch cubes}
  - {ingredient: olive-oil}
  - {ingredient: chipotle-in-adobo, qty: 3, prep: finely minced}
  - {ingredient: chipotle-in-adobo, unit: tbsp, qty: 3}
  - {ingredient: barbecue-sauce, unit: tbsp, qty: 3}
  - {ingredient: butter, unit: tbsp, qty: 3, prep: cut into small cubes}
steps:
- Run salmon cubes through a meat grinder on medium setting. Mix with chipotle, sauce, butter, and adobo.
- Form into 4 equal patties, about ¾ inch thick. Brush with extra-virgin olive oil and season both sides liberally with seasoning. Set aside.
- Preheat grill pan to medium high. Rub with olive oil, then add salmon patties. Grill 5–6 minutes per side for medium rare, or until desired doneness is achieved.
- Brush buns with oil. Place a patty on and close. Serve immediately with desired condiments.
tips:
- You could try this with a standard grill, but they may not stay together. To cook on a standard grill, follow same directions only with a standard grill.
- An excellent way to cook them on a grill is by planking. Just soak 2 untreated cedar, applewood, hickory, or mesquite planks in cold water for 1 hour. Air dry overnight, then place on the sides of one burner heated to medium low. Add 2 patties to each plank and insert a probe thermometer into one of them. Cover and cook until temperature is 140°F.
