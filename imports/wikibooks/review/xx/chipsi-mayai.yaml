id: xx-chipsi-mayai
title: Chipsi mayai
summary: Chipsi Mayai (Swahili for "chips and eggs"), also known as zege, is the most popular street food found all over Tanzania. The dish was invented in the streets of Dar es Salaam. In its most basic form, chipsi mayai is a simple potato-egg omelette.
