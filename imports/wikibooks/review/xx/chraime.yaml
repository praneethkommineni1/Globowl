title: Chraime
alternate_names:
- Sephardic Fish and Vegetable Casserole
summary: Chraime is a popular Sephardic Jewish fish and vegetable casserole often eaten as the first course at Rosh Hashanah. It can also be eaten as an entrée, and is normally served with challah.
