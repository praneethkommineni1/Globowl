- name: Marinating
  items:
  - {ingredient: chicken, prep: 'breasts, or wings'}
  - {ingredient: coconut, unit: can, qty: 1}
  - {ingredient: lime, qty: 1, prep: zested and juiced}
  - {ingredient: mint, unit: bunch, qty: 1, prep: chopped}
