ingredient_groups:
- items:
  - {ingredient: sausage, unit: g, qty: 550}
  - {ingredient: bacon, unit: g, qty: 250, prep: chopped into 3 cm pieces}
  - {ingredient: chicken-stock, unit: ml, qty: 300}
  - {ingredient: potato, qty: 6}
  - {ingredient: onion, qty: 2, note: medium}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- Completely submerge bacon, onions, and sausages in broth, then boil for about 5 minutes.
- Add the potatoes, cutting into bite-sized pieces if necessary, then add the rest of the stock.
- Return to the boil and simmer for about 1 hour, or until the potatoes have started to disintegrate, thickening the broth.
- Add salt and pepper to serve.
