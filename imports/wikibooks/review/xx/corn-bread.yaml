id: xx-corn-bread
title: Corn Bread
alternate_names:
- Lombardy
summary: 'See also: Cornbread, Cornbread 2 Corn bread is a traditional bread recipe from the mountain areas of Lombardy, in Italy, where corn flour was much cheaper and easier to obtain than wheat. In its native area it''s called “pan giald”, lombard for “yellow bread”.'
origin:
  country: XX
course: main
authenticity: unassessed
