id: xx-corn-pone
title: Corn Pone
summary: Corn pone is a small simple corn cake, similar to a johnnycake. It was originally cooked in ashes, and introduced to early European settlers by indigenous Americans.
origin:
  country: XX
course: bread
authenticity: unassessed
yield:
  servings: 1
