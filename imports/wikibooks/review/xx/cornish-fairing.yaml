id: xx-cornish-fairing
title: Cornish Fairing
summary: Cornish fairings are traditional Cornish spiced biscuits with a real kick.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- 1 sieve
- 1 mixing bowl
- 1 wooden spoon
- 1 baking tray
- 1 rolling pin
- 1 cooling rack
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: g, qty: 110}
  - {ingredient: butter, unit: g, qty: 60}
  - {ingredient: caster-sugar, unit: g, qty: 60}
  - {ingredient: baking-powder, unit: tsp, qty: 1}
  - {ingredient: golden-syrup, unit: tsp, qty: 2}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: mixed-spice, unit: tsp, qty: 1}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 1}
steps:
- Preheat the oven to 180°C (350°F or Gas Mark 4).
- Sift the flour into a mixing bowl, then rub in the butter.
- Sift in the caster sugar, baking powder, and spices, then mix well.
- Add the syrup to the mixture, then stir in until it becomes a dough.
- Roll the dough out into little balls about the size of walnuts.
- Place the balls on a baking tray, then bake for 15 minutes.
- Allow the fairings to cool for a few minutes on the cooling rack before serving.
