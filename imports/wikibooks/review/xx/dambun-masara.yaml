id: xx-dambun-masara
title: Dambun Masara
summary: Dambun masara is a traditional Hausa dish made from cornmeal that is steamed and mixed with vegetables and spices. This savory dish has a fluffy, crumbly texture and is a popular choice for a snack or light meal in northern Nigeria.
origin:
  country: XX
