id: xx-east-african-beef-pilaf
title: East African Beef Pilaf
summary: This beef pilaf is a fragrant East African rice dish made by cooking the rice with meat or vegetables, ginger, garlic, and spices. It is usually served with kachumbari, which is a mixture of tomatoes, onions, and lettuce.
