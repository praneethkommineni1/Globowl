title: Easy Christmas Fruit Cake
summary: This Christmas fruit cake can be eaten a day after making, with no fuss no waiting around for it to age. The original contributor left the following anecdote:"This recipe was written out by my husband's sister who passed away at a very young age of 37, 12 Christmases ago.
