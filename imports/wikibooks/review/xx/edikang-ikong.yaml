id: xx-edikang-ikong
title: Edikang Ikong
summary: Edikang Ikong Soup is a Nigerian most popular delicacy that is prepared using Pumpkin Leaf and Water leaf. It is highly nutritional and very easy to prepare. Edikang Ikong translates as Cooked Vegetable Soup in English language.
origin:
  country: XX
