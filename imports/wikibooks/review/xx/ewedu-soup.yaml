id: xx-ewedu-soup
title: Ewedu Soup
alternate_names:
- Yoruba Style
summary: __notoc__ Ewedu soup is a traditional Yoruba soup made from the leaves of the jute plant, which gives it a slippery, mucilaginous texture. It is a beloved dish in Nigeria, often served with fufu, pounded yam, or amala.
