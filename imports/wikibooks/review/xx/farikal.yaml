title: Fårikål
alternate_names:
- Norwegian Lamb and Cabbage Stew
summary: Fårikål is a stew using cabbage and mutton shoulder or sometimes lamb. It is the national dish of Norway.
origin:
  country: XX
course: main
authenticity: unassessed
