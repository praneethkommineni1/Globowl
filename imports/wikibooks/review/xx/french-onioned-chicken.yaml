ingredient_groups:
- items:
  - {ingredient: egg, prep: beaten}
  - {ingredient: chicken}
  - {ingredient: onion, prep: crushed}
  - {ingredient: paprika, optional: true}
steps:
- Preheat the oven to 200°C.
- Dip the chicken into the beaten, then dip it into the crushed onions. Make sure the chicken is well-coated, then transfer to parchment-lined baking sheet.
- Bake the chicken for 20 minutes or until it's no longer pink on the inside.
- Serve hot.
