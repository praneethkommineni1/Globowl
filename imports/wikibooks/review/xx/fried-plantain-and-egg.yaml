id: xx-fried-plantain-and-egg
title: Fried Plantain and Egg
summary: Fried plantain and egg is a Nigerian dish mostly eaten as breakfast.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 30
difficulty: 1
equipment:
- Frying pan
- Frying spoon
- Bowl
- Knife
- Fork
ingredient_groups:
- items:
  - {ingredient: plantain}
  - {ingredient: vegetable-oil}
  - {ingredient: egg}
  - {ingredient: salt}
steps:
- Peel and slice the plantain. Season with salt and toss to mix.
- Heat a little oil in a frying pan. When hot, add the plantain. Cook, turning occasionally, until browned. Remove the plantain and set aside.
- Whisk the egg with a pinch of salt. Add the egg to the pan, and cook like scrambled eggs.
- Serve the eggs and plantain together.
