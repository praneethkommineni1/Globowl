id: xx-gambian-yassa-poulet
title: Gambian Yassa Poulet
summary: Yassa poulet is a delightful and tangy Gambian dish that combines succulent chicken with a vibrant onion and citrus marinade. This dish is known for its distinctive flavors and is a popular choice for special occasions and gatherings.
