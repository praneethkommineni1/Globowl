id: xx-gboma-dessi-and-akoume
title: Gboma Dessi and Akoume
alternate_names:
- Togolese Spinach Stew with Corn Swallow
summary: Gboma dessi is also known as "sauce feuille" and is a staple food eaten among the West Africans, specifically in Togo. It can be cooked with meat or chicken.
origin:
  country: XX
course: main
authenticity: unassessed
