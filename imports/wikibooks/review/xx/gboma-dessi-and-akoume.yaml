  - {ingredient: onion, qty: 3, prep: thinly sliced, note: medium}
  - {ingredient: garlic, qty: 3, prep: finely minced, note: medium}
  - {ingredient: ground-ginger, unit: tbsp, qty: 2, optional: true}
  - {ingredient: beef, unit: g, qty: 1361, prep: cut into large cubes}
