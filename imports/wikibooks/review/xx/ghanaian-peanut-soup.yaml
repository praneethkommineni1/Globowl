id: xx-ghanaian-peanut-soup
title: Ghanaian Peanut Soup
alternate_names:
- Nkatenkwan
summary: Nkatenkwan, a Ghanaian stew, is a comforting and flavorful dish that blends the nuttiness of peanuts or groundnuts with the richness of palm oil, tomatoes, mixed chiles, onions, garlic, and either meat or fish.
