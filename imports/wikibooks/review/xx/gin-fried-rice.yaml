id: xx-gin-fried-rice
title: Gin Fried Rice
summary: Gin adds a spectacular finish to plain fried rice. Prepare this tableside next time you have guests and they will be amazed.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: long-grain-rice, unit: cup, qty: 5}
  - {ingredient: salt}
  - {ingredient: black-pepper}
  - {ingredient: egg, qty: 4, prep: 'scrambled, cooked, and roughly chopped'}
  - {ingredient: soy-sauce, unit: tbsp, qty: 2}
  - {ingredient: chicken, unit: cup, qty: 2}
  - {ingredient: butter, unit: tbsp, qty: 3}
  - {ingredient: garlic, unit: tbsp, qty: 3}
  - {ingredient: chili-flakes, unit: tbsp, qty: 1}
steps:
- Melt butter in a large straight-sided sauté pan.
- Add all ingredients except gin to pan. Cook until all ingredients are heated through.
- Add gin and carefully ignite off of the heat.
- Place pan back on heat and cook until you don't smell alcohol any more.
- Serve warm.
