id: xx-githeri
title: Githeri
summary: Githeri (also spelled githere, mutheri, or muthere) is a traditional Kenyan dish made by boiling maize and beans together until tender. It is especially associated with the Kikuyu, Meru, Embu, and other communities in Kenya, although it is enjoyed throughout the country.
