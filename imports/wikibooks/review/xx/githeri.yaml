  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: garlic, unit: clove, qty: 2, prep: minced, optional: true}
  - {ingredient: carrot, qty: 1, prep: diced, optional: true}
  - {ingredient: green-pepper, qty: 1, prep: chopped, optional: true}
  - {ingredient: salt, note: to taste}
steps:
- Wash the maize and beans thoroughly. If using dried maize and beans, soak them overnight in separate bowls of water.
- Drain the soaked maize and beans and place them in a large pot.
- Add enough water to cover the mixture and boil until both the maize and beans become soft. This may take 1–2 hours depending on the type used.
- In another pan, heat the vegetable oil over medium heat.
- Add the chopped onions and cook until soft and lightly golden.
- Stir in the garlic, tomatoes, carrot, and bell pepper. Cook for several minutes until the tomatoes soften.
- Add curry powder or turmeric if desired.
- Add the cooked maize and beans to the vegetable mixture and stir well.
- Season with salt and simmer for 10–15 minutes, adding a little water if necessary.
- Serve hot.
tips:
- Soaking dried maize and beans overnight reduces cooking time.
- A pressure cooker can greatly speed up preparation.
- Fresh maize gives a softer and sweeter flavour.
- Fried onions improve the flavour significantly.
- Leftover githeri can be reheated or fried the next day.
