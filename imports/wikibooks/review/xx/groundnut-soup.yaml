title: Groundnut Soup
summary: Groundnut soup, also known as "ofe epa" in the Nigerian culinary tradition, is a delicious soup made with groundnuts (peanuts) and typically enjoyed with fufu or pounded yam. It is rich, flavorful, and slightly spicy.
