id: xx-gullisuwa
title: Gullisuwa
alternate_names:
- Nigerian Milk Balls
summary: Gullisuwa is a type of fritter commonly eaten in the northern part of Nigeria during festive periods and weddings, and as street food.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 50
difficulty: 2
equipment:
- Bowl
- Wooden spoon
- Frying pan
- Sieve
techniques:
- deep-frying
ingredient_groups:
- items:
  - {ingredient: sugar, unit: cup, qty: 0.25}
  - {ingredient: cornstarch, unit: tbsp, qty: 2}
  - {ingredient: vanilla-extract}
  - {ingredient: water}
  - {ingredient: vegetable-oil}
steps:
- Combine powdered milk, sugar, cornstarch, and vanilla powder in a bowl. Mix thoroughly.
- Mix in enough water to form a dough.
- Grease your hands with vegetable oil, and roll the dough into small balls.
- Deep fry the dough in a pan of hot vegetable oil until browned all over.
- Use spoon to remove the fritters from the oil and drain in a sieve.
- Serve fresh.
tips:
- Different variety of gullisuwa can be made by adding chilli pepper, cashew nuts, and coconut.
