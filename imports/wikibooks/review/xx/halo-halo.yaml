id: xx-halo-halo
title: Halo-Halo
alternate_names:
- Filipino Layered Dessert
summary: Halo-halo ("mix-mix") is a Filipino dessert usually made with shaved ice, ice cream, and a variety of add-ins such as sweetened fruits and jellies.
origin:
  country: XX
course: main
authenticity: unassessed
