id: xx-hawawshi
title: Hawawshi
alternate_names:
- Egyptian Meat Pies
summary: Hawawshi is a popular Egyptian street food consisting of flavorful meat fillings encased in a crispy pastry. It is a delicious and convenient dish that is often enjoyed as a quick snack or as part of a meal.
