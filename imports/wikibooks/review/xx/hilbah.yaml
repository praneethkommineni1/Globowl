- items:
  - {ingredient: ground-fenugreek, unit: tbsp, qty: 3}
  - {ingredient: water, unit: cup, qty: 1}
  - {ingredient: cilantro, prep: finely chopped}
  - {ingredient: leek, prep: chopped}
  - {ingredient: lemon, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: red-bell-pepper, unit: tbsp, qty: 1}
  - {ingredient: tomato, optional: true}
steps:
- Soak ground fenugreek in the water for 3 hours until expanded.
- Beat with a spatula until paste becomes light and frothy. Gradually add more water if necessary.
- Mix in coriander leaves and leeks.
- Mix in salt, lemon juice, and zḥug.
- Mix in grated tomato if using.
