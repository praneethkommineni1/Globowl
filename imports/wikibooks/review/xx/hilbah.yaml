id: xx-hilbah
title: Hilbah
alternate_names:
- Fenugreek Condiment
summary: 'Hilbah, (Arabic: حلبة) also spelled holbah, is a condiment or dollop made from ground fenugreek seeds. It is typically consumed with a morsel of bread (sop), or added as flavoring to hot soups. Its preparation is mostly found in Yemen, Israel and other Middle-Eastern countries.'
