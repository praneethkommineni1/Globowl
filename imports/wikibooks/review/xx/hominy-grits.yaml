title: Hominy Grits
summary: Recipe from Effigy Mounds National Monument.
origin:
  country: XX
course: breakfast
authenticity: unassessed
yield:
  servings: 8
time:
  total_min: 30
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, unit: cup, qty: 5}
  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: honey, unit: tbsp, qty: 1, prep: 'brown sugar, or maple syrup', optional: true}
steps:
- Bring water to a rapid boil in a saucepan.
- Gradually stir in the hominy grits.
- Reduce heat to low.
- Stir in the butter.
- Cook for 20 minutes, or until the water is absorbed.
- If desired, sweeten with honey, brown sugar, maple syrup, or jelly.
- Serve while hot.
tips:
- Grits can also be flavored with cheese, sunny-side up egg, or small bits of ham or sausage.
