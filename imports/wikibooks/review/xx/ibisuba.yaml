id: xx-ibisuba
title: Ibisuba
alternate_names:
- Rwandan Bean Salad
summary: Ibisuba is a refreshing and nutritious bean salad from Rwanda. Made with cooked beans, fresh vegetables, and a tangy dressing, this salad is a popular side dish that complements a variety of main courses.
origin:
  country: XX
course: main
authenticity: unassessed
