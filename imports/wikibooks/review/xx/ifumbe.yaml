id: xx-ifumbe
title: Ifumbe
alternate_names:
- Rwandan Cassava Fritters
summary: Ifumbe is a Rwandan snack made from cassava flour and other simple ingredients. These cassava fritters are crispy on the outside and soft on the inside, making them a perfect treat for any time of the day.
origin:
  country: XX
course: main
authenticity: unassessed
