id: xx-ikokore
title: Ikokore
summary: Ikokore is a traditional Nigerian dish native to the Ijebu and Ilaje communities of southwestern Nigeria, particularly in Ondo State. It is prepared from grated water yam cooked in a richly seasoned broth containing fish, seafood, palm oil, and spices.
