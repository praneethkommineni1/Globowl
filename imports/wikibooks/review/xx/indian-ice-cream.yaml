id: xx-indian-ice-cream
title: Indian Ice Cream
summary: Indian ice-cream or sxusem (pronounced "s-khushem", with "kh" sound resembling the final sound in the Scottish word 'loch') is a dessert made by native people throughout the Pacific Northwest region of North America.
origin:
  country: XX
course: dessert
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: water, unit: cup, qty: 2}
  - {ingredient: sugar, prep: 'camas bulb or sweet berries such as salal berries, or thimbleberries. Nowadays many people sweeten it with sugar.', optional: true}
steps:
- Crush berries to release the liquid/juice.
- Combine juice with an equal part of water.
- Add sweetener.
- Whip it with a whisk until foamy, similar in texture to whipped cream.
tips:
- A branch of soapberries can be shaken over a metal or glass container until all of the ripe berries fall off. Oily or plastic containers will prevent frothing.
