id: xx-italian-mulled-wine
title: Italian Mulled Wine
summary: This is a recipe for a spiced wine.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 40
difficulty: 1
equipment:
- Stock pot
- Mortar and pestle
ingredient_groups:
- name: Crushed ingredients
  items:
  - {ingredient: star-anise, qty: 1}
  - {ingredient: bay-leaf, qty: 1}
  - {ingredient: rosemary, unit: pinch, qty: 1}
  - {ingredient: black-peppercorns, unit: pinch, qty: 1}
  - {ingredient: thyme, unit: pinch, qty: 1}
  - {ingredient: chili-flakes, unit: pinch, qty: 1}
  - {ingredient: fennel-seeds, unit: pinch, qty: 1}
  - {ingredient: ground-cloves, unit: pinch, qty: 1}
  - {ingredient: nutmeg, unit: pinch, qty: 1}
- name: Non-crushed ingredients
  items:
  - {ingredient: orange, qty: 1}
  - {ingredient: lemon, qty: 1}
  - {ingredient: honey, unit: tbsp, qty: 1}
  - {ingredient: vanilla-extract, unit: tsp, qty: 1}
  - {ingredient: cinnamon-stick, qty: 1}
  - {ingredient: brandy, unit: ml, qty: 50, prep: 'brandy, or Cognac', optional: true}
steps:
- Pour wine into stock pot and turn heat to medium-high.
- Crush all “crushed ingredients” using the mortar and pestle. Set aside.
- Peel and juice orange and lemon. Remove and discard the white pith from the peels, then add the peels and juice to the wine.
- When the wine is simmering, immediately reduce to low heat. Add the crushed and all remaining ingredients.
- Cook on low for at least 15 minutes to infuse the flavors. Make sure to keep on low so the wine stays warm and continues to infuse, but doesn’t bubble / heat off the alcohol.
tips:
- Feel free to double the recipe or scale any of these ingredients up or down to suite your taste.
