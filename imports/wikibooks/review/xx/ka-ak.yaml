title: Ka'ak
alternate_names:
- Savory Ring-Shaped Biscuit
summary: 'Ka''ak (Arabic: كعك), is a biscuit traditionally baked while clinging to the wall of a clay oven, or on the floor of a masonry oven.'
origin:
  country: XX
course: bread
authenticity: unassessed
