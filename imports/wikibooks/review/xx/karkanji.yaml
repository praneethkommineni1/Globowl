id: xx-karkanji
title: Karkanji
alternate_names:
- Chadian Spiced Hibiscus Drink
summary: Karkanji is an hibiscus drink from Chad and across the Sahel region. Known for its intense deep red color, it is made from dried hibiscus petals, spiced with ginger and cloves, and sweetened with sugar or honey to taste.
