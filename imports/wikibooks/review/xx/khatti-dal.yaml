id: xx-khatti-dal
title: Khatti Dal
alternate_names:
- Spiced Tamarind Pigeon Peas
summary: This is a variety of dal, the common staple food of South Asia made with dal forming a stew or thick soup. Dal is the name for split legumes in many South Asian languages (see dal page).
origin:
  country: XX
course: main
authenticity: unassessed
