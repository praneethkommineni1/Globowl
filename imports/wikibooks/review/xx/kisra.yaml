id: xx-kisra
title: Kisra
alternate_names:
- Sudanese Bread
summary: Kisra is a traditional Sudanese flatbread made from sorghum or millet flour. It is a staple food in Sudan and is enjoyed with a variety of dishes, such as stews, soups, and dips. Kisra has a thin and flexible texture, with a slightly tangy flavor due to the fermentation process.
