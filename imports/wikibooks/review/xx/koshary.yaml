id: xx-koshary
title: Koshary
alternate_names:
- Egyptian Pasta Salad with Rice and Lentils
summary: Koshary, alternately spelled koshari or kushari, is an Egyptian dish of rice, pasta, and legumes. It combines elements of both Mediterranean and Middle Eastern cuisines. According to Wikipedia it is Egypt's national dish and a widely popular street food.
origin:
  country: XX
course: main
authenticity: unassessed
