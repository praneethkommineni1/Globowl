steps:
- In a bowl, combine the chicken with lemon juice, garlic, ginger, curry powder, turmeric, salt, black pepper, and oil.
- Marinate for at least 30 minutes.
- Grill the chicken over charcoal or roast in an oven until lightly charred and partly cooked.
- Heat oil in a large pan over medium heat.
- Add the onions and cook until soft.
- Stir in the garlic, ginger, chilies, tomatoes, tomato paste, curry powder, cumin, and coriander.
- Cook until the tomatoes soften and the mixture becomes fragrant.
- Pour in the coconut milk and stir well.
- Add the grilled chicken pieces to the sauce.
- Simmer gently for 20–30 minutes until the chicken is fully cooked and the sauce thickens.
- Garnish with fresh coriander leaves and serve hot.
tips:
- Charcoal grilling gives the dish its traditional smoky flavour.
- Coconut cream creates a richer sauce than coconut milk.
- Fresh ginger and garlic improve the aroma.
- Marinating the chicken overnight enhances flavour.
- The sauce should simmer gently to avoid separating the coconut milk.
