id: xx-lahoh-spongy-flatbread
title: Lahoh (Spongy Flatbread)
summary: 'Lahoh, alternately called laḥūḥ (Arabic: لحوح‎) is a griddle-cake made similar to a pancake, but with a slightly different texture and notable for its porous texture on one side.'
origin:
  country: XX
course: bread
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- whisking
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: g, qty: 500}
  - {ingredient: semolina, unit: tbsp, qty: 2}
  - {ingredient: yeast, unit: tsp, qty: 2}
  - {ingredient: sugar, unit: tsp, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: water, unit: l, qty: 1}
steps:
- Combine all dry ingredients in a large bowl.
- Add water and whisk vigorously until you get a thin batter.
- Cover bowl and let sit for 1 hour.
- Heat a frying pan over medium heat, and lightly grease it.
- Add a ladleful of batter, and spread it out in the bottom of pan. Cook over medium heat until air bubbles form on the top of the batter.
- Remove from frying pan and let cool.
