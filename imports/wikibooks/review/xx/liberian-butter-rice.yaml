id: xx-liberian-butter-rice
title: Liberian Butter Rice
summary: Liberian butter rice is a flavorful and comforting dish that is a popular staple in Liberian cuisine. Made with aromatic ingredients and cooked in butter, this rice dish has a rich and delicious taste that pairs well with a variety of proteins and vegetables.
