id: xx-liberian-collard-greens-stew
title: Liberian Collard Greens Stew
summary: Liberian collard green stew is a hearty and flavorful dish that is a staple in Liberian cuisine. Made with tender collard greens and a rich tomato-based sauce, this stew is both nutritious and delicious.
origin:
  country: XX
