id: xx-liberian-fried-fish
title: Liberian Fried Fish
summary: Liberian fried fish is a popular and delicious dish in Liberia. Made with fresh fish and a flavorful spice blend, this dish is crispy on the outside and tender on the inside, making it a delightful meal for seafood lovers.
origin:
  country: XX
