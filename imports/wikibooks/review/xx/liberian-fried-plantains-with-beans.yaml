id: xx-liberian-fried-plantains-with-beans
title: Liberian Fried Plantains with Beans
summary: Liberian fried plantains with beans is a popular and delicious dish in Liberia. It combines the sweet and savory flavors of ripe plantains with the heartiness of cooked beans. This dish can be served as a main course or as a side dish, and it's perfect for any occasion.
origin:
  country: XX
