id: xx-liberian-fried-sweet-potato-puffs
title: Liberian Fried Sweet Potato Puffs
summary: Liberian fried sweet potato puffs are delightful and flavorful snacks that make a perfect treat for any occasion. Made with mashed sweet potatoes, these puffs are seasoned with a blend of spices and herbs, giving them a unique taste that will keep you coming back for more.
origin:
  country: XX
