id: xx-liberian-fufu
title: Liberian Fufu
summary: Liberian fufu is a staple food in Liberia and many other West African countries. It is made from starchy vegetables like cassava, yams, or plantains, which are boiled, pounded, and formed into a smooth, dough-like consistency.
origin:
  country: XX
