id: xx-m-batata
title: M'batata
alternate_names:
- Sweet Potato And Peanut Soup
summary: M'batata is a flavorful and creamy soup popular in the Central African Republic. It combines the natural sweetness of sweet potatoes with the richness of peanuts, resulting in a comforting and nourishing dish.
