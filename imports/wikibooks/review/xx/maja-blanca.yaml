id: xx-maja-blanca
title: Maja Blanca
alternate_names:
- Coconut Milk Pudding
summary: Maja blanca is a gelatin-like comfort food.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: cornstarch, unit: cup, qty: 2}
  - {ingredient: coconut-milk, unit: cup, qty: 4}
  - {ingredient: condensed-milk, unit: can, qty: 1}
  - {ingredient: coconut-cream, unit: can, qty: 1}
  - {ingredient: sugar, unit: cup, qty: 0.75}
  - {ingredient: corn-kernels, unit: cup, qty: 1, optional: true}
  - {ingredient: coconut, unit: cup, qty: 0.25, optional: true}
steps:
- In a bowl, dissolve cornstarch in 1 cup of coconut milk. Set aside.
- In a pot, combine the remaining coconut milk, condensed milk, coconut cream, and sugar. Bring to a gentle boil over medium heat.
- Gradually pour the cornstarch mixture into the pot while continuously stirring. Lower the heat and continue stirring until the mixture thickens, about 10–15 minutes.
- If desired, add corn kernels into the mixture and stir for an additional 2–3 minutes.
- Pour the mixture into a greased baking dish or other mold. Let it cool and set for at least an hour in the refrigerator.
- Once set, slice the pudding into squares and sprinkle toasted coconut flakes on top before serving.
