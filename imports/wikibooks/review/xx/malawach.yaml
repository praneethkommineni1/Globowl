id: xx-malawach
title: Malawach
alternate_names:
- Flaky Flatbread
summary: Malawach is a layered, flaky flatbread that is popularly eaten in Israel, and now made popular in other regions. It is typically brushed with oil or fat and cooked flat in a frying pan.
origin:
  country: XX
