id: xx-maraq
title: Maraq
summary: Maraq is a rich and aromatic soup popular across the Horn of Africa, especially in Somalia, Djibouti, Kenya,Ethiopia, and parts of Yemen. The word maraq simply means “broth” or “soup” in Somali.
