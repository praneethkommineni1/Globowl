title: Mchemsho
alternate_names:
- Tanzanian cuisine
summary: Mchemsho is a traditional Tanzanian mixed stew consisting of meat, vegetables, green bananas, and aromatic spices simmered together in a flavorful broth. The name mchemsho comes from the Swahili word chemsha, meaning "to boil".
