id: xx-mediterranean-grilled-tuna
title: Mediterranean Grilled Tuna
summary: This is a very simple and quick recipe for delicious fresh tuna steaks.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 15
difficulty: 2
techniques:
- marinating
ingredient_groups:
- items:
  - {ingredient: olive-oil, qty: 4}
  - {ingredient: white-vinegar, qty: 2}
  - {ingredient: lime, qty: 1, prep: juiced}
  - {ingredient: salt}
  - {ingredient: black-pepper}
steps:
- At least one hour before serving, prepare a marinade with the oil, vinegar or lime juice, tarragon leaves, salt and pepper in a flat container. Pour over the tuna steaks and turn them to make sure all pieces are well coated. Cover with plastic wrap and refrigerate until it is time to grill.
- Spray a clean grill or grilling container with non-stick cooking spray.
- Drain and reserve the excess marinade from the tuna. Grill tuna for about 4 minutes on each side or until nicely charred on the outside and still a bit pink in the middle.
- Place the steaks on individual serving dishes and pour the marinade on the grilled tuna.
- Serve with steamed vegetables, steamed rice, or a spinach salad.
