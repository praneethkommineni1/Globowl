id: xx-mesir-wat
title: Mesir Wat
alternate_names:
- Spicy Ethiopian Lentil Stew
summary: Mesir wat is a delicious and spicy Ethiopian lentil stew that is packed with flavor. It is a popular vegetarian dish that is enjoyed as a main course or as a side dish in Ethiopian cuisine. Mesir wat is made with red lentils, aromatic spices, and a rich tomato-based sauce.
