id: xx-mincemeat
title: Mincemeat
summary: Mincemeat is a mixture of spiced chopped fruits. Traditionally mincemeat has contained meat, although many modern recipes omit it. This recipe, however, does contain beef. Mincemeat will stay good for a while.
