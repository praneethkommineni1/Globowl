title: Miyan Kubewa
alternate_names:
- Okra Soup
summary: Miyan kuɓewa is a popular soup in Hausa cuisine made primarily from okra. Known for its viscous texture and rich flavor, it is widely prepared across Northern Nigeria and other parts of West Africa.
origin:
  country: XX
course: main
authenticity: unassessed
