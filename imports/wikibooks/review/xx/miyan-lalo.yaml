id: xx-miyan-lalo
title: Miyan Lalo
alternate_names:
- Hausa Jute Leaf Soup
summary: Miyan Lalo is a traditional jute leaf soup commonly eaten by the Hausa people of Northern Nigeria. It is similar in preparation and texture to the Yoruba dish known as ewedu soup.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 2
  amount: 2–3
time:
  total_min: 1
difficulty: 3
