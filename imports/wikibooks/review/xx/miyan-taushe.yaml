title: Miyan Taushe
alternate_names:
- Hausa Pumpkin Soup
summary: __notoc__ Miyan taushe is a traditional, popular soup in Hausa homes, especially during festive seasons or when pumpkins are in season. It reflects the Hausa people's creative use of local ingredients to prepare nourishing, flavorful meals.
