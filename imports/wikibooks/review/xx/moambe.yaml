title: Moambe
alternate_names:
- Palm Nut Soup
summary: Moambe is a delicious and popular dish from Central and West Africa. This rich and flavorful soup is made from palm nuts and typically includes an assortment of meats, vegetables, and spices. It is often served with a side of fufu, rice, or plantains.
