title: Mtori
alternate_names:
- Tanzanian stew
summary: Mtori is a traditional Tanzanian stew made from green bananas (plantains) and meat, usually beef. It originated among the Chagga people of the Kilimanjaro region in northern Tanzania and has become popular throughout the country.
