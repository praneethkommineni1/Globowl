steps:
- Clean the fish and season with salt, pepper, garlic, and lemon juice. Leave it for 20 minutes.
- Grill the fish or bake it until it is well cooked and golden brown.
- Heat palm oil in a pot. Add chopped onions, tomatoes, and garlic. Stir for a few minutes.
- Add the cooked beans and allow it to simmer for 10 minutes.
- Peel and boil the cassava and sweet potatoes until soft.
- Boil or fry the plantains.
- Prepare onion sauce by mixing chopped onions, tomatoes, little oil, lemon juice, and salt.
