id: xx-mukhbaza
title: Mukhbaza
summary: Mukhbaza is a traditional flatbread associated with the cuisine of Sudan and neighboring regions of Northeast Africa. It is made from wheat flour, water, yeast, and salt, producing a soft bread that is commonly served alongside stews, meat dishes, and vegetable-based meals.
