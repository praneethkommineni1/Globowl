id: xx-n-gakasse
title: N'gakasse
alternate_names:
- Groundnut Sauce
summary: N'gakasse is a delicious West African dish made with groundnuts (peanuts) as the main ingredient. This sauce is commonly enjoyed with rice, yams, plantains, or fufu.
