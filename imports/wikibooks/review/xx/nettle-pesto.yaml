ingredient_groups:
- items:
  - {ingredient: walnuts, unit: cup, qty: 0.333, prep: 'walnuts, or pine nuts'}
  - {ingredient: garlic, qty: 3}
  - {ingredient: olive-oil, unit: cup, qty: 0.333}
  - {ingredient: parmesan, unit: cup, qty: 0.25}
  - {ingredient: lemon, unit: tsp, qty: 2}
  - {ingredient: black-pepper, unit: tsp, qty: 2}
steps:
- Dry sauté or roast the nuts until slightly browned.
- Wearing thick gloves, submerge nettles in boiling water for 1 minute. Drain and transfer to an ice water bath to stop the cooking process. Drain.
- Combine all ingredients in a blender and process until smooth. Alternatively, grind with mortar and pestle for a coarser consistency.
tips:
- Pesto can be used in wide variety of dishes from simple but zesty pasta to rubs for meat and fish.
- Hazelnuts, walnuts, and pine nuts can be used separately or mixed depending on price and what is available.
