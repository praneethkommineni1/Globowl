title: Nyama Yemombe
alternate_names:
- Zimbabwean Beef Stew
summary: __notoc__ Nyama yemombe (beef stew), is a stew recipe in Zimbabwean community. It’s a hearty dish, often served with sadza (corn porridge) and vegetables.
