steps:
- Wash and blend tomatoes, peppers, scotch bonnet, and one onion.
- The blend can be smooth or slightly coarse depending on preference.
- Season meat with salt, onions, and seasoning cubes.
- Cook until tender and set aside.
- Fry lightly if a richer flavour is desired.
- Pour oil into a pot and heat gently.
- If using palm oil, allow it to heat until it becomes slightly clear but not burnt.
- Add chopped onions to the oil and fry lightly.
- Pour in the blended pepper mix and cook on medium heat until water reduces and oil begins to separate (20–30 minutes).
- Add cooked meat or fish, seasoning cubes, crayfish, and spices.
- Stir well and allow to simmer for 10–15 minutes.
- Taste and adjust salt and seasoning.
- Add boiled eggs if using and simmer briefly.
tips:
- Obe Ata Dindin – fried pepper stew version commonly found in buka restaurants
- Ofada sauce – a thicker, more local version with locust beans (iru)
- Tomato stew base – used as foundation for jollof rice
