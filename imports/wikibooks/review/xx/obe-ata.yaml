id: xx-obe-ata
title: Obe Ata
summary: Obe Ata is a traditional Yoruba stew widely eaten in Nigeria, especially in the southwestern region. The name means “pepper sauce” in Yoruba. It is a versatile base sauce used for many Nigerian dishes such as rice, yam, plantain, beans, and swallows.
