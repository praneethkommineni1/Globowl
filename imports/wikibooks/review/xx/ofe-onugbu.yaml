id: xx-ofe-onugbu
title: Ofe Onugbu
alternate_names:
- Bitter Leaf Soup
summary: Ofe onugbu, or bitterleaf soup, is a traditional Nigerian soup commonly eaten by the Igbo people of Eastern Nigeria. It is prepared with thoroughly washed bitter leaves, meat, palm oil, local spices, and a thickener such as cocoyam, achi, or ofor.
