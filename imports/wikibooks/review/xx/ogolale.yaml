id: xx-ogolale
title: Ogolale
alternate_names:
- Mashed Yam and Plantain
summary: Ogolale, also known as oritobor, is a dish of mashed yam, unripe plantain, and palm oil. It is popular with the people of the Niger Delta.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: yam}
  - {ingredient: plantain}
  - {ingredient: salt}
  - {ingredient: red-palm-oil}
steps:
- Boil the yam and plantain in a pot of salted water until cooked through.
- Drain the water, and transfer the cooked yam and plantain to a clean container.
- Use a spoon or spatula to mash the yam and plantain.
- Mix in the palm oil.
- Adjust seasoning to taste, and serve.
tips:
- Additional ingredients may be added according to taste.
