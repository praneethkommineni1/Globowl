id: xx-orange-bread
title: Orange Bread
summary: This recipe for orange bread, originally called "Grandma-Ag's orange bread" by the recipe contributor, makes a quickbread flavored with orange peel. From the original contributor:"This bread is a fond memory of my childhood, visiting Agnes Frances Primm, my Grandma-Ag.
origin:
  country: XX
course: dessert
authenticity: unassessed
