ingredient_groups:
- name: Crepes
  items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 0.5}
  - {ingredient: egg, qty: 1}
  - {ingredient: sugar, unit: tsp, qty: 1}
  - {ingredient: butter, unit: tbsp, qty: 3}
  - {ingredient: milk, unit: cup, qty: 0.667}
  - {ingredient: salt, unit: pinch, qty: 1}
- name: Filling
  items:
  - {ingredient: vanilla-extract, unit: tsp, qty: 2}
  - {ingredient: sugar, unit: cup, qty: 0.5}
  - {ingredient: lemon-juice, unit: tbsp, qty: 1}
  - {ingredient: orange-juice, unit: tbsp, qty: 4}
- name: Garnish
  items:
  - {ingredient: powdered-sugar}
  - {ingredient: ground-cinnamon}
steps:
- Mix all ingredients together in a large mixing bowl to make a batter.
- Strain the batter to get rid of any lumps, then chill in the refrigerator for 2 hours.
- Brush a 12 inch (30 cm) frying pan with butter. Ladle batter onto pan as if making crepes, leaving space for spreading.
- Cook for 1 minute on each side.
- Combine orange juice, lemon juice, sugar, and vanilla extract in medium saucepan. Bring to boil and add fruit.
- Put 2 tbsp fruit mixture on each pancake, and fold over to enclose the filling.
- Sprinkle with powdered sugar and cinnamon.
