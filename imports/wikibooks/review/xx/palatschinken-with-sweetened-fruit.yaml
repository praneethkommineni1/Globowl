id: xx-palatschinken-with-sweetened-fruit
title: Palatschinken with Sweetened Fruit
summary: Palatschinken with Sweetened Fruit.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
