id: xx-palm-fruit-with-syrup
title: Palm Fruit with Syrup
summary: Palm fruit with syrup is a Thai dessert. Thailand is a tropical country, so one must find desserts or foods that can help reduce the heat, such as palm fruit with syrup.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: sugar, unit: g, qty: 500}
  - {ingredient: water, unit: cup, qty: 6}
  - {ingredient: pandan-leaf, qty: 2}
steps:
- Peel the palm fruit, and slice it.
- Put the water in a pan, add the white sugar, and let it simmer over medium heat.
- Add the palm fruit to the syrup, and heat it again.
- Add the pandan leaves to the syrup.
- Chill the fruit in syrup. Serve it cold with ice on top.
