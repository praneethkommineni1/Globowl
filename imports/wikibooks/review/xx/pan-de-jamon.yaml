id: xx-pan-de-jamon
title: Pan de Jamón
summary: Pan de jamón is a sweet and savory rolled loaf, traditionally made in Venezuela during Christmas. The bread is buttery soft and slightly sweet. The stuffing can vary but generally includes thin slices of cured ham, raisins, pickled olives, and sweet pimento peppers.
