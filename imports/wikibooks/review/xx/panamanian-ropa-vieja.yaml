steps:
- Season the beef with salt, sazón, cumin, oregano, garlic powder, and pepper, and coat well.
- Whisk together the tomato paste, wine, and broth in a medium bowl. If you’re cooking this dish on the stove, use 3 cups of broth—you’ll need more since some of it will evaporate on the stove.
- 'Sauté the vegetables:'
- If using an Instant Pot, set it to the sauté setting. Add the oil and then the onions, bell peppers, and garlic. Cook for 3–4 minutes until softened. Then press cancel.
- If using the stove, sauté the vegetables in a large Dutch oven on medium-high heat.
- Nestle the meat into the onions so half are on the bottom and half are above the meat. Add the carrots, olives, bay leaves, and cilantro (if using). Pour the tomato mixture over everything.
- 'Cook:'
- If using an Instant Pot, put the lid on, and cook on high for 45 minutes. Once done, unplug the pot, and do a natural release.
- If using the stove, bring the pot to a boil, cover, reduce the heat to low, and simmer until the meat easily shreds. It should take about 1½–2 hours. Add more water if it gets too dry.
- Shred the beef, discard the bay leaves, and top with more cilantro if desired.
