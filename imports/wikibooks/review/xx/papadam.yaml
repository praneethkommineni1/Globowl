title: Papadam
alternate_names:
- Black Gram Flatbread
summary: Papadam (also papadum, poppadom, papar, and appalam) is an Indian and Sri Lankan flatbread. Typically, it is prepared using black gram bean flour, rice flour, or lentil flour with salt and peanut oil added.
