id: xx-pasta-alla-gricia
title: Pasta alla Gricia
alternate_names:
- Pasta with Guanciale
summary: Pasta alla gricia is an Italian pasta dish, typical of Rome. The preparation is very simple and quick. There are several versions of the recipe but they are all very similar.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
- pan-frying
ingredient_groups:
- items:
  - {ingredient: salt, unit: tbsp, qty: 3}
  - {ingredient: pasta, unit: g, qty: 400}
  - {ingredient: pecorino-romano, prep: grated}
  - {ingredient: black-pepper}
steps:
- Heat water and salt in a pot until it starts boiling.
- Add the pasta, and cook until al dente.
- Cook the guanciale in a frying pan until fat melts almost completely.
- Add the cooked pasta to the guanciale pan, and fry for 2 minutes.
- Add grated pecorino romano and black pepper to the frying pan, and toss to blend the ingredients.
