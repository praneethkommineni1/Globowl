- items:
  - {ingredient: goat, unit: kg, qty: 1, prep: 'catfish, chicken, or assorted meats'}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: bouillon-cube, qty: [2, 3]}
  - {ingredient: ginger, unit: tbsp, qty: 1, optional: true}
  - {ingredient: water, unit: cup, qty: [4, 6]}
  - {ingredient: ground-crayfish, unit: tbsp, qty: 1}
  - {ingredient: black-pepper, unit: tsp, qty: 1}
  - {ingredient: scent-leaf, unit: cup, qty: 1}
steps:
- Wash and cut the meat into bite-sized pieces.
- Rub the meat well with the salt, seasoning cube, and ginger/garlic.
- Combine the meat and water in a pot, and simmer until tender.
- Stir in the pepper soup spice mix, ground crayfish, and ground pepper. Simmer for 10 minutes to let the flavors blend.
- Stir in the scent leaves, and cook for 2–3 minutes.
- Taste, adjust seasoning, and serve hot.
