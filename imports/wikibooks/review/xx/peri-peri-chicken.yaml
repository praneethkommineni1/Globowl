id: xx-peri-peri-chicken
title: Peri-Peri Chicken
summary: Peri-peri chicken is a mouth-watering and spicy African chicken dish. It is very easy to prepare and can be made using an oven or grill. It goes well with fried plantains, mashed potatoes, and salad.
