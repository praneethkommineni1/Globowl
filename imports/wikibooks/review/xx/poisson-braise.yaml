id: xx-poisson-braise
title: Poisson Braise
alternate_names:
- Ivorian Grilled Fish
summary: Poisson braise is an Ivory Coast dish, usually eaten after work. It is also an affordable meal that can be enjoyed with any cold drink of your choice.
origin:
  country: XX
