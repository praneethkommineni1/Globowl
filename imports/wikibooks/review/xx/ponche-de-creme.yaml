id: xx-ponche-de-creme
title: Ponche de Crème
summary: Ponche de crème is a seasonal beverage usually enjoyed as a cocktail at Christmastime. It is similar to eggnog.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 12
time:
  total_min: 15
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: egg, qty: 6}
  - {ingredient: lime}
  - {ingredient: condensed-milk, unit: can, qty: 3}
  - {ingredient: condensed-milk, unit: can, qty: 1.5, note: to taste}
  - {ingredient: nutmeg, unit: tsp, qty: 0.5}
  - {ingredient: rum, unit: cup, qty: 0.5, note: to taste}
steps:
- Beat eggs and lime peel until light and fluffy.
- Add evaporated milk.
- Sweeten to taste with condensed milk.
- Add bitters, grated nutmeg and rum according to taste.
- Remove lime peel and serve over crushed ice.
tips:
- Instead of beating the raw eggs, you can gently stir them together with the other ingredients over a low heat until the mixture thickens (about 20–25 minutes).
