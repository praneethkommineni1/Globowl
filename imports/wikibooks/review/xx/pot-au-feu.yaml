id: xx-pot-au-feu
title: Pot-au-feu
alternate_names:
- Boiled Meat and Vegetables
summary: Pot-au-feu is a typical and rustic French dish made of low-cost beef pieces and vegetables. There are many variants in France and other countries.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 4
  amount: 4–6
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
