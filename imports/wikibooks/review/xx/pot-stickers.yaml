title: Pot Stickers
summary: Pot Stickers or Jiaozi are traditional Chinese dumplings that are both fried and steamed. You can use whatever filling you like. Pork is traditional, but there are many versions. Any meat should be thoroughly cooked, and all ingredients should be sliced very small.
