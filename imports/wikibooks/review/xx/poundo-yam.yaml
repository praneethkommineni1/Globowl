id: xx-poundo-yam
title: Poundo Yam
summary: Poundo yam is a swallow made from yam flour. It is similar to pounded yam; however, this version is made with yam flour and does not require a mortar and pestle. It can be served with ẹfọ riro, ogbono soup, or ẹgusi soup.
