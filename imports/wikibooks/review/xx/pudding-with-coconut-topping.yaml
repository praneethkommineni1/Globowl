id: xx-pudding-with-coconut-topping
title: Pudding with Coconut Topping
alternate_names:
- Tako
summary: 'Thai pudding with coconut topping, or tako (Thai: ตะโก้), is a Thai dessert made of rice flour, sugar, coconut milk, and other flavoring ingredients such as corn or taro. It is a traditional dessert of Thailand. Tako has three main parts.'
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
techniques:
- boiling
ingredient_groups:
- name: Jelly base
  items:
  - {ingredient: rice-flour, unit: g, qty: 75}
  - {ingredient: cornstarch, unit: tbsp, qty: 2}
  - {ingredient: water, unit: ml, qty: 250}
  - {ingredient: brown-sugar, unit: tbsp, qty: 1}
  - {ingredient: sugar, unit: g, qty: 225}
- name: Coconut milk topping
  items:
  - {ingredient: coconut-milk, unit: ml, qty: 350}
  - {ingredient: rice-flour, unit: tbsp, qty: 1}
  - {ingredient: cornstarch, unit: tbsp, qty: 0.5}
  - {ingredient: salt, unit: tsp, qty: 1}
steps:
- Combine the rice flour, cornstarch, and water in a mixing bowl to begin to make the jelly base.
- Strain the mixed ingredients from previous step into a saucepan, and stir in the sugar.
- Boil over medium heat while stirring constantly for 5 minutes. Then set the heat lower and cook while stirring for 5 minutes.
- Stir in the water chestnuts or lotus seeds.
- Divide the mixture between pandan leaf cups, and leave it to cool.
- Place a medium saucepan over low heat and mix all the coconut topping ingredients together.
- Stir for 10 minutes until the mixture becomes a thick custard.
- Let cool for a few minutes, then put the topping carefully on top of the jelly base in each cup.
