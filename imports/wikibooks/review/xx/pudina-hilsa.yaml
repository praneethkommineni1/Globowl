  - {ingredient: mint, unit: tsp, qty: 1}
  - {ingredient: ground-ginger, unit: tsp, qty: 1}
  - {ingredient: nutmeg, unit: tsp, qty: 1}
  - {ingredient: butter, unit: g, qty: 50, prep: chopped}
  - {ingredient: red-bell-pepper, unit: tbsp, qty: 3}
  - {ingredient: salt, note: to taste}
  - {ingredient: sugar, unit: pinch, qty: 1}
  - {ingredient: chili-paste, unit: tsp, qty: 1}
steps:
- Wash the fish thoroughly in water.
- Put the salt, sugar, 25 g of butter and all the other ingredients into a baking dish.
- Add the fish pieces and sprinkle the rest of the butter on the top.
- Bake at 200°C until the fish turns golden in color or otherwise appears to be done.
