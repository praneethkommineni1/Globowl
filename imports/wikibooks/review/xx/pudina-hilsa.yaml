id: xx-pudina-hilsa
title: Pudina Hilsa
alternate_names:
- Bengali Fish with Mint
summary: Pudina hilsa is a wonderful Bengali preparation of hilsa fish. It is very easy and can be served hot with boiled rice.
origin:
  country: XX
course: main
authenticity: unassessed
