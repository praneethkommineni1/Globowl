id: xx-pumpkin-roll
title: Pumpkin Roll
summary: Pumpkin roll is a traditional holiday dessert that's lovely to serve. The filling keeps the cake moist. This dessert can be prepared and kept frozen before the holidays.
origin:
  country: XX
