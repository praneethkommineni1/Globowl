ingredient_groups:
- items:
  - {ingredient: sugar, unit: cup, qty: 0.5}
  - {ingredient: butter, unit: cup, qty: 0.5, prep: softened}
  - {ingredient: egg, qty: 3, note: large}
  - {ingredient: butternut-squash, unit: cup, qty: 1.5}
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: baking-powder, unit: tsp, qty: 2}
  - {ingredient: ground-cinnamon, unit: pinch, qty: 1, prep: or more to taste}
steps:
- Preheat the oven to 450 °F (230 °C), and grease the baking dish.
- Use the electric mixer to beat together sugar, butter, and eggs until smooth and creamy.
- Mix in pumpkin purée until well combined.
- Add milk, cake flour, and baking powder, and mix until smooth.
- Pour mixture into the prepared baking dish, and sprinkle cinnamon over top.
- Bake in the heated oven until it is set in the middle, 45 minutes or more.
