id: xx-pupuru
title: Pupuru
alternate_names:
- Nigerian Cassava Swallow
summary: Pupuru, also known as cassava poundo, is a typical Nigerian swallow made from cassava flour. It is majorly consumed by people of Ondo State, and it is served with soups such as okro soup, egusi soup, ogbono soup, and many others.
origin:
  country: XX
course: main
