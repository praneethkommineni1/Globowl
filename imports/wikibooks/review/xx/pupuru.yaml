  - {ingredient: cassava}
  - {ingredient: water}
steps:
- Boil water in a pot.
- Gradually mix the cassava flour into the boiling water, stirring with a spatula until it forms a smooth and lump-free dough.
- Cook for a few minutes.
- Serve with your soup of choice.
