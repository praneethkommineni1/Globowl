  - {ingredient: sugar, unit: tbsp, qty: 3}
  - {ingredient: egg, qty: 1}
  - {ingredient: jam, unit: cup, qty: 1.5}
  - {ingredient: butter, unit: tbsp, qty: 2, prep: softened}
