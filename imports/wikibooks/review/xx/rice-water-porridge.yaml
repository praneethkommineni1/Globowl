id: xx-rice-water-porridge
title: Rice Water Porridge
summary: A typical Ghanaian morning dish is rice water porridge, made with evaporated or powdered milk. It is comparable to rice pudding but lighter because the cooking process uses water.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 32
difficulty: 1
equipment:
- Stove
- Spoon
- Pot/saucepan
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: long-grain-rice}
  - {ingredient: salt, unit: tsp, qty: 1}
  - {ingredient: sugar}
  - {ingredient: milk}
  - {ingredient: nutmeg}
steps:
- Wash the rice, then put it in a saucepan with a few cups of water. Bring to a boil.
- Boil the rice for about 20 minutes, or until it has absorbed the water and become soft. If necessary, add the salt and an additional cup of water.
- Beat the rice against the saucepan with a spoon to create a smooth, pudding-like consistency.
- Add the nutmeg, and then let it boil for about 5 minutes. Add the sugar or honey.
- Serve with your preferred milk, and garnish with a tiny touch of nutmeg.
tips:
- Soak the unprepared rice in water overnight for a very smooth rice water porridge.
