id: xx-risengrd
title: Risengrød
summary: Risengrød is part of the Nordic Christmas tradition as a dinner dish. It is simply rice boiled with milk and a little sugar to form porridge, and it is served warm with butter and cinnamon-sugar.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 90
difficulty: 1
equipment:
- Deep pot with lid
- Bowl
- Mixing spoon or spatula
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: water, qty: 3}
  - {ingredient: long-grain-rice, unit: g, qty: 180}
  - {ingredient: milk, unit: l, qty: 1}
  - {ingredient: salt, unit: pinch, qty: 2}
  - {ingredient: sugar, unit: tbsp, qty: 4}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 2}
  - {ingredient: butter, unit: g, qty: 50}
steps:
- Bring water and rice to a boil in a deep pot. Boil the rice at steady heat and with active stirring for approximately 2 minutes.
- Add milk and return to a boil. Simmer over low heat, stirring actively for approximately 10 minutes.
- Put on lid and simmer for approximately 30 minutes, stirring often to prevent sticking.
- Test the porridge for thickness—if it seems too thin, simmer for another 5–10 minutes.
- Add salt.
- Combine sugar and cinnamon in a bowl or container.
- Serve porridge warm with cinnamon-sugar on top and a bit of butter in the middle.
