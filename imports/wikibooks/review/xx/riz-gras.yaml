title: Riz Gras
alternate_names:
- West African Fried Rice
summary: Riz gras is a popular and flavorful rice dish enjoyed in West Africa. This versatile recipe typically consists of cooked rice stir-fried with an array of vegetables, meats, and aromatic spices.
