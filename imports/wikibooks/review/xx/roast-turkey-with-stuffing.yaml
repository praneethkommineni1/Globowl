id: xx-roast-turkey-with-stuffing
title: Roast Turkey with Stuffing
summary: Roast turkey usually forms the centerpiece of Thanksgiving in the United States. There are many recipes and methods for cooking whole turkeys. Below is one of the simplest and therefore one of the most traditional.
origin:
  country: XX
