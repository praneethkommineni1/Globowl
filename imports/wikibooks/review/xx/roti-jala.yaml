id: xx-roti-jala
title: Roti Jala
alternate_names:
- Malaysian Lacy Pancakes
summary: Roti jala are thin and lacy Malaysian pancakes. They are typically served—like other kinds of roti—with savory dishes like curries. Many versions use coconut milk, but this one uses water.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 60
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 4}
  - {ingredient: water, unit: cup, qty: 3}
  - {ingredient: egg, qty: 2}
  - {ingredient: salt, unit: tsp, qty: 2}
  - {ingredient: food-coloring}
steps:
- Combine all the ingredients in a blender, and blend until you get a well-combined batter. Over-blending will produce excess foam.
- Let the batter rest for 30 minutes.
- Transfer the batter to a squeeze-bottle with a nozzle (see notes).
- Heat a skillet over medium-high heat.
- If necessary, use a paper towel to lightly grease the pan with some oil.
- Use the squeeze bottle to drizzle batter over the surface of the pan in a swirling, lacy pattern.
- Let the pancake cook just until dry—avoid excessive coloration.
- Remove from the pan, transfer to a plate, and roll or fold up.
- Repeat the cooking process until you have used up all the batter.
- Serve warm.
tips:
- If you can get one, a specialized squeeze bottle with multiple nozzles will make it faster to shape the pancake. You can also use a specialized cup with multiple holes in the bottom.
