id: xx-rwandan-goat-brochette
title: Rwandan Goat Brochette
summary: Rwandan goat brochette, also known as Brochettes de Chèvre, is a popular street food in Rwanda consisting of tender grilled goat meat skewers. This flavorful dish is often enjoyed with a side of vegetables and served with a spicy sauce.
