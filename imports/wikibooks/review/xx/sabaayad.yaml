tips:
- Sabaayad is often eaten with honey, butter, tea, or savory stews.
- The bread is known as Kimis in some Somali regions.
- Additional layers can be created by repeatedly folding and rolling the dough.
- Whole-wheat flour may be substituted for part of the white flour.
- Similar breads include paratha and other layered flatbreads of East Africa and South Asia.
