title: Sabaayad
summary: __NOtOC__ Sabaayad (also called Kimis) is a traditional Somali flatbread. It is a layered bread commonly eaten for breakfast or served with tea, honey, soups, curries, and meat stews throughout Somalia and the Horn of Africa.
