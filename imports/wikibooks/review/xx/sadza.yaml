id: xx-sadza
title: Sadza
alternate_names:
- Zimbabwean Corn Porridge
summary: Sadza is also known as pap, nsima, or ugali in different regions. It's a simple and hearty maize porridge that's often served as a staple food. It’s a popular recipe in Zimbabwe
origin:
  country: XX
course: main
authenticity: unassessed
