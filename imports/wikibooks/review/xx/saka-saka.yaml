title: Saka-Saka
alternate_names:
- Cassava Leaf Stew
summary: Saka-saka is a popular West African dish that features tender cassava leaves cooked with a flavorful blend of spices and ingredients. This nutritious stew is commonly enjoyed in countries such as Nigeria, Ghana, Cameroon, and Congo.
