id: xx-sauce-feuilles
title: Sauce Feuilles
alternate_names:
- Greens Stew
summary: Sauce feuilles is a delicious West African dish made with a variety of greens and typically served with a side of rice or fufu. It is a popular dish in West African cuisine. The stew is often cooked with palm oil, which gives it a distinct taste and vibrant color.
