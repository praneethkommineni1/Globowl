ingredient_groups:
- items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 2, prep: chopped}
  - {ingredient: celery, qty: 4, prep: chopped}
  - {ingredient: carrot, qty: 2, prep: chopped}
  - {ingredient: potato, qty: 3, prep: boiled and smashed}
  - {ingredient: chicken-stock, qty: 0.5}
  - {ingredient: milk, qty: 0.5}
  - {ingredient: black-pepper, unit: tbsp, qty: 1}
steps:
- Place stock pot over medium heat, add oil.
- Add carrots, onions, celery, stirring until onions turn clear.
- Add tarragon and salmon stock to deglaze bottom of pan.
- Stir in smashed potatoes, smoked salmon. Continue to stir and bring to a simmer.
- Add milk and pepper.
- Serve and enjoy.
tips:
- Vegetable stock can be substituted.
- Additional seafood can be added.
- Frozen veggies can be added.
- Parsley or dill can be used as garnish.
- Paprika or cayenne will add some spice!
