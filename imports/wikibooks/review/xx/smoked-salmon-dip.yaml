steps:
- In medium-sized bowl, crumble salmon; add cream cheese, sour cream, lemon juice, and pepper.
- Mix until well incorporated or creamy.
- Mix in basil and parsley.
- Serve and enjoy.
tips:
- Whipped cream cheese is much easier to mix.
- Add a pinch of paprika/cayenne for added heat.
