  - {ingredient: honey}
steps:
- Place the grated cassava in a large bowl and add water. Use your hands to mix and squeeze the cassava to release the starch. Continue this process until the water becomes cloudy, and the cassava particles settle at the bottom of the bowl.
- Pour the cassava mixture through a fine-mesh strainer or cheesecloth placed over another bowl, reserving the liquid. Let the mixture rest and allow the starch to settle at the bottom. This starch is what you'll use to make the porridge. Carefully pour off the water and keep the starch.
- Transfer the cassava starch to a blender or food processor. Add the coconut milk, sugar, ground cinnamon, and a pinch of salt. Blend until you achieve a smooth and creamy consistency.
- Pour the blended mixture into a medium-sized saucepan. Heat the mixture over medium heat, stirring constantly with a wooden spoon or spatula to prevent lumps and sticking.
- As the porridge cooks, it will thicken. Continue stirring until it reaches your desired consistency. It should be smooth and creamy, similar to the texture of oatmeal or grits.
- Remove it from the heat. Serve the warm porridge in bowls and top with shredded coconut, sliced bananas, chopped nuts, or a drizzle of honey.
