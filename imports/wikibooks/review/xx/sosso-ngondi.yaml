id: xx-sosso-ngondi
title: Sosso-Ngondi
alternate_names:
- Ground Cassava Porridge
summary: Sosso-ngondi is a traditional West African dish made from ground cassava. It is a smooth, thick, and creamy porridge that is often enjoyed as a breakfast or a filling snack.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Large bowl
- Fine-mesh strainer or cheesecloth
- Blender or food processor
- Medium-sized saucepan
- Wooden spoon or spatula
ingredient_groups:
- name: Base
  items:
  - {ingredient: cassava, unit: cup, qty: 2}
  - {ingredient: water, unit: cup, qty: 4}
  - {ingredient: coconut-milk, unit: cup, qty: 1}
  - {ingredient: sugar, unit: cup, qty: 0.25}
  - {ingredient: ground-cinnamon, unit: tsp, qty: 0.5}
