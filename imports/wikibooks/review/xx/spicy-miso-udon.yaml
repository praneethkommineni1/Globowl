id: xx-spicy-miso-udon
title: Spicy Miso Udon
summary: This is a spicy miso udon soup made with dry udon noodles. This soup may be a little more challenging because the temperature must be controlled. The delicate flavors do not hold up against higher temperatures, so if this soup becomes too hot or reaches a boil it will be ruined.
