  total_min: 1
difficulty: 2
equipment:
- Blender, food processor, or mortar and pestle
- Oven or stove
techniques:
- roasting
- sauteing
ingredient_groups:
- items:
  - {ingredient: pine-nuts, unit: cup, qty: 0.333, prep: 'pine nuts, and/or walnuts'}
  - {ingredient: garlic, qty: 3}
  - {ingredient: olive-oil, unit: cup, qty: 0.333}
  - {ingredient: parmesan, unit: cup, qty: 0.25}
  - {ingredient: lemon-juice, unit: tsp, qty: 2}
  - {ingredient: black-pepper, unit: tsp, qty: 2}
steps:
- Dry sauté or roast nuts until slightly browned.
- With thick gloves, place nettles in boiling water for 1 minute. Transfer nettles to an ice water bath to stop the cooking process. Drain.
- Blend all ingredients until smooth. Alternatively, smash with mortar and pestle for a coarser consistency.
tips:
- Pesto can be used in wide variety of dishes from simple but zesty pasta to rubs for meat and fish. Hazelnuts, walnuts, and pine nuts can be used separate or mixed depending on what is available.
