id: xx-stuffed-grape-leaves
title: Stuffed Grape Leaves
summary: 'Grape leaves (stuffed), (Arabic: ورق دوالي); (Hebrew: עלי גפן ממולאים), are an appetizer popular in Middle Eastern countries, including Turkey and Persia, where it is usually eaten with stuffed rice that has been seasoned with a multitude of spices.'
