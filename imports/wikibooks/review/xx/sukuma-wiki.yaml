title: Sukuma Wiki
alternate_names:
- East African Greens
summary: Sukuma wiki is a Swahili dish of cooked kale or collard greens, popular throughout several East African nations like Kenya and Tanzania. It is often served with ugali, a corn-based swallow.
origin:
  country: XX
course: main
authenticity: unassessed
