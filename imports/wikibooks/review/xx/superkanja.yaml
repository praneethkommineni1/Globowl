techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: beef, unit: g, qty: 907, prep: cut into chunks}
  - {ingredient: onion, qty: 2, prep: chopped, note: medium}
  - {ingredient: black-pepper}
  - {ingredient: okra, unit: g, qty: 907, prep: diced into small cubes}
  - {ingredient: red-palm-oil}
  - {ingredient: salt, note: to taste}
steps:
- Bring a pot of water to a boil and add the meat and fish. Let them boil for 15 minutes, then remove the fish from the pot.
- To the pot, add salt, onions, pepper, and diced okra. Mix all the ingredients well.
- Cook the mixture over medium heat for 15 minutes, then incorporate the palm oil.
- Reduce the heat to low and let it simmer for 20 minutes, stirring occasionally.
- Afterward, return the fish to the pot and continue simmering for 6–10 minutes on low heat.
- Serve the superkanja stew with white rice or fufu.
tips:
- You can also include crabs and shrimp to enhance the dish.
