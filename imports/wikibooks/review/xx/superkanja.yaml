id: xx-superkanja
title: Superkanja
alternate_names:
- Gambian Okra Stew
summary: Superkanja is a highly nutritious and flavorful stew that brings together an array of leafy greens, including spinach, collards, okra, and sweet potato leaves. This dish has different variations throughout West Africa, such as the Ghanaian kontomire.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 90
difficulty: 2
equipment:
