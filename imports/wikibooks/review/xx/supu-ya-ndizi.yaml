id: xx-supu-ya-ndizi
title: Supu Ya Ndizi
summary: Supu Ya Ndizi is a traditional East African soup made with green cooking bananas, vegetables, and spices. It is especially popular in Tanzania and among communities along the East African coast. The soup is valued for its rich flavor, nourishing qualities, and versatility.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 45
difficulty: 2
