title: Sylheti Doner Kebab
summary: Sylheti doner kebab is a tantalizing dish influenced by Turkish doner kebab but infused with Sylheti flavors, including hatxora. It has gained immense popularity in Sylhet as a street food, as well as in the Whitechapel area of London.
