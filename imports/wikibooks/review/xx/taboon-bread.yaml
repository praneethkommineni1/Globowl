id: xx-taboon-bread
title: Taboon Bread
summary: Taboon bread, also spelled tabun bread, is one of the various baked flatbreads found primarily in the areas surrounding the Palestinian village of Al-Jabal. It is traditionally baked in a clay oven called a taboon oven, the bottom of which is lined with smooth beach stones.
origin:
  country: XX
