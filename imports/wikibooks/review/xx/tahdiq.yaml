title: Tahdiq
alternate_names:
- Crisped Persian Rice
summary: Tahdiq, or tahdig is a popular Persian way of preparing rice.
origin:
  country: XX
course: side
authenticity: unassessed
yield:
  servings: 4
  amount: 4–6
time:
  total_min: 60
difficulty: 3
