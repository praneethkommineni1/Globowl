id: xx-tajine-bil-samak
title: Tajine bil Samak
alternate_names:
- Libyan Fish Tajine
summary: Tajine bil samak is a delicious and fragrant Libyan fish dish cooked in a tajine, a traditional clay pot with a conical lid. This flavorful dish features tender fish fillets cooked in a tomato-based sauce infused with aromatic spices and herbs.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 4
