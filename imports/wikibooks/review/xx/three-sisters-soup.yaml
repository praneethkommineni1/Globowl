id: xx-three-sisters-soup
title: Three Sisters Soup
summary: 'Three sisters soup is a classic Indigenous recipe steeped in the folklore of the three staples of Indigenous cultures in North America: corn, squash, and beans. This hearty and delicious soup pays homage to the rich heritage and agricultural traditions of Indigenous communities.'
