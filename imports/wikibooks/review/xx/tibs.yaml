id: xx-tibs
title: Tibs
alternate_names:
- Ethiopian Sauteed Meat and Vegetables
summary: Tibs is a flavorful Ethiopian dish made with sautéed meat or vegetables. It is a popular and versatile dish that can be made with different types of meat, such as beef, lamb, or chicken, as well as various vegetables.
origin:
  country: XX
course: main
authenticity: unassessed
