- Large skillet or frying pan
- Wooden spoon or spatula
- Cutting board
- Chef's knife
techniques:
- sauteing
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped, note: large}
  - {ingredient: garlic, unit: clove, qty: 3, prep: minced}
  - {ingredient: beef, unit: g, qty: 500, prep: cut into bite-sized pieces}
  - {ingredient: berbere, unit: tbsp, qty: 1}
  - {ingredient: paprika, unit: tsp, qty: 1}
  - {ingredient: ground-cumin, unit: tsp, qty: 0.5}
  - {ingredient: salt, unit: tsp, qty: 0.5, note: to taste}
  - {ingredient: black-pepper, unit: tsp, qty: 0.25}
  - {ingredient: cayenne, unit: tsp, qty: 0.25, optional: true}
  - {ingredient: lemon-juice, unit: cup, qty: 0.25}
