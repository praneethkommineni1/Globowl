id: xx-toasted-coconut-flakes
title: Toasted Coconut Flakes
summary: These toasted coconut flakes are a crunchy, caramelized snack made from fresh coconut. They are a popular snack in Nigeria.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Oven
- Grater
- Bowl
- Baking sheet/tray
ingredient_groups:
- items:
  - {ingredient: coconut}
  - {ingredient: sugar}
  - {ingredient: salt}
steps:
- Crack open the coconut, and separate out the coconut meat.
- Grate the coconut meat into flakes.
- Toss the coconut flakes with sugar and a pinch of salt.
- Spread the coconut mixture on a baking sheet, and place on the lowest rack of the oven. Bake at 300˚F, stirring every few minutes until golden brown and crisp.
- Remove the coconut flakes and cool completely.
tips:
- Ensure you are fully concentrated while toasting the coconut, as it will burn quite fast.
- If you layer the coconut too thick on the pan, they will take very long to crisp up.
