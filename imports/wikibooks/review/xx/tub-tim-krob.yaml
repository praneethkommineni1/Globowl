id: xx-tub-tim-krob
title: Tub Tim Krob
alternate_names:
- Thai Water Chestnuts in Coconut
summary: 'Tub tim krob (Thai: ทับทิมกรอบ) is one of the most famous Thai desserts. It is made of cubes of water chestnuts coated with red food coloring. This dessert is also known as “Red Rubies” because its appearance looks similar to bright red rubies.'
origin:
  country: XX
course: main
authenticity: unassessed
