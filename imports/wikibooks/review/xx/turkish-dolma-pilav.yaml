id: xx-turkish-dolma-pilav
title: Turkish Dolma Pilav
summary: Turkish dolma pilav also called iç pilav is a spiced pilav-style rice dish that can be used to make stuffed grape leaves, cabbage rolls, or to stuff vegetables like green peppers or zucchini.
