id: xx-tuwo-alabo
title: Tuwo Alabo
alternate_names:
- Nigerian Cassava Swallow
summary: Tuwo alabo or tuwon taiba is a Nigerian swallow made from cassava flour, locally called garin kwaki, which is gotten by sun-drying and milling fermented peeled cassava. It is a substitute for tuwo masara and is the Hausa version of lafun.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 2
  amount: 2 servings
time:
  total_min: 20
difficulty: 2
equipment:
- Sieve
- Turning stick (mu iya)
- Mixing bowl
techniques:
- boiling
- steaming
ingredient_groups:
- items:
  - {ingredient: water}
steps:
- Sift the cassava flour to remove debris.
- Boil the water in a pot, and gradually stir in the flour until it forms a smooth mixture.
- Use the wooden spatula to mix and mash the dough until smooth and thick.
- Cover the pot and allow the mixture to steam on low heat for 3–5 minutes.
- Stir again until well-cooked and smooth.
tips:
- Use clean, fine cassava flour for the best results.
- Continuous stirring helps achieve a lump-free texture.
- The dish has a slightly fermented taste if the cassava flour is traditionally processed.
