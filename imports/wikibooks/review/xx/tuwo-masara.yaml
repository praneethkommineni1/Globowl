title: Tuwo Masara
alternate_names:
- Nigerian Corn Fufu
summary: Tuwo Masara is a swallow food made from corn popular amongst the hausa and Fulani people. it is also known as Corn Fufu.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
