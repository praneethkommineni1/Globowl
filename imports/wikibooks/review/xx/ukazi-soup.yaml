techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: beef, qty: 6, optional: true}
  - {ingredient: stockfish, qty: 4, prep: cleaned}
  - {ingredient: bouillon-cube, qty: 3}
  - {ingredient: red-palm-oil, unit: cup, qty: 0.75}
  - {ingredient: scotch-bonnet, qty: 2, prep: chopped}
  - {ingredient: ground-crayfish, qty: 6}
  - {ingredient: salt, unit: tsp, qty: 1}
steps:
- Boil the meat and fish in water with stock cubes until the meat is tender.
- Stir in the palm oil and chiles. Cook until yellow.
- Reduce the heat and stir in the achara and crayfish.
- Season to taste with stock cubes and salt, then cook for 5 more minutes.
- Stir in the okazi leaf, and cook for 3 minutes.
