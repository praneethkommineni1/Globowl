id: xx-ukazi-soup
title: Ukazi Soup
summary: Ukazi soup is an Igbo soup made from okazi and water leaf. It is similar to afang soup, but okazi soup is thicker.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 3
  amount: 3-4
