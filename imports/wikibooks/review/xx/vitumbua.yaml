id: xx-vitumbua
title: Vitumbua
alternate_names:
- Coconut Rice Pancakes
summary: Vitumbua are baked goods commonly found in Tanzania. They are often eaten for breakfast and are found sold in the streets in many places. The ingredients may vary based on taste and availability, however the base ingredient is rice. It can be used in plain form or as flour.
origin:
  country: XX
course: breakfast
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
ingredient_groups:
- items:
  - {ingredient: rice-flour, unit: cup, qty: 2}
  - {ingredient: coconut-milk, unit: cup, qty: 1}
  - {ingredient: yeast, unit: tsp, qty: 1}
  - {ingredient: sugar, unit: cup, qty: [0.5, 1]}
  - {ingredient: vegetable-oil}
- name: Optional ingredients
  items:
