title: Waakyne
alternate_names:
- Ghanaian Rice and Beans
summary: Waakyne is a popular meal cooked in West Africa. It is commonly eaten for breakfast or lunch, where it can be served with boiled eggs, fried plaintain, meat, fish, and even spaghetti.
origin:
  country: XX
