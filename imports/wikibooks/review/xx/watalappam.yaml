ingredient_groups:
- items:
  - {ingredient: coconut-milk, unit: cup, qty: 2}
  - {ingredient: brown-sugar, unit: g, qty: 227}
  - {ingredient: egg, qty: 4}
  - {ingredient: ground-cardamom, unit: pinch, qty: 1, optional: true}
  - {ingredient: whole-cloves, qty: 3, optional: true}
  - {ingredient: cashews, qty: 12}
steps:
- Beat the eggs in a mixer. Add the milk, brown sugar, cardamom, and cloves to the beaten eggs. Mix well.
- Transfer the mixture to a pot and steam for 20 minutes. Add the cashews.
tips:
- One can also vary or enhance the aroma and flavour by adding thick pandan juice or vanilla pod gratings.
- Alternatively, the mixture can be poured into multiple small aluminum baking foils and then steamed for about 5–10 minutes.
