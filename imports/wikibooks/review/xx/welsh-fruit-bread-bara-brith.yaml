id: xx-welsh-fruit-bread-bara-brith
title: Welsh Fruit Bread (Bara Brith)
summary: This variation for bara brith is also popular and uses baking powder and bicarbonate of soda as raising agents, rather than yeast. Soaking of the dried fruit in tea for several hours is essential to the taste and succulence of the loaf.
