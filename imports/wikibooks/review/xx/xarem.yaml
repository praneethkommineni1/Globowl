title: Xarém
alternate_names:
- Porridge dish
summary: Xarém (also spelled Xerém) is a thick soup or porridge from Algarve, Portugal that is eaten in Cape Verde and Brazil as well. It has a corn flour base combined with other traditional ingredients which vary by region.
