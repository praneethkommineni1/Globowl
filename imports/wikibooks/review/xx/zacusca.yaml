id: xx-zacusca
title: Zacusca
alternate_names:
- Romanian Vegetable Spread
summary: Zacuscă is a vegetable spread popular in Romania. It is usually eaten with bread. Similar spreads are found in other countries in the Balkan region and bordering regions.
