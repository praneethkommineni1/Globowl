- Spoon
- Stovetop
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 1}
  - {ingredient: onion, qty: 1, prep: diced}
  - {ingredient: chicken-stock, unit: cup, qty: 4, prep: divided}
  - {ingredient: peanut-butter, unit: cup, qty: 0.5}
  - {ingredient: tomato, unit: cup, qty: 2, prep: with juices}
  - {ingredient: white-cabbage, unit: cup, qty: 1}
  - {ingredient: sweet-potato, unit: cup, qty: 1}
  - {ingredient: carrot, unit: cup, qty: 1}
  - {ingredient: turnip, unit: cup, qty: 1}
  - {ingredient: okra, unit: cup, qty: 1}
  - {ingredient: chicken, unit: cup, qty: 1, note: to taste}
steps:
- Heat the olive oil in the pot over medium heat. Add the onion, and sauté for about 5 minutes until translucent.
- Stir ½ cup of the vegetable stock and the peanut butter into the onions until the mixture looks smooth.
- Stir in the remaining vegetable stock, diced tomatoes with their liquid, and crushed red pepper flakes; simmer for 30 minutes, stirring frequently.
- Stir in the cabbage, sweet potato, carrot, and turnip. Simmer, stirring, until the vegetables become soft (about 30 minutes).
- Stir in the okra and chicken, and simmer for about 30 additional minutes.
