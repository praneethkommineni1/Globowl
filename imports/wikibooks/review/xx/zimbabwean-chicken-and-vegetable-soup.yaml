id: xx-zimbabwean-chicken-and-vegetable-soup
title: Zimbabwean Chicken and Vegetable Soup
summary: __notoc__ Zimbabwean chicken and vegetable soup is a delicious soup that combines a variety of vegetables with peanut butter and a few red pepper flakes.
origin:
  country: XX
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
