id: za-boerewors
title: Boerewors
alternate_names:
- South African Sausage
summary: 'Traditionally eaten at braais or barbecues, boerewors (Afrikaans: farmer''s sausage) are thick, hearty and flavoursome Afrikaner sausages, often eaten with a corn porridge called pap. There is no one definitive recipe for boerewors, as nearly every family has its own variation.'
