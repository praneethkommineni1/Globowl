id: zm-braai
title: Braai
alternate_names:
- Zambian Barbecue
summary: Braai is a traditional Zambian barbecue that brings people together for a delightful outdoor cooking experience. This method of grilling is popular in Zambia, especially during social gatherings and special occasions.
origin:
  country: ZM
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Grill or braai stand
- Mixing bowl
- Cutting board
- Knife
- Wooden or metal skewers
- Plastic wrap
techniques:
- marinating
