id: zm-chibwabwa
title: Chibwabwa
alternate_names:
- Zambian Pumpkin Leaves with Groundnut Sauce
summary: Chibwabwa is a classic Zambian dish that features tender pumpkin leaves in a flavorful groundnut sauce. Also known as pumpkin leaves with peanut sauce, this dish is a delightful combination of nutritious greens and a rich, nutty sauce.
origin:
  country: ZM
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Large pot
- Blender or food processor
- Cutting board
- Knife
- Wooden spoon
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: garlic, unit: clove, qty: 2, prep: minced}
  - {ingredient: tomato, qty: 1, prep: diced}
  - {ingredient: black-pepper, qty: 1, prep: chopped}
  - {ingredient: butternut-squash, unit: cup, qty: 2, prep: chopped}
  - {ingredient: roasted-peanuts, unit: cup, qty: 1, prep: roasted and ground into a smooth paste}
  - {ingredient: water, unit: cup, qty: 2}
  - {ingredient: salt, note: to taste}
steps:
- In a large pot, heat the vegetable oil over medium heat.
- Add the chopped onion and minced garlic to the pot. Sauté until the onions are soft and translucent.
- Add the diced tomato and chopped hot pepper (if using) to the pot. Cook until the tomato is soft and tender.
- In a blender or food processor, blend the roasted peanuts until they form a smooth paste. You may need to add a little water to achieve the desired consistency.
- Add the peanut paste to the pot with the cooked vegetables. Stir well to combine.
- Pour in the water and bring the mixture to a gentle simmer.
- Add the chopped pumpkin leaves to the pot. Stir to incorporate the leaves into the groundnut sauce.
- Let simmer for about 10–15 minutes, stirring occasionally, until the pumpkin leaves are cooked and tender.
- Taste the sauce and season with salt according to your preference.
- Remove the pot from the heat and let rest for a few minutes before serving.
tips:
- Chibwabwa is traditionally served with nshima, a thick maize meal porridge that complements the flavors of the dish.
- You can add other vegetables like okra or spinach to the dish for added taste and nutrition.
- For extra creaminess, you can blend some of the cooked pumpkin leaves with the groundnut sauce before serving.
