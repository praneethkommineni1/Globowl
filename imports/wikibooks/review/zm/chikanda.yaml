id: zm-chikanda
title: Chikanda
alternate_names:
- Zambian Orchid Sausage
summary: Chikanda is a unique and flavorful Zambian snack made from the roots of the chikanda orchid plant. Also known as "African sausage" or "African polony", Chikanda is popular in Zambia and is often enjoyed as a tasty and energizing treat.
origin:
  country: ZM
course: main
authenticity: unassessed
