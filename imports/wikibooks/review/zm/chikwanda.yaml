id: zm-chikwanda
title: Chikwanda
alternate_names:
- Zambian Sweet Potato Stew
summary: Chikwanda is a Zambian stew that showcases the natural sweetness of sweet potatoes in a rich and savory sauce. This comforting dish is a favorite in Zambian cuisine, combining the earthiness of sweet potatoes with a medley of aromatic spices.
origin:
  country: ZM
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 2
equipment:
- Large pot
- Cutting board
- Knife
- Wooden spoon
techniques:
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: onion, qty: 1, prep: finely chopped}
  - {ingredient: garlic, unit: clove, qty: 2, prep: minced}
  - {ingredient: tomato, qty: 1, prep: diced}
  - {ingredient: black-pepper, qty: 1, prep: chopped}
  - {ingredient: sweet-potato, qty: 2, prep: peeled and diced, note: large}
  - {ingredient: carrot, qty: 1, prep: peeled and sliced}
  - {ingredient: chicken-stock, unit: cup, qty: 2}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: cayenne, unit: tsp, qty: 1}
  - {ingredient: ground-turmeric, unit: tsp, qty: 0.5}
  - {ingredient: salt, note: to taste}
steps:
- In a large pot, heat the vegetable oil over medium heat.
- Add the chopped onion and minced garlic to the pot. Sauté until the onions are soft and translucent.
- Add the diced tomato and chopped hot pepper (if using) to the pot. Cook until the tomato is soft and tender.
- Stir in the ground cumin, ground cayenne pepper, and ground turmeric, coating the vegetables with the spices.
- Add the diced sweet potatoes and sliced carrot to the pot. Mix well with the spiced vegetables.
- Pour in the vegetable broth or water, ensuring that the sweet potatoes and carrots are mostly submerged.
- Bring the mixture to a gentle simmer and cover the pot with a lid.
- Let the stew cook for about 20–25 minutes, stirring occasionally, until the sweet potatoes and carrots are tender and cooked through.
- Season the stew with salt to taste, adjusting the seasoning according to your preference.
- Remove the pot from the heat and let the stew rest for a few minutes before serving.
tips:
- You can add other vegetables like spinach or bell peppers to the stew for added taste and nutrition.
- For a creamier texture, you can mash some of the cooked sweet potatoes with a fork and mix them back into the stew.
- Sweet potatoes are a rich source of vitamins A and C, fiber, and essential minerals.
