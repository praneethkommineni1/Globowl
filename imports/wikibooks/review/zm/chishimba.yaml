id: zm-chishimba
title: Chishimba
alternate_names:
- Zambian Cassava Cake
summary: Chishimba is a Zambian dessert made from cassava, showcasing the unique flavor of this root vegetable in a sweet and moist cake. This traditional treat is a favorite in Zambian cuisine, often enjoyed on special occasions and gatherings.
origin:
  country: ZM
course: main
authenticity: unassessed
