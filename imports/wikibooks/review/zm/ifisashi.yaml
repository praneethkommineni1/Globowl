id: zm-ifisashi
title: Ifisashi
alternate_names:
- Zambian Peanut and Spinach Stew
summary: Ifisashi is a delicious and hearty Zambian stew made with a flavorful combination of peanuts and spinach. This nutritious dish is a staple in Zambian cuisine and is often served with nshima, a popular Zambian side dish made from cornmeal.
origin:
  country: ZM
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 3
equipment:
- Large pot
- Blender or food processor
- Cutting board
- Knife
techniques:
- sauteing
- simmering
