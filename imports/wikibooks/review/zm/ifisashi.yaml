  - {ingredient: garlic, unit: clove, qty: 2, prep: minced}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 1}
  - {ingredient: tomato, qty: 1, prep: diced, note: medium}
  - {ingredient: red-bell-pepper, qty: 1, prep: diced}
  - {ingredient: red-bell-pepper, qty: 1, prep: diced}
