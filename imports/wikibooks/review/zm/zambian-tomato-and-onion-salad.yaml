id: zm-zambian-tomato-and-onion-salad
title: Zambian Tomato and Onion Salad
summary: Zambian tomato and onion Salad is a refreshing and simple salad that showcases the vibrant flavors of fresh tomatoes and onions. This salad is a popular side dish in Zambia and complements a variety of main courses, making it a delightful addition to any meal.
origin:
  country: ZM
course: main
authenticity: unassessed
yield:
  servings: 1
time:
  total_min: 1
difficulty: 1
equipment:
- Mixing bowl
- Cutting board
- Knife
ingredient_groups:
- items:
  - {ingredient: tomato, qty: 4, prep: diced}
  - {ingredient: onion, qty: 1, prep: thinly sliced}
  - {ingredient: red-chili, qty: 1, prep: finely chopped}
  - {ingredient: vegetable-oil, unit: tbsp, qty: 2}
  - {ingredient: lemon}
  - {ingredient: salt, note: to taste}
  - {ingredient: cilantro, prep: for garnish, optional: true}
steps:
- In a mixing bowl, combine the diced tomatoes, thinly sliced onions, and finely chopped green chili (if using).
- Drizzle the vegetable oil and lemon juice over the vegetables.
- Gently toss the ingredients until the vegetables are coated with the oil and lemon juice.
- Season the salad with salt to taste. Adjust the seasoning according to your preference.
- Let the salad sit for a few minutes to allow the flavors to meld together.
- Garnish the salad with fresh cilantro leaves, if desired, before serving.
tips:
- For added heat and spice, you can include finely chopped green chili in the salad.
- If you prefer a tangier flavor, you can add a bit more lemon juice.
- Feel free to customize the salad with other vegetables or herbs, such as cucumber, bell peppers, or parsley.
- This salad pairs well with grilled meats, fish, or as a side dish to traditional Zambian meals like nshima (maize meal porridge).
