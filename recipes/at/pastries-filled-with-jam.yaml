id: at-pastries-filled-with-jam
title: Pastries Filled with Jam
alternate_names:
- Marmeladetascherl
summary: Marmeladetascherl are a variety of sweet filled pastry originating in Austria.
origin:
  country: AT
course: snack
authenticity: unassessed
yield:
  servings: 4
  amount: 4-5
time:
  total_min: 30
difficulty: 2
techniques:
- baking
- dough-making
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: g, qty: 250}
  - {ingredient: baking-powder, unit: tsp, qty: 1}
  - {ingredient: butter, unit: g, qty: 250}
  - {ingredient: twarog, qty: 1}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: egg-white, qty: 1}
  - {ingredient: jam}
steps:
- Mix the flour with the baking powder, and rub in the butter. Then, add the curd and the salt, and knead it into dough.
- Let the dough rest in the fridge for 1 hour.
- Roll the dough to about 2 mm thick, and cut it into 10 cm squares.
- Put a blob of jam in the middle of each square, and fold them diagonally. Press the edges to seal the tascherl.
- Brush a bit of the egg white onto each tascherl, and place onto a baking sheet.
- Preheat the oven to 180°C, put the tascherl into the oven, and bake them for approximately 20 minutes.
- Before serving, dust some sugar onto the tascherl to add some extra flavour.
