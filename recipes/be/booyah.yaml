id: be-booyah
title: Booyah
alternate_names:
- Chicken Vegetable Stew
summary: Booyah is a stew created in Northeastern Wisconsin by Walloon-Belgian immigrants (particularly in the Green Bay area).
origin:
  country: BE
course: main
authenticity: unassessed
yield:
  servings: 16
time:
  total_min: 180
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: chicken, qty: 1, note: large}
  - {ingredient: green-beans, unit: cup, qty: 2}
  - {ingredient: carrot, unit: cup, qty: 3}
  - {ingredient: green-peas, unit: cup, qty: 2}
  - {ingredient: white-cabbage, unit: cup, qty: 1}
  - {ingredient: celery, unit: stalk, qty: 4}
  - {ingredient: tomato, unit: cup, qty: 2}
  - {ingredient: onion, qty: 1, prep: diced, note: large}
  - {ingredient: potato, unit: cup, qty: 2, optional: true}
  - {ingredient: salt, note: to taste}
steps:
- Place chicken in a large pot and cover with water. Simmer until chicken is well done.
- Remove chicken from broth and skim off fat.
- Add remaining ingredients to broth.
- Remove chicken meat from bones and skin. Cut meat into small pieces and add to broth. Add salt and water to taste.
- Cover and let simmer for at least 3 hours. It tastes best when cooked all day.
