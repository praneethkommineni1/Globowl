id: bj-amiwo
title: Amiwo
native_name: {text: Amiwo, lang: fon}
alternate_names: [Pâte rouge, Red cornmeal paste]
summary: Cornmeal cooked in a spicy tomato and chicken broth into a smooth, red paste, served with the chicken — a Beninese celebration dish.
