id: cm-ndole
title: Ndole
alternate_names:
- Cameroonian Bitter Leaf and Peanut Soup
summary: Ndole is a popular traditional soup recipe in Cameroon that is made with the combination of spinach and bitter leaves as well as crayfish, shrimp, and beef. It is also a recipe for ceremony.
