id: cu-rice-with-black-beans
title: Rice with Black Beans
alternate_names:
- Arroz con Frijoles Negros
summary: Arroz con frijoles negros (rice with black beans) is one of the many rice and bean dishes that are extremely popular throughout Latin America, especially in the Caribbean. Most people serve meat or fish with rice and beans.
