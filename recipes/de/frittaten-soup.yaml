id: de-frittaten-soup
title: Frittaten Soup
summary: Frittaten soup originates from an incident that took place during the Congress of Vienna in the 19th century, which involved various European ambassadors and was chaired by the Austrian Prince, Klemens Wenzel von Metternich.
