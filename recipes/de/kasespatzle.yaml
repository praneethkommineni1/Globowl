id: de-kasespatzle
title: Käsespätzle
native_name: {text: Käsespätzle, lang: de}
summary: Soft homemade egg noodles layered with melted mountain cheese and topped with sweet, crispy fried onions.
origin:
  country: DE
  region: Swabia and the Allgäu
  also_claimed_by: [AT, CH]
course: main
dish_types: [noodles, cheese]
authenticity: traditional
yield: {servings: 4}
time: {prep_min: 20, cook_min: 30, inactive_min: 15}
difficulty: 3
equipment: [Spätzle press or a colander with large holes]
techniques: [dough-making, boiling, pan-frying, baking]
ingredient_groups:
  - name: Spätzle
    items:
      - {ingredient: all-purpose-flour, qty: 400, unit: g}
      - {ingredient: egg, qty: 4}
      - {ingredient: water, qty: 100, unit: ml, note: "or milk"}
      - {ingredient: salt, qty: 1, unit: tsp}
      - {ingredient: nutmeg, qty: 1, unit: pinch}
  - name: Assembly
    items:
      - {ingredient: butter, qty: 3, unit: tbsp}
      - {ingredient: onion, qty: 2, prep: "thinly sliced into rings"}
      - {ingredient: emmental, qty: 200, unit: g, prep: "grated", note: "or Bergkäse / Gruyère"}
      - {ingredient: chives, qty: 1, unit: handful, prep: "snipped"}
steps:
  - Beat the flour, eggs, water, salt and nutmeg with a wooden spoon until the batter is smooth, thick and forms bubbles. Rest it for 15 minutes.
  - Fry the onions in 2 tablespoons butter over medium heat until deep brown and crisp (15–20 minutes). Heat the oven to 180 °C.
  - Bring a large pot of salted water to a boil. Press the batter through the spätzle press into the water in batches. When the spätzle float, cook 1 minute more and lift out with a slotted spoon.
  - Layer the hot spätzle and cheese in a buttered ovenproof dish, finishing with cheese.
  - text: Bake until the cheese has melted.
    timer_min: 10
  - Top with the fried onions and chives.
serving: With a green salad or potato salad.
