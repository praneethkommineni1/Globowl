id: de-lentil-and-sausage-stew
title: Lentil and Sausage Stew
summary: This lentil and sausage stew is intended for eating with spätzle. It is a slightly modified recipe; the traditional one has no tomato and honey. But, as with many "national meals," there are different opinions.
origin:
  country: DE
course: main
