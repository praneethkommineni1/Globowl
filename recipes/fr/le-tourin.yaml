id: fr-le-tourin
title: Le Tourin
alternate_names:
- Garlic Soup
summary: Le tourin is a type of garlic soup. This recipe is from the village of Le Fleix in Dordogne.
origin:
  country: FR
course: soup
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 30
difficulty: 2
ingredient_groups:
- items:
  - {ingredient: garlic, unit: clove, qty: [10, 12], prep: chopped}
  - {ingredient: olive-oil, unit: tbsp, qty: 1}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 1}
  - {ingredient: water, unit: cup, qty: 4, prep: or as needed}
  - {ingredient: egg, qty: 1, prep: separated}
  - {ingredient: black-pepper, note: to taste}
  - {ingredient: white-vinegar, unit: tsp, qty: 1}
  - {ingredient: salt, note: to taste}
steps:
- In a frying pan, brown the chopped garlic in the olive oil.
- Add the flour. Mix well, then cook for a few minutes to remove the floury taste.
- Gradually stir in the water, and cook for 10 minutes.
- Beat the egg white in a small bowl. Gradually whisk in a ladleful of the soup to temper it, then stir the mixture back into the soup pot.
- Combine the egg yolk, pepper, and vinegar in a small bowl. Like before, gradually temper the yolks with a ladleful of soup.
- Remove the soup from the heat, and stir in the egg yolk mixture. Season to taste with salt.
- Place thin slices of bread in each soup bowl, and pour the soup on top. Serve hot.
tips:
- You can optionally use an equal mixture of chopped onions and garlic.
