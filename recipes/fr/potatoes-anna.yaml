id: fr-potatoes-anna
title: Potatoes Anna
summary: Potatoes Anna (or pommes Anna) is a classic French dish of sliced, layered potatoes cooked in a very large amount of melted butter. It can be eaten hot or cold.
origin:
  country: FR
course: side
authenticity: unassessed
yield:
  servings: 4
time:
  total_min: 70
difficulty: 2
equipment:
- Oven
- 23 cm round pie tin
techniques:
- baking
ingredient_groups:
- items:
  - {ingredient: potato, qty: 4, prep: optionally peeled}
  - {ingredient: butter, unit: g, qty: 100}
steps:
- Preheat the oven to 250 °C.
- Melt the butter.
- Slice the potatoes thinly. Press slices against absorbent paper to dry.
- Brush the tin with melted butter. Layer the potato slices into the tin, brushing each layer with butter and ending with butter on the top.
- Cover and bake in the oven for 20 minutes. Uncover and cook for a further 30 minutes.
