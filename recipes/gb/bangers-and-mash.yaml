id: gb-bangers-and-mash
title: Bangers and Mash
summary: You can fry or grill sausages quickly, but in this recipe they are cooked slowly (as recommended by Nigel Slater, no less) so as to really bring out the flavour. Some people like baked beans with their sausage and mash, some people like gravy, and some people don't need either.
origin:
