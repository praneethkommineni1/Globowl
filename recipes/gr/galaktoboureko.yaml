  - {ingredient: semolina, unit: g, qty: 150}
  - {ingredient: milk, unit: l, qty: 1}
  - {ingredient: vanilla-bean, qty: 2}
  - {ingredient: lemon, qty: 0.5, prep: juiced}
  - {ingredient: salt, unit: pinch, qty: 1}
  - {ingredient: phyllo, unit: g, qty: 450}
