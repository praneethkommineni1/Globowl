id: gr-galaktoboureko
title: Galaktoboureko
alternate_names:
- Greek Semolina Custard Pastry
summary: The galaktoboureko (Γαλακτομπούρεκο) is a traditional Greek dessert. It is made with phyllo, also known as filo or fillo dough, which is filled with a custard of semolina flavored with citron. It is served with a sugar syrup.
