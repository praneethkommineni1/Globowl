id: in-ghevar
title: Ghevar
alternate_names:
- Rajasthani Honeycomb Fritter
summary: Ghevar is an Indian delicacy originally from the state of Rajasthan. It is made with a round mold and has a crispy but porous texture. The following recipe has been entered with inputs from Tarla Dalal recipe book.
