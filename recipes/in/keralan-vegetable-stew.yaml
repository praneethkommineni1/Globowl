id: in-keralan-vegetable-stew
title: Keralan Vegetable Stew
summary: This coconut-flavoured vegetable stew is a famous dish of the South Indian coastal state of Kerala. It is often served with appam (rice pancakes). Though frequently made with chicken, this recipe is for the purely vegetable version of the stew.
origin:
  country: IN
