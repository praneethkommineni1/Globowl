id: it-agnolotti-pasta-soup
title: Agnolotti Pasta Soup
alternate_names:
- Agnolotti in Brodo
summary: Agnolotti in brodo is a very simple and delicious Italian pasta soup containing agnolotti, small ravioli filled most commonly with meat. This soup is delicious on a cold day when you haven't much time to devote to preparing a tasty meal.
origin:
  country: IT
course: soup
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 15
difficulty: 2
techniques:
- boiling
ingredient_groups:
- items:
  - {ingredient: pasta, unit: g, qty: 250}
  - {ingredient: chicken-stock, unit: l, qty: 0.5}
  - {ingredient: heavy-cream, unit: cup, qty: 0.5}
  - {ingredient: black-pepper, unit: pinch, qty: 1}
  - {ingredient: parsley, unit: handful, qty: 1}
  - {ingredient: sherry, qty: 1}
  - {ingredient: parmesan}
steps:
- Bring the chicken broth to a rolling boil. If using water and chicken stock cubes, bring the water to a boil, add the stock cubes and let dissolve.
- Add the agnolotti and cook according to the instructions on the package.
- Add the cream, freshly-ground black pepper, and chopped parsley about 2 minutes before the end of the cooking, and turn down the heat.
- Add the dash of sherry just before serving. If serving to children, dish out their portions first, then add the sherry for the grown-ups.
- Let stand for a few minutes to marry the flavors, then serve, sprinkled with grated Parmesan cheese and enjoy.
