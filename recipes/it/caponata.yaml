id: it-caponata
title: Caponata
alternate_names:
- Sicilian Eggplant and Vegetables
summary: Caponata is a Sicilian eggplant dish consisting of cooked vegetables with chopped up fried eggplant, celery, sweetened vinegar, and capers with sweet sauce.
origin:
  country: IT
course: starter
authenticity: unassessed
yield:
  servings: 2
time:
  total_min: 60
difficulty: 2
techniques:
- blanching
- sauteing
