id: it-marinara-sauce
title: Marinara Sauce
summary: Marinara (mariner's) sauce is a southern Italian tomato sauce usually made with tomatoes, garlic, herbs (such as basil), and onion. However, there are many variations. Some of these include the addition of capers, olives and spices.
origin:
  country: IT
course: condiment
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 45
difficulty: 2
techniques:
- boiling
- simmering
ingredient_groups:
- items:
  - {ingredient: olive-oil, unit: tbsp, qty: 6}
  - {ingredient: onion, unit: g, qty: 225, prep: diced}
  - {ingredient: garlic, unit: clove, qty: 4, prep: thinly sliced}
  - {ingredient: thyme, unit: tsp, qty: 2}
  - {ingredient: basil, unit: tsp, qty: 4}
  - {ingredient: red-bell-pepper, unit: g, qty: 85, prep: diced}
  - {ingredient: tomato, unit: kg, qty: 1.3, prep: crushed by hand}
  - {ingredient: sugar, unit: tbsp, qty: 1}
  - {ingredient: salt, note: to taste}
steps:
- Heat the oil in a saucepan over medium heat until it shimmers.
- Add the onions and garlic, and sauté them for about 2 minutes until the onions are translucent.
- Add the thyme, basil and bell pepper. Cook 5 minutes more.
- Add the tomatoes and sugar. Bring to a boil and then lower to a light simmer, stirring occasionally for 30 minutes.
- Season with salt to taste.
- Serve hot by ladling over pasta, seafood or rice.
