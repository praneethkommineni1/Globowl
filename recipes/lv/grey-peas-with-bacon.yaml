  - items:
      - {ingredient: dried-grey-peas, qty: 400, unit: g, note: "soaked overnight"}
      - {ingredient: water, qty: 2, unit: l}
      - {ingredient: bacon, qty: 200, unit: g, prep: "diced", note: "smoked speķis"}
      - {ingredient: onion, qty: 1, prep: "chopped"}
