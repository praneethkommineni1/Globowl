id: lv-grey-peas-with-bacon
title: Grey Peas with Bacon
native_name: {text: Pelēkie zirņi ar speķi, lang: lv}
summary: Earthy grey peas tossed with crisp smoked bacon and onion — a Latvian national dish, essential at Christmas.
origin:
  country: LV
course: main
dish_types: [beans]
occasions: [Christmas]
authenticity: traditional
yield: {servings: 4}
time: {prep_min: 10, cook_min: 75, inactive_min: 720}
