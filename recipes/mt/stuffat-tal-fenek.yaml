id: mt-stuffat-tal-fenek
title: Stuffat tal-Fenek
native_name: {text: Stuffat tal-fenek, lang: mt}
alternate_names: [Maltese rabbit stew]
summary: Rabbit marinated in red wine and garlic, then slowly stewed with tomatoes, peas and potatoes — Malta's national dish.
origin:
  country: MT
course: main
dish_types: [stew]
occasions: [Fenkata (communal rabbit feast)]
authenticity: traditional
yield: {servings: 4}
time: {prep_min: 20, cook_min: 120, inactive_min: 720}
difficulty: 3
techniques: [marinating, pan-frying, stewing]
ingredient_groups:
  - items:
      - {ingredient: rabbit, qty: 1.2, unit: kg, prep: "jointed"}
      - {ingredient: red-wine, qty: 300, unit: ml}
      - {ingredient: garlic, qty: 6, unit: clove, prep: "crushed"}
      - {ingredient: bay-leaf, qty: 3}
      - {ingredient: olive-oil, qty: 4, unit: tbsp}
      - {ingredient: onion, qty: 2, prep: "chopped"}
      - {ingredient: tomato-paste, qty: 2, unit: tbsp}
      - {ingredient: canned-tomatoes, qty: 400, unit: g}
      - {ingredient: potato, qty: 500, unit: g, prep: "cut into chunks"}
      - {ingredient: green-peas, qty: 150, unit: g}
      - {ingredient: salt, note: "to taste"}
      - {ingredient: black-pepper, note: "to taste"}
steps:
  - text: Marinate the rabbit in the wine, garlic and bay overnight in the fridge.
    timer_min: 720
  - Lift out the rabbit (keep the marinade), pat dry and brown it in the oil. Set aside.
  - Soften the onions in the same pot, add the tomato paste and fry for 1 minute.
  - text: Return the rabbit with the marinade and tomatoes, cover and simmer gently.
    timer_min: 75
  - text: Add the potatoes and peas and cook until tender.
    timer_min: 30
  - Season. The sauce is traditionally eaten first with spaghetti, followed by the rabbit as a main course.
