id: ng-amala-ogede
title: Amala Ọgẹdẹ
alternate_names:
- Nigerian Plantain Fufu
summary: Amala ọgẹdẹ is a typical Nigerian swallow made from plantain flour. It is served with ẹgusi soup, ogbono soup, or okro soup.
origin:
  country: NG
course: side
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 15
difficulty: 2
equipment:
- Bowl
- Wooden turning stick
- Pot
- Stove
ingredient_groups:
- items:
  - {ingredient: plantain}
  - {ingredient: water}
steps:
- Boil some water in a pot.
- Slowly stir in the plantain flour until smooth and lump-free.
- Add some water and cook for few minutes.
- Serve with the soup of your choice.
