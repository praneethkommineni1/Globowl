id: ng-fanke
title: Fanke
alternate_names:
- Hausa Puff Puff
summary: Fanke is a Nigerian fritter made with wheat flour or semovita. It is commonly eaten in the Northern part of Nigeria, especially among the Hausa people.
origin:
  country: NG
course: snack
authenticity: unassessed
yield:
  servings: 3
  amount: 3 servings
time:
  total_min: 120
difficulty: 3
equipment:
- Pan for deep frying
- Sieve
- Mixing Bowl
ingredient_groups:
- items:
  - {ingredient: all-purpose-flour, unit: cup, qty: 3}
  - {ingredient: yeast, unit: tbsp, qty: 1}
  - {ingredient: sugar, unit: cup, qty: 1}
  - {ingredient: baking-powder, unit: tsp, qty: 1.5}
  - {ingredient: water, unit: cup, qty: 2}
  - {ingredient: vanilla-extract, note: to taste}
  - {ingredient: vegetable-oil}
steps:
- Sift the flour into a clean bowl. Mix in the yeast, sugar, and baking powder.
- Stir in the warm water and vanilla to make a thick batter.
- Cover the bowl, and let rise for about 1 hour.
- Heat enough oil in a pan for deep-frying. Shape the batter into balls, and drop them into the hot oil in batches.
- Deep fry the fritters until golden brown on all sides.
- Remove from the oil and let drain.
