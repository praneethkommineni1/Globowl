id: ng-jollof-rice
title: Jollof Rice
alternate_names: [Party jollof]
summary: Long-grain rice cooked in a deep-red, smoky reduction of peppers, tomatoes and onion — the centrepiece of West African parties.
origin:
  country: NG
  also_claimed_by: [GH, SN]
course: main
dish_types: [rice-dish, one-pot]
occasions: [Weddings, Birthdays, Christmas]
authenticity: home-style
yield: {servings: 6}
time: {prep_min: 20, cook_min: 60}
difficulty: 3
equipment: [Blender, Heavy pot with a tight lid, Foil]
techniques: [simmering, rice-cooking]
ingredient_groups:
  - name: Pepper base
    items:
      - {ingredient: red-bell-pepper, qty: 3, prep: "deseeded and roughly chopped"}
      - {ingredient: tomato, qty: 400, unit: g, prep: "roughly chopped"}
      - {ingredient: scotch-bonnet, qty: [1, 2], note: "to taste"}
      - {ingredient: onion, qty: 1, prep: "roughly chopped"}
  - name: Rice
    items:
      - {ingredient: vegetable-oil, qty: 120, unit: ml}
      - {ingredient: onion, qty: 1, prep: "thinly sliced"}
      - {ingredient: tomato-paste, qty: 3, unit: tbsp}
      - {ingredient: curry-powder, qty: 1, unit: tsp}
      - {ingredient: dried-thyme, qty: 1, unit: tsp}
      - {ingredient: bay-leaf, qty: 2}
      - {ingredient: chicken-bouillon-cube, qty: 1, optional: true}
      - {ingredient: parboiled-rice, qty: 500, unit: g, prep: "rinsed until the water runs clear"}
      - {ingredient: chicken-stock, qty: 750, unit: ml, alt: [vegetable-stock]}
      - {ingredient: salt, note: "to taste"}
      - {ingredient: butter, qty: 1, unit: tbsp, optional: true}
steps:
  - Blend the pepper-base ingredients until smooth.
  - text: Pour the blend into a pot and boil uncovered, stirring now and then, until reduced by about half and thick.
    timer_min: 20
  - Heat the oil in a heavy pot over medium heat. Fry the sliced onion until soft, then add the tomato paste and fry, stirring, until it darkens a shade (about 5 minutes).
  - text: Add the reduced pepper base, curry powder, thyme, bay leaves and the crumbled bouillon cube, if using. Fry until the oil rises to the surface.
    timer_min: 10
  - Stir in the rice to coat every grain. Add stock to just cover the rice and season with salt — it should taste slightly over-salted.
  - text: Cover the pot tightly with foil, then the lid. Cook on the lowest heat without stirring.
    timer_min: 30
  - Check the rice. If it is still hard, sprinkle over a little water, re-cover and cook 5–10 minutes more. A thin, lightly scorched layer at the bottom gives the prized smoky "party" flavour — don't stir it in until the end.
  - Fluff with a fork, stir in the butter if using, and rest covered for 5 minutes before serving.
tips:
  - Parboiled long-grain rice keeps its shape best; basmati works but needs less liquid.
  - Too little liquid is easier to fix than too much — add water in small splashes.
serving: With fried plantain, coleslaw, fried or grilled chicken, or moin moin.
culture: Nigeria, Ghana and Senegal all claim the best jollof, and the friendly rivalry is a running joke across West Africa. The dish is generally traced to the Wolof people of the Senegambia region.
