id: ng-nigerian-egg-pepper-soup
title: Nigerian Egg Pepper Soup
summary: Egg pepper soup is a popular Nigerian dish known for its simplicity and bold flavors. It is a delicious combination of eggs, peppers, and spices, creating a rich and flavorful soup.
origin:
  country: NG
course: soup
authenticity: unassessed
yield:
  servings: 2
  amount: 2-3
time:
  total_min: 75
difficulty: 2
equipment:
