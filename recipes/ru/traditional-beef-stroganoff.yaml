id: ru-traditional-beef-stroganoff
title: Traditional Beef Stroganoff
summary: Beef stroganoff, in its simplest form, is simply tender beef with a mushroom and sour cream sauce. It is very popular as a basic food service dish as it is very easy to produce it in large quantities.
