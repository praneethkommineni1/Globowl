id: th-pattaya-fried-rice
title: Pattaya Fried Rice
summary: 'Pattaya fried rice (Malay: nasi goreng pattaya), is a Malaysian dish made by wrapping chicken fried rice in an omelette pouch. It is similar to the Japanese omurice.'
