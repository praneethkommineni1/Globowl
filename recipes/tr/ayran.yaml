id: tr-ayran
title: Ayran
alternate_names:
- Turkish Yogurt Drink
summary: Ayran is a popular Turkish drink made of a yoghurt and water. The ayran made from sheep yoghurt has a quite thick taste, fatty but also delicious. It is very similar to the Iranian drink, doogh and Armenian drink, taan. Salt is usually added to ayran for flavour.
origin:
