id: tr-pudding-with-pistachios-and-rose-water
title: Pudding with Pistachios and Rose Water
alternate_names:
- Muhallebi
summary: Muhallebi, also called muhallabia or mihallabiya, is a milk pudding thickened with rice flour and optionally perfumed with rosewater or orange flower water.
origin:
  country: TR
course: dessert
authenticity: unassessed
yield:
  servings: 10
time:
  total_min: 60
difficulty: 2
techniques:
- simmering
ingredient_groups:
- items:
  - {ingredient: rice-flour, unit: cup, qty: 0.75}
  - {ingredient: cornstarch, unit: cup, qty: 0.25}
  - {ingredient: water, unit: cup, qty: 1}
  - {ingredient: milk, unit: cup, qty: 7}
  - {ingredient: sugar, unit: cup, qty: [0.5, 1]}
  - {ingredient: rose-water, unit: cup, qty: 0.5, optional: true}
  - {ingredient: pistachios, unit: cup, qty: 0.5, prep: chopped}
steps:
- Mix the milk and sugar in a large saucepan and heating slowly, so as not to burn the milk, bring to a simmer.
- Make a slurry by dissolving the rice flour and cornstarch in the water and, stirring constantly, slowly add this mixture to the simmering milk.
- Simmer gently for 30–40 minutes, stirring frequently, until the mixture has thickened sufficiently to coat a spoon. Remove from the heat.
- Stir in the rose water or orange flower water.
- Pour into a 9x13-inch baking pan and refrigerate until chilled and set.
- Cut into pieces about 4 inches square.
- Place the squares on individual dessert plates and garnish with the chopped pistachios.
tips:
- If you don't have rice flour, cornstarch may be substituted.
