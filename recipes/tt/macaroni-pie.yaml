id: tt-macaroni-pie
title: Macaroni Pie
summary: Macaroni pie is a side dish that goes well with stewed chicken, callaloo or any stewed peas like pigeon peas or lentils. It can also be enjoyed on its own. It has versions derived from Caribbean, Early American and Scottish origins.
