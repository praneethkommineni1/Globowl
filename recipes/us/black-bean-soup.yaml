id: us-black-bean-soup
title: Black Bean Soup
summary: This recipe for black bean soup is a blend of beans and vegetables inspired by Tex-Mex cuisine.
origin:
  country: US
course: soup
authenticity: unassessed
yield:
  servings: 12
time:
  total_min: 120
difficulty: 2
techniques:
