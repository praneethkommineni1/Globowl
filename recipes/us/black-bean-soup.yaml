- simmering
ingredient_groups:
- items:
  - {ingredient: black-beans-canned, unit: cup, qty: 6}
  - {ingredient: bay-leaf, qty: 5}
  - {ingredient: red-bell-pepper, qty: 1, prep: diced}
  - {ingredient: green-pepper, qty: 1, prep: diced}
  - {ingredient: chili-powder, unit: tsp, qty: 1}
  - {ingredient: ground-cumin, unit: tsp, qty: 1}
  - {ingredient: whole-cloves, qty: 7, prep: minced}
  - {ingredient: green-chili, qty: 1, prep: finely-chopped}
  - {ingredient: onion, qty: 1.5, prep: diced, note: large}
  - {ingredient: red-wine-vinegar, unit: tbsp, qty: 1}
  - {ingredient: salt, note: to taste}
  - {ingredient: cilantro, unit: cup, qty: 0.5}
  - {ingredient: sour-cream, unit: cup, qty: 1}
steps:
- Pick over the beans.
- Place in large bean pot and add water to cover by at least 2 inches (~5 cm).
- Soak overnight, then change water.
- Bring beans to a boil. Reduce heat, then simmer until beans start to soften, around ½ hour.
- Add bay leaves, bell peppers, chili powder, cumin, garlic, jalapeños, onions, and red wine vinegar.
- Add salt and pepper to taste.
- Simmer ½ to 1 hour, until beans are soft.
- Take out bay leaves.
- Stir in cilantro.
- Add some sour cream.
- Serve.
