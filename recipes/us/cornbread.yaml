id: us-cornbread
title: Cornbread
summary: Cornbread is a type of quick bread made of cornmeal and sometimes supplemented with wheat flour. Some variations may include whole corn kernels.
origin:
  country: US
course: bread
authenticity: unassessed
yield:
  servings: 8
