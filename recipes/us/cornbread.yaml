- baking
ingredient_groups:
- items:
  - {ingredient: cornmeal, unit: cup, qty: 1}
  - {ingredient: all-purpose-flour, unit: cup, qty: 1}
  - {ingredient: baking-powder, unit: tsp, qty: 4}
  - {ingredient: salt, unit: tsp, qty: 0.5}
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: egg, qty: 1}
  - {ingredient: shortening, unit: cup, qty: 0.25, prep: melted}
  - {ingredient: sugar, unit: cup, qty: 0.25, optional: true}
  - {ingredient: corn-kernels, qty: 0.5, prep: drained, optional: true}
  - {ingredient: onion, qty: 0.25, prep: finely chopped, optional: true}
steps:
- Preheat oven to . Grease an baking pan.
- Combine cornmeal, flour, baking powder, salt, and sugar in a large mixing bowl.
- Add egg, milk, and shortening.
- Beat until fairly smooth (about a minute).
- If using corn and/or onion, fold in these ingredients.
- Pour the mixture into the baking pan.
- Bake for 20–25 minutes or until a toothpick inserted in center comes out clean. If corn is added to batter, increase time by ~50%
- Serve hot!
