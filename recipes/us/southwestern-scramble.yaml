ingredient_groups:
- items:
  - {ingredient: egg, qty: 8}
  - {ingredient: milk, unit: tbsp, qty: 2}
  - {ingredient: butter, prep: 'margarine, or cooking spray, for frying pan'}
  - {ingredient: onion, qty: 1, prep: chopped, note: medium}
  - {ingredient: red-chili, qty: 1, prep: 'such as jalapeño, seeded and chopped', note: medium}
  - {ingredient: red-bell-pepper, qty: 1, prep: seeded and sliced}
