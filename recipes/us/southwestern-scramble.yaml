id: us-southwestern-scramble
title: Southwestern Scramble
summary: A Southwestern Scramble is a scrambled eggs recipe with many spicy ingredients, such as onions and chilis. For a complete breakfast, serve with sliced, fried wiejska (Polish sausage), toast, and orange juice.
origin:
  country: US
