id: us-spiced-pumpkin-soup
title: Spiced Pumpkin Soup
summary: This recipe for spiced pumpkin soup is from the Seattle and King County Public Health Office at http://www.metrokc.gov/HEALTH/nutrition/recipes/pumpkinsoup.htm.
origin:
  country: US
course: soup
authenticity: unassessed
yield:
  servings: 6
time:
  total_min: 60
difficulty: 3
techniques:
- boiling
- sauteing
- simmering
ingredient_groups:
- items:
  - {ingredient: butter, unit: tbsp, qty: 1}
  - {ingredient: onion, unit: cup, qty: 1}
  - {ingredient: all-purpose-flour, unit: tbsp, qty: 3}
  - {ingredient: curry-powder, unit: tsp, qty: 0.5}
  - {ingredient: ground-cumin, unit: tsp, qty: 0.25}
  - {ingredient: nutmeg, unit: tsp, qty: 0.25}
  - {ingredient: garlic, qty: 2, prep: crushed}
  - {ingredient: sweet-potato, unit: cup, qty: 1}
  - {ingredient: salt, unit: tsp, qty: 0.25}
  - {ingredient: chicken-stock, unit: can, qty: 2}
  - {ingredient: butternut-squash, unit: can, qty: 1}
  - {ingredient: milk, unit: cup, qty: 1}
  - {ingredient: lime, unit: tbsp, qty: 1}
steps:
- Melt butter in a Dutch oven or large saucepan over medium-high heat. Sauté onion for 3–4 minutes. Add flour, curry, cumin, and nutmeg and sauté for 1 minute.
- Add sweet potato, salt, chicken broth, and pumpkin, and bring to a boil. Reduce heat to medium-low and simmer, partially covered for about 20–25 minutes or until sweet potatoes are cooked through and softened. Remove from heat and let stand for 10 minutes to cool.
- Place half of the pumpkin mixture in a blender and process until smooth. Using a strainer, pour soup back into pan. Repeat with rest of soup.
- Raise heat to medium then stir in milk and cook for 5 minutes or until soup is heated through.
- Remove from heat and add lime juice.
